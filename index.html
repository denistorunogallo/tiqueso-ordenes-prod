}

/* La marca del encabezado manda sobre el prefijo: 0550 con marca Real es
   REA0550, no TIQ0550. */
/* Lo que se espera que salga del cajón, según la merma de cada queso. */
function Deshidratacion({o}){
  if(o.tipo!=="deshidratado") return null;
  const e = planificadaDeshidratado(o.componentes);
  if(!e) return null;
  return <div className="avi esp" style={{marginBottom:14}}>
    <strong style={{color:"var(--morado)"}}>Merma del deshidratado</strong>
    <div style={{fontFamily:"var(--mono)",fontSize:12,marginTop:5,color:"var(--tinta)"}}>
      entran {e.entra} kg · merma {(e.merma*100).toFixed(0)}% ·
      salen ≈ <strong>{e.sale} kg</strong>
    </div>
    <div style={{color:"var(--acero)",marginTop:5,fontSize:11.5}}>
      Ese es el número que conviene poner como cantidad planificada; la cantidad real
      se ajusta después, con la boleta de salida.
      {e.sinRegla.length>0 && " Sin regla de merma para " + e.sinRegla.join(", ") + "."}
    </div>
  </div>;
}

/* La boleta de salida no crea nada: sirve para encontrar la orden abierta. */
function SalidaDeCajon({o}){
  if(o.tipo!=="salida") return null;
  const p = desglosarLote(o.lote);
  const f = p ? fechaDesdeJuliano(p.yy,p.ddd) : null;
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const nombre = f ? dias[new Date(f+"T12:00:00Z").getUTCDay()] : "";
  return <div className="avi esp" style={{marginBottom:14}}>
    <strong style={{color:"var(--morado)"}}>Salida del cajón · no se sube a SAP</strong>
    <div style={{color:"var(--acero)",margin:"3px 0 8px",lineHeight:1.5}}>
      Esta boleta ajusta una orden que ya existe. Buscala en SAP con estos datos y
      cambiale la cantidad a la que salió de verdad; después hacé el recibo de producción.
    </div>
    <div style={{background:"var(--panel)",border:"1px solid var(--borde)",borderRadius:3,
                 padding:"9px 11px",fontFamily:"var(--mono)",fontSize:12,lineHeight:1.7}}>
      <div>Lote  <strong>{o.lote||"—"}</strong></div>
      <div>Entró <strong>{f || "lote incompleto"}</strong>
        {nombre && " · " + nombre}{p && "  (día juliano " + p.ddd + ")"}</div>
      <div>Cajón <strong>{o.cajon||"—"}</strong></div>
      <div>Salió <strong>{o.cantidadKg||"—"} kg</strong></div>
    </div>
  </div>;
}

/* En el deshidratado la cantidad planificada no se lee de la hoja: sale del
   peso que entró menos la merma esperada de cada materia prima. */
function MermaDeshidratado({o}){
  if(o.tipo==="salida")
    return <div className="avi esp" style={{fontSize:11.5}}>
      Salida de cajón: no crea orden. Los {o.cantidadKg||"—"} kg son la recepción del lote
      <strong> {o.lote||"—"}</strong>, y además corrigen la cantidad planificada que se
      estimó al entrar.
    </div>;
  if(o.tipo!=="deshidratado") return null;

  const m = planificadaDeshidratado(o.componentes);
  if(!m) return <div className="avi war" style={{fontSize:11.5}}>
    Cargá los lotes de queso para calcular la cantidad planificada.</div>;

  return <div className={"avi "+(m.sinRegla.length?"war":"ok")} style={{fontSize:11.5}}>
    <span style={{fontFamily:"var(--mono)"}}>
      {m.entra} kg de queso − {Math.round(m.merma*100)}% de merma = <strong>{m.sale} kg</strong> planificados
    </span>
    {/* La cantidad se recalcula sola, así que los registros viejos ya salen
        bien. El problema es lo que ya se subió: en SAP quedó la cifra inflada
        y hay que corregirla allá. */}
    {m.aparte && m.aparte.length>0 && o.subida && (() => {
      const conSal = (o.componentes||[]).filter(c=>c.codigo && !c.excluido)
        .reduce((t,c)=>{
          const kg=parseFloat(c.cantidad)||0;
          const mm=mermaDeshidratado(c.codigo);
          return t + (mm===null ? kg : kg*(1-mm));
        },0);
      if(Math.abs(conSal - m.sale) < 0.01) return null;
      return <div className="avi err" style={{marginTop:6}}>
        <strong style={{color:"var(--alerta)"}}>Esta orden ya se subió con la sal incluida</strong>
        <div style={{color:"var(--acero)",marginTop:3,lineHeight:1.5}}>
          En SAP quedó con <strong>{conSal.toFixed(2)} kg</strong> planificados; el cálculo
          corregido da <strong>{m.sale} kg</strong>. Hay que ajustar la cantidad planificada
          de esa orden en SAP: son {(conSal - m.sale).toFixed(2)} kg de más.
        </div>
      </div>;
    })()}

    {m.aparte && m.aparte.length>0 && <div style={{color:"var(--acero)",marginTop:4}}>
      La proyección se hace solo sobre el queso. Fuera del cálculo:{" "}
      {m.aparte.join(", ")} — entran al cajón pero no se deshidratan.
    </div>}
    {m.sinRegla.length>0 && <div style={{color:"var(--acero)",marginTop:4}}>
      Sin regla de merma: {m.sinRegla.join(", ")}. Esos kg se contaron sin pérdida,
      así que la cantidad puede quedar alta.
    </div>}
  </div>;
}

function MarcaVsCodigo({o,onCambio}){
  if(o.tipo === "recortes") return null;   /* los recortes siempre son TIQ */
  const choque = chocaConMarca(o.codigo, o.lote, o.marca);
  if(!choque) return null;

  /* La marca la escriben a mano y el código sale de la etiqueta impresa, así
     que lo más probable es que lo equivocado sea lo escrito. Se ofrecen las
     dos salidas, con esa primero. */
  const arreglarMarca = () => onCambio({...o,
    marca: choque.marcaDelCodigo,
    marcaOriginal: o.marcaOriginal || o.marca});

  return <Aviso tipo="err">
    <strong style={{color:"var(--alerta)"}}>La marca no coincide con el código</strong>
    <div style={{color:"var(--acero)",margin:"3px 0 8px",lineHeight:1.5}}>
      La hoja dice <strong>{o.marca}</strong> y {o.codigo} es de{" "}
      <strong>{choque.marcaDelCodigo || "otra marca"}</strong>. La etiqueta pegada
      suele ser más confiable que lo escrito a mano.
    </div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      {choque.marcaDelCodigo &&
        <button className="btn" onClick={arreglarMarca}>
          La marca es {choque.marcaDelCodigo} · corregir la hoja</button>}
      {choque.alterno &&
        <button className="btn sec" onClick={()=>onCambio(conCodigo(o,choque.alterno))}>
          No, usar {choque.alterno}</button>}
    </div>
  </Aviso>;
}

function EditorOrden({orden,onCambio,onBorrar,onUnir,foto,todas,onAgregarRecortes,dia,col1,col2,histCajon}){
  const o=orden;
  const set=k=>v=>onCambio({...o,[k]:v, ...(k==="docEntry" ? {docEntryCodigo:""} : {})});
  const esRec = o.tipo==="recortes";
  /* Mismo criterio que usa la validación: vale la pareja exacta, o unos
     recortes del mismo consecutivo y familia aunque hayan entrado por otra
     carga. Tener dos reglas distintas para lo mismo hacía que el aviso
     apareciera con el registro de recortes ya creado y a la vista. */
  const tienePar = recortesDelProducto(o, todas).length > 0;
  const setComp=(id,nc)=>onCambio({...o,componentes:o.componentes.map(x=>x.id===id?nc:x)});
  const alertas=validarOrden(o,todas,dia);
  const s1=armarCom1(o), s2=armarCom2(o);
  const act=o.componentes.filter(c=>c.material||c.codigo||c.cantidad||c.lote);
  const revisados=act.filter(c=>c.revisado).length;

  return <div>
    <div className={"avi "+(esRec?"esp":"neu")} style={{display:"flex",gap:10,
         alignItems:"center",flexWrap:"wrap"}}>
      <div style={{flex:"1 1 150px"}}>
        <Lbl>Tipo de registro</Lbl>
        <select value={o.tipo} onChange={ev=>set("tipo")(ev.target.value)}>
          {TIPOS.map(([v,t])=><option key={v} value={v}>{t}</option>)}
        </select>
      </div>
      {o.tipo!=="rallado" && <div style={{flex:"0 0 90px"}}>
        <Lbl>Pareja</Lbl>
        <select value={o.pareja} onChange={ev=>set("pareja")(parseInt(ev.target.value,10))}>
          <option value={1}>1</option><option value={2}>2</option>
        </select>
      </div>}
      {esRec && <div style={{flex:"1 1 100%",fontSize:11.5,color:"var(--morado)"}}>
        Excedente de cortar el producto. Va como orden aparte en SAP.</div>}
    </div>

    {o.tipo==="fraccionado" && !tienePar && <Aviso tipo="esp">
      <strong style={{color:"var(--morado)"}}>Falta el registro de recortes</strong>
      <div style={{color:"var(--acero)",margin:"3px 0 8px"}}>
        {codigoRecortes(o.codigo)
          ? "Se crea con " + codigoRecortes(o.codigo) + ", heredando fecha, turno y componentes."
          : "Esta familia no tiene código de recortes activo; revisá el código del producto."}
      </div>

      {/* Si el día ya tiene recortes de otra familia en el mismo consecutivo,
          conviene decirlo: sin esto parece que la app ignora un registro que
          está a la vista, cuando en realidad pertenece al otro bloque. */}
      {(() => {
        const fam = c => (/^[A-Z]{3}(\d{2})/.exec(c||"")||[])[1];
        const otros = (todas||[]).filter(x => x.tipo==="recortes" &&
          x.registro===o.registro && fam(x.codigo)!==fam(o.codigo));
        if(!otros.length) return null;
        return <div style={{color:"var(--acero)",margin:"0 0 8px",fontSize:11.5,
                     lineHeight:1.5}}>
          En el registro {o.registro} ya hay recortes, pero de otra familia:{" "}
          {otros.map(x => <span key={x.id} style={{fontFamily:"var(--mono)"}}>
            {x.codigo}{ART[x.codigo] ? " (" + nombreCorto(ART[x.codigo].desc) + ")" : ""}{" "}
          </span>)}
          — esos salieron del otro bloque de la hoja, no de {o.codigo}.
        </div>;
      })()}
      <button className="btn" onClick={onAgregarRecortes} disabled={!codigoRecortes(o.codigo)}>
        Crear el registro de recortes</button>
    </Aviso>}

    <VisorFoto url={foto}/>
    <ListaAlertas alertas={alertas}/>

    {o.dudas && o.dudas.length>0 && <Aviso tipo="esp">
      <strong style={{color:"var(--morado)"}}>La IA marcó dudas de lectura ({o.dudas.length})</strong>
      <ul style={{margin:"5px 0 0",paddingLeft:17,color:"var(--acero)"}}>
        {o.dudas.map((d,i)=><li key={i} style={{marginBottom:2}}>{d}</li>)}
      </ul>
    </Aviso>}

    <div className="card">
      <h3 style={{margin:"0 0 12px",fontSize:14}}>Producto terminado</h3>
      <Campo etiqueta="Lote (10 caracteres)" valor={o.lote} cod
        onChange={v=>onCambio({...o,lote:v.replace(/[\s-]/g,"").toUpperCase(),codigo:""})}/>
      <DesgloseLote lote={o.lote}/>
      <label style={{display:"flex",gap:8,alignItems:"center",cursor:"pointer",
             padding:"8px 10px",marginTop:8,borderRadius:3,
             border:"1px solid "+(o.loteRevisado?"var(--verde)":"var(--borde)"),
             background:o.loteRevisado?"var(--verde-suave)":"transparent"}}>
        <input type="checkbox" checked={!!o.loteRevisado}
          onChange={ev=>set("loteRevisado")(ev.target.checked)}
          style={{width:"auto",margin:0}}/>
        <span style={{fontSize:12.5,fontWeight:500,
                      color:o.loteRevisado?"var(--verde)":"var(--tinta)"}}>
          El lote del producto terminado coincide con la foto</span>
      </label>
      <div style={{height:12}}/>
      <ResolverCodigo lote={o.lote} codigo={o.codigo} onElegir={v=>onCambio(conCodigo(o,v))}/>
      <div style={{border:"1px solid var(--borde)",borderRadius:3,padding:11,marginBottom:14,
                   background:"var(--fondo)"}}>
        <Campo etiqueta="Vence · del lote, no de la orden" valor={o.fechaVencimiento}
          onChange={set("fechaVencimiento")} tipo="date"/>
        <div style={{fontSize:11,color:"var(--gris)",marginTop:-8,lineHeight:1.45}}>
          {esRec
            ? <span>Los recortes no llevan etiqueta: vencen{" "}
                {MESES_VENCE_RECORTES} meses después de producidos. Pertenece al lote
                <strong> {o.lote||"—"}</strong> y va a
                <code style={{fontFamily:"var(--mono)"}}> BTNT.ExpiryDate</code>.</span>
            : <span>Es la fecha de la etiqueta blanca del producto terminado. Pertenece al lote
                <strong> {o.lote||"—"}</strong>, que nace en la recepción: va a
                <code style={{fontFamily:"var(--mono)"}}> BTNT.ExpiryDate</code>.
                La orden de producción no tiene campo de vencimiento.</span>}
        </div>

        {/* Los recortes cargados antes de que esto se calculara solo pueden
            arreglarse a mano; el botón lo hace de una. */}
        {esRec && o.fechaElaboracion &&
         o.fechaVencimiento !== venceRecortes(o.fechaElaboracion) &&
          <button className="btn min" style={{marginTop:8}}
            onClick={()=>set("fechaVencimiento")(venceRecortes(o.fechaElaboracion))}>
            Calcular: {venceRecortes(o.fechaElaboracion)}
            {" "}({MESES_VENCE_RECORTES} meses después del {o.fechaElaboracion})
          </button>}
      </div>
      <Campo etiqueta="Producto en la boleta" valor={o.producto} onChange={set("producto")}/>
      <div className="row">
        <Campo etiqueta="Presentación" valor={o.presentacion} onChange={set("presentacion")} ancho="34%"/>
        <Campo etiqueta="Marca" valor={o.marca} onChange={set("marca")} ancho="33%"/>
        <Campo etiqueta="CVO" valor={o.cvo} onChange={set("cvo")} ancho="33%" cod/>
      </div>
      <MarcaVsCodigo o={o} onCambio={onCambio}/>
      {(() => {
        /* Cuando los lotes no caben en una hoja, siguen en otra con el mismo
           consecutivo. Son dos fotos pero un solo cajón: si quedan como dos
           órdenes, SAP crea dos producciones donde hubo una. */
        /* El lote tiene que ser el mismo: dos tandas del mismo producto en el
           mismo consecutivo son producciones separadas, con lotes distintos, y
           unirlas mezclaría trazabilidad. Se permite que a una le falte el
           lote, que pasa cuando la hoja de continuación no lo repite. */
        /* Solo en la entrada al cajón (deshidratado): ahí los lotes de un mismo
           cajón no caben en una hoja y siguen en otra. En fraccionados, panadero
           y análogo el mismo consecutivo se repite a propósito (una pareja o una
           tanda por bloque de la hoja) y unirlos sería un error. */
        if(o.tipo !== "deshidratado") return null;
        const hermanas = (todas||[]).filter(x => x.id !== o.id &&
          x.registro && x.registro === o.registro &&
          x.codigo === o.codigo && x.tipo === o.tipo &&
          (!x.lote || !o.lote || x.lote === o.lote));
        if(!hermanas.length) return null;
        const totalComp = hermanas.reduce((t,x)=>t+(x.componentes||[]).length, 0);

        const unir = () => {
          const vistos = new Set((o.componentes||[])
            .map(c => (c.codigo||"") + "|" + (c.lote||"") + "|" + (c.cantidad||"")));
          const extra = [];
          hermanas.forEach(x => (x.componentes||[]).forEach(c => {
            const k = (c.codigo||"") + "|" + (c.lote||"") + "|" + (c.cantidad||"");
            if(!vistos.has(k)){ vistos.add(k); extra.push({...c, id:uid()}); }
          }));
          onUnir(o, hermanas.map(x=>x.id), extra);
        };

        return <div className="avi war" style={{marginBottom:14}}>
          <strong style={{color:"var(--tinta)"}}>
            Hay {hermanas.length === 1 ? "otro registro" : hermanas.length + " registros"}{" "}
            con el consecutivo {o.registro} y el mismo producto</strong>
          <div style={{color:"var(--acero)",margin:"3px 0 8px",lineHeight:1.5}}>
            Si los lotes no cabían en una hoja y siguieron en otra, es una sola
            producción: conviene unirlas para que SAP no cree dos órdenes.
            Se agregarían {totalComp} componente(s) a este registro y{" "}
            {hermanas.length === 1 ? "el otro se borra" : "los otros se borran"}.
          </div>
          <button className="btn" onClick={unir}>
            Unir en este registro</button>
        </div>;
      })()}

      {o.tipo==="salida" && (() => {
        /* La entrada de ese mismo cajón sabe cuál era el lote. Si difiere, lo
           más probable es un dígito mal leído: la tanda es el que más falla,
           porque va al final y se confunde con facilidad. */
        const e = entradaDeCajon(o, histCajon);
        if(!e || !e.lote || !o.lote || e.lote === o.lote) return null;
        const soloTanda = e.lote.length === o.lote.length &&
          e.lote.slice(0,-1) === o.lote.slice(0,-1);
        return <div className="avi err" style={{marginBottom:14}}>
          <strong style={{color:"var(--alerta)"}}>
            El lote no coincide con lo que entró a ese cajón</strong>
          <div style={{color:"var(--acero)",margin:"3px 0 8px",lineHeight:1.5}}>
            Acá dice <span style={{fontFamily:"var(--mono)"}}>{o.lote}</span> y al{" "}
            {e.cajon||"cajón"} entró <span style={{fontFamily:"var(--mono)"}}>{e.lote}</span>
            {" "}el {e.fecha} (registro {e.registro||"—"}).
            {soloTanda && <span> Solo cambia el último dígito: es la <strong>tanda</strong>,
              que se lee mal seguido.</span>}
          </div>
          <button className="btn" onClick={()=>set("lote")(e.lote)}>
            Usar {e.lote}</button>
        </div>;
      })()}

      {o.tipo==="salida" && <div style={{border:"1px solid var(--morado)",borderRadius:3,
           padding:12,marginBottom:14,background:"var(--morado-suave)"}}>
        <Lbl>DocEntry de la orden que se creó al entrar al cajón</Lbl>
        <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <Campo etiqueta="" valor={o.docEntry} onChange={set("docEntry")} cod
              ph="p. ej. 91800"/>
          </div>
        </div>
        <div style={{fontSize:11.5,color:"var(--acero)",lineHeight:1.5,marginTop:-8,
             marginBottom:12}}>
          Esta orden se creó semanas atrás, así que no aparece en la consulta del día:
          el número se escribe acá. En la hoja está el <strong>CÓDIGO ORDEN SAP</strong>,
          que es el DocNum; para pasarlo a DocEntry:
          <pre style={{marginTop:6,marginBottom:0,fontSize:10.5}}>{
'SELECT T0."DocEntry", T0."DocNum", T0."ItemCode"\n' +
'FROM OWOR T0\n' +
'WHERE T0."DocNum" = ' + (o.docNum || '«número de la hoja»')}</pre>
        </div>
      </div>}

      {o.tipo==="salida" && <div style={{border:"1px solid var(--borde)",borderRadius:3,
           padding:12,marginBottom:14,background:"var(--fondo)"}}>
        <Lbl>¿Se vació el cajón?</Lbl>
        <select value={o.salidaFinal===false?"parcial":"final"}
          onChange={ev=>set("salidaFinal")(ev.target.value==="final")}>
          <option value="final">Sí, salió todo lo que quedaba</option>
          <option value="parcial">No, quedó producto adentro</option>
        </select>
        <div style={{marginTop:10}}>
          <Campo etiqueta="Ya había salido antes de este lote (kg)"
            valor={o.sacadoAntes} onChange={set("sacadoAntes")} cod/>
        </div>
        <Campo etiqueta="Cuánto entró al cajón (kg) · para medir la merma"
          valor={o.kgEntraronCajon} onChange={set("kgEntraronCajon")} cod
          ph="de la hoja de entrada"/>
        <div style={{fontSize:11.5,color:"var(--acero)",lineHeight:1.5}}>
          {o.salidaFinal===false
            ? <span>Se reciben los <strong>{o.cantidadKg||"—"} kg</strong> de hoy y la
                cantidad planificada queda como está, para que el resto se pueda recibir
                después contra esta misma orden.</span>
            : <span>Se reciben los <strong>{o.cantidadKg||"—"} kg</strong> de hoy y la
                cantidad planificada pasa a{" "}
                <strong>{(parseFloat(o.cantidadKg)||0)+(parseFloat(o.sacadoAntes)||0)} kg</strong>,
                que es lo que dio el cajón en total.</span>}
        </div>
      </div>}

      {(o.tipo==="deshidratado"||o.tipo==="salida") &&
        <Campo etiqueta="Cajón" valor={o.cajon} onChange={set("cajon")} cod/>}
      <MermaDeshidratado o={o}/>

      {o.tipo==="salida" && (() => {
        /* La entrada de ese mismo cajón sabe cuál era el lote. Si difiere, lo
           más probable es un dígito mal leído: la tanda es el que más falla,
           porque va al final y se confunde con facilidad. */
        const e = entradaDeCajon(o, histCajon);
        if(!e || !e.lote || !o.lote || e.lote === o.lote) return null;
        const soloTanda = e.lote.length === o.lote.length &&
          e.lote.slice(0,-1) === o.lote.slice(0,-1);
        return <div className="avi err" style={{marginBottom:14}}>
          <strong style={{color:"var(--alerta)"}}>
            El lote no coincide con lo que entró a ese cajón</strong>
          <div style={{color:"var(--acero)",margin:"3px 0 8px",lineHeight:1.5}}>
            Acá dice <span style={{fontFamily:"var(--mono)"}}>{o.lote}</span> y al{" "}
            {e.cajon||"cajón"} entró <span style={{fontFamily:"var(--mono)"}}>{e.lote}</span>
            {" "}el {e.fecha} (registro {e.registro||"—"}).
            {soloTanda && <span> Solo cambia el último dígito: es la <strong>tanda</strong>,
              que se lee mal seguido.</span>}
          </div>
          <button className="btn" onClick={()=>set("lote")(e.lote)}>
            Usar {e.lote}</button>
        </div>;
      })()}

      {o.tipo==="salida" && <div style={{border:"1px solid var(--morado)",borderRadius:3,
           padding:12,marginBottom:14,background:"var(--morado-suave)"}}>
        <Lbl>DocEntry de la orden que se creó al entrar al cajón</Lbl>
        <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <Campo etiqueta="" valor={o.docEntry} onChange={set("docEntry")} cod
              ph="p. ej. 91800"/>
          </div>
        </div>
        <div style={{fontSize:11.5,color:"var(--acero)",lineHeight:1.5,marginTop:-8,
             marginBottom:12}}>
          Esta orden se creó semanas atrás, así que no aparece en la consulta del día:
          el número se escribe acá. En la hoja está el <strong>CÓDIGO ORDEN SAP</strong>,
          que es el DocNum; para pasarlo a DocEntry:
          <pre style={{marginTop:6,marginBottom:0,fontSize:10.5}}>{
'SELECT T0."DocEntry", T0."DocNum", T0."ItemCode"\n' +
'FROM OWOR T0\n' +
'WHERE T0."DocNum" = ' + (o.docNum || '«número de la hoja»')}</pre>
        </div>
      </div>}

      {o.tipo==="salida" && <div style={{border:"1px solid var(--borde)",borderRadius:3,
           padding:12,marginBottom:14,background:"var(--fondo)"}}>
        <Lbl>¿Se vació el cajón?</Lbl>
        <select value={o.salidaFinal===false?"parcial":"final"}
          onChange={ev=>set("salidaFinal")(ev.target.value==="final")}>
          <option value="final">Sí, salió todo lo que quedaba</option>
          <option value="parcial">No, quedó producto adentro</option>
        </select>
        <div style={{marginTop:10}}>
          <Campo etiqueta="Ya había salido antes de este lote (kg)"
            valor={o.sacadoAntes} onChange={set("sacadoAntes")} cod/>
        </div>
        <Campo etiqueta="Cuánto entró al cajón (kg) · para medir la merma"
          valor={o.kgEntraronCajon} onChange={set("kgEntraronCajon")} cod
          ph="de la hoja de entrada"/>
        <div style={{fontSize:11.5,color:"var(--acero)",lineHeight:1.5}}>
          {o.salidaFinal===false
            ? <span>Se reciben los <strong>{o.cantidadKg||"—"} kg</strong> de hoy y la
                cantidad planificada queda como está, para que el resto se pueda recibir
                después contra esta misma orden.</span>
            : <span>Se reciben los <strong>{o.cantidadKg||"—"} kg</strong> de hoy y la
                cantidad planificada pasa a{" "}
                <strong>{(parseFloat(o.cantidadKg)||0)+(parseFloat(o.sacadoAntes)||0)} kg</strong>,
                que es lo que dio el cajón en total.</span>}
        </div>
      </div>}

      {(o.tipo==="deshidratado"||o.tipo==="salida") && <div style={{marginBottom:14}}>
        <Lbl>Cajón · va a {CAMPO_CAJON_DEFECTO}</Lbl>
        <select value={o.cajon||""} onChange={ev=>set("cajon")(ev.target.value)}>
          <option value="">— elegir —</option>
          {CAJONES.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>}
      <Deshidratacion o={o}/>
      <SalidaDeCajon o={o}/>
      <BalanceMasa o={o} todas={todas} onCambio={onCambio}/>
      <CasillasCantidad o={o} onCambio={onCambio}/>
    </div>

    {/* Una orden ya subida con el producto equivocado no se arregla editando:
        la de SAP sigue existiendo con el código malo. Se marca, se corrige el
        registro, sale en un OWOR nuevo y la vieja se cancela. */}
    {(o.subida || o.correccion) && o.tipo !== "salida" &&
      <div className="card" style={{borderColor:o.correccion?"var(--alerta)":undefined}}>
        <h3 style={{margin:"0 0 3px",fontSize:14}}>
          {o.correccion ? "Orden rehecha por producto equivocado" : "¿Se subió con un error?"}</h3>
        {!o.correccion
          ? <div>
              <p style={{margin:"0 0 10px",fontSize:12,color:"var(--gris)",lineHeight:1.45}}>
                Si el producto o el lote quedaron mal en SAP —la app leyó 2020 y la
                etiqueta decía 2120—, marcala acá. Se corrige el registro, sale en un
                archivo nuevo y la orden vieja se cancela.
              </p>
              <button className="btn sec" style={{color:"var(--alerta)"}} onClick={()=>{
                if(!confirm("La orden " + (o.docEntry ? "con DocEntry " + o.docEntry + " " : "") +
                            "queda para cancelar en SAP y este registro vuelve a subirse " +
                            "como orden nueva. ¿Seguir?")) return;
                onCambio({...o,
                  correccion:{codigo:o.codigo, lote:o.lote, docEntry:o.docEntry||"",
                              recibida:!!o.recibida},
                  docEntry:"", subida:false, recibida:false,
                  revisada:false, loteRevisado:false});
              }}>Marcar como incorrecta</button>
            </div>
          : <div style={{fontSize:12,lineHeight:1.55}}>
              <div style={{color:"var(--acero)"}}>
                Se había subido como <strong style={{fontFamily:"var(--mono)"}}>
                {o.correccion.codigo}</strong>, lote{" "}
                <span style={{fontFamily:"var(--mono)"}}>{o.correccion.lote||"—"}</span>
                {o.correccion.docEntry && <span>, DocEntry{" "}
                  <strong style={{fontFamily:"var(--mono)"}}>{o.correccion.docEntry}</strong></span>}.
              </div>
              <div style={{color:"var(--acero)",marginTop:6}}>
                <strong>Pasos:</strong> corregí el lote y el producto más abajo · subí el OWOR
                que va a aparecer solo con esta orden · escribí acá el DocEntry nuevo · bajá el
                archivo <strong>CANCELAR</strong> para anular la vieja.
              </div>
              {o.correccion.codigo === o.codigo &&
                <div style={{color:"var(--alerta)",marginTop:6}}>
                  Todavía tiene el mismo producto que la orden mala.</div>}
              {(o.correccion.recibida || o.correccion.revertida) &&
                <div style={{border:"1px solid var(--alerta)",borderRadius:3,padding:"8px 10px",
                     marginTop:8,background:o.correccion.revertida?"var(--verde-suave)":"var(--alerta-suave)"}}>
                  <div style={{color:"var(--tinta)",lineHeight:1.5}}>
                    La orden vieja ya tenía recepción. Antes del archivo CANCELAR, en SAP:
                    <div style={{marginTop:3}}>1 · Cancelar la recepción de producción (Datos → Cancelar)</div>
                    <div>2 · Cancelar las emisiones de componentes, si se hicieron</div>
                  </div>
                  <label style={{display:"flex",gap:7,alignItems:"center",marginTop:7,cursor:"pointer"}}>
                    <input type="checkbox" checked={!!o.correccion.revertida}
                      style={{width:"auto",margin:0}}
                      onChange={ev=>onCambio({...o, correccion:{...o.correccion,
                        revertida:ev.target.checked, recibida:!ev.target.checked}})}/>
                    <span style={{fontWeight:600,
                          color:o.correccion.revertida?"var(--verde)":"var(--tinta)"}}>
                      Ya lo revertí en SAP: incluirla en el archivo CANCELAR</span>
                  </label>
                </div>}
              <div style={{marginTop:10}}>
                <Campo etiqueta="DocEntry de la orden nueva" valor={o.docEntry}
                  onChange={set("docEntry")} cod ph="de la consulta, después de subir el OWOR"/>
              </div>
              <button className="btn min" onClick={()=>onCambio({...o,
                codigo:o.correccion.codigo, lote:o.correccion.lote,
                docEntry:o.correccion.docEntry, subida:true,
                recibida:o.correccion.recibida, correccion:null})}>
                Deshacer: era correcta</button>
            </div>}
      </div>}

    <div className="card">
      <h3 style={{margin:"0 0 10px",fontSize:14}}>Datos de la orden en SAP</h3>
      {/* El campo solo aparece si trae algo: normalmente va vacío y no hay
          nada que editar, pero si la lectura metió el CVO hay que poder
          sacarlo. Antes la validación bloqueaba y no había dónde corregirlo. */}
      {o.docNum && <div className="avi err" style={{fontSize:11.5}}>
        <strong style={{color:"var(--alerta)"}}>Esta orden trae un número escrito</strong>
        <div style={{color:"var(--acero)",margin:"3px 0 8px"}}>
          El número lo asigna SAP al importar. Si esto salió de la etiqueta —el CVO—,
          vacialo.
        </div>
        <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
          <div style={{flex:1}}>
            <Campo etiqueta="N° de orden" valor={o.docNum} onChange={set("docNum")} cod/>
          </div>
          <button className="btn" style={{marginBottom:14}}
            onClick={()=>set("docNum")("")}>Vaciar</button>
        </div>
      </div>}

      {/* Serie, almacén y tipo casi nunca se tocan: van plegados con un resumen.
          Se abren solos si alguno no tiene el valor de siempre, para que no
          pase inadvertido. */}
      <details open={!!(o.serie || (o.almacen||"02")!=="02" || (o.tipoOrden||"S")!=="S")}
        style={{margin:"0 0 12px",fontSize:12}}>
        <summary style={{cursor:"pointer",color:"var(--gris)"}}>
          Almacén <span style={{fontFamily:"var(--mono)"}}>{o.almacen||"02"}</span>
          {" · "}{({S:"Estándar",P:"Especial",D:"Desensamblaje"})[o.tipoOrden||"S"]}
          {o.serie ? " · serie " + o.serie : ""} · cambiar</summary>
        <div style={{marginTop:10}}>
      <div className="row">
        <Campo etiqueta="Serie" valor={o.serie} onChange={set("serie")} ancho="34%" cod/>
        <Campo etiqueta="Almacén" valor={o.almacen} onChange={set("almacen")} ancho="33%" cod/>
        <div style={{width:"33%",marginBottom:14}}>
          <Lbl>Tipo de orden</Lbl>
          <select value={o.tipoOrden||"S"} onChange={ev=>set("tipoOrden")(ev.target.value)}>
            <option value="S">S · Estándar</option>
            <option value="P">P · Especial</option>
            <option value="D">D · Desensamblaje</option>
          </select>
        </div>
      </div>
      <div className="avi neu" style={{fontSize:11.5,marginBottom:10}}>
        <strong>Estándar o Especial.</strong> Una orden <strong>Estándar</strong> toma los
        componentes de la lista de materiales del artículo en SAP; si el artículo no tiene
        lista, SAP la rechaza con <em>"Invalid production bill of materials"</em>. Una orden{" "}
        <strong>Especial</strong> no necesita lista: los componentes son los que van en el
        archivo. Casi todo va como Estándar; Especial sirve para un artículo que todavía
        no tiene su lista creada.
      </div>

      <div className="avi neu" style={{fontSize:11.5}}>
        <strong>El número de orden lo asigna SAP.</strong> Se sube en blanco y SAP le pone el
        consecutivo de la serie; después se copia al registro físico. Si lo ponés a mano,
        se arriesga un choque con otra orden creada entremedio.
      </div>
        </div>
      </details>
      <Campo etiqueta="Fecha de elaboración" valor={o.fechaElaboracion}
        onChange={set("fechaElaboracion")} tipo="date"/>
      {dia && o.fechaElaboracion && o.fechaElaboracion!==dia &&
        <div style={{marginTop:-8,marginBottom:14}}>
          {/* Al corregir la fecha se deja constancia sola: si no, el reporte
              muestra un día prolijo sin rastro de que hubo que ajustarlo. */}
          {/* Se guarda la fecha que traía la boleta, no una frase: así la
              corrección tiene su propia fila en el reporte y el campo de
              comentarios queda libre para lo que quiera escribir la persona. */}
          <button className="btn min" onClick={()=>onCambio({...o,
            fechaElaboracion: dia,
            fechaOriginal: o.fechaOriginal || o.fechaElaboracion})}>
            Usar la fecha del panel ({dia})</button>
        </div>}
    </div>

    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:3}}>
        <h3 style={{margin:0,fontSize:14}}>Materias primas, aditivos y empaque</h3>
        <span style={{fontFamily:"var(--mono)",fontSize:10.5,
          color:revisados===act.length&&act.length?"var(--verde)":"var(--gris)"}}>
          {revisados}/{act.length} revisados</span>
      </div>
      <p style={{margin:"0 0 12px",fontSize:12,color:"var(--gris)"}}>
        Cada línea es una fila de WOR1. El lote es opcional: aditivos y empaques se buscan por nombre.</p>
      {o.componentes.map((c,i)=>
        <FilaComponente key={c.id} c={c} idx={i} total={o.componentes.length}
          productoCod={o.codigo} productoLote={o.lote}
          onCambio={nc=>setComp(c.id,nc)}
          onQuitar={()=>onCambio({...o,componentes:o.componentes.filter(x=>x.id!==c.id)})}/>)}
      <button className="btn sec" onClick={()=>onCambio({...o,componentes:[...o.componentes,COMP_VACIO()]})}>
        Agregar componente</button>
    </div>

    <div className="card">
      <h3 style={{margin:"0 0 3px",fontSize:14}}>Trazabilidad en comentarios</h3>
      <p style={{margin:"0 0 12px",fontSize:12,color:"var(--gris)"}}>
        Lo que no tiene campo propio en la orden viaja acá. Se arma solo y se puede editar.</p>
      <Campo etiqueta="N° de registro del día (consecutivo manuscrito)" valor={o.registro} onChange={set("registro")} cod/>
      <Campo etiqueta="Colaboradores" valor={o.colaboradores} onChange={set("colaboradores")}/>
      {(() => {
        /* Un nombre que no está en la lista, o que se corrigió por parecido,
           se pregunta en vez de darlo por bueno: "Irvin" puede ser Ervin, pero
           también podría ser alguien nuevo. */
        const gente = colaboradoresDe(o.colaboradores);
        const dudosos = gente.filter(g => !g.canonico || g.aproximado);
        if(!dudosos.length) return null;

        const reemplazar = (leido, nuevo) => {
          const partes = (o.colaboradores||"").split(/\s*,\s*/);
          set("colaboradores")(partes.map(x =>
            norm(x) === norm(leido) ? nuevo : x).join(", "));
        };

        return <div className="avi war" style={{marginTop:-6,marginBottom:14}}>
          <strong style={{color:"var(--tinta)"}}>
            {dudosos.length === 1 ? "Un nombre no calza con la lista"
                                  : dudosos.length + " nombres no calzan con la lista"}</strong>
          {dudosos.map(g => {
            const opciones = sugerirNombres(g.leido, 3)
              .filter(n => n !== g.leido);
            return <div key={g.leido} style={{marginTop:8,fontSize:12,lineHeight:1.5}}>
              Leí <strong style={{fontFamily:"var(--mono)"}}>{g.leido}</strong>
              {g.canonico && g.aproximado &&
                <span style={{color:"var(--acero)"}}> y lo tomé como {g.canonico}</span>}
              {!g.canonico && <span style={{color:"var(--acero)"}}> y no está en la lista</span>}
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:5}}>
                {opciones.map(n =>
                  <button key={n} className="btn min"
                    onClick={()=>reemplazar(g.leido, n)}>¿{n}?</button>)}
                {!opciones.length &&
                  <span style={{fontSize:11.5,color:"var(--gris)"}}>
                    Ninguno de la lista se parece. Los habituales son{" "}
                    {COLABORADORES.join(", ")}.</span>}
              </div>
            </div>;
          })}
        </div>;
      })()}

      {(() => {
        /* La boleta tiene tres casillas de responsable; cuando trabajan cuatro,
           el que sobra queda anotado en observaciones y su tiempo no se cuenta
           en ningún lado. */
        const yaEstan = colaboradoresDe(o.colaboradores).map(g=>g.canonico||g.leido);
        const conApoyo = (o.apoyos||[]).map(a=>a.nombre);
        const texto = [(o.observacionesHoja||""), (o.observaciones||"")].join(" ");
        const sueltos = nombresEnTexto(texto)
          .filter(n => !yaEstan.includes(n) && !conApoyo.includes(n));
        if(!sueltos.length) return null;
        /* Si la frase trae un horario, esa persona ayudó solo ese rato y no
           todo el turno: se ofrece como apoyo con su propio horario, que se
           puede corregir si la lectura salió mal. */
        const rango = horasEnTexto(texto);
        return <div className="avi neu" style={{marginTop:-6,marginBottom:14,fontSize:11.5}}>
          En las observaciones aparece <strong>{sueltos.join(", ")}</strong>.
          {" "}¿También trabajó en este registro?
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
            {sueltos.map(n => rango
              ? <button key={n} className="btn min" onClick={()=>set("apoyos")(
                  [...(o.apoyos||[]), {nombre:n, desde:comoHora(rango.desde),
                                       hasta:comoHora(rango.hasta)}])}>
                  Agregar {n} de {comoHora(rango.desde)} a {comoHora(rango.hasta)}</button>
              : <button key={n} className="btn min" onClick={()=>set("colaboradores")(
                  (o.colaboradores||"").trim() ? o.colaboradores.trim() + ", " + n : n)}>
                  Agregar {n}</button>)}
          </div>
          {rango && <div style={{color:"var(--gris)",marginTop:5}}>
            Entra con su propio horario, no con el del registro. Después se puede ajustar.
          </div>}
        </div>;
      })()}
      <div className="row">
        <Campo etiqueta="Hora inicio" valor={o.horaInicio} onChange={set("horaInicio")} tipo="time" ancho="50%"/>
        <Campo etiqueta="Hora fin" valor={o.horaFin} onChange={set("horaFin")} tipo="time" ancho="50%"/>
      </div>

      {/* La IA confunde seguido la mañana con la tarde, así que el aviso frena
          por defecto. Pero hay turnos que sí empiezan antes de las 6 o siguen
          después de las 18: para esos se confirma acá. */}
      {[minutosDe(o.horaInicio), minutosDe(o.horaFin)]
        .some(m => m !== null && (m < HORA_MIN || m > HORA_MAX)) &&
        <label style={{display:"flex",gap:8,alignItems:"center",cursor:"pointer",
               padding:"8px 10px",marginBottom:14,borderRadius:3,
               border:"1px solid "+(o.horarioConfirmado?"var(--verde)":"var(--queso)"),
               background:o.horarioConfirmado?"var(--verde-suave)":"var(--queso-suave)"}}>
          <input type="checkbox" checked={!!o.horarioConfirmado}
            onChange={ev=>set("horarioConfirmado")(ev.target.checked)}
            style={{width:"auto",margin:0}}/>
          <span style={{fontSize:12.5,lineHeight:1.45,
                color:o.horarioConfirmado?"var(--verde)":"var(--tinta)"}}>
            Este horario está fuera de {comoHora(HORA_MIN)}–{comoHora(HORA_MAX)} y lo
            confirmé contra la foto
            <div style={{fontSize:11,color:"var(--acero)",marginTop:2}}>
              Marcalo solo si el turno realmente empezó o terminó a esa hora. Queda
              anotado como aviso en el reporte.
            </div>
          </span>
        </label>}
      {(o.apoyos||[]).length > 0 &&
        <div style={{border:"1px solid var(--borde)",borderRadius:3,padding:11,
             marginBottom:14,background:"var(--fondo)"}}>
          <Lbl>Apoyos · gente que ayudó un rato</Lbl>
          <div style={{fontSize:11.5,color:"var(--gris)",marginBottom:8,lineHeight:1.45}}>
            Cuentan con su propio horario, no con el del registro. Los kilos se les
            atribuyen en proporción al tiempo que estuvieron.
          </div>
          {(o.apoyos||[]).map((ap,i) =>
            <div key={i} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
              <span style={{flex:1,fontSize:12.5,fontWeight:500}}>{ap.nombre}</span>
              <input type="time" value={ap.desde||""} style={{width:110}}
                onChange={ev=>set("apoyos")((o.apoyos||[]).map((x,j)=>
                  j===i ? {...x, desde:ev.target.value} : x))}/>
              <input type="time" value={ap.hasta||""} style={{width:110}}
                onChange={ev=>set("apoyos")((o.apoyos||[]).map((x,j)=>
                  j===i ? {...x, hasta:ev.target.value} : x))}/>
              <button className="btn min" style={{color:"var(--alerta)"}}
                onClick={()=>set("apoyos")((o.apoyos||[]).filter((x,j)=>j!==i))}>
                Quitar</button>
            </div>)}
        </div>}

      <Campo etiqueta="Revisado por" valor={o.revisadoPor} onChange={set("revisadoPor")}/>
      <CampoComentario numero="1" destino={col1||COL_COM1_DEFECTO} valor={com1De(o)} sugerido={s1}
        auto={o.auto1} onAuto={set("auto1")} onChange={set("comentario1")}/>
      <CampoComentario numero="2" destino={col2||COL_COM2_DEFECTO} valor={com2De(o)} sugerido={s2}
        auto={o.auto2} onAuto={set("auto2")} onChange={set("comentario2")}/>
    </div>

    <div className="card">
      <h3 style={{margin:"0 0 3px",fontSize:14}}>Observaciones para gerencia</h3>
      <p style={{margin:"0 0 10px",fontSize:12,color:"var(--gris)",lineHeight:1.45}}>
        No viaja a SAP ni a los archivos de DTW: solo aparece en el reporte del día.
        Sirve para lo que no cabe en una casilla —una parada de máquina, un lote que
        llegó mal, algo que explique un número raro.
      </p>
      {(o.fechaOriginal && o.fechaOriginal !== o.fechaElaboracion ||
        o.marcaOriginal && o.marcaOriginal !== o.marca) &&
        <div style={{border:"1px solid var(--oro)",borderRadius:3,padding:"8px 10px",
             marginBottom:10,fontSize:11.5,lineHeight:1.5}}>
          <div style={{fontSize:9.5,color:"var(--gris)",textTransform:"uppercase",
               letterSpacing:".07em",marginBottom:3}}>Corregido contra la boleta</div>
          {o.fechaOriginal && o.fechaOriginal !== o.fechaElaboracion &&
            <div>Fecha: decía <strong>{o.fechaOriginal}</strong>, quedó{" "}
              <strong>{o.fechaElaboracion}</strong>{" "}
              <button className="btn min" onClick={()=>onCambio({...o,
                fechaElaboracion:o.fechaOriginal, fechaOriginal:""})}>Deshacer</button>
            </div>}
          {o.marcaOriginal && o.marcaOriginal !== o.marca &&
            <div>Marca: decía <strong>{o.marcaOriginal}</strong>, quedó{" "}
              <strong>{o.marca}</strong>{" "}
              <button className="btn min" onClick={()=>onCambio({...o,
                marca:o.marcaOriginal, marcaOriginal:""})}>Deshacer</button>
            </div>}
          <div style={{color:"var(--gris)",marginTop:4}}>
            Sale en el reporte con su propia categoría; no ocupa el comentario.
          </div>
        </div>}

      {/* Los registros transcritos antes de separar los campos guardaron el
          texto de la boleta acá. No hay cómo distinguirlo de un comentario
          escrito a mano, así que se ofrece moverlo con un botón. */}
      {!(o.observacionesHoja||"").trim() && (o.observaciones||"").trim() &&
        <div className="avi neu" style={{fontSize:11.5,marginBottom:10}}>
          ¿Este texto salió de la boleta y no lo escribiste vos? Movelo arriba y deja
          de aparecer en el reporte.
          <button className="btn min" style={{marginLeft:8}}
            onClick={()=>onCambio({...o, observacionesHoja:o.observaciones, observaciones:""})}>
            Vino de la boleta</button>
        </div>}

      {(o.observacionesHoja||"").trim() &&
        <div style={{border:"1px solid var(--borde)",borderRadius:3,padding:"8px 10px",
             marginBottom:10,background:"var(--fondo)"}}>
          <div style={{fontSize:9.5,color:"var(--gris)",textTransform:"uppercase",
               letterSpacing:".07em",marginBottom:3}}>Lo que dice la boleta</div>
          <div style={{fontSize:12,color:"var(--acero)",lineHeight:1.45}}>
            {o.observacionesHoja}</div>
          <button className="btn min" style={{marginTop:6}}
            onClick={()=>set("observaciones")(
              ((o.observaciones||"").trim() ? o.observaciones.trim() + " · " : "") +
              o.observacionesHoja.trim())}>
            Copiarlo abajo</button>
        </div>}

      <textarea rows={6} value={o.observaciones||""}
        onChange={ev=>set("observaciones")(ev.target.value)}
        style={{resize:"vertical"}}/>
      {(o.componentes||[]).some(c=>c.incompleto) &&
        <div style={{fontSize:11.5,color:"var(--alerta)",marginTop:8}}>
          {o.componentes.filter(c=>c.incompleto).length} componente(s) marcados como
          incompletos: también van al reporte.
        </div>}
    </div>

    {/* Es el último paso de cada registro y se hace decenas de veces al día:
        va destacado y en el mismo lugar de siempre, al final. */}
    <div className="card" style={{background:o.revisada?"var(--verde-suave)":"var(--panel)",
         borderColor:o.revisada?"var(--verde)":"var(--tiqueso)", borderWidth:2}}>
      <label style={{display:"flex",gap:11,alignItems:"center",cursor:"pointer",
             padding:"4px 0"}}>
        <input type="checkbox" checked={!!o.revisada} onChange={e=>set("revisada")(e.target.checked)}
          style={{width:"auto",margin:0,transform:"scale(1.4)"}}/>
        <span style={{fontWeight:700,fontSize:15,
              color:o.revisada?"var(--verde)":"var(--tiqueso)"}}>
          {o.revisada ? "Orden revisada contra la foto" : "Marcar la orden como revisada"}</span>
      </label>
      {(!o.loteRevisado || act.some(c=>!c.revisado)) &&
        <div style={{fontSize:11.5,color:"var(--queso)",marginTop:8,lineHeight:1.45}}>
          Falta cotejar: {[
            !o.loteRevisado ? "el lote del producto" : null,
            act.some(c=>!c.revisado)
              ? act.filter(c=>!c.revisado).length + " componente(s)" : null
          ].filter(Boolean).join(" y ")}.
        </div>}
    </div>

    <div className="card" style={{borderColor:o.enEspera?"var(--queso)":undefined}}>
      <h3 style={{margin:"0 0 3px",fontSize:14}}>Dejar en espera</h3>
      <p style={{margin:"0 0 10px",fontSize:12,color:"var(--gris)",lineHeight:1.45}}>
        Para un registro que no debe subirse todavía: algo en revisión, un dato por
        confirmar. No entra en ningún archivo ni cuenta para los contadores, pero
        queda guardado y sale en el reporte para que no se pierda de vista.
      </p>
      <label style={{display:"flex",gap:8,alignItems:"center",cursor:"pointer",
             marginBottom:o.enEspera?10:0}}>
        <input type="checkbox" checked={!!o.enEspera}
          onChange={ev=>set("enEspera")(ev.target.checked)} style={{width:"auto",margin:0}}/>
        <span style={{fontSize:12.5,fontWeight:500,
              color:o.enEspera?"var(--queso)":"var(--tinta)"}}>
          Apartar esta orden por ahora</span>
      </label>
      {o.enEspera &&
        <Campo etiqueta="Por qué queda en espera" valor={o.motivoEspera}
          onChange={set("motivoEspera")}
          ph="p. ej. calidad está revisando si entró a SAP"/>}
    </div>

    <div className="card">
      <button className="btn min" style={{color:"var(--alerta)"}} onClick={onBorrar}>Eliminar esta orden</button>
    </div>
  </div>;
}

function ordenEjemploSucia(){

    registro:"", docNum:"", almacen:"02", tipoOrden:"S",
    producto:"QUESO PIZZERO RALLADO 1 KG", presentacion:"1 KG",
    lote:"3011261800",              /* 3011 no existe → sugiere 3010 y 3010 */
    codigo:"",
    cantidadKg:"480", unidades:"24",
    fechaElaboracion:"2026-08-15",  /* no cuadra con el día juliano 180 */
    horaInicio:"06:00", horaFin:"14:30", colaboradores:"M. Jiménez",

      {id:uid(),material:"SAL",lote:"",codigo:"",cantidad:"",revisado:false},
    ]};
}

/* ---- Exportación DTW ---- */
/* Los nombres de las dos columnas de comentario cambian según la instalación
   y la versión. Se leen del desplegable "Target Fields" del paso 5 de DTW y se
   configuran abajo, en vez de quedar fijos en el código. */
/* Dónde aparece cada campo en la pantalla de la orden de producción. Los tres
   existen y son distintos: si el comentario 2 sale en "Resumen del asiento" en
   vez de "Observaciones sobre empaque", el nombre configurado es el de otro
   campo. La configuración vive en el navegador, así que un valor viejo
   sobrevive aunque cambie el valor por defecto. */
/* Marca de armado. Varias veces un cambio "no aparecía" y era que el navegador
   o Vercel seguían sirviendo el archivo anterior. Con esto se compara de un
   vistazo contra la versión que se acaba de subir. */
const VERSION_ARCHIVO = "2026-10-08 nube-8";

const CAMPOS_SAP = {
  remarks:            "Comentarios",
  journalremarks:     "Resumen del asiento",
  jrnlmemo:           "Resumen del asiento",
  pickremark:         "Observaciones sobre empaque",
  pickremarks:        "Observaciones sobre empaque",
  pickrmrk:           "Observaciones sobre empaque"
};
const dondeSale = col => CAMPOS_SAP[(col||"").toLowerCase().replace(/[^a-z]/g,"")] || null;

const COL_COM1_DEFECTO = "Remarks";
/* El template de DTW (OWOR - ProductionOrders) la llama PickRemarks, con s:
   campo PickRmrk, "Observaciones sobre empaque". Con "PickRemark" DTW la
   dejaba sin mapear y el comentario 2 se perdía sin avisar. */
const COL_COM2_DEFECTO = "PickRemarks";

/* OWOR NO lleva ProductionOrderStatus. SAP solo permite crear órdenes en
   estado Planificado:
     "Production orders can be created in planned status only [OWOR.Status]"
   Y una orden Planificada tampoco se puede recibir:
     "Referenced production order status should be 'Released' [OIGN.DocStatus]"
   O sea que liberar es obligatoriamente una segunda corrida, de tipo Update,
   con el DocEntry que SAP asignó al crearlas. De ahí el archivo LIBERAR. */
function cabOWOR(col1, col2, colCajon){
  return ["RecordKey","DocNum","Series","ItemNo","ProductionOrderType",
    "PlannedQuantity","Warehouse","PostingDate","StartDate","DueDate",
    col1 || COL_COM1_DEFECTO, col2 || COL_COM2_DEFECTO,
    colCajon || CAMPO_CAJON_DEFECTO];
}

/* Archivo aparte para liberar órdenes que YA existen. Se sube con
   "Update existing data", no con "Add new data".

   La columna clave se llama AbsoluteEntry en la plantilla de órdenes de
   producción: es el mismo número que el DocEntry de la tabla OWOR, pero el
   DI API lo expone con ese nombre. Se dejó configurable porque el rótulo
   cambia entre versiones. */
const CLAVE_ORDEN_DEFECTO = "AbsoluteEntry";

/* Cancela en SAP las órdenes que se crearon con el producto equivocado. Solo
   se puede con las que no tienen movimientos: si ya se recibió producto contra
   ellas, SAP no deja cancelar y primero hay que revertir la recepción. */
function construirCancelar(ordenes, clave){
  const cab = ["RecordKey", clave || CLAVE_ORDEN_DEFECTO, "ProductionOrderStatus"];
  const filas = ordenes
    .filter(o => o.correccion && o.correccion.docEntry && !o.correccion.recibida)
    .map((o,i) => [i+1, o.correccion.docEntry, "boposCancelled"]);
  return [cab, ...filas];
}

function construirLiberar(ordenes, clave){
  /* Lleva también PickRemarks: así las órdenes que se crearon con la columna
     mal nombrada ("PickRemark") reciben su comentario 2 al liberarse. */
  const cab = ["RecordKey", clave || CLAVE_ORDEN_DEFECTO, "ProductionOrderStatus", COL_COM2_DEFECTO];
  /* Una salida de cajón no se libera: su orden se liberó semanas atrás, al
     entrar. Volver a liberarla es pedirle a SAP algo que ya está hecho. */
  const filas = ordenes.filter(o=>o.docEntry && o.tipo!=="salida")
    .map((o,i)=>[i+1, o.docEntry, "boposReleased", com2De(o)||""]);
  return [cab, ...filas];
}
const CAB_WOR1 = ["RecordKey","LineNum","ItemNo","PlannedQuantity","BaseQuantity","Warehouse"];

/* ── Serialización ──────────────────────────────────────────────────────
   DTW usa normalmente TXT delimitado por tabulaciones. Ese formato NO lleva
   comillas: si se entrecomilla un valor, las comillas entran como parte del
   dato. En CSV sí hay que entrecomillar lo que traiga comas o saltos.      */

function limpiar(v){
  /* Tabuladores y saltos de línea rompen cualquiera de los dos formatos. */
  return String(v ?? "").replace(/[\t\r\n]+/g, " ").trim();
}

function celda(v, fmt){
  const s = limpiar(v);
  if(fmt === "txt") return s;                  /* tabulado: sin comillas */
  return /[",]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

/* Las plantillas de DTW llevan DOS filas de encabezado: la primera con el
   nombre técnico del campo y la segunda con su descripción. Los datos empiezan
   en la fila 3. Con una sola fila, DTW toma el primer registro como si fuera el
   segundo encabezado y lo descarta en silencio. */
function tabla(filas, fmt, doble){
  const sep = fmt === "txt" ? "\t" : ",";
  const conEncabezado = (doble===false || !filas.length)
    ? filas
    : [filas[0], filas[0], ...filas.slice(1)];
  return conEncabezado.map(f => f.map(v => celda(v,fmt)).join(sep)).join("\r\n");
}

const FORMATOS = {
  json:{ext:"json", mime:"application/json;charset=utf-8;", bom:false,
        nombre:"Respaldo de la app"},
  txt: {ext:"txt", mime:"text/plain;charset=utf-8;", bom:false,
        nombre:"TXT delimitado por tabulaciones — lo normal en DTW"},
  csv: {ext:"csv", mime:"text/csv;charset=utf-8;",  bom:true,
        nombre:"CSV separado por comas — para abrir en Excel"}
};

/* Hoja de control: como SAP asigna el DocNum al importar, hace falta saber
   después qué orden quedó ligada a cuál registro físico. Esta hoja se imprime
   o se abre al lado, y se anota el número que SAP devolvió.                 */
const CAB_CTRL = ["RecordKey","RegistroDia","Pareja","Tipo","ItemCode","Descripcion",
                  "CantidadPlan","Lote","Vence","DocNum_SAP","DocEntry_SAP"];

function construirControl(ordenes){
  const filas = ordenes.map((o,i)=>([
    i+1, o.registro, o.pareja, o.tipo, o.codigo,
    ART[o.codigo]?ART[o.codigo].desc:o.producto,
    cantidadDe(o), o.lote, o.fechaVencimiento,
    o.docNum, o.docEntry                 /* se llenan con lo que devuelva SAP */
  ]));
  return [CAB_CTRL, ...filas];
}

/* ══════════════ RECEPCIÓN DE PRODUCTO TERMINADO ══════════════
   Tres archivos que se suben JUNTOS en la misma corrida de DTW:
     OIGN — cabecera del documento (Entrada de mercancías)
     IGN1 — líneas, enlazadas a la orden con BaseType 202 + BaseEntry
     BTNT — el lote nuevo que nace aquí, con su vencimiento

   BaseEntry es el DocEntry de la orden de producción, no el DocNum. Solo
   existe después de importar OWOR, por eso la recepción va en una segunda
   pasada. BTNT.BaseLineNumber apunta a IGN1.LineNum y arranca en 0.
   La cantidad de BTNT debe cuadrar exactamente con la de su línea de IGN1.

   BaseLine VA VACÍO. En una orden de producción las líneas son los COMPONENTES,
   así que BaseLine=0 apunta al primer componente y SAP recibe ese artículo en
   vez del producto terminado. Comprobado en planta: dos recibos entraron como
   TIQ0100 (componente 1) cuando los productos eran TIQ0199R y REA0150.
   Vacío, SAP toma el artículo padre de la orden, que es lo correcto.
   Para la EMISIÓN será al revés: ahí BaseLine sí numera los componentes.   */

/* TaxDate NO va: cuando el documento referencia una orden de producción, SAP
   la deriva y rechaza el archivo si viene con valor.
     "The field should be empty if the document is referenced to a
      production order. [OIGN.TaxDate]"                                     */
function cabOIGN(col1, col2){
  return ["RecordKey","DocDate","DocDueDate",
    col1 || "Comments", col2 || "JournalMemo"];
}
/* ItemCode NO va: al referenciar la orden, SAP toma el artículo de ella.
     "The field should be empty if the document is referenced to a
      production order. [IGN1.ItemCode]"
   Mismo criterio que TaxDate en la cabecera: todo lo que SAP derive de la
   orden hay que dejarlo vacío, no repetirlo. */
const CAB_IGN1 = ["RecordKey","LineNum","BaseType","BaseEntry","BaseLine",
                  "Quantity","WarehouseCode"];
/* Se mandan todas las columnas de BTNT aunque vayan vacías: DTW es quisquilloso
   con las plantillas incompletas. */
const CAB_BTNT = ["RecordKey","LineNum","AddmisionDate","BaseLineNumber","BatchNumber",
                  "ExpiryDate","InternalSerialNumber","Location","ManufacturerSerialNumber",
                  "ManufacturingDate","Notes","Quantity"];

function construirRecepcion(ordenes, fmt, col1, col2){
  const oign=[cabOIGN(col1,col2)], ign1=[CAB_IGN1], btnt=[CAB_BTNT];
  ordenes.forEach((o,i)=>{
    const rk=i+1, f=fechaDTW(o.fechaElaboracion,fmt), cant=cantidadDe(o);
    oign.push([rk,f,f,com1De(o),com2De(o)]);
    /* Una línea por orden: el producto terminado que entra a inventario. */
    /* Si el DocEntry es de una orden de otro artículo, BaseEntry va vacío
       para que DTW lo rechace: SAP aceptaría la recepción y metería el
       artículo de esa otra orden con el lote y la cantidad de esta. */
    ign1.push([rk,0,202,docEntryAjeno(o) ? "" : o.docEntry,"",cant,o.almacen]);
    btnt.push([rk,0,"",0,o.lote,fechaDTW(o.fechaVencimiento,fmt),"","","",
               fechaDTW(o.fechaElaboracion,fmt),"",cant]);
  });
  return {oign,ign1,btnt};
}

/* Al salir del cajón la cantidad planificada deja de ser la estimada por merma
   y pasa a ser la real recibida. Se corrige con una corrida Update sobre la
   orden que se creó en la entrada, semanas antes. */
const CAB_AJUSTE = ["RecordKey","AbsoluteEntry","PlannedQuantity"];

/* La cantidad planificada solo se corrige cuando el cajón se vacía: ahí ya se
   sabe cuánto dio en total. En una salida parcial se deja la estimación por
   merma, porque el resto todavía tiene que poder recibirse contra esta orden.
   Si se ajustara a lo que salió hoy, la orden quedaría cerrada en falso. */
function totalSalida(o){
  const hoy = parseFloat(o.cantidadKg) || 0;
  const antes = parseFloat(o.sacadoAntes) || 0;
  return +(hoy + antes).toFixed(3);
}

function construirAjuste(ordenes, clave){
  const cab = ["RecordKey", clave || CLAVE_ORDEN_DEFECTO, "PlannedQuantity"];
  const filas = ordenes
    .filter(o => o.tipo==="salida" && o.docEntry && o.salidaFinal !== false &&
                 totalSalida(o) > 0)
    .map((o,i) => [i+1, o.docEntry, String(totalSalida(o))]);
  return [cab, ...filas];
}

/* Hoja de apoyo para la ENTREGA DE COMPONENTES en SAP, mientras la emisión
   por DTW siga pendiente. No se sube: se abre al lado y se va cargando a mano.
   Va ordenada por DocEntry, que es el orden en que aparecen las órdenes en SAP. */
const CAB_COMPONENTES = ["DocEntry","DocNum","RegistroDia","ProductoTerminado",
                         "ItemCode","Descripcion","Lote","Cantidad","UM",
                         "Almacen","EnLaOrden"];

function construirComponentes(ordenes){
  const filas = [];
  ordenes
    .filter(o => o.docEntry)
    .slice()
    .sort((a,b) => (parseInt(a.docEntry,10)||0) - (parseInt(b.docEntry,10)||0))
    .forEach(o => {
      o.componentes
        .filter(c => c.codigo || c.lote || c.material)
        .forEach(c => {
          const a = ART[c.codigo];
          filas.push([
            o.docEntry, o.docNum, o.registro,
            o.codigo + (ART[o.codigo] ? " " + ART[o.codigo].desc : ""),
            c.codigo, a ? a.desc : c.material,
            c.lote, cantidadComponente(c),
            a ? a.uom : "",
            almacenDe(c.codigo, o.almacen),
            /* Los excluidos no entraron en la orden: hay que agregarlos primero */
            c.excluido ? "NO" : "si"
          ]);
        });
    });
  return [CAB_COMPONENTES, ...filas];
}

/* La orden de producción lleva QUÉ artículos y CUÁNTO, no de qué lote: el lote
   se elige recién al hacer la emisión. Si el mismo ItemCode va en dos líneas,
   SAP rechaza la orden entera con "Item already defined at a higher level in
   the product tree". Pasa seguido: una hoja puede consumir dos lotes del mismo
   queso, o dos rollos de la misma bolsa.

   Acá se juntan por código y se suman las cantidades. El detalle por lote no se
   pierde: sigue en la app y en la hoja de entrega de componentes, que es donde
   hace falta. */
function consolidarComponentes(componentes, almacenOrden){
  const porCodigo = new Map();
  componentes.filter(c => c.codigo && !c.excluido).forEach(c => {
    const cant = parseFloat(cantidadComponente(c)) || 0;
    const previo = porCodigo.get(c.codigo);
    if(previo){ previo.cantidad += cant; previo.lotes.push(c.lote || "sin lote"); }
    else porCodigo.set(c.codigo, {codigo:c.codigo, cantidad:cant,
                                  almacen:almacenDe(c.codigo, almacenOrden),
                                  lotes:[c.lote || "sin lote"]});
  });
  return [...porCodigo.values()].map(x => ({...x,
    /* se redondea para que 30.6 + 96.9 no salga 127.50000000000001 */
    cantidad: +x.cantidad.toFixed(4)}));
}

function construirCSV(ordenes, fmt, col1, col2, colCajon){
  const owor=[cabOWOR(col1,col2,colCajon)], wor1=[CAB_WOR1];
  /* Las salidas de cajón no crean orden: la orden ya existe desde la entrada,
     semanas antes. Solo se reciben y se les ajusta la cantidad planificada. */
  ordenes.filter(o=>o.tipo!=="salida").forEach((o,i)=>{
    const rk=i+1, f=fechaDTW(o.fechaElaboracion,fmt);
    owor.push([rk,o.docNum,o.serie,o.codigo,o.tipoOrden,
      cantidadDe(o),o.almacen,f,f,f,com1De(o),com2De(o),o.cajon||""]);
    consolidarComponentes(o.componentes, o.almacen).forEach((c,j)=>{
      wor1.push([rk,j,c.codigo,c.cantidad,c.cantidad,c.almacen]);
    });
  });
  return {owor,wor1};
}

const ES_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);

/* El BOM ayuda a Excel con los acentos y la Ñ de CHONTALEÑO, pero DTW puede
   leerlo como parte del primer encabezado y rechazar la plantilla. Por eso va
   en CSV y no en TXT, y queda como opción visible. */
function archivoBlob(texto, fmt, conBom){
  const F = FORMATOS[fmt] || FORMATOS.csv;
  const bom = (conBom===undefined ? F.bom : conBom) ? "\ufeff" : "";
  return new Blob([bom+texto],{type:F.mime});
}

/* Safari corta la descarga si el blob se revoca enseguida, y no dispara nada si
   el enlace no está en el DOM. Por eso: se inserta, se hace clic y se revoca
   mucho después. */
function bajar(nombre,txt,fmt,bom){
  const u = URL.createObjectURL(archivoBlob(txt,fmt,bom));
  const a = document.createElement("a");
  a.href = u; a.download = nombre; a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(u); }, 60000);
}

/* En iPad la vía natural para sacar un archivo es la hoja de compartir:
   deja guardarlo en Archivos, mandarlo por AirDrop o por correo. */
/* Devuelve null si se puede compartir, o el motivo por el que no.
   Esconder el botón sin explicar por qué solo genera dudas. */
function motivoNoCompartir(nombre,txt,fmt,bom){
  if(!window.isSecureContext)
    return location.protocol === "file:"
      ? "Compartir necesita https. Estás abriendo el archivo desde el disco."
      : "Compartir necesita una conexión segura (https).";
  if(!navigator.share || !navigator.canShare)
    return "Este navegador no tiene la función de compartir.";
  try{
    if(!navigator.canShare({files:[new File([archivoBlob(txt,fmt,bom)],nombre,
        {type:(FORMATOS[fmt]||FORMATOS.csv).mime})]}))
      return "Este navegador no comparte archivos, solo enlaces.";
  }catch(e){ return "Este navegador no comparte archivos."; }
  return null;
}

async function compartir(nombre,txt,fmt,bom){
  const f = new File([archivoBlob(txt,fmt,bom)], nombre,
                     {type:(FORMATOS[fmt]||FORMATOS.csv).mime});
  try{ await navigator.share({files:[f], title:nombre}); }
  catch(e){ /* el usuario canceló, o el sistema lo rechazó */ }
}

async function copiar(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){ return false; }
}

/* ══════════════ Respaldo de un día: exportar e importar ══════════════
   Sirve para arrancar el día en el iPad y terminarlo en la PC. Lleva las
   órdenes tal cual, no las fotos: una boleta fotografiada pesa varios MB y
   el archivo se volvería impracticable de mover. */

const FORMATO_RESPALDO = 1;

function armarRespaldo(fecha, ordenes, actividades){
  return JSON.stringify({
    app: "tiqueso-ordenes",
    formato: FORMATO_RESPALDO,
    fecha,
    exportado: new Date().toISOString(),
    ordenes,
    actividades: actividades || []
  }, null, 2);
}

function leerRespaldo(texto){
  let d;
  try{ d = JSON.parse(texto); }
  catch(e){ throw new Error("El archivo no es un JSON válido."); }
  if(!d || d.app !== "tiqueso-ordenes")
    throw new Error("Este archivo no es un respaldo de esta aplicación.");
  if(typeof d.formato === "number" && d.formato > FORMATO_RESPALDO)
    throw new Error("El respaldo viene de una versión más nueva de la app. Actualizá el archivo HTML.");
  if(!Array.isArray(d.ordenes))
    throw new Error("El respaldo no trae ninguna orden.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.fecha || ""))
    throw new Error("El respaldo no dice a qué día pertenece.");

  /* Se rellenan los campos que falten: un respaldo viejo puede no tener
     campos que se agregaron después. */
  const ordenes = d.ordenes.map(o => ({
    ...ORDEN_VACIA(), ...o,
    id: o.id || uid(),
    componentes: Array.isArray(o.componentes) && o.componentes.length
      ? o.componentes.map(c => ({...COMP_VACIO(), ...c, id: c.id || uid()}))
      : [COMP_VACIO()]
  }));
  const actividades = Array.isArray(d.actividades)
    ? d.actividades.map(a => ({...ACTIVIDAD_VACIA(), ...a, id: a.id || uid()}))
    : [];
  return {...d, ordenes, actividades};
}

/* Consulta para SAP B1 sobre HANA: los identificadores van entre comillas
   dobles y con alias de tabla. La fecha, como literal AAAA-MM-DD. */
function CONSULTA(fecha){
  /* Con [%0] SAP pide la fecha al ejecutarla: se guarda una vez en el
     Administrador de consultas y sirve para cualquier día. Las cerradas y
     canceladas no salen; la fecha de liberación va al final porque una orden
     ya liberada es de una subida anterior del día y la app la salta. */
  return 'SELECT T0."DocEntry", T0."DocNum", T0."ItemCode",\n' +
         '       T0."PlannedQty", T0."Comments", T0."Status", T0."RlsDate"\n' +
         'FROM OWOR T0\n' +
         'WHERE T0."PostDate" = [%0]\n' +
         '  AND T0."Status" NOT IN (\'C\',\'L\')\n' +
         'ORDER BY T0."DocEntry"';
}

/* Interpreta lo que se pega desde SAP o Excel. Devuelve qué entendió, sin
   aplicar nada: la vista previa usa esto para mostrarlo antes de tocar datos.
   Con la tabla de la consulta (con encabezado) toma también el artículo, la
   cantidad y el registro del comentario: así el emparejamiento es por
   CONTENIDO y no por posición. El orden de la lista en la app puede no ser el
   del archivo que se subió (la nube no garantiza orden): emparejar por
   posición le dio a cada recepción la orden de otro producto (8/10/2026). */
const sinTildes = x => String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
const ENC_PEGADO = {
  docEntry: /^(docentry|numero interno|absoluteentry)$/,
  docNum:   /^(docnum|numero de documento|n(umero|o\.?)? de orden)$/,
  item:     /^(itemcode|itemno|numero de producto|numero de articulo|codigo de articulo|articulo|producto)$/,
  cant:     /^(plannedqty|plannedquantity|cantidad planificada|cantidad planif\.?)$/,
  coment:   /^(comments|comentarios|remarks)$/,
  rk:       /^(recordkey|record key|rk)$/,
  estado:   /^(status|estado|estado de la orden)$/,
  libera:   /^(rlsdate|release date|fecha de liberacion|fecha liberacion)$/
};
const ES_ARTICULO = /^[A-Z]{2,4}\d{3,}[A-Z]?$/i;
function celdaEnc(x){
  return sinTildes(x).toLowerCase().replace(/["#]/g,"").replace(/\s+/g," ").trim();
}
/* "4.8", "4,8", "1,234.5", "1.234,5" → número. Si es ambiguo, devuelve las dos lecturas. */
function lecturasCantidad(x){
  const t = String(x||"").replace(/\s/g,"");
  if(!t) return [];
  if(t.includes(".") && t.includes(",")){
    const dec = t.lastIndexOf(",") > t.lastIndexOf(".") ? "," : ".";
    const n = parseFloat(dec==="," ? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,""));
    return isNaN(n) ? [] : [n];
  }
  if(t.includes(",")){
    const a = parseFloat(t.replace(",",".")), b = parseFloat(t.replace(/,/g,""));
    return [a,b].filter(n=>!isNaN(n));
  }
  const n = parseFloat(t); return isNaN(n) ? [] : [n];
}
function registroDeComentario(c){
  const m = /registro[^0-9]*(\d+)/i.exec(sinTildes(c));
  return m ? m[1] : "";
}
function interpretarPegado(texto){
  const lineas = (texto||"").split("\n").map(l=>l.replace(/\r$/,"")).filter(l=>l.trim());
  if(!lineas.length) return {modo:null, pares:[]};
  /* Lo que se copia de SAP o de Excel viene separado por tabulador: con eso
     las celdas con espacios ("Número interno", el comentario) quedan enteras. */
  const conTab = lineas.some(l=>l.includes("\t"));
  const parte = l => conTab ? l.split("\t").map(x=>x.trim())
                            : l.trim().split(/[;,]+|\s+/).map(x=>x.trim()).filter(Boolean);

  const primera = parte(lineas[0]).map(celdaEnc);
  const col = k => primera.findIndex(x=>ENC_PEGADO[k].test(x));
  const iEnt = col("docEntry");
  if(iEnt >= 0){
    const iNum = col("docNum"), iItem = col("item"), iCant = col("cant"), iCom = col("coment"),
          iRk = col("rk"), iEst = col("estado"), iLib = col("libera");
    const filas = lineas.slice(1).map(parte).filter(t=>t.some(Boolean));
    const pares = filas.map((t,i)=>({orden:i+1,
        docEntry:(t[iEnt]||"").replace(/[^\d]/g,""),
        docNum: iNum>=0 ? (t[iNum]||"").replace(/[^\d]/g,"") : "",
        itemCode: iItem>=0 ? (t[iItem]||"").trim().toUpperCase() : "",
        cantidades: iCant>=0 ? lecturasCantidad(t[iCant]) : [],
        rk: iRk>=0 ? parseInt(t[iRk],10)||null : null,
        /* Liberada (R), cerrada (L) o cancelada (C), o con fecha de liberación:
           es de una subida anterior y ya tiene su recepción o la va a tener. */
        liberada: (iEst>=0 && /^[RLC]$/i.test((t[iEst]||"").trim())) ||
                  (iLib>=0 && !!(t[iLib]||"").trim()),
        registro: iCom>=0 ? registroDeComentario(t.slice(iCom).join(" ")) : ""}))
      .filter(x=>/^\d+$/.test(x.docEntry||""));
    return {modo: iItem>=0 ? "contenido" : "encabezado", pares};
  }

  const filas = lineas.map(parte).map(t=>t.filter(Boolean)).filter(t=>t.length);

  /* Sin encabezado pero con el artículo: «RecordKey DocEntry Artículo»,
     «DocEntry Artículo» o «DocEntry DocNum Artículo». Un primer número menor
     que 1000 se toma como RecordKey (los DocEntry son de 5 dígitos o más). */
  if(filas.every(t=>t.some(x=>ES_ARTICULO.test(x)))){
    const pares = filas.map((t,i)=>{
      const k = t.findIndex(x=>ES_ARTICULO.test(x));
      const nums = t.slice(0,k).filter(x=>/^\d+$/.test(x));
      const tras = t.slice(k+1);
      let rk=null, docEntry="", docNum="";
      if(nums.length>=3){ rk=parseInt(nums[0],10); docEntry=nums[1]; docNum=nums[2]; }
      else if(nums.length===2){
        if(parseInt(nums[0],10) < 1000){ rk=parseInt(nums[0],10); docEntry=nums[1]; }
        else { docEntry=nums[0]; docNum=nums[1]; }
      } else if(nums.length===1) docEntry=nums[0];
      return {orden:i+1, rk, docEntry, docNum, itemCode:t[k].toUpperCase(),
              cantidades: tras.length ? lecturasCantidad(tras[0]) : [],
              registro: registroDeComentario(tras.join(" "))};
    }).filter(x=>/^\d+$/.test(x.docEntry||""));
    if(pares.length) return {modo:"contenido", pares};
  }

  if(filas.every(t=>t.length===1 && /^\d+$/.test(t[0])))
    return {modo:"lista", pares:filas.map((t,i)=>({orden:i+1, docEntry:t[0], docNum:""}))};

  if(filas.every(t=>t.length===2 && /^\d+$/.test(t[0]) && /^\d+$/.test(t[1])))
    return {modo:"pares", pares:filas.map(t=>({orden:parseInt(t[0],10),
                                               docEntry:t[1], docNum:""}))};

  return {modo:null, pares:[]};
}

/* Decide a qué orden va cada DocEntry. Con artículo: por artículo, después
   registro, después cantidad; si queda más de una candidata no asigna nada
   (mejor pedirlo a mano que adivinar). Sin artículo: por posición, con aviso. */
function emparejarDocEntry(interpretado, destinos, todas){
  const {modo, pares} = interpretado;
  /* DocEntry que ya tiene otra orden del día (fuera de las que esperan): no
     se puede volver a usar. */
  const ids = new Set(destinos.map(d=>d.id));
  const yaUsados = new Set((todas||[]).filter(o=>!ids.has(o.id) && o.docEntry)
                                      .map(o=>String(o.docEntry)));
  /* Si todas tienen el RecordKey guardado, el orden del archivo se rearma con
     eso y no con el de la lista. */
  const todasConRK = destinos.length && destinos.every(d=>d.rkOwor);
  const enOrdenArchivo = todasConRK
    ? destinos.slice().sort((a,b)=>String(a.tandaOwor).localeCompare(String(b.tandaOwor)) ||
                                    (+a.rkOwor) - (+b.rkOwor))
    : destinos;
  if(modo !== "contenido")
    return {porContenido:false,
            filas:pares.map(p=>{
              const d = (modo==="pares" && destinos.find(x=>String(x.rkOwor)===String(p.orden))) ||
                        enOrdenArchivo[p.orden-1] || null;
              return {par:p, destino:d, estado: d ? "posicion" : "sin-destino"};
            })};
  const usados = new Set();
  const casa = (o,p) => !p.cantidades.length ||
    p.cantidades.some(n=>Math.abs(n - (parseFloat(cantidadDe(o))||0)) < 0.0005);
  /* Primero las filas más específicas, para que una ambigua no se lleve la de otra. */
  const resultado = pares.map(p=>({par:p, destino:null,
    estado: p.liberada ? "liberada" : yaUsados.has(String(p.docEntry)) ? "ya-usado" : ""}));
  const bloqueada = r => r.estado==="liberada" || r.estado==="ya-usado";
  const candidatas = p => {
    let c = destinos.filter(d => !usados.has(d.id) &&
      String(d.codigo||"").toUpperCase() === p.itemCode);
    /* Si SAP dice el registro y ninguna candidata lo tiene, no es ninguna de
       ellas (puede ser la de otra subida del día con el mismo artículo). */
    if(c.length && p.registro){
      const r = c.filter(d => String(d.registro||"").trim() === p.registro);
      c = r.length ? r : c.filter(d => !String(d.registro||"").trim());
    }
    if(c.length>1 && p.cantidades.length){
      const q = c.filter(d => casa(d,p));
      if(q.length) c = q;
    }
    if(c.length>1 && p.rk){
      const k = c.filter(d => String(d.rkOwor) === String(p.rk));
      if(k.length===1) c = k;
    }
    return c;
  };
  for(let vuelta=0; vuelta<pares.length; vuelta++){
    let avance = false;
    resultado.forEach(r=>{
      if(r.destino || bloqueada(r)) return;
      const c = candidatas(r.par);
      if(c.length===1){ r.destino=c[0]; usados.add(c[0].id); avance=true;
        r.estado = casa(c[0],r.par) ? "ok" : "cantidad"; }
    });
    if(!avance) break;
  }
  /* Mismo artículo varias veces y nada más que las distinga: DTW crea las
     órdenes en el orden del archivo, así que entre ellas el DocEntry menor es
     el RecordKey menor. Solo si todas tienen el RecordKey de la misma tanda. */
  const sueltas = {};
  resultado.filter(r=>!r.destino && !bloqueada(r)).forEach(r=>{ (sueltas[r.par.itemCode]=sueltas[r.par.itemCode]||[]).push(r); });
  Object.entries(sueltas).forEach(([item,rs])=>{
    const c = destinos.filter(d=>!usados.has(d.id) && String(d.codigo||"").toUpperCase()===item);
    if(c.length!==rs.length || c.length<2) return;
    if(!c.every(d=>d.rkOwor && d.tandaOwor===c[0].tandaOwor)) return;
    const cs = c.slice().sort((a,b)=>(+a.rkOwor)-(+b.rkOwor));
    rs.slice().sort((a,b)=>(+a.par.docEntry)-(+b.par.docEntry)).forEach((r,i)=>{
      r.destino = cs[i]; usados.add(cs[i].id); r.estado = "orden";
    });
  });
  /* El RecordKey, si vino, se coteja contra el guardado en la orden (o, si no
     lo tiene, contra la posición): no decide nada, solo avisa. */
  resultado.forEach(r=>{
    if(!r.destino || !r.par.rk || r.estado!=="ok") return;
    const esperado = r.destino.rkOwor ? String(r.destino.rkOwor)
                   : String(destinos.indexOf(r.destino)+1);
    if(esperado !== String(r.par.rk)) r.estado = "rk";
  });
  resultado.forEach(r=>{
    if(r.destino || bloqueada(r)) return;
    const c = candidatas(r.par);
    r.estado = c.length>1 ? "ambiguo"
             : destinos.some(d=>String(d.codigo||"").toUpperCase()===r.par.itemCode) ? "repetido"
             : "sin-orden";
  });
  return {porContenido:true, filas:resultado};
}

const NOMBRE_MODO = {
  contenido:"tabla de SAP: se empareja por artículo, registro y cantidad",
  encabezado:"columna DocEntry del encabezado, en orden (sin artículo: por posición)",
  lista:"lista de DocEntry, en orden",
  pares:"parejas RecordKey y DocEntry"
};

/* DTW reporta los errores como "RecordKey N ... [WOR1.ItemCode][line: M]", y
   averiguar a qué artículo corresponde obliga a contar renglones a mano. Esto
   lo resuelve: se pega el mensaje y devuelve la orden y el componente.

   DTW cuenta las líneas DESDE 1, aunque el LineNum que escribimos en el archivo
   arranque en 0. Comprobado contra un rechazo real: "[line: 2]" era el segundo
   componente, no el tercero. Además los componentes excluidos no viajan al
   archivo, así que la numeración tampoco coincide con la de la pantalla. */
function ubicarErrorDTW(texto, ordenes){
  const t = texto || "";
  const mRec  = /^\s*(\d+)\s/.exec(t) || /record\s*(?:key)?\s*[:#]?\s*(\d+)/i.exec(t);
  const mLine = /\[line:\s*(\d+)\]/i.exec(t);
  const mTabla = /\[(\w+)\.(\w+)\]/.exec(t);
  if(!mRec) return null;

  const rk = parseInt(mRec[1], 10);
  const orden = ordenes[rk - 1] || null;          /* RecordKey es 1-indexado */
  if(!orden) return {rk, orden:null};

  const tabla = mTabla ? mTabla[1].toUpperCase() : "";
  let componente = null, linea = null, vecino = null;
  if(mLine && tabla === "WOR1"){
    linea = parseInt(mLine[1], 10);
    const enviados = consolidarComponentes(orden.componentes, orden.almacen);
    componente = enviados[linea - 1] || null;
    /* Se ofrece el de al lado por si alguna versión de DTW numera distinto */
    vecino = enviados[linea] || null;
  }
  return {rk, orden, linea, componente, vecino, tabla,
          campo: mTabla ? mTabla[2] : "",
          mensaje: t.replace(/^\s*\d+\s+\w+\s+\w+\s*/,"").trim()};
}

/* ---- UI de archivos (JSX, no entra en las pruebas de lógica) ----

  const contenido = tabla(filas,fmt,doble);
  const sinCompartir = motivoNoCompartir(nombre,contenido,fmt,bom);
