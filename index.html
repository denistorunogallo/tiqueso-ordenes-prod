      <span style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:600}}>{nombre}</span>
      <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--gris)"}}>
        {renglones} fila{renglones===1?"":"s"}</span>
    </div>
    {nota && <div style={{fontSize:11,color:"var(--gris)",marginTop:3}}>{nota}</div>}
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
      <button className="btn" style={{padding:"7px 12px"}}
        onClick={()=>{ if(!antesDeBajar || antesDeBajar()) bajar(nombre,contenido,fmt,bom); }}>
        Descargar</button>
      {!sinCompartir && <button className="btn sec" style={{padding:"7px 12px"}}
        onClick={()=>{ if(!antesDeBajar || antesDeBajar()) compartir(nombre,contenido,fmt,bom); }}>
        Compartir</button>}
      <button className="btn sec" style={{padding:"7px 12px"}}

      Sin botón Compartir: {sinCompartir}</div>}
  </div>;
}

/* ---- Mapeo: una hoja de la IA puede dar varias órdenes de SAP ---- */
function ordenesDesdeIA(d, hojaId){
  const cab = {
    registro:d.registro||"", fechaElaboracion:d.fechaElaboracion||"",
    horaInicio:d.horaInicio||"", horaFin:d.horaFin||"",
    colaboradores:nombresLimpios(d.colaboradores||""), revisadoPor:d.revisadoPor||"",
    dudas:Array.isArray(d.dudas)?d.dudas:[]
  };

  /* La IA inventaría la hoja antes de transcribir. Si después no devuelve lo
     que ella misma anunció, es que se quedó corta: hay que decirlo. */
  const regs = Array.isArray(d.registros) ? d.registros : [];
  const bloqueDe = r => parseInt(r.bloque,10) || parseInt(r.pareja,10) || 1;
  const inv = Array.isArray(d.inventario) ? d.inventario : [];

  inv.forEach(it => {
    const b = parseInt(it.bloque,10) || 1;
    const suyos = regs.filter(r => bloqueDe(r) === b);
    const esperados = it.recortes ? 2 : 1;
    if(suyos.length < esperados)
      cab.dudas = cab.dudas.concat(
        `El bloque ${b} (${it.producto || "sin nombre"}) debía dar ${esperados} registro(s) ` +
        `y solo llegó ${suyos.length}. ` +
        (it.recortes && !suyos.some(r => r.tipo === "recortes")
          ? "Falta el registro de recortes."
          : "Falta parte de ese bloque en la foto o en la lectura."));
  });

  const bloquesTraidos = new Set(regs.map(bloqueDe));
  if(inv.length > bloquesTraidos.size)
    cab.dudas = cab.dudas.concat(
      `La lectura vio ${inv.length} bloques con datos pero solo transcribió ` +
      `${bloquesTraidos.size}. Revisá la mitad inferior de la hoja.`);

  /* Bandera propia: una hoja de fraccionados casi siempre trae más de un
     bloque. Si vino uno solo, hay que mirarla antes de darla por buena. */
  const esperados = inv.length ? inv.reduce((t,i)=>t+(i.recortes?2:1),0) : null;
  cab.lecturaParcial =
    (esperados !== null && regs.length < esperados) ||
    ((d.tipoHoja === "fraccionado") && bloquesTraidos.size < 2);
  const crudos = Array.isArray(d.registros)&&d.registros.length ? d.registros : [d];
  return crudos.map(r=>({...ORDEN_VACIA(), ...cab,
    parcial: !!cab.lecturaParcial,
    hoja:hojaId,
    tipo: r.tipo || d.tipoHoja || "rallado",
    /* Una salida de cajón no crea orden: la suya existe desde la entrada. */
    subida: (r.tipo || d.tipoHoja) === "salida" ? true : false,
    tipoOrden: cab.tipoOrden || "S",
    cajon: r.cajon || "",
    /* Cada bloque de la hoja tiene su propio encabezado: si el registro trae
       fecha, turno o responsables propios, mandan sobre los de la hoja. */
    pareja: parseInt(r.bloque,10) || parseInt(r.pareja,10) || 1,
    marca: r.marca || "",
    fechaElaboracion: r.fechaElaboracion || cab.fechaElaboracion,
    horaInicio: r.horaInicio || cab.horaInicio,
    horaFin: r.horaFin || cab.horaFin,
    colaboradores: r.colaboradores ? nombresLimpios(r.colaboradores) : cab.colaboradores,
    revisadoPor: r.revisadoPor || cab.revisadoPor,
    docNum:r.docNum||"", producto:r.producto||"", presentacion:r.presentacion||"",
    lote:(r.lote||"").replace(/[\s-]/g,"").toUpperCase(),
    codigo:r.codigo&&ART[r.codigo]?r.codigo:"",
    cvo:r.cvo||"", cantidadKg:r.cantidadKg||"", unidades:r.unidades||"",
    mpKg:r.mpKg||"", autoCant:true,
    /* Los recortes no llevan etiqueta con vencimiento: se calcula. */
    fechaVencimiento: r.fechaVencimiento ||
      ((r.tipo || d.tipoHoja) === "recortes"
        ? venceRecortes(r.fechaElaboracion || cab.fechaElaboracion) : ""),
    /* Lo leído de la hoja va a su propio campo: si cayera en el de
       observaciones, quien digita tendría que borrarlo para escribir lo suyo. */
    observacionesHoja:r.observaciones||d.observaciones||"",
    componentes:(Array.isArray(r.componentes)&&r.componentes.length
      ? r.componentes.map(c=>({id:uid(),material:c.material||"",
          lote:(c.lote||"").replace(/[\s-]/g,"").toUpperCase(),
          codigo:c.codigo&&ART[c.codigo]?c.codigo:"", cantidad:c.cantidad||"",revisado:false}))
      : [COMP_VACIO()])}));
}

/* Crea el registro de recortes emparejado con un fraccionado.
   La cantidad sale del balance de masa: lo que entró de materia prima menos
   lo que salió como producto. Así el renglón no nace vacío. */
function recortesDe(o){
  const cod = codigoRecortes(o.codigo);
  const p = desglosarLote(o.lote);
  const mp = parseFloat(o.mpKg), pt = parseFloat(o.cantidadKg);
  const kg = (!isNaN(mp) && !isNaN(pt) && mp > pt) ? String(+(mp - pt).toFixed(3)) : "";
  return {...ORDEN_VACIA(),
    tipo:"recortes", hoja:o.hoja, pareja:o.pareja,
    registro:o.registro, fechaElaboracion:o.fechaElaboracion,
    horaInicio:o.horaInicio, horaFin:o.horaFin,
    colaboradores:o.colaboradores, revisadoPor:o.revisadoPor,
    serie:o.serie, almacen:o.almacen, tipoOrden:o.tipoOrden,
    codigo:cod||"",
    fechaVencimiento: venceRecortes(o.fechaElaboracion),
    producto:cod&&ART[cod]?ART[cod].desc:"RECORTES",
    lote: cod&&p ? cod.slice(3,5)+"99"+p.yy+p.ddd+p.t : "",
    cantidadKg: kg,
    /* Solo la materia prima: la bolsa y la etiqueta son del producto, no de
       los recortes. Su cantidad es la misma que la de los recortes. */
    componentes:o.componentes
      .filter(c=>!esInsumo(c.codigo) &&
                 !pareceBolsa(c.material) && !pareceEtiqueta(c.material) &&
                 (c.codigo || c.lote || c.material))
      .map(c=>({...c,id:uid(),cantidad:kg,unidad:"kg",revisado:false}))};
}

/* Una excepción durante el render desmonta todo y deja la página en blanco,
   sin consola y sin forma de saber qué pasó. Los datos siguen guardados: lo
   que hace falta es no perder la pantalla y poder volver. */
class Salvavidas extends React.Component {
  constructor(p){ super(p); this.state = {error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  render(){
    if(!this.state.error) return this.props.children;
    return <div style={{padding:20,maxWidth:620,margin:"0 auto",
                        fontFamily:"var(--sans)",color:"var(--tinta)"}}>
      <style>{CSS}</style>
      <h2 style={{fontSize:16,color:"var(--alerta)",margin:"0 0 8px"}}>
        Algo falló al dibujar la pantalla</h2>
      <p style={{fontSize:13,lineHeight:1.5}}>
        Tu trabajo está guardado: las órdenes del día no se perdieron.
        Recargá la página para volver. Si se repite siempre en el mismo punto,
        pasá este texto para poder arreglarlo:
      </p>
      <pre style={{whiteSpace:"pre-wrap",fontSize:11}}>
        {String(this.state.error && (this.state.error.stack || this.state.error.message))}
      </pre>
      <button className="btn" onClick={()=>location.reload()}>Recargar</button>
    </div>;
  }
}

/* Muestra qué entendió del pegado ANTES de aplicarlo. Un DocEntry en la orden
   equivocada asocia la recepción a otra orden de producción y SAP la acepta
   sin quejarse, así que conviene verlo antes. */
function VistaPegado({texto,destinos,todas}){
  if(!texto.trim()) return null;
  const interp = interpretarPegado(texto);
  const {modo,pares} = interp;
  if(!modo) return <div className="avi err" style={{marginTop:8,marginBottom:0}}>
    <span style={{color:"var(--alerta)"}}>No reconozco ese formato.</span>
    <div style={{color:"var(--acero)",marginTop:3}}>
      Lo recomendado: copiá el resultado completo de la consulta, con su encabezado
      (DocEntry, DocNum, ItemCode, PlannedQty, Comments), o tres columnas:
      RecordKey, DocEntry y artículo.
    </div>
  </div>;

  const {porContenido, filas} = emparejarDocEntry(interp, destinos, todas);
  const asignadas = filas.filter(f=>f.destino).length;
  const ETIQ = {ok:"✓", orden:"✓ por orden de subida", rk:"✓ por artículo (ojo: el RecordKey no coincide)", cantidad:"✓ (cantidad distinta)", posicion:"por posición",
                ambiguo:"⚠ más de una orden posible: escribilo a mano",
                repetido:"⚠ no coincide con ninguna orden pendiente (registro, cantidad o ya asignada)", "sin-orden":"sin orden pendiente con ese artículo",
                "sin-destino":"ninguna orden en esa posición",
                liberada:"ya liberada: es de una subida anterior, se salta",
                "ya-usado":"ese DocEntry ya lo tiene otra orden del día"};
  const COLOR = {ok:"var(--verde)", orden:"var(--verde)", rk:"var(--verde)", cantidad:"var(--alerta)", posicion:"var(--acero)",
                 ambiguo:"var(--alerta)", repetido:"var(--alerta)", "sin-orden":"var(--gris)",
                 "sin-destino":"var(--alerta)", liberada:"var(--gris)", "ya-usado":"var(--gris)"};

  return <div className="avi neu" style={{marginTop:8,marginBottom:0}}>
    <strong style={{fontSize:12}}>Leído como {NOMBRE_MODO[modo]}</strong>
    {!porContenido && <div style={{color:"var(--alerta)",marginTop:4,fontSize:11.5,lineHeight:1.45}}>
      Sin la columna del artículo solo se puede asignar por posición, y la posición
      en la app puede no ser la del archivo que subiste. Pegá la consulta completa
      con encabezado para que se empareje por artículo.
    </div>}
    <div style={{marginTop:6,display:"flex",flexDirection:"column",gap:3}}>
      {filas.map((f,i)=>{
        const p = f.par, d = f.destino;
        return <div key={i} style={{fontFamily:"var(--mono)",fontSize:11,color:COLOR[f.estado]}}>
          {p.rk ? "RK " + p.rk + " · " : ""}DocEntry <strong>{p.docEntry}</strong>
          {p.docNum && " · " + p.docNum}
          {p.itemCode && " · " + p.itemCode}
          {"  → "}{d ? (d.codigo||"sin código") + " reg. " + (d.registro||"—") +
                       " · " + (cantidadDe(d)||"—") : ""}
          {"  "}{ETIQ[f.estado]}
        </div>;
      })}
    </div>
    <div style={{marginTop:6,fontSize:11.5,
                 color: asignadas===destinos.length ? "var(--verde)" : "var(--alerta)"}}>
      {asignadas} de {destinos.length} orden(es) esperando quedarían con DocEntry.
    </div>
  </div>;
}


/* La vista previa en pantalla se quitó a propósito: el entregable es el PDF y
   tener dos maneras de dibujar lo mismo solo garantiza que se vean distinto.
   El botón genera el archivo directamente. */


/* PDF del día, con la misma estructura visual que el reporte de salidas:
   banda verde con el logo, tarjetas de totales, encabezados de tabla en verde
   y barras horizontales para las proporciones. */

const PDF = {
  verde:[10,91,44], verde2:[0,128,61], verdeClaro:[231,243,236],
  oro:[212,160,23], rojo:[168,30,18], ambar:[138,90,0],
  tinta:[29,43,38], gris:[90,109,113], regla:[216,226,221],
  papel:[250,251,250], blanco:[255,255,255]
};

/* En el reporte no hace falta la palabra QUESO en cada renglón: se repite en
   casi todos y se come el ancho que necesitan los nombres largos. */
/* jsPDF dibuja con Helvetica en Windows-1252. Un carácter fuera de esa tabla
   —una flecha, un signo de aproximado— sale como basura y desordena el renglón
   entero. Se traducen antes de escribir.

   Va fuera de pdfDelDia a propósito: adentro era un const que se usaba antes de
   su propia línea, y eso rompe la generación entera en tiempo de ejecución. */
const REEMPLAZOS_PDF = [
  [/[↳→⇒]/g, ">"], [/[≈]/g, "~"], [/[−]/g, "-"], [/[✓]/g, "OK"],
  [/[○◐●]/g, "·"], [/[═─]/g, "-"], [/[“”]/g, '"'], [/[‘’]/g, "'"]
];

function limpioPDF(t){
  let x = String(t == null ? "" : t);
  REEMPLAZOS_PDF.forEach(([re, con]) => { x = x.replace(re, con); });
  /* Lo que quede fuera de Windows-1252 se descarta antes que ensuciar */
  return x.replace(/[^\x00-\xFF\u20AC\u201A\u0192\u201E\u2026\u2020\u2021\u02C6\u2030\u0160\u2039\u0152\u017D\u2018\u2019\u201C\u201D\u2022\u2013\u2014\u02DC\u2122\u0161\u203A\u0153\u017E\u0178]/g, "");
}

function nombreCorto(desc){
  return (desc || "").trim()
    .replace(/^QUESO\s+/i, "")
    /* "Fresco y Blando" es un solo tipo de queso y el nombre largo se come el
       ancho de la columna: alcanza con "Fresco". El grupo capturado conserva
       las mayúsculas del original, que en las familias van en minúscula. */
    .replace(/\b(fresco)\s+y\s+blando\b/gi, "$1")
    .replace(/\s{2,}/g, " ").trim();
}

function fechaLarga(iso){
  try{
    return new Date(iso + "T12:00:00").toLocaleDateString("es-CR",
      {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  }catch(e){ return iso; }
}

function pdfDelDia(ordenes, fecha, actividades, historico){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ alert("No se pudo cargar el generador de PDF. Revisá tu conexión."); return; }

  const r = resumenDia(ordenes, fecha, actividades, historico);
  const doc = new jsPDF({unit:"pt", format:"a4"});
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 40, ANCHO = W - M*2;
  let y = 0;

  const set = (fuente, tam, color) => {
    doc.setFont("helvetica", fuente); doc.setFontSize(tam);
    doc.setTextColor.apply(doc, color);
  };
  const salto = alto => { if(y + alto > H - 56){ doc.addPage(); y = M + 10; } };

  /* ── banda verde ───────────────────────────────────────────────── */
  doc.setFillColor.apply(doc, PDF.verde);
  doc.rect(0, 0, W, 118, "F");
  set("bold", 22, PDF.blanco);
  doc.text("Producción del día", M, 52);
  set("normal", 10.5, [210,228,217]);
  doc.text("Tiqueso · COPROLAC", M, 72);
  doc.text(fechaLarga(fecha) + "  ·  " + r.registros + " registros", M, 89);
  try{ doc.addImage(LOGO_TIQUESO_BLANCO, "PNG", W - M - 104, 34, 104, 0); }catch(e){}
  y = 150;

  /* ── tarjetas de totales ───────────────────────────────────────── */
  function tarjetas(items){
    const ancho = (ANCHO - 12*(items.length-1)) / items.length;
    items.forEach((it, i) => {
      const x = M + i*(ancho+12);
      doc.setDrawColor.apply(doc, PDF.regla);
      doc.setFillColor.apply(doc, PDF.blanco);
      doc.roundedRect(x, y, ancho, 62, 7, 7, "FD");
      set("normal", 8, PDF.gris);
      doc.text(it.rotulo.toUpperCase(), x + 14, y + 22);
      set("bold", 19, it.color || PDF.verde);
      doc.text(String(it.valor), x + 14, y + 47);
    });
    y += 62;
  }
  tarjetas([
    {rotulo:"Registros", valor:r.registros},
    {rotulo:"Kilos", valor:r.kgTotal.toFixed(1)},
    {rotulo:"Colaboradores", valor:r.personas.length},
    {rotulo:"Sin terminar", valor:r.pendientes,
     color: r.pendientes ? PDF.rojo : PDF.verde}
  ]);
  y += 10;

  /* Todos los procesos con kilos, cada uno con su porcentaje del día: de un
     vistazo se ve en qué se fue la jornada, sin tener que bajar a las barras. */
  const conKg = r.procesos.filter(p => p.kg > 0);
  if(conKg.length){
    const colores = [PDF.verde2, PDF.oro, PDF.ambar, PDF.verde, [90,109,113], [94,53,177]];
    const porFila = 3;
    conKg.forEach((p, i) => {
      const fila = Math.floor(i / porFila), col = i % porFila;
      const ancho = (ANCHO - 12*(porFila-1)) / porFila;
      const x = M + col*(ancho+12);
      const yy = y + fila*62;
      const c = colores[i % colores.length];
      doc.setDrawColor.apply(doc, c);
      doc.roundedRect(x, yy, ancho, 54, 7, 7, "D");
      set("normal", 7.5, PDF.gris);
      doc.text(recortar(p.nombre.toUpperCase(), ancho - 24), x + 12, yy + 18);
      set("bold", 15, c);
      doc.text(p.kg.toFixed(1) + " kg", x + 12, yy + 40);
      set("normal", 9, PDF.gris);
      doc.text((r.kgTotal ? (p.kg/r.kgTotal*100).toFixed(1) : "0") + "%",
               x + ancho - 12, yy + 40, {align:"right"});
    });
    y += Math.ceil(conKg.length/porFila)*62 + 12;
  }

  /* ── piezas reutilizables ──────────────────────────────────────── */
  /* El título no se dibuja al pedirlo: queda pendiente hasta que el bloque
     que lo sigue sepa cuánto mide. Antes se dibujaba primero y, si el bloque
     no cabía, había que repetirlo en la página siguiente: el primero quedaba
     colgado al pie de la anterior. */
  let tituloPendiente = null;

  function titulo(t, nota){ tituloPendiente = {t, nota}; }

  const altoTitulo = tp => tp ? (30 + (tp.nota ? 16 : 0)) : 0;

  function dibujarTitulo(tp){
    y += 6;
    set("bold", 13.5, PDF.verde);
    doc.text(tp.t, M, y);
    y += 8;
    doc.setDrawColor.apply(doc, PDF.verdeClaro);
    doc.setLineWidth(2); doc.line(M, y, M + 46, y); doc.setLineWidth(0.5);
    y += 16;
    if(tp.nota){
      set("normal", 8.5, PDF.gris);
      doc.text(tp.nota, M, y);
      y += 16;
    }
  }

  /* Decide el salto contando título y bloque juntos, y recién entonces
     dibuja el título. */
  function abrirSeccion(altoBloque){
    const tope = H - 52, arriba = M, altoTit = altoTitulo(tituloPendiente);
    if(y + altoTit + altoBloque > tope && altoTit + altoBloque <= tope - arriba){
      doc.addPage(); y = arriba;
    } else if(y + altoTit + 40 > tope){
      doc.addPage(); y = arriba;      /* ni el título con dos filas entra */
    }
    if(tituloPendiente){ dibujarTitulo(tituloPendiente); tituloPendiente = null; }
  }

  /* Tabla con encabezado verde y filas alternadas. Las columnas se declaran
     con {t, x, al, w}: rótulo, posición, alineación y ancho para recortar. */
  /* Recorta midiendo con la fuente actual. Contar letras engañaba: en
     mayúsculas el mismo número de caracteres ocupa casi un tercio más, y
     "QUESO FRESCO Y BLANDO PARA FUNDIR FRACCIONADO 300 G" se montaba sobre
     la columna vecina. */
  function recortar(txt0, ancho){
    const txt = limpioPDF(txt0);
    if(!ancho || doc.getTextWidth(txt) <= ancho) return txt;
    let t = txt;
    while(t.length > 1 && doc.getTextWidth(t + "…") > ancho) t = t.slice(0, -1);
    return t.trim() + "…";
  }

  /* En un nombre de producto el final es lo que distingue —"500 G", "2 KG"—,
     así que cuando no cabe se corta por el medio y no por la cola. */
  function recortarMedio(txt0, ancho){
    const txt = limpioPDF(txt0);
    if(!ancho || doc.getTextWidth(txt) <= ancho) return txt;
    const m = txt.match(/\s\d+(?:[.,]\d+)?\s*(?:G|KG|ML|L|UD)$/i);
    const cola = m ? m[0] : "";
    if(!cola) return recortar(txt, ancho);
    let cabeza = txt.slice(0, txt.length - cola.length);
    while(cabeza.length > 4 && doc.getTextWidth(cabeza + "…" + cola) > ancho)
      cabeza = cabeza.slice(0, -1);
    return cabeza.trim() + "…" + cola;
  }

  function tabla(cols, filas, opciones){
    const o = opciones || {};

    /* Cada columna llega hasta donde EMPIEZA el contenido de la siguiente.
       Con una columna derecha al lado no basta con su x —ahí termina el
       número, no donde arranca—, así que se mide el valor más ancho que va
       a llevar. */
    const anchoMax = cols.map((c, j) => {
      let max = 0;
      filas.forEach(f => {
        const celda = f[j];
        const val = (celda && typeof celda === "object") ? celda : {v:celda};
        set(val.fuerte ? "bold" : "normal", val.tam || 9.5, PDF.tinta);
        max = Math.max(max, doc.getTextWidth(String(val.v == null ? "" : val.v)));
      });
      set("bold", 8.5, PDF.tinta);
      return Math.max(max, doc.getTextWidth(c.t.toUpperCase()));
    });

    const limites = cols.map((c, j) => {
      if(c.al === "right") return null;
      const k = cols.findIndex((x, i) => i > j && x.x > c.x);
      if(k < 0) return (W - M) - c.x - 4;
      const inicioSiguiente = cols[k].al === "right"
        ? cols[k].x - anchoMax[k]      /* la derecha empieza antes de su x */
        : cols[k].x;
      return inicioSiguiente - c.x - 8;
    });

    function encabezado(){
      doc.setFillColor.apply(doc, PDF.verde);
      doc.rect(M, y, ANCHO, 20, "F");
      set("bold", 8.5, PDF.blanco);
      cols.forEach((c, j) => doc.text(recortar(c.t.toUpperCase(), limites[j]),
                                      c.x, y + 13.5,
                                      c.al ? {align:c.al} : undefined));
      y += 20;
    }

    /* Una tabla partida a la mitad se lee mal. Si entera cabe en una página,
       se empieza en la siguiente en vez de cortarla; si es tan larga que no
       cabe de ninguna forma, se parte pero repitiendo el encabezado.

       La altura se mide fila por fila: antes se asumía que todas eran altas
       si una sola tenía segunda línea, y eso mandaba tablas a la página
       siguiente sin necesidad. */
    /* Una celda marcada como "envuelve" se parte en varios renglones en vez de
       recortarse: en la tabla de revisión el detalle es lo que hay que leer, y
       cortado con puntos suspensivos no sirve de nada. */
    const renglonesDe = (f, j) => {
      const celda = f[j];
      const val = (celda && typeof celda === "object") ? celda : {v:celda};
      if(!val.envuelve || !limites[j]) return [limpioPDF(String(val.v == null ? "" : val.v))];
      set(val.fuerte ? "bold" : "normal", val.tam || 9.5, PDF.tinta);
      return doc.splitTextToSize(limpioPDF(String(val.v == null ? "" : val.v)), limites[j]);
    };
    /* La segunda línea de una celda también se envuelve: en la tabla de
       colaboradores la lista de familias no entra en un renglón cuando alguien
       trabajó en varias. */
    const renglonesSub = (f, j) => {
      const celda = f[j];
      const val = (celda && typeof celda === "object") ? celda : {};
      if(!val.sub) return [];
      if(!val.envuelve || !limites[j]) return [limpioPDF(String(val.sub))];
      set("normal", 7.5, PDF.gris);
      return doc.splitTextToSize(limpioPDF(String(val.sub)), limites[j]);
    };
    const altoDe = f => {
      const extra = Math.max.apply(null,
        f.map((_, j) => renglonesDe(f, j).length).concat([1])) - 1;
      const extraSub = Math.max.apply(null,
        f.map((_, j) => renglonesSub(f, j).length).concat([1])) - 1;
      const base = f.some(c => c && typeof c === "object" && c.sub) ? 26 : 18;
      return base + extra * 10.5 + extraSub * 9;
    };
    const tope = H - 52, arriba = M;

    /* Una tabla partida a la mitad se lee mal. Si entera cabe en una página se
       empieza en la siguiente; si es tan larga que no cabe de ninguna forma,
       se parte pero repitiendo el encabezado. */
    abrirSeccion(20 + filas.reduce((t,f) => t + altoDe(f), 0) + (o.total ? 20 : 0));

    encabezado();

    filas.forEach((f, i) => {
      if(y + altoDe(f) + 2 > tope){ doc.addPage(); y = arriba; encabezado(); }
      const altoFila = altoDe(f);
      if(i % 2 === 0){
        doc.setFillColor.apply(doc, PDF.papel);
        doc.rect(M, y, ANCHO, altoFila, "F");
      }
      cols.forEach((c, j) => {
        const celda = f[j];
        const val = (celda && typeof celda === "object") ? celda : {v:celda};
        set(val.fuerte ? "bold" : "normal", val.tam || 9.5, val.color || PDF.tinta);
        const txt = String(val.v == null ? "" : val.v);
        if(val.envuelve){
          renglonesDe(f, j).forEach((l, k) =>
            doc.text(l, c.x, y + 12.5 + k*10.5, c.al ? {align:c.al} : undefined));
        } else {
          doc.text(val.medio ? recortarMedio(txt, limites[j]) : recortar(txt, limites[j]),
                   c.x, y + 12.5, c.al ? {align:c.al} : undefined);
        }
        if(val.sub){
          set("normal", 7.5, PDF.gris);
          /* Si el valor de arriba ocupó varias líneas, la segunda baja con él:
             si no, se escribiría encima. */
          const desplaza = (renglonesDe(f, j).length - 1) * 10.5;
          renglonesSub(f, j).forEach((l, k) =>
            doc.text(l, c.x, y + 21 + desplaza + k*9, c.al ? {align:c.al} : undefined));
        }
      });
      y += altoFila;
      doc.setDrawColor.apply(doc, PDF.regla);
      doc.line(M, y, W - M, y);
    });

    if(o.total){
      y += 2;
      if(y + 22 > tope){ doc.addPage(); y = arriba; }
      set("bold", 9.5, PDF.verde);
      cols.forEach((c, j) => {
        if(o.total[j] == null) return;
        doc.text(String(o.total[j]), c.x, y + 14, c.al ? {align:c.al} : undefined);
      });
      y += 20;
    }
    y += 26;                      /* separación con lo que viene después */
  }

  /* La jornada dibujada: una fila por tramo, con la barra donde ocurrió.
     Reemplaza dos tablas largas —el tramo por tramo y el detalle— por algo
     que se lee de un vistazo: dónde se trabajó, dónde no, y cuánto salió. */
  function lineaDeTiempo(linea, ordenes){
    const x0 = M + 156, x1 = W - M - 52, ancho = x1 - x0, alto = 14;
    const enX = min => x0 + (Math.max(HORA_MIN, Math.min(HORA_MAX, min)) - HORA_MIN)
                            / (HORA_MAX - HORA_MIN) * ancho;
    const kgDe = {};
    (ordenes||[]).forEach(o => { kgDe[(o.codigo||"") + (o.horaInicio||"")] = kilosDe(o); });

    /* La jornada tampoco debería partirse: es un dibujo, no una lista. */
    abrirSeccion(11 + linea.tramos.length * 14 + 40 +
                 (linea.sinHorario.length ? 16 + linea.sinHorario.length * 11 : 0));

    /* Rejilla: una línea por hora, rotulada cada dos. */
    set("normal", 7, PDF.gris);
    for(let h = 6; h <= 18; h++){
      const x = enX(h*60);
      if(h % 2 === 0) doc.text(String(h).padStart(2,"0"), x, y, {align:"center"});
    }
    y += 5;
    const yRejilla = y, altoTotal = linea.tramos.length * alto + 6;

    /* Los huecos, sombreados de punta a punta: se ven como espacios muertos. */
    doc.setFillColor(247,246,242);
    linea.huecos.forEach(h =>
      doc.rect(enX(h.desde), yRejilla, enX(h.hasta)-enX(h.desde), altoTotal, "F"));

    doc.setDrawColor(228,234,231);
    for(let h = 6; h <= 18; h++)
      doc.line(enX(h*60), yRejilla, enX(h*60), yRejilla + altoTotal);

    linea.tramos.forEach((t, i) => {
      if(y + alto + 2 > H - 52){ doc.addPage(); y = M; }
      if(i % 2 === 0){
        doc.setFillColor(250,251,250);
        doc.rect(M, y, ANCHO, alto, "F");
      }
      set("normal", 8, PDF.tinta);
      doc.text(recortar((t.registro ? t.registro + " · " : "") +
               (nombreCorto(t.detalle) || t.que), 150), M, y + 9.5);

      const a = enX(t.desde), b = Math.max(enX(t.hasta), a + 3);
      doc.setFillColor.apply(doc, t.tipo === "actividad" ? [94,53,177] : PDF.verde2);
      doc.roundedRect(a, y + 3, b - a, alto - 6, 2, 2, "F");

      /* La hora, junto a la barra y del lado donde haya espacio. */
      set("normal", 6.5, PDF.gris);
      const horas = comoHora(t.desde) + "-" + comoHora(t.hasta);
      if(b - a > doc.getTextWidth(horas) + 8){
        doc.setTextColor(255,255,255);
        doc.text(horas, a + 4, y + 9.5);
      } else if(b + 4 + doc.getTextWidth(horas) < x1){
        doc.text(horas, b + 4, y + 9.5);
      }

      const kg = kgDe[(t.que||"") + comoHora(t.desde)];
      set("normal", 7.5, PDF.gris);
      doc.text(kg ? kg.toFixed(1) : "", W - M, y + 9.5, {align:"right"});
      y += alto;
    });

    y += 10;
    set("normal", 8, PDF.gris);
    doc.text(comoHoras(linea.minutosCubiertos) + " con registro   ·   " +
             comoHoras(linea.minutosHuecos) + " sin nada anotado" +
             "   ·   sombreado = sin registro", M, y);
    y += 12;

    if(linea.sinHorario.length){
      y += 4; salto(30);
      set("bold", 8.5, PDF.ambar);
      doc.text(linea.sinHorario.length +
        " registro(s) sin horario, no ubicables en la jornada:", M, y);
      y += 12; set("normal", 8, PDF.gris);
      linea.sinHorario.forEach(x => { salto(14);
        doc.text("Reg. " + (x.registro||"—") + " · " +
                 nombreCorto(ART[x.codigo] ? ART[x.codigo].desc : x.codigo) +
                 " — " + x.motivo, M + 10, y);
        y += 11; });
    }
    y += 16;
  }

  /* Barras horizontales: rótulo, barra proporcional, porcentaje y valor. */
  function barras(items, unidad, opciones){
    const o = opciones || {};
    /* Mismo criterio que las tablas: si el bloque entero cabe en una página,
       se arranca en la siguiente en vez de cortarlo a la mitad. */
    abrirSeccion(items.length * 19 + 14);
    const max = Math.max.apply(null, items.map(i => i.valor).concat([0.0001]));
    const total = items.reduce((t,i) => t + i.valor, 0) || 1;
    const xBarra = M + 150, anchoBarra = ANCHO - 150 - 130;
    items.forEach(it => {
      salto(20);
      set("normal", 9.5, PDF.tinta);
      doc.text(recortar(it.nombre, 144), M, y + 10);
      doc.setFillColor(233, 238, 235);
      doc.roundedRect(xBarra, y + 2, anchoBarra, 10, 3, 3, "F");
      const largo = Math.max(2, anchoBarra * (it.valor / max));
      const col = o.color ? o.color(it) : PDF.verde2;
      doc.setFillColor.apply(doc, col);
      doc.roundedRect(xBarra, y + 2, largo, 10, 3, 3, "F");
      set("normal", 8, PDF.gris);
      doc.text(o.aparte ? o.aparte(it) : (it.valor/total*100).toFixed(1) + "%",
               W - M - 66, y + 10, {align:"right"});
      set("bold", 9.5, col === PDF.verde2 ? PDF.verde : col);
      doc.text((o.valor ? o.valor(it) : it.valor.toFixed(1)) + (unidad||""),
               W - M, y + 10, {align:"right"});
      y += 19;
    });
    y += 14;
  }

  /* ── contenido ─────────────────────────────────────────────────── */

  /* Arriba del todo: es lo único del reporte que pide una acción, y el resto
     es información. Quien mire solo la primera página tiene que ver cuánto se
     produjo y si algo quedó pendiente. En tabla, además, se barre la columna
     del motivo en vez de leer frases sueltas. */
  if(!r.notas.length){
    /* Que el día salió limpio también es información: sin esto, el lector no
       sabe si no había pendientes o si la sección se omitió. */
    titulo("Requieren atención");
    abrirSeccion(34);
    doc.setFillColor(231,243,236);
    doc.setDrawColor.apply(doc, PDF.verde2);
    doc.roundedRect(M, y, ANCHO, 34, 6, 6, "FD");
    set("bold", 10, PDF.verde);
    doc.text("Sin pendientes: ningún registro quedó incompleto ni con cuentas que no cuadren.",
             M + 14, y + 21);
    y += 34 + 26;
  }

  if(r.notas.length){
    titulo("Requieren atención");
    tabla(
      [{t:"Reg.", x:M}, {t:"Producto", x:M+34}, {t:"Lote", x:M+130},
       {t:"Qué revisar", x:M+218}, {t:"Detalle", x:M+330}],
      r.notas.map(n => [
        n.registro,
        {v:n.codigo, tam:8.5},
        {v:n.lote || "—", tam:8.5},
        {v:n.motivo, fuerte:true, tam:8.5,
         color: n.tipo === "cuenta"    ? PDF.rojo
              : n.tipo === "lote"      ? [94,53,177]
              : n.tipo === "horario"   ? PDF.ambar
              : n.tipo === "espera"    ? PDF.ambar
              : n.tipo === "faltante"  ? PDF.rojo
              : n.tipo === "corregido" ? PDF.oro : PDF.gris},
        {v:n.detalle, tam:8, envuelve:true}])
    );
  }

  titulo("Kilos por familia");
  barras(r.familias.filter(f => f.kg > 0)
           .map(f => ({nombre:nombreCorto(f.nombre), valor:f.kg})), " kg");

  titulo("Producción por proceso");
  barras(r.procesos.filter(p => p.kg > 0)
           .map(p => ({nombre:p.nombre, valor:p.kg, registros:p.registros})), " kg",
        {aparte: it => it.registros + " reg."});

  if(r.rendimientos.length){
    titulo("Aprovechamiento del fraccionado",
           "Cuánto se fue en recortes. En rojo, por encima de 15%.");
    tabla(
      [{t:"Reg.", x:M}, {t:"Producto", x:M+36, w:40},
       {t:"Entró kg", x:M+300, al:"right"}, {t:"Salió kg", x:M+375, al:"right"},
       {t:"Recortes kg", x:M+450, al:"right"}, {t:"% recorte", x:W-M, al:"right"}],
      r.rendimientos.map(x => [x.registro || "—",
        {v: nombreCorto(ART[x.productos[0]] ? ART[x.productos[0]].desc : x.productos[0]),
         sub: x.productos.join(" · "), medio:true},
        x.entrada, x.producto, x.recortes,
        {v:x.pctRecortes + "%", fuerte:true,
         color: x.pctRecortes >= 15 ? PDF.rojo : PDF.tinta}])
    );
  }

  if(r.transformacion.length){
    titulo("Ahumado y deshidratado",
           "Merma medida: el ahumado y las salidas de cajón. La entrada al cajón no aparece " +
           "porque su merma todavía es una proyección.");
    tabla(
      /* Ocho columnas no caben en A4: el tiempo pasa a segunda línea del
         proceso y la materia prima —que son nombres— se queda con el ancho. */
      [{t:"Reg.", x:M}, {t:"Proceso", x:M+28}, {t:"Producto", x:M+130},
       {t:"Entró kg", x:M+287, al:"right"}, {t:"Salió kg", x:M+342, al:"right"},
       {t:"Merma", x:M+392, al:"right"}, {t:"Materia prima", x:M+402}],
      r.transformacion.map(x => [
        x.registro,
        {v:x.proceso,
         sub:[x.cajon,
              x.diasEnCajon !== null && x.diasEnCajon !== undefined
                ? x.diasEnCajon + " días en el cajón"
                : (x.minutos ? comoHoras(x.minutos) : ""),
              x.diasEnCajon !== null && x.diasEnCajon !== undefined
                ? "desde el " + x.desdeCajon : x.horario]
               .filter(Boolean).join(" · "),
         envuelve:true, tam:8.5},
        /* El origen del dato va bajo el producto, no bajo la cifra: una
           segunda línea alineada a la derecha se extiende hacia la izquierda
           y termina encima de la columna vecina. */
        {v: nombreCorto(ART[x.codigo] ? ART[x.codigo].desc : x.codigo),
         sub: x.codigo + (x.origen ? " · " + x.origen : ""), envuelve:true, tam:9},
        {v: x.entrada || "—", tam:9.5},
        x.salio || "—",
        {v: x.merma === null ? "—" : x.merma + "%", fuerte:true,
         color: x.merma !== null && x.merma > 35 ? PDF.rojo : PDF.tinta},
        {v: x.familias.map(nombreCorto).join(", "),
         sub: x.proveedores.join(", "), envuelve:true, tam:9}])
    );
    set("normal", 8, PDF.gris);
    doc.text("Una salida de cajón solo muestra merma si se anotó cuánto entró: " +
             "su orden es de semanas atrás.", M, y - 12);
  }

  titulo("La jornada");
  lineaDeTiempo(r.linea, ordenes);

  titulo("Por colaborador");
  tabla(
    [{t:"Colaborador", x:M}, {t:"Jornada", x:M+96},
     {t:"Tiempo", x:M+216, al:"right"}, {t:"Kg/h", x:M+262, al:"right"},
     {t:"Reg.", x:M+296, al:"right"}, {t:"En qué trabajó", x:M+312}],
    r.personas.map(p => [
      p.nombre,
      p.desde !== null ? comoHora(p.desde) + " a " + comoHora(p.hasta) : "—",
      comoHoras(p.minutos), p.kgPorHora ?? "—", p.registros,
      /* Solo los números de registro: el detalle de cada uno está en la tabla
         de abajo, y así esta columna deja de partirse en varios renglones. */
      /* Las familias van arriba, en texto normal: son nombres y hay que
         leerlos. Los registros, que ahora son rangos cortos, caben abajo en
         letra chica sin perder legibilidad. */
      {v: p.familias.map(nombreCorto).join(", "), envuelve:true, tam:9,
       sub: "reg. " + comoRangos(p.registrosEnQue)}])
  );

  /* El detalle de cada registro, para poder decodificar los números que
     aparecen arriba en la columna de cada colaborador. */
  titulo("Registros de producción");
  tabla(
    [{t:"Reg.", x:M}, {t:"Artículo", x:M+38}, {t:"Descripción", x:M+108},
     {t:"Unidades", x:M+430, al:"right"}, {t:"Kilos", x:W-M, al:"right"}],
    ordenes.slice().sort(porConsecutivo)
      .map(o => [
        o.registro || "—",
        {v:o.codigo || "—", tam:8.5},
        {v: nombreCorto(ART[o.codigo] ? ART[o.codigo].desc : (o.producto||"")), medio:true},
        o.unidades || "—",
        kilosDe(o) ? kilosDe(o).toFixed(2) : "—"]),
    {total:["", "", "Total", "", r.kgTotal.toFixed(2)]}
  );

  /* ── pie con numeración, al final para saber el total ───────────── */
  const paginas = doc.internal.getNumberOfPages();
  for(let p = 1; p <= paginas; p++){
    doc.setPage(p);
    doc.setDrawColor.apply(doc, PDF.regla);
    doc.line(M, H-42, W-M, H-42);
    set("normal", 8, PDF.gris);
    doc.text("Tiqueso · Generado " + new Date().toLocaleString("es-CR"), M, H-28);
    doc.text("Página " + p + " de " + paginas, W-M, H-28, {align:"right"});
  }

  doc.save("Produccion_" + fecha + ".pdf");
}



/* ══════════════ REVERSO DE RECEPCIONES EQUIVOCADAS ══════════════
   El 8/10/2026 las recepciones quedaron contra órdenes de otro artículo:
   entró el artículo de la orden con el lote y la cantidad de otro registro.
   SAP no deja cancelar esos recibos, así que el lote se saca con una SALIDA
   DE MERCANCÍA (sin documento base) y la orden se CIERRA con un comentario
   que explica el fallo. Los datos salen de SAP, no de la app: la app puede
   tener ya los DocEntry corregidos.                                        */
function CONSULTA_REVERSO(){
  return 'SELECT T0."DocEntry" AS "RecepcionEntry", T0."DocNum" AS "RecepcionNum",\n' +
         '       T1."BaseEntry" AS "OrdenEntry", T4."DocNum" AS "OrdenNum",\n' +
         '       T1."ItemCode", T5."DistNumber" AS "Lote", T3."Quantity" AS "Cantidad",\n' +
         '       T1."WhsCode" AS "Almacen", IFNULL(T6."Quantity",0) AS "Disponible",\n' +
         '       T4."Status" AS "EstadoOrden", T4."Comments" AS "ComentarioOrden"\n' +
         'FROM OIGN T0\n' +
         'INNER JOIN IGN1 T1 ON T1."DocEntry" = T0."DocEntry" AND T1."BaseType" = 202\n' +
         'INNER JOIN OITL T2 ON T2."DocEntry" = T1."DocEntry" AND T2."DocLine" = T1."LineNum"\n' +
         '                  AND T2."DocType" = 59\n' +
         'INNER JOIN ITL1 T3 ON T3."LogEntry" = T2."LogEntry"\n' +
         'INNER JOIN OBTN T5 ON T5."ItemCode" = T3."ItemCode" AND T5."SysNumber" = T3."SysNumber"\n' +
         'INNER JOIN OWOR T4 ON T4."DocEntry" = T1."BaseEntry"\n' +
         'LEFT JOIN OBTQ T6 ON T6."ItemCode" = T3."ItemCode" AND T6."SysNumber" = T3."SysNumber"\n' +
         '                 AND T6."WhsCode" = T1."WhsCode"\n' +
         'WHERE T0."DocDate" = [%0] AND T0."CANCELED" = \'N\'\n' +
         'ORDER BY T0."DocEntry"';
}
const ENC_REVERSO = {
  recEntry:/^(recepcionentry)$/, recNum:/^(recepcionnum)$/, ordEntry:/^(ordenentry)$/,
  ordNum:/^(ordennum)$/, item:/^(itemcode|numero de articulo)$/, lote:/^(lote|distnumber)$/,
  cant:/^(cantidad|quantity)$/, alm:/^(almacen|whscode)$/, disp:/^(disponible)$/,
  estado:/^(estadoorden)$/, coment:/^(comentarioorden)$/
};
function interpretarReverso(texto){
  const lineas = (texto||"").split("\n").map(l=>l.replace(/\r$/,"")).filter(l=>l.trim());
  if(lineas.length<2) return {filas:[], error: lineas.length ? "Falta el encabezado o las filas." : ""};
  const parte = l => l.split("\t").map(x=>x.trim());
  const enc = parte(lineas[0]).map(celdaEnc);
  const col = {}; Object.entries(ENC_REVERSO).forEach(([k,re])=>{ col[k]=enc.findIndex(x=>re.test(x)); });
  const faltan = ["recEntry","ordEntry","item","lote","cant","alm"].filter(k=>col[k]<0);
  if(faltan.length) return {filas:[], error:"No encuentro las columnas de la consulta (pegala con su encabezado, separada por tabuladores)."};
  const filas = lineas.slice(1).map(parte).map((t,i)=>{
    const v = k => col[k]>=0 ? (t[col[k]]||"") : "";
    const item = v("item").toUpperCase(), lote = v("lote");
    const cant = lecturasCantidad(v("cant"))[0] || 0;
    const disp = col.disp>=0 ? (lecturasCantidad(v("disp"))[0] ?? 0) : null;
    /* El catálogo dice de qué artículo es el lote: si no es el de la orden,
       la recepción quedó cruzada. */
    const delLote = [...new Set(buscarPorLote(lote).map(c=>c.codigo))];
    const cruzada = delLote.length>0 && !delLote.includes(item);
    return {i, recEntry:v("recEntry").replace(/[^\d]/g,""), recNum:v("recNum").replace(/[^\d]/g,""),
            ordEntry:v("ordEntry").replace(/[^\d]/g,""), ordNum:v("ordNum").replace(/[^\d]/g,""),
            item, lote, cant, alm:v("alm"), disp, estado:v("estado").toUpperCase(),
            coment:v("coment"), delLote, cruzada};
  }).filter(f=>f.recEntry && f.item && f.lote);
  return {filas, error: filas.length ? "" : "No hay filas con recepción, artículo y lote."};
}
const CAB_IGE1_REVERSO = ["RecordKey","LineNum","ItemCode","Quantity","WarehouseCode"];
function construirReverso(filas, fechaIso, fmt, clave, colCom){
  const oige=[["RecordKey","DocDate","DocDueDate","Comments","JournalMemo"]], ige1=[CAB_IGE1_REVERSO], btnt=[CAB_BTNT];
  const f = fechaDTW(fechaIso, fmt);
  const dmy = (fechaIso||"").split("-").reverse().join("/");
  filas.forEach((x,i)=>{
    const rk = i+1;
    oige.push([rk,f,f,
      ("Fallo en app Ordenes de Produccion: reverso de la recepcion " + (x.recNum||x.recEntry) +
       " (orden " + (x.ordNum||x.ordEntry) + "), lote " + x.lote +
       ". La recepcion quedo contra una orden de otro articulo.").slice(0,MAX_COM),
      "Reverso recepcion erronea app Ordenes"]);
    ige1.push([rk,0,x.item,String(x.cant),x.alm]);
    btnt.push([rk,0,"",0,x.lote,"","","","","","",String(x.cant)]);
  });
  const cerrar=[["RecordKey", clave || CLAVE_ORDEN_DEFECTO, "ProductionOrderStatus", colCom || COL_COM1_DEFECTO]];
  const vistas = new Set();
  filas.filter(x=>x.ordEntry && x.estado!=="L" && x.estado!=="C").forEach(x=>{
    if(vistas.has(x.ordEntry)) return; vistas.add(x.ordEntry);
    cerrar.push([cerrar.length, x.ordEntry, "boposClosed",
      ("FALLO APP ORDENES " + dmy + ": recepcion contra orden equivocada, revertida con salida de mercancia. " +
       (x.coment||"")).slice(0,MAX_COM)]);
  });
  return {oige, ige1, btnt, cerrar};
}

function RevertirRecepciones({fmt, fmtFecha, bom, doble, claveOrd, colCom1}){
  const [abierto,setAbierto] = useState(false);
  const [texto,setTexto] = useState("");
  const [fechaSalida,setFechaSalida] = useState(hoy());
  const [quitadas,setQuitadas] = useState({});   /* filas desmarcadas a mano */
  const [puestas,setPuestas] = useState({});     /* filas marcadas a mano */
  const [vista,setVista] = useState("");
  if(!abierto) return <button className="btn min" style={{margin:0}}
    onClick={()=>setAbierto(true)}>¿Se recibió contra la orden equivocada? Revertir con salida de mercancía</button>;

  const {filas, error} = interpretarReverso(texto);
  const marcada = x => puestas[x.i] || (x.cruzada && !quitadas[x.i]);
  const elegidas = filas.filter(marcada);
  const arch = construirReverso(elegidas, fechaSalida, fmtFecha, claveOrd, colCom1);
  const cortas = elegidas.filter(x=>x.disp!==null && x.disp < x.cant - 0.0005);
  const tocar = (x,v) => {
    setPuestas(p=>({...p,[x.i]: v && !x.cruzada}));
    setQuitadas(q=>({...q,[x.i]: !v && x.cruzada}));
  };

  return <div>
    <h3 style={{margin:"0 0 4px",fontSize:14}}>Revertir recepciones equivocadas</h3>
    <div style={{fontSize:11.5,color:"var(--acero)",lineHeight:1.5}}>
      Saca el lote con una <strong>salida de mercancía</strong> (SAP no deja cancelar el recibo)
      y <strong>cierra</strong> la orden con un comentario que explica el fallo. Los datos salen
      de SAP: corré esta consulta con la fecha de la recepción y pegá el resultado con encabezado.
    </div>
    <pre style={{margin:"8px 0 0",fontSize:10.5,whiteSpace:"pre-wrap"}}>{CONSULTA_REVERSO()}</pre>
    <button className="btn min" style={{marginTop:7}}
      onClick={async()=>{ await copiar(CONSULTA_REVERSO()); }}>Copiar la consulta</button>

    <Lbl>Resultado de la consulta</Lbl>
    <textarea rows={4} value={texto} onChange={e=>{ setTexto(e.target.value); setQuitadas({}); setPuestas({}); }}
      placeholder={"RecepcionEntry\tRecepcionNum\tOrdenEntry\tOrdenNum\tItemCode\tLote\tCantidad\tAlmacen\tDisponible\t…"}
      style={{fontFamily:"var(--mono)",fontSize:11,resize:"vertical"}}/>
    {error && <div style={{color:"var(--alerta)",fontSize:11.5,marginTop:6}}>{error}</div>}

    {filas.length>0 && <div style={{marginTop:8}}>
      <div style={{fontSize:11.5,color:"var(--acero)",marginBottom:4}}>
        Vienen marcadas las que el catálogo dice que están cruzadas (el lote es de otro artículo).
        Revisá cada una.</div>
      {filas.map(x=>
        <label key={x.i} style={{display:"flex",gap:8,alignItems:"flex-start",fontFamily:"var(--mono)",
               fontSize:11,padding:"3px 0",borderBottom:"1px solid var(--borde)",
               color: x.cruzada ? "var(--alerta)" : "var(--acero)"}}>
          <input type="checkbox" checked={!!marcada(x)} onChange={e=>tocar(x,e.target.checked)}
            style={{width:"auto",flex:"0 0 auto",margin:"2px 0 0"}}/>
          <span>Recibo {x.recNum||x.recEntry} · orden {x.ordNum||x.ordEntry} · {x.item} · lote {x.lote} ·
            {" "}{x.cant} · {x.alm}
            {x.delLote.length>0 && (x.cruzada ? " · el lote es de " + x.delLote.join("/") : " · correcta")}
            {x.delLote.length===0 && " · lote fuera del catálogo: revisalo a mano"}
            {x.disp!==null && x.disp < x.cant - 0.0005 && " · ⚠ disponible " + x.disp}
            {(x.estado==="L"||x.estado==="C") && " · orden ya cerrada"}</span>
        </label>)}
    </div>}

    {elegidas.length>0 && <div style={{marginTop:10}}>
      <Lbl>Fecha de la salida de mercancía</Lbl>
      <input type="date" value={fechaSalida} onChange={e=>setFechaSalida(e.target.value||hoy())}
        style={{fontFamily:"var(--mono)",fontSize:12}}/>
      {cortas.length>0 && <div className="avi err" style={{marginTop:8}}>
        <strong style={{color:"var(--alerta)"}}>{cortas.length} lote(s) ya no tienen todo en el almacén</strong>
        <div style={{color:"var(--acero)",marginTop:3}}>
          Parte se vendió o se movió. La salida de esos va a fallar o dejar el lote en negativo:
          sacalos del archivo y resolvelos aparte.</div>
      </div>}
      <div style={{marginTop:10}}>
        <Archivo base={"OIGE_Documents_reverso_"+fechaSalida} filas={arch.oige} fmt={fmt} bom={bom} doble={doble}
          nota="Salida de mercancía: fila Documents."
          onVer={()=>setVista(vista==="OIGE"?"":"OIGE")} viendo={vista==="OIGE"}/>
        <Archivo base={"IGE1_Document_Lines_reverso_"+fechaSalida} filas={arch.ige1} fmt={fmt} bom={bom} doble={doble}
          nota="Document_Lines: artículo de la orden, cantidad y almacén de la recepción."
          onVer={()=>setVista(vista==="IGE1"?"":"IGE1")} viendo={vista==="IGE1"}/>
        <Archivo base={"BTNT_BatchNumbers_reverso_"+fechaSalida} filas={arch.btnt} fmt={fmt} bom={bom} doble={doble}
          nota="BatchNumbers: el lote que entró por error."
          onVer={()=>setVista(vista==="BTNT"?"":"BTNT")} viendo={vista==="BTNT"}/>
        {vista && <pre style={{marginTop:0}}>{tabla(vista==="OIGE"?arch.oige:vista==="IGE1"?arch.ige1:
                                                   vista==="BTNT"?arch.btnt:arch.cerrar, fmt, doble)}</pre>}
        <div className="avi neu" style={{fontSize:11.5}}>
          <strong>Paso 1 en DTW:</strong> objeto <strong>Inventory · Goods Issue</strong>, los tres
          archivos en la misma corrida. Corré <strong>Run Simulation</strong> primero.
        </div>
        <Archivo base={"OWOR_Cerrar_"+fechaSalida} filas={arch.cerrar} fmt={fmt} bom={bom} doble={doble}
          nota="Cierra las órdenes con el comentario del fallo. Se sube con Update existing data."
          onVer={()=>setVista(vista==="CER"?"":"CER")} viendo={vista==="CER"}/>
        <div className="avi neu" style={{fontSize:11.5}}>
          <strong>Paso 2 en DTW,</strong> después de la salida: objeto <strong>Production Orders</strong>,
          <strong> Update existing data</strong>. Cerrar no tiene vuelta atrás: probá primero con una.
        </div>
      </div>
    </div>}
    <button className="btn sec" style={{marginTop:10}} onClick={()=>setAbierto(false)}>Cerrar</button>
  </div>;
}

/* Pegás el renglón que devolvió DTW y te dice de qué orden y de qué artículo
   está hablando, sin contar renglones. */
function BuscadorErrorDTW({ordenes}){
  const [txt,setTxt] = useState("");
  const [abierto,setAbierto] = useState(false);
  if(!abierto) return <button className="btn min" style={{marginTop:10}}
    onClick={()=>setAbierto(true)}>¿DTW rechazó una línea? Buscá cuál es</button>;

  const r = ubicarErrorDTW(txt, ordenes);
  return <div className="avi neu" style={{marginTop:12}}>
    <Lbl>Pegá el renglón del log de DTW</Lbl>
    <textarea rows={2} value={txt} onChange={e=>setTxt(e.target.value)}
      placeholder="23  Created Failed  AbsoluteEntry  The valuation method… [WOR1.ItemCode][line: 2]"
      style={{fontFamily:"var(--mono)",fontSize:11,resize:"vertical"}}/>

    {txt.trim() && !r && <div style={{color:"var(--alerta)",fontSize:11.5,marginTop:6}}>
      No encuentro el número de registro en ese texto.</div>}

    {r && !r.orden && <div style={{color:"var(--alerta)",fontSize:11.5,marginTop:6}}>
      El registro {r.rk} no está entre las {ordenes.length} órdenes de este archivo.</div>}

    {r && r.orden && <div style={{marginTop:8,fontSize:12,lineHeight:1.5}}>
      <div><strong>Orden {r.rk}:</strong>{" "}
        <span style={{fontFamily:"var(--mono)"}}>{r.orden.codigo||"sin código"}</span>
        {" · registro "}{r.orden.registro||"—"}</div>

      {r.componente ? <div style={{marginTop:6,padding:"8px 10px",borderRadius:3,
            background:"var(--alerta-suave)",border:"1px solid var(--alerta)"}}>
        <div style={{fontSize:10.5,color:"var(--gris)"}}>
          Línea {r.linea} = componente número {r.linea} de los que se enviaron</div>
        <div style={{fontFamily:"var(--mono)",fontWeight:600,marginTop:3}}>
          {r.componente.codigo}</div>
        <div style={{color:"var(--acero)"}}>
          {ART[r.componente.codigo] ? ART[r.componente.codigo].desc : ""}
          {" · "}{r.componente.cantidad}
          {r.componente.lotes ? " · lote(s) " + r.componente.lotes.join(", ") : ""}
        </div>
        {r.orden.componentes.some(c=>c.excluido) &&
          <div style={{fontSize:10.5,color:"var(--acero)",marginTop:5}}>
            Esta orden tiene componentes excluidos, así que la numeración de la pantalla
            no coincide con la del archivo. El de arriba es el que viajó.</div>}
        {r.vecino && <div style={{fontSize:10.5,color:"var(--acero)",marginTop:6,
              paddingTop:5,borderTop:"1px solid var(--borde)"}}>
          Si no es ese, el siguiente en el archivo es{" "}
          <span style={{fontFamily:"var(--mono)"}}>{r.vecino.codigo}</span>
          {ART[r.vecino.codigo] ? " · " + ART[r.vecino.codigo].desc : ""}.
        </div>}
      </div>
      : r.tabla==="WOR1"
        ? <div style={{color:"var(--alerta)",marginTop:6}}>
            La orden no tiene una línea {r.linea}. Puede que el archivo que subiste sea
            de otra corrida.</div>
        : <div style={{color:"var(--acero)",marginTop:6}}>
            El error apunta a {r.tabla||"la cabecera"}{r.campo?"."+r.campo:""}, no a un
            componente.</div>}
    </div>}

    <button className="btn min" style={{marginTop:8}}
      onClick={()=>{setAbierto(false);setTxt("");}}>Cerrar</button>
  </div>;
}

/* ---- App ---- */
function App(){
  const [fecha,setFecha]     = useState(hoy());
  const [ordenes,setOrdenesBase] = useState([]);
  const [actividades,setActividadesBase] = useState([]);
  const [recargaDia,setRecargaDia] = useState(0);   /* vuelve a leer el día en pantalla (tras importar varios respaldos) */
  /* Las entradas a cajón de días anteriores, para poder comparar contra lo que
     sale semanas después sin pedir el dato a mano. */
  const [histCajon,setHistCajon] = useState({});
  /* El inventario vive solo en memoria: son decenas de miles de filas y se
     carga una vez al final del día, cuando se hace la entrega. */
  const [inventario,setInventario] = useState(null);

     pertenece a un día: es del taller. */
  const [colabs,setColabs] = useState([...COLABORADORES_FABRICA]);

  useEffect(()=>{ (async()=>{

  })(); },[]);

  /* Las funciones de reconocimiento leen el array directamente, así que hay
     que mantenerlo al día con el estado. */
  useEffect(()=>{
    ponerColaboradores(colabs);
    store.set(LS_COLAB, JSON.stringify(colabs));
  },[colabs]);
  const [listo,setListo]     = useState(false);
  const [activa,setActiva]   = useState(null);
  const [apiKey,setApiKey]   = useState("");
  const [modelo,setModelo]   = useState(MODELO_DEFECTO);
  const [config,setConfig]   = useState(false);
  const [cola,setCola]       = useState([]);   /* fotos por procesar */
  const [fotos,setFotos]     = useState({});   /* ordenId -> dataURL (no persiste) */
  const [modo,setModo]       = useState("una");/* una foto = un registro */
  const [conMitades,setConMitades] = useState(false);  /* solo si una hoja se resiste */
  const [procesando,setProcesando] = useState(false);
  const [error,setError]     = useState("");
  const [vista,setVista]     = useState("");
  const [dias,setDias]       = useState([]);   /* días con datos guardados */
  const [fmtFecha,setFmtFecha] = useState("compacto");
  const [fmtArch,setFmtArch]   = useState("txt");   /* DTW usa tabulado */
  const [conBom,setConBom]     = useState(false);
  const [dobleEnc,setDobleEnc] = useState(true);   /* DTW espera dos encabezados */
  const [colCom1,setColCom1]   = useState(COL_COM1_DEFECTO);
  const [colCom2,setColCom2]   = useState(COL_COM2_DEFECTO);
  const [claveOrd,setClaveOrd] = useState(CLAVE_ORDEN_DEFECTO);
  const [colCajon,setColCajon] = useState(CAMPO_CAJON_DEFECTO);
  const [pegado,setPegado]   = useState("");
  const [avisoPegar,setAvisoPegar] = useState("");
  const [avisoResp,setAvisoResp] = useState(null);   /* {tipo, texto} */
  const respRef = useRef(null);
  const inputRef = useRef(null);
  const camRef   = useRef(null);
  const cancelar = useRef(false);

  // ================= NUBE (Supabase): sesión, roles y sincronización de órdenes y actividades =================
  const sesionNube=useSesionNube();
  const rolNube=sesionNube.perfil?sesionNube.perfil.rol:null;
  const conectadoNube=!!(sesionNube.session&&sesionNube.perfil);
  const puedeEditarNube=rolNube==="admin"||rolNube==="salidas";      // Dennis y Darwin editan
  const soloLectura=conectadoNube&&!puedeEditarNube;                 // Jordy (y producción) solo ven
  const [sync,setSync]=useState({estado:"off",msg:""});
  const modelosNube=useModelosNube(conectadoNube);          // modelos de IA definidos por el admin en la nube
  const [verModelos,setVerModelos]=useState(false);
  const [verLecturas,setVerLecturas]=useState(false);       // análisis de lecturas IA (nube, solo admin)
  const [recargaNube,setRecargaNube]=useState(0);                    // fuerza volver a traer el día de la nube
  const ultimoRef=useRef({}); ultimoRef.current={fecha,ordenes,actividades,listo};
  const diaCargadoRef=useRef(null);   // fecha a la que pertenecen las órdenes en memoria
  const permisoRef=useRef(false); permisoRef.current=conectadoNube&&puedeEditarNube;
  const seguirRef=useRef(false); seguirRef.current=soloLectura;
  const subiendoRef=useRef(false);
  const diasNubeRef=useRef([]);       // días que tienen órdenes en la nube
  const kOrd=f=>"tiq_sync_ord_"+f, kMeta=f=>"tiq_sync_ordmeta_"+f;
  const baseRef=useRef({fecha:null,base:{}});
  const getBase=f=>{ if(baseRef.current.fecha!==f) baseRef.current={fecha:f,base:leerBaseSync(kOrd(f))}; return baseRef.current.base; };
  const setBase=(f,b)=>{ baseRef.current={fecha:f,base:b}; guardarBaseSync(kOrd(f),b); };
  // Lo que llega de la nube se completa con los campos por defecto (como al importar un respaldo): una orden guardada
  // por una versión vieja puede no tener campos que se agregaron después. Determinístico: sin ids al azar.
  const normalizarOrden=o=>({...ORDEN_VACIA(), ...o, id:o.id,
    componentes:Array.isArray(o.componentes)?o.componentes.map((c,i)=>({...COMP_VACIO(), ...c, id:c.id||(String(o.id)+"-c"+i)})):[] });
  const normalizarActs=as=>(Array.isArray(as)?as:[]).map((a,i)=>({...ACTIVIDAD_VACIA(), ...a, id:a.id||("act-"+i)}));
  // En solo lectura, ningún cambio del usuario tiene efecto (la carga del día y la nube usan las versiones *Base)
  const setOrdenes=v=>{ if(seguirRef.current) return; setOrdenesBase(v); };
  const setActividades=v=>{ if(seguirRef.current) return; setActividadesBase(v); };

  // días con órdenes en la nube (para la lista de días)
  useEffect(()=>{
    if(!conectadoNube){ diasNubeRef.current=[]; return; }
    const sb=nube(); if(!sb) return; let vivo=true;
    paginarNube(()=>sb.from("ordenes").select("fecha").eq("deleted",false).order("fecha"))
      .then(filas=>{ if(!vivo) return; diasNubeRef.current=[...new Set(filas.map(r=>r.fecha))]; refrescarDias(); })
      .catch(()=>{});
    return ()=>{ vivo=false; };
  },[conectadoNube,recargaNube]);

  // al iniciar sesión o cambiar de día: traer órdenes y actividades de la nube, unir y escuchar cambios en vivo
  useEffect(()=>{
    if(!conectadoNube){ setSync({estado:"off",msg:""}); return; }
    if(!listo) return;
    const sb=nube(); if(!sb) return;
    let vivo=true; const f=fecha;
    const aplicar=(filas,inicial)=>{
      if(!vivo||diaCargadoRef.current!==f) return;
      const norm=(filas||[]).map(r=>(r.deleted||!r.data)?r:{...r,data:normalizarOrden(r.data)});
      setOrdenesBase(prev=>{ const r=unirOrdenesNube(prev,norm,getBase(f),inicial,seguirRef.current); setBase(f,r.base); return r.ordenes; });
    };
    const aplicarMeta=(fila)=>{
      if(!vivo||diaCargadoRef.current!==f||!fila||!fila.data) return;
      const mR={actividades:normalizarActs(fila.data.actividades)}; const hR=hashReg(mR);
      const mL={actividades:ultimoRef.current.actividades||[]}; const hL=hashReg(mL);
      const bM=leerBaseSync(kMeta(f)).h;
      if(hL===hR){ guardarBaseSync(kMeta(f),{h:hR}); return; }
      const sucio = bM===undefined ? mL.actividades.length>0 : hL!==bM;
      if(sucio&&!seguirRef.current) return;                      // cambios locales sin subir: se quedan
      setActividadesBase(mR.actividades); guardarBaseSync(kMeta(f),{h:hR});
    };
    setSync({estado:"cargando",msg:""});
    Promise.all([
      sb.from("ordenes").select("id,data,deleted").eq("fecha",f),
      sb.from("ordenes_dia").select("fecha,data").eq("fecha",f).maybeSingle()
    ]).then(([ro,rm])=>{
      if(!vivo) return;
      if(ro.error){ setSync({estado:"error",msg:ro.error.message}); return; }
      aplicar(ro.data||[],true); if(rm&&rm.data) aplicarMeta(rm.data);
      setSync({estado:"ok",msg:""});
    }).catch(err=>{ if(vivo) setSync({estado:"pendiente",msg:String((err&&err.message)||err)}); });
    const canal=sb.channel("ordenes-"+f+"-"+Math.random().toString(36).slice(2,8))
      .on("postgres_changes",{event:"*",schema:"public",table:"ordenes",filter:"fecha=eq."+f},(pl)=>{
        const id=pl&&pl.new&&pl.new.id; if(!id) return;
        // se relee la fila completa: el aviso en vivo puede venir recortado si la orden es grande
        sb.from("ordenes").select("id,data,deleted,fecha").eq("id",id)
          .then(({data})=>{ const fila=data&&data[0]; if(fila&&fila.fecha===f) aplicar([fila],false); }).catch(()=>{});
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"ordenes_dia",filter:"fecha=eq."+f},()=>{
        sb.from("ordenes_dia").select("fecha,data").eq("fecha",f).maybeSingle()
          .then(({data})=>{ if(data) aplicarMeta(data); }).catch(()=>{});
      }).subscribe();
    return ()=>{ vivo=false; try{ sb.removeChannel(canal); }catch(e){} };
  },[fecha,conectadoNube,listo,recargaNube]);

  async function subirCambios(){
    if(!permisoRef.current) return;
    const sb=nube(); if(!sb) return;
    const u=ultimoRef.current; const f=u.fecha;
    if(!u.listo||diaCargadoRef.current!==f) return;
    if(subiendoRef.current){ setTimeout(subirCambios,800); return; }
    const plan=planSubidaOrdenes(u.ordenes,getBase(f),f);
    const m={actividades:u.actividades||[]}; const hM=hashReg(m); const bM=leerBaseSync(kMeta(f)).h;
    const subirMeta = bM===undefined ? m.actividades.length>0 : hM!==bM;
    if(!plan.filas.length&&!plan.borrarFilas.length&&!subirMeta){ setSync(s=>(s.estado==="pendiente"||s.estado==="error")?{estado:"ok",msg:""}:s); return; }
    subiendoRef.current=true; setSync({estado:"subiendo",msg:""});
    try{
      if(plan.filas.length){ const {error}=await sb.from("ordenes").upsert(plan.filas,{onConflict:"id"}); if(error) throw error; }
      if(plan.borrarFilas.length){ const {error}=await sb.from("ordenes").update({deleted:true}).in("id",plan.borrarFilas).eq("fecha",f); if(error) throw error; }
      if(subirMeta){ const {error}=await sb.from("ordenes_dia").upsert({fecha:f,data:m},{onConflict:"fecha"}); if(error) throw error; guardarBaseSync(kMeta(f),{h:hM}); }
      const nb={...getBase(f),...plan.hashes}; plan.borrarIds.forEach(id=>delete nb[id]); setBase(f,nb);
      if(plan.filas.length&&!diasNubeRef.current.includes(f)){ diasNubeRef.current=[...diasNubeRef.current,f]; refrescarDias(); }
      setSync({estado:"ok",msg:""});
    }catch(err){
      const msg=String((err&&err.message)||err);
      setSync({estado:(!navigator.onLine||/fetch|network|Failed/i.test(msg))?"pendiente":"error",msg});
    }finally{ subiendoRef.current=false; }
  }
  // subir 1,5 s después del último cambio
  useEffect(()=>{
    if(!conectadoNube||!puedeEditarNube) return;
    const tm=setTimeout(()=>{ subirCambios().catch(()=>{}); },1500);
    return ()=>clearTimeout(tm);
  },[ordenes,actividades,fecha,listo,conectadoNube,puedeEditarNube]);
  // reintentar lo pendiente: al volver internet y cada 30 s
  useEffect(()=>{
    const h=()=>{ subirCambios().catch(()=>{}); };
    window.addEventListener("online",h);
    const iv=setInterval(h,30000);
    return ()=>{ window.removeEventListener("online",h); clearInterval(iv); };
  },[]);

  // sube un día que está guardado en este dispositivo (órdenes + actividades), usando su huella
  async function subirDiaOrdenes(sb,f){
    let lista=[], acts=[];
    try{ lista=JSON.parse((await store.get(LS_ORD(f)))||"[]"); }catch(e){}
    try{ acts=JSON.parse((await store.get(LS_ACT(f)))||"[]"); }catch(e){}
    const plan=planSubidaOrdenes(lista,leerBaseSync(kOrd(f)),f);
    if(plan.filas.length){ const {error}=await sb.from("ordenes").upsert(plan.filas,{onConflict:"id"}); if(error) throw error; }
    if(plan.borrarFilas.length){ const {error}=await sb.from("ordenes").update({deleted:true}).in("id",plan.borrarFilas).eq("fecha",f); if(error) throw error; }
    if(plan.filas.length||plan.borrarFilas.length){ const nb={...leerBaseSync(kOrd(f)),...plan.hashes}; plan.borrarIds.forEach(id=>delete nb[id]); guardarBaseSync(kOrd(f),nb); }
    if(acts.length){ const m={actividades:acts}; const {error}=await sb.from("ordenes_dia").upsert({fecha:f,data:m},{onConflict:"fecha"}); if(error) throw error; guardarBaseSync(kMeta(f),{h:hashReg(m)}); }
    return plan.filas.length;
  }
  // pasar a la nube todos los días guardados en este dispositivo (desde el que tenga la historia más completa)
  async function subirDiasGuardados(){
    const sb=nube(); if(!sb||!permisoRef.current) return;
    const dias=(await store.listar("tiq_ordenes_")).map(k=>k.replace("tiq_ordenes_","")).sort();
    if(!dias.length){ alert("No hay días guardados en este dispositivo."); return; }
    if(!confirm(`Se van a subir a la nube ${dias.length} día(s) de órdenes guardados en este dispositivo.\nSi una orden ya existe en la nube, se reemplaza con la de este dispositivo.\n\n¿Continuar?`)) return;
    let subidas=0, fallos=0;
    setSync({estado:"subiendo",msg:""});
    for(const f of dias){ try{ subidas+=await subirDiaOrdenes(sb,f); }catch(e){ fallos++; } }
    baseRef.current={fecha:null,base:{}}; setRecargaNube(n=>n+1);
    setSync({estado:fallos?"error":"ok",msg:fallos?`${fallos} día(s) no se pudieron subir`:""});
    alert(`Listo: ${subidas} orden(es) subidas a la nube${fallos?` · ${fallos} día(s) con error (reintentá)`:""}.`);
  }
  // importar VARIOS respaldos de una vez (por ejemplo, los de OneDrive). Con sesión, van directo a la nube.
  async function importarVarios(files){
    if(seguirRef.current) return;
    setAvisoResp(null);
    const leidos=[], errores=[];
    for(const file of files){
      try{ leidos.push({d:leerRespaldo(await file.text()), lm:file.lastModified||0}); }
      catch(err){ errores.push(`${file.name}: ${err.message}`); }
    }
    if(!leidos.length){ setAvisoResp({tipo:"err",texto:"No se pudo leer ningún respaldo. "+errores.slice(0,3).join(" · ")}); return; }
    const porFecha={}; leidos.sort((a,b)=>a.lm-b.lm).forEach(x=>{ porFecha[x.d.fecha]=x.d; }); // mismo día repetido: gana el más reciente
    const fechas=Object.keys(porFecha).sort();
    const locales=new Set((await store.listar("tiq_ordenes_")).map(k=>k.replace("tiq_ordenes_","")));
    const existentes=[];
    for(const f of fechas){ try{ const l=JSON.parse((await store.get(LS_ORD(f)))||"[]"); if(l.some(o=>!ordenVacia(o))) existentes.push(f); }catch(e){} }
    let msg=`Se leyeron ${fechas.length} día(s) de órdenes, del ${fechas[0]} al ${fechas[fechas.length-1]}.`;
    if(leidos.length>fechas.length) msg+=`\n(${leidos.length-fechas.length} archivo(s) eran del mismo día: se usa el más reciente.)`;
    if(errores.length) msg+=`\n\n${errores.length} archivo(s) no se pudieron leer y se omiten:\n${errores.slice(0,5).join("\n")}${errores.length>5?"\n…":""}`;
    if(!confirm(msg+"\n\n¿Importarlos?")) return;
    let reemplazar=true;
    if(existentes.length) reemplazar=confirm(`${existentes.length} de esos días ya tienen órdenes en este dispositivo:\n${existentes.join(", ")}\n\nAceptar = reemplazarlos con el respaldo\nCancelar = dejarlos como están e importar solo los días nuevos`);
    const sb=nube(); const usarNube=!!(sb&&permisoRef.current);
    const importadas=[], soloNube=[], filasNube=[], metasNube=[]; let subidas=0, fallosNube=0;
    if(usarNube) setSync({estado:"subiendo",msg:""});
    for(const f of fechas){
      if(!reemplazar&&existentes.includes(f)) continue;
      const d=porFecha[f];
      // en el dispositivo solo se guarda: sin sesión, el día abierto, o días que ya estaban acá
      if(!usarNube||f===fecha||locales.has(f)){
        await store.set(LS_ORD(f),JSON.stringify(d.ordenes));
        await store.set(LS_ACT(f),JSON.stringify(d.actividades||[]));
        if(usarNube){ try{ subidas+=await subirDiaOrdenes(sb,f); }catch(e){ fallosNube++; } }
      }else{
        // solo en la nube: SIN huella local (si quedara, al abrir el día se interpretaría "borrado acá")
        planSubidaOrdenes(d.ordenes,{},f).filas.forEach(x=>filasNube.push(x));
        if((d.actividades||[]).length) metasNube.push({fecha:f,data:{actividades:d.actividades}});
        soloNube.push(f);
      }
      importadas.push(f);
    }
    if(usarNube){
      for(let i=0;i<filasNube.length;i+=300){
        const lote=filasNube.slice(i,i+300);
        try{ const {error}=await sb.from("ordenes").upsert(lote,{onConflict:"id"}); if(error) throw error; subidas+=lote.length; }catch(e){ fallosNube+=lote.length; }
      }
      for(let i=0;i<metasNube.length;i+=200){
        try{ const {error}=await sb.from("ordenes_dia").upsert(metasNube.slice(i,i+200),{onConflict:"fecha"}); if(error) throw error; }catch(e){ fallosNube++; }
      }
      soloNube.forEach(f=>{ if(!diasNubeRef.current.includes(f)) diasNubeRef.current=[...diasNubeRef.current,f]; });
      baseRef.current={fecha:null,base:{}};
      setSync({estado:fallosNube?"error":"ok",msg:fallosNube?"Parte de la importación no se pudo subir":""});
    }
    if(importadas.includes(fecha)){ setListo(false); setRecargaDia(n=>n+1); }
    refrescarDias();
    setAvisoResp({tipo:fallosNube?"err":"ok", texto:`Importados ${importadas.length} día(s)`+(usarNube
