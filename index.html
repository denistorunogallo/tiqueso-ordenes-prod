<script>
/* Vigilante de arranque. En un iPad no hay consola: si algo falla, la pagina
   queda en blanco y no hay forma de saber por que. Esto convierte cualquier
   fallo en un mensaje leible dentro de la misma pagina. */
(function(){
  var caja = document.getElementById("arranque");
  var errores = [];

  function pintar(titulo, detalle){
    if(!caja) return;
    var faltan = [];
    if(!window.React)    faltan.push("React");
    if(!window.ReactDOM) faltan.push("ReactDOM");
    if(!window.Babel)    faltan.push("Babel");

    caja.innerHTML =
      '<h1 class="mal">' + titulo + '</h1>' +
      (detalle ? '<pre style="white-space:pre-wrap;background:#F2F4F6;padding:10px;' +
                 'border-radius:3px;font-size:11px;overflow-x:auto">' +
                 String(detalle).replace(/</g,"&lt;") + '</pre>' : '') +
      '<p><strong>Diagnostico</strong></p><ul>' +
      '<li>Librerias que no cargaron: ' + (faltan.length ? faltan.join(", ") : "ninguna, todas bien") + '</li>' +
      '<li>Conexion: ' + (navigator.onLine ? "en linea" : "sin conexion") + '</li>' +
      '<li>Origen: <code>' + location.protocol + '</code></li>' +
      '</ul>' +
      (faltan.length
        ? '<p>La aplicacion descarga React y Babel desde internet la primera vez. ' +
          'Necesita conexion y que la red no bloquee <code>cdn.jsdelivr.net</code> ni ' +
          '<code>unpkg.com</code>.</p>'
        : '') +
      (location.protocol === "file:"
        ? '<p><strong>Estas abriendo el archivo directamente desde el disco.</strong> ' +
          'En iPhone y iPad eso casi nunca funciona: Safari no abre <code>file://</code> ' +
          'de forma confiable. Subilo a un hosting, o abrilo desde una computadora.</p>'
        : '');
  }

  /* Sin crossorigin, el navegador oculta los errores de scripts de otro origen
     y solo dice "Script error.". Con él llega el mensaje y la pila de verdad. */
  window.addEventListener("error", function(e){
    var det = (e.error && (e.error.stack || e.error.message)) || e.message ||
              "error desconocido";
    if(e.filename) det += "\n" + e.filename + ":" + (e.lineno||"?");
    errores.push(det);
    pintar("La aplicacion no pudo arrancar", det);
  });

  window.addEventListener("unhandledrejection", function(e){
    var r = e.reason;
    pintar("Una operacion fallo",
      (r && (r.stack || r.message)) || String(r));
  });

  setTimeout(function(){
    if(window.__appLista){ if(caja) caja.remove(); return; }
    pintar("La aplicacion no termino de cargar", errores[0] || null);
  }, 6000);
})();
</script>

function nube(){

const ROL_TXT = { admin:"Admin", salidas:"Salidas", tesoreria:"Tesorería", produccion:"Producción" };
function useSesionNube(){
  const [st,setSt]=useState({cargando:true, session:null, perfil:null, error:""});
  useEffect(()=>{
    const sb=nube();
    if(!sb){ setSt({cargando:false,session:null,perfil:null,error:"No se pudo cargar la conexión a la nube (revisá internet)."}); return; }
    let vivo=true;

      if(!vivo) return;

        let perfil=data||null;
        if(!perfil&&error){ try{ perfil=JSON.parse(localStorage.getItem(claveCache)||"null"); }catch(e){} } // sin internet: último rol conocido
        setSt({cargando:false,session,perfil,error:perfil?"":(error?error.message:"Este usuario no tiene un rol asignado. Avisale al administrador.")});
      }catch(e){
        let perfil=null; try{ perfil=JSON.parse(localStorage.getItem("tiq_nube_perfil_"+session.user.id)||"null"); }catch(x){}
        if(vivo) setSt({cargando:false,session,perfil,error:perfil?"":String((e&&e.message)||e)});

    sb.auth.getSession().then(({data})=>cargar(data&&data.session)).catch(()=>{ if(vivo) setSt(s=>({...s,cargando:false})); });
    // setTimeout: llamar a la base dentro del aviso de sesión puede trabar supabase-js
    const {data:sub}=sb.auth.onAuthStateChange((_ev,session)=>{ setTimeout(()=>cargar(session),0); });
    return ()=>{ vivo=false; try{ sub.subscription.unsubscribe(); }catch(e){} };
  },[]);
  return st;
}

  const caja={maxWidth:380,margin:"9vh auto 0",background:"#fff",border:"1px solid #D5DCE3",borderRadius:16,boxShadow:"0 12px 40px rgba(0,0,0,.08)",padding:"28px 26px",color:"#1d2b36",fontFamily:"inherit"};

  if(st.cargando) return <div style={caja}>{cabecera}<div style={{color:"#5b6b7a"}}>Verificando sesión…</div></div>;

// ===== SINCRONIZACIÓN de Órdenes de producción con la nube =====
// JSON con llaves ordenadas: la base (jsonb) reordena las llaves, así se compara el CONTENIDO y no el orden
function jsonEstable(v){
  if(v===null||typeof v!=="object") return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v)) return "["+v.map(jsonEstable).join(",")+"]";
  return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+jsonEstable(v[k])).join(",")+"}";
}
function hashTxt(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36)+"."+s.length; }
const hashReg = e => hashTxt(jsonEstable(e));
// id del registro en la nube: fecha + id de la orden (los ids cortos podrían repetirse entre días)
const idFilaOrden = (f,o) => f+"|"+String(o.id);
// ⚠ AJUSTAR a los campos reales de una orden "vacía" (recién creada, sin datos)
const ordenVacia = o => !(o && (o.producto||o.lote||o.codigo||o.cantidadKg||o.unidades||o.cantidadPlan||
  (o.componentes||[]).some(c=>c.material||c.lote||c.codigo||c.cantidad)));
// "base" = huella de cada orden tal como quedó la última vez que se sincronizó en ESTE dispositivo (por día)
function leerBaseSync(clave){ try{ return JSON.parse(localStorage.getItem(clave)||"{}")||{}; }catch(e){ return {}; } }
function guardarBaseSync(clave,b){ try{ localStorage.setItem(clave, JSON.stringify(b)); }catch(e){} }
// Une lo local con filas de la nube.
//  · Quien edita: lo local con cambios SIN SUBIR nunca se pisa; lo demás se actualiza.
//  · Solo lectura (seguirNube): la pantalla refleja exactamente lo que hay en la nube.
function unirOrdenesNube(locales, filas, base, esCargaInicial, seguirNube){
  let lista = (esCargaInicial && seguirNube) ? [] : [...(locales||[])];
  const idx=new Map(lista.map((e,i)=>[String(e.id),i]));
  const nb={...base};
  (filas||[]).forEach(r=>{
    const remota={...r.data}; if(remota.id==null) remota.id=String(r.id).split("|").slice(1).join("|");
    const id=String(remota.id); const i=idx.get(id);
    if(r.deleted){
      if(i!=null && (seguirNube || hashReg(lista[i])===base[id])){ lista[i]=null; delete nb[id]; }
      else if(i==null) delete nb[id];
      return;
    }
    const hR=hashReg(remota);
    if(i!=null){
      const hL=hashReg(lista[i]);
      if(hL===hR){ nb[id]=hR; return; }
      if(!seguirNube && hL!==base[id]) return;     // cambios locales sin subir: se quedan (y se suben)
      lista[i]=remota; nb[id]=hR;
    }else{
      if(!seguirNube && base[id]) return;          // la borré acá y falta subir el borrado
      idx.set(id,lista.length); lista.push(remota); nb[id]=hR;
    }
  });
  return {ordenes:lista.filter(Boolean), base:nb};
}
// Qué hay que subir: órdenes nuevas o cambiadas, y las que se borraron acá
function planSubidaOrdenes(lista, base, f){
  const filas=[], hashes={};
  (lista||[]).forEach(o=>{
    const id=String(o.id); const h=hashReg(o);
    if(base[id]===h) return;
    if(!base[id] && ordenVacia(o)) return;         // orden vacía nunca subida: no ensuciar la nube
    filas.push({id:idFilaOrden(f,o), fecha:f, data:o, deleted:false}); hashes[id]=h;
  });
  const ids=new Set((lista||[]).map(o=>String(o.id)));
  const borrarIds=Object.keys(base).filter(id=>!ids.has(id));
  return {filas, hashes, borrarIds, borrarFilas:borrarIds.map(id=>f+"|"+id)};
}

// ===== COBERTURA DE DÍAS: qué días (lunes a sábado) tienen datos y cuáles faltan =====
const FERIADOS_CR = { "2026-01-01":"Año Nuevo","2026-04-02":"Jueves Santo","2026-04-03":"Viernes Santo","2026-04-11":"Juan Santamaría",
  "2026-05-01":"Día del Trabajo","2026-07-25":"Anexión de Nicoya","2026-08-15":"Día de la Madre","2026-08-31":"Día de la Persona Negra",
  "2026-09-15":"Independencia","2026-12-01":"Abolición del Ejército","2026-12-25":"Navidad" };
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
// trae todas las filas de una consulta, de 1000 en 1000 (límite de la base por consulta)
async function paginarNube(armar){ const out=[]; for(let desde=0;;desde+=1000){ const {data,error}=await armar().range(desde,desde+999); if(error) throw error; out.push(...(data||[])); if(!data||data.length<1000) break; } return out; }
function CoberturaDias({titulo, cargar, onAbrir, onCerrar, desdeInicial}){
  const [desde,setDesde]=useState(desdeInicial||"2026-08-01");
  const [datos,setDatos]=useState(null); const [cargando,setCargando]=useState(true); const [err,setErr]=useState("");
  useEffect(()=>{ let vivo=true; setCargando(true); setErr("");
    Promise.resolve(cargar(desde)).then(r=>{ if(vivo){ setDatos(r||{}); setCargando(false); } }).catch(e=>{ if(vivo){ setErr(String((e&&e.message)||e)); setCargando(false); } });
    return ()=>{ vivo=false; }; },[desde]);
  const hoy=isoLocal(new Date());
  const dias=[]; { const d=new Date(desde+"T12:00:00"); const fin=new Date(hoy+"T12:00:00"); while(d<=fin){ dias.push(isoLocal(d)); d.setDate(d.getDate()+1); } }
  const estadoDe=f=>{
    const info=datos&&datos[f]; const dow=new Date(f+"T12:00:00").getDay();
    if(info) return info.aviso?{k:"parcial",t:info.aviso}:{k:"ok",t:"Con datos"};
    if(dow===0) return {k:"domingo",t:"Domingo"};
    if(f===hoy) return {k:"hoy",t:"Hoy (en curso)"};
    // los feriados se trabajan: sin datos cuentan como faltantes (con la aclaración, por si ese día no se trabajó)
    return {k:"falta",t:FERIADOS_CR[f]?`Falta · era feriado (${FERIADOS_CR[f]}): si ese día no se trabajó, ignoralo`:"Falta: no hay datos de este día"};
  };
  const COL={ok:["#EAF7EE","#127A3E"],parcial:["#FBEEDC","#8A5A00"],falta:["#FDECEA","#B3261E"],feriado:["#EEF0F3","#7a8494"],hoy:["#E8F0FB","#2B6CB0"]};
  const laborales=dias.filter(f=>new Date(f+"T12:00:00").getDay()!==0);
  const faltan=laborales.filter(f=>estadoDe(f).k==="falta");
  const parciales=laborales.filter(f=>estadoDe(f).k==="parcial");
  const conDatos=laborales.filter(f=>datos&&datos[f]).length;
  const meses={}; laborales.forEach(f=>{ (meses[f.slice(0,7)]=meses[f.slice(0,7)]||[]).push(f); });
  const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"];
  const fmtCorta=f=>{ const d=new Date(f+"T12:00:00"); return ["dom","lun","mar","mié","jue","vie","sáb"][d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1); };
  const chip=(f,c)=>(<button key={f} onClick={()=>onAbrir(f)} title={estadoDe(f).t} style={{border:"1px solid "+c[1],background:c[0],color:c[1],borderRadius:14,padding:"3px 9px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{fmtCorta(f)}{FERIADOS_CR[f]?" · feriado":""}</button>);
  return (
    <div style={{marginTop:14,background:"#fff",border:"1px solid #D5DCE3",borderRadius:12,padding:"14px 16px",color:"#1d2b36"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:10}}>
        <div style={{fontWeight:800,fontSize:15}}>📅 Días con datos — {titulo}</div>
        <label style={{fontSize:12.5,color:"#5b6b7a"}}>Desde <input type="date" value={desde} onChange={e=>e.target.value&&setDesde(e.target.value)} style={{fontFamily:"inherit",fontSize:12.5,padding:"3px 6px",border:"1px solid #D5DCE3",borderRadius:6}}/></label>
        <div style={{flex:1}}/>
        <button onClick={onCerrar} style={{border:"1px solid #D5DCE3",background:"#fff",borderRadius:8,padding:"5px 11px",cursor:"pointer",fontFamily:"inherit"}}>Cerrar</button>
      </div>
      {cargando ? <div style={{fontSize:13,color:"#5b6b7a"}}>Revisando días…</div> : err ? <div style={{fontSize:13,color:"#B3261E"}}>No se pudo revisar: {err}</div> : (<>
        <div style={{fontSize:13.5,marginBottom:10}}>
          <b>{conDatos}</b> día(s) con datos · <b style={{color:faltan.length?"#B3261E":"#127A3E"}}>{faltan.length}</b> faltante(s){parciales.length?<> · <b style={{color:"#8A5A00"}}>{parciales.length}</b> incompleto(s)</>:null} <span style={{color:"#5b6b7a"}}>(lunes a sábado, feriados incluidos)</span>
        </div>
        {faltan.length>0 && <div style={{marginBottom:10}}><div style={{fontSize:12.5,fontWeight:700,color:"#B3261E",marginBottom:5}}>Faltan (tocá para abrir el día):</div><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{faltan.map(f=>chip(f,COL.falta))}</div></div>}
        {parciales.length>0 && <div style={{marginBottom:10}}><div style={{fontSize:12.5,fontWeight:700,color:"#8A5A00",marginBottom:5}}>Incompletos:</div><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{parciales.map(f=>chip(f,COL.parcial))}</div></div>}
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
          {Object.keys(meses).map(m=>{
            const filas=[]; let fila=null;
            meses[m].forEach(f=>{ const dow=new Date(f+"T12:00:00").getDay(); if(!fila||dow===1){ fila=new Array(6).fill(null); filas.push(fila); } fila[dow-1]=f; });
            return (
              <div key={m}>
                <div style={{fontSize:12.5,fontWeight:700,marginBottom:4}}>{MES[+m.slice(5,7)-1]} {m.slice(0,4)}</div>

// ===== MODELOS DE IA configurables desde la nube (tabla config_app, clave "modelos") =====
// El administrador elige el modelo principal y el de reintento de cada app; todos los dispositivos lo usan
// sin publicar una versión nueva. Si lo configurado falla por un error de modelo, se usa el MODELO_SEGURO.
const MODELOS_CONOCIDOS = [
  {id:"claude-sonnet-5-5", nombre:"Sonnet 5.5", in:2, out:10},
  {id:"claude-opus-5-5",   nombre:"Opus 5.5",   in:4, out:20},
  {id:"claude-sonnet-5",   nombre:"Sonnet 5",   in:2, out:10},
  {id:"claude-opus-5",     nombre:"Opus 5",     in:5, out:25},
  {id:"claude-haiku-4-5",  nombre:"Haiku 4.5",  in:1, out:5},
];
const MODELO_SEGURO = {principal:"claude-sonnet-5-5", respaldo:"claude-opus-5-5"};  // probados con estas apps
const CFG_MODELOS_DEFECTO = {salidas:{...MODELO_SEGURO}, entradas:{...MODELO_SEGURO}, ordenes:{...MODELO_SEGURO}, precios:{}};
let CFG_MODELOS = (()=>{ try{ return {...CFG_MODELOS_DEFECTO, ...(JSON.parse(localStorage.getItem("tiq_cfg_modelos")||"null")||{})}; }catch(e){ return CFG_MODELOS_DEFECTO; } })();
function modelosDe(app){ const c=(CFG_MODELOS&&CFG_MODELOS[app])||{}; return {principal:c.principal||MODELO_SEGURO.principal, respaldo:c.respaldo||MODELO_SEGURO.respaldo}; }
function precioModelo(id){ const p=(CFG_MODELOS&&CFG_MODELOS.precios&&CFG_MODELOS.precios[id])||MODELOS_CONOCIDOS.find(m=>m.id===id); return p?{in:+p.in||0,out:+p.out||0}:null; }
function nombreModelo(id){ const m=MODELOS_CONOCIDOS.find(x=>x.id===id); return m?m.nombre:id; }
// ¿con qué modelo seguro se reintenta si el configurado falla? (null = no aplica)
function modeloSeguroDe(app, modelo){
  const m=modelosDe(app);
  if(modelo===m.principal && modelo!==MODELO_SEGURO.principal) return MODELO_SEGURO.principal;
  if(modelo===m.respaldo && modelo!==MODELO_SEGURO.respaldo) return MODELO_SEGURO.respaldo;
  return null;
}
// solo errores que indican modelo inexistente o parámetro no aceptado (no key inválida, ni saturación)
function esErrorDeModelo(status, texto){ return status===404 || (status===400 && /model|temperature|top_p|top_k|thinking|param|support/i.test(String(texto||""))); }
function registrarFalloModelo(app, modelo, seguro, detalle){
  try{ localStorage.setItem("tiq_fallo_modelo", JSON.stringify({fecha:new Date().toISOString(), app, modelo, seguro, detalle:String(detalle||"").slice(0,200)})); }catch(e){}
}
// ejecuta fn(modelo); si falla por un error de modelo, reintenta UNA vez con el modelo seguro y lo deja anotado
async function leerConModelo(app, modelo, fn){
  try{ return await fn(modelo); }
  catch(e){
    const seguro = (e && e._statusApi && esErrorDeModelo(e._statusApi, e.message)) ? modeloSeguroDe(app, modelo) : null;
    if(!seguro) throw e;
    registrarFalloModelo(app, modelo, seguro, e.message);
    const r = await fn(seguro);
    if(r && typeof r==="object") r._modeloRespaldo = seguro;
    return r;
  }
}
// cargar la configuración de la nube, escuchar cambios en vivo, y guardar (solo admin)
function useModelosNube(conectado){
  const [cfg,setCfg]=useState(CFG_MODELOS);
  useEffect(()=>{
    if(!conectado) return;
    const sb=nube(); if(!sb) return; let vivo=true;
    const aplicar=d=>{ if(!vivo||!d) return; CFG_MODELOS={...CFG_MODELOS_DEFECTO, ...d}; try{ localStorage.setItem("tiq_cfg_modelos",JSON.stringify(CFG_MODELOS)); }catch(e){} setCfg(CFG_MODELOS); };
    const leer=()=>{ try{ sb.from("config_app").select("data").eq("clave","modelos").maybeSingle().then(({data})=>{ if(data&&data.data) aplicar(data.data); }).catch(()=>{}); }catch(e){} };
    leer();
    let canal=null;
    try{ canal=sb.channel("cfg-modelos-"+Math.random().toString(36).slice(2,7)).on("postgres_changes",{event:"*",schema:"public",table:"config_app",filter:"clave=eq.modelos"},()=>leer()).subscribe(); }catch(e){}
    return ()=>{ vivo=false; try{ if(canal) sb.removeChannel(canal); }catch(e){} };
  },[conectado]);
  const guardar=async(nuevo)=>{
    const sb=nube(); if(!sb) throw new Error("Sin conexión con la nube.");
    const {error}=await sb.from("config_app").upsert({clave:"modelos",data:nuevo},{onConflict:"clave"});
    if(error) throw error;
    CFG_MODELOS={...CFG_MODELOS_DEFECTO, ...nuevo};
    try{ localStorage.setItem("tiq_cfg_modelos",JSON.stringify(CFG_MODELOS)); }catch(e){}
    setCfg(CFG_MODELOS);
  };
  return {cfg, guardar};
}

async function cabecerasNube(app, meta){

  try{ const sb=nube(); if(sb){ const {data}=await sb.auth.getSession(); const tk=data&&data.session&&data.session.access_token; if(tk) h.Authorization="Bearer "+tk; } }catch(e){}

const NOMBRE_APP = {salidas:"Salidas", entradas:"Entradas", ordenes:"Órdenes"};
function costoLectura(f){
  const p=precioModelo(f.modelo)||{in:0,out:0};
  return ((f.in_tok||0)*p.in + (f.cache_w||0)*p.in*1.25 + (f.cache_r||0)*p.in*0.1 + (f.out_tok||0)*p.out)/1e6;
}
function resumirLecturas(filas){
  const n=filas.length, ok=filas.filter(f=>f.ok);
  const prom=(a,k)=>a.length?a.reduce((s,f)=>s+(f[k]||0),0)/a.length:0;
  const conTexto=ok.filter(f=>f.resp_chars>0&&f.out_tok>0);
  const razon = conTexto.length ? 1 - conTexto.reduce((s,f)=>s+Math.min(1,(f.resp_chars/3.2)/f.out_tok),0)/conTexto.length : null;
  const costo=filas.reduce((s,f)=>s+costoLectura(f),0);
  return { n, ok:ok.length, errores:n-ok.length,
    escaladas:filas.filter(f=>/escal/i.test(f.rol||"")).length,
    cortadas:filas.filter(f=>f.stop==="max_tokens").length,
    conCache:filas.filter(f=>(f.cache_r||0)>0).length,
    outProm:Math.round(prom(ok,"out_tok")), seg:prom(ok,"ms")/1000, renglones:prom(ok.filter(f=>f.lineas!=null),"lineas"),
    razon, costo, costoProm:n?costo/n:0 };
}

  const [msg,setMsg]=useState(""); const [ocupado,setOcupado]=useState(false);
  const sb=nube();
  const conectado = !!(st.session && st.perfil);
  const chip = {display:"inline-flex",alignItems:"center",gap:6,border:"1px solid "+(oscuro?"rgba(255,255,255,.35)":"#D5DCE3"),background:oscuro?"rgba(255,255,255,.12)":"#fff",color:oscuro?"#fff":"#1d2b36",borderRadius:20,padding:"4px 11px",fontSize:12.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit"};
  async function entrar(){
    if(!sb) return;
    setOcupado(true); setMsg("");
    const {error}=await sb.auth.signInWithPassword({email:email.trim().toLowerCase(), password:clave});
    setOcupado(false);
    if(error){ setMsg(/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":error.message); return; }
    setClave(""); setAbierto(false);
  }
  async function salir(){ if(sb){ try{ await sb.auth.signOut(); }catch(e){} } setAbierto(false); setMsg(""); }
  async function probar(){
    if(!sb||!st.session) return; setOcupado(true); setMsg("Probando…");
    const partes=[]; const t0=Date.now();
    try{
      const r1=await sb.from("perfiles").select("rol").eq("user_id",st.session.user.id).maybeSingle();
      partes.push(r1.error?"✗ Perfil: "+r1.error.message:"✓ Sesión y rol ("+(ROL_TXT[r1.data&&r1.data.rol]||"sin rol")+")");
      for(const tabla of ["ordenes","ordenes_dia"]){
        const r=await sb.from(tabla).select("id",{count:"exact",head:true});
        partes.push(r.error?("✗ "+tabla+": "+r.error.message):("✓ "+tabla+": lectura OK ("+(r.count==null?0:r.count)+" registros)"));
      }
      partes.push("Tiempo total: "+(Date.now()-t0)+" ms");
    }catch(e){ partes.push("✗ "+((e&&e.message)||e)); }
    setOcupado(false); setMsg(partes.join("\n"));
  }
  let etiqueta;
  if(st.cargando) etiqueta="☁ …";
  else if(conectado) etiqueta="☁ "+st.perfil.nombre+" · "+(ROL_TXT[st.perfil.rol]||st.perfil.rol);
  else if(st.session) etiqueta="⚠ Sin rol";
  else if(st.error) etiqueta="⚠ Nube no disponible";
  else etiqueta="☁ Iniciar sesión";
  const inp={width:"100%",boxSizing:"border-box",padding:"8px 10px",border:"1px solid #D5DCE3",borderRadius:8,fontSize:14,marginTop:4,fontFamily:"inherit"};
  const btn=(bg,fg)=>({border:"none",background:bg,color:fg,borderRadius:8,padding:"8px 12px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"});
  return (
    <div style={{position:"relative",display:"inline-block",textAlign:"left"}}>
      <button style={chip} onClick={()=>{ setAbierto(!abierto); setMsg(""); }} title={st.error||"Conexión a la nube"}>
        {etiqueta}
        {conectado && sync && sync.estado!=="off" && <span style={{fontWeight:700}}>{({cargando:"⟳",subiendo:"⟳",ok:"✓",pendiente:"⏳",error:"⚠"})[sync.estado]||""}</span>}
        {conectado && <span style={{width:8,height:8,borderRadius:"50%",background:(sync&&(sync.estado==="error"||sync.estado==="pendiente"))?"#E0A100":"#2EB872",display:"inline-block"}}/>}
      </button>
      {abierto && (
        <div style={{position:"absolute",right:0,top:"calc(100% + 6px)",zIndex:50,width:290,background:"#fff",color:"#1d2b36",border:"1px solid #D5DCE3",borderRadius:12,boxShadow:"0 10px 30px rgba(0,0,0,.18)",padding:14,fontWeight:400,opacity:1}}>
          {!st.session ? (
            <div>
              <div style={{fontWeight:800,fontSize:14,marginBottom:8}}>Iniciar sesión</div>
              <label style={{fontSize:12,color:"#5b6b7a"}}>Correo</label>
              <input style={inp} type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} placeholder="nombre@tiqueso.com"/>
              <label style={{fontSize:12,color:"#5b6b7a",display:"block",marginTop:8}}>Contraseña</label>
              <input style={inp} type="password" autoComplete="current-password" value={clave} onChange={e=>setClave(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") entrar(); }}/>
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button style={btn("#127A3E","#fff")} disabled={ocupado||!email||!clave} onClick={entrar}>{ocupado?"Entrando…":"Entrar"}</button>
                <button style={btn("#F4F6F8","#1d2b36")} onClick={()=>setAbierto(false)}>Cancelar</button>
              </div>
              {st.error && <div style={{marginTop:8,fontSize:12,color:"#B3261E"}}>{st.error}</div>}
            </div>
          ) : (
            <div>
              <div style={{fontWeight:800,fontSize:14}}>{st.perfil?st.perfil.nombre:"Usuario sin rol"}</div>
              <div style={{fontSize:12,color:"#5b6b7a",marginBottom:10}}>{st.session.user.email}{st.perfil?" · "+(ROL_TXT[st.perfil.rol]||st.perfil.rol):""}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button style={btn("#EAF7EE","#127A3E")} disabled={ocupado} onClick={probar}>Probar conexión</button>
                <button style={btn("#F4F6F8","#1d2b36")} onClick={salir}>Cerrar sesión</button>
                {onModelos && st.perfil && st.perfil.rol==="admin" && <button style={btn("#E8F0FB","#2B6CB0")} onClick={()=>{ setAbierto(false); onModelos(); }}>🤖 Modelos de IA</button>}
                {onLecturas && st.perfil && st.perfil.rol==="admin" && <button style={btn("#F4F6F8","#1d2b36")} onClick={()=>{ setAbierto(false); onLecturas(); }}>📈 Lecturas IA</button>}
              </div>
              {st.error && <div style={{marginTop:8,fontSize:12,color:"#B3261E"}}>{st.error}</div>}
              {sync && <div style={{marginTop:10,fontSize:12,color:sync.estado==="error"?"#B3261E":"#5b6b7a"}}>
                {({off:"Sincronización apagada.",cargando:"Trayendo datos de la nube…",subiendo:"Guardando en la nube…",ok:"✓ Todo guardado en la nube.",pendiente:"⏳ Sin conexión: los cambios quedan en este dispositivo y se suben al volver internet.",error:"⚠ No se pudo guardar en la nube: "+(sync.msg||"")})[sync.estado]||""}
              </div>}
            </div>
          )}
          {msg && <pre style={{whiteSpace:"pre-wrap",fontSize:12,background:"#F4F6F8",borderRadius:8,padding:8,fontFamily:"inherit",margin:"10px 0 0"}}>{msg}</pre>}
        </div>
      )}
    </div>
  );
}

/* ══════════════ MÓDULO: plataforma.js — ADAPTADOR "vercel" ══════════════
   Publicado en Vercel. La API key vive en el servidor como variable de
   entorno, así que nadie la escribe ni la ve: el navegador solo habla con
   /api/transcribir, que reenvía a Anthropic.
   ═══════════════════════════════════════════════════════════════════════ */

const PLATAFORMA     = "vercel";
const NECESITA_KEY   = false;
const MODELO_FIJO    = null;      /* el usuario elige; la key es del servidor */
const NOTA_PLATAFORMA =
  "La credencial vive en el servidor: no hace falta configurar nada en este " +
  "dispositivo. El modelo sí se puede cambiar.";

const store = {
  async get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  async set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  async listar(prefijo){
    try{ return Object.keys(localStorage).filter(k=>k.startsWith(prefijo)); }
    catch(e){ return []; }
  },
  async borrar(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* El proxy devuelve el flujo de Anthropic (SSE). Acá se rearma la respuesta
   con la misma forma que tendría sin streaming, para que el resto de la app
   no tenga que enterarse. */
async function llamarAPI({contenido, sistema, modelo, alAvanzar}){
  const modeloReal = (!modelo || modelo==="nube") ? modelosDe("ordenes").principal : modelo;
  const r = await fetch("/api/transcribir",{
    method:"POST",
    headers: await cabecerasNube("ordenes", null),   /* la sesión la exige el servidor */
    body: JSON.stringify({
      model: modeloReal,
      max_tokens: 16000,
      /* bloque cacheable: la 2ª foto en adelante cuesta ~10% del input */
      system: [{type:"text", text:sistema, cache_control:{type:"ephemeral"}}],
      messages:[{role:"user", content:contenido}]
    })
  });

  if(!r.ok){
    let detalle = "";
    try{ const j = await r.json(); detalle = (j.error && j.error.message) || ""; }catch(e){}
    /* si el modelo configurado no existe o no acepta la solicitud, se reintenta UNA vez con el modelo seguro */
    const seguro = esErrorDeModelo(r.status, detalle) ? modeloSeguroDe("ordenes", modeloReal) : null;
    if(seguro){ registrarFalloModelo("ordenes", modeloReal, seguro, "API "+r.status+": "+detalle); return await llamarAPI({contenido, sistema, modelo:seguro, alAvanzar}); }
    let msg = "El servidor respondió con error " + r.status + ".";
    const deSesion = (r.status===401 || r.status===403) && /sesi[oó]n|permiso/i.test(detalle);
    if(deSesion) msg = detalle;   /* sesión vencida o usuario sin permiso: el mensaje del servidor ya es claro */
    else if(r.status===401 || (r.status===500 && /ANTHROPIC_API_KEY/.test(detalle)))
      msg = "El servidor no pudo autenticarse con Anthropic. " +
            "Revisá la variable ANTHROPIC_API_KEY en Vercel.";
    if(r.status===413)
      msg = "Las fotos pesan más de lo que Vercel acepta en una sola petición (4.5 MB). " +
            "Mandá una foto por vez, o desactivá el envío de las mitades.";
    if(r.status===429) msg = "Demasiadas solicitudes seguidas. Esperá unos segundos.";
    if(r.status===504)
      msg = "El servidor cortó por tiempo. Probá con una foto por vez.";
    const e = new Error(deSesion ? msg : (detalle && !/ANTHROPIC_API_KEY/.test(detalle)
                        ? msg + " " + detalle : msg));
    e.duro = true; throw e;
  }

  /* Si no vino como flujo, es una respuesta normal: se usa tal cual. */
  const tipo = r.headers.get("content-type") || "";
  if(!tipo.includes("text/event-stream")) return await r.json();

  const lector = r.body.getReader();
  const dec = new TextDecoder();
  let buffer = "", texto = "", fin = null, uso = null, errorFlujo = null;

  for(;;){
    const {done, value} = await lector.read();
    if(done) break;
    buffer += dec.decode(value, {stream:true});

    /* Los eventos vienen separados por una línea en blanco. */
    let corte;
    while((corte = buffer.indexOf("\n\n")) >= 0){
      const bloque = buffer.slice(0, corte); buffer = buffer.slice(corte + 2);
      const linea = bloque.split("\n").find(l => l.startsWith("data:"));
      if(!linea) continue;
      let ev; try{ ev = JSON.parse(linea.slice(5).trim()); }catch(e){ continue; }

      if(ev.error){ errorFlujo = ev.error.message || "error en el flujo"; continue; }
      if(ev.type === "content_block_delta" && ev.delta && ev.delta.text){
        texto += ev.delta.text;
        if(alAvanzar) alAvanzar(texto.length);
      }
      if(ev.type === "message_delta"){
        if(ev.delta && ev.delta.stop_reason) fin = ev.delta.stop_reason;
        if(ev.usage) uso = ev.usage;
      }
      if(ev.type === "message_start" && ev.message && ev.message.usage) uso = ev.message.usage;
    }
  }

  if(errorFlujo){ const e = new Error(errorFlujo); e.duro = true; throw e; }

  return {content:[{type:"text", text:texto}], stop_reason:fin, usage:uso};
}

const CSS = `@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    /* Paleta Tiqueso, la misma de la app de salidas */
    --tiqueso:#0A5B2C; --tiqueso2:#00803D; --oro:#D4A017;
    --papel:#FAFBFA;
    /* neutros */
    --tinta:#1d2b26; --acero:#5A6D71; --gris:#7C8B87;
    --borde:#D8E2DD; --panel:#FFFFFF; --fondo:#EEF2F0;
    /* semanticos */
    --alerta:#A81E12;  --alerta-suave:#FBE9E7;   /* rojo  = impide exportar */
    --queso:#8A5A00;   --queso-suave:#FBEEDC;    /* ambar = revisar */
    --verde:#00803D;   --verde-suave:#E7F3EC;    /* verde = validado */
    --morado:#5E35B1;  --morado-suave:#EDE7F6;   /* morado = caso especial */
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--fondo);font-family:var(--sans);color:var(--tinta);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  input,textarea,select,button{font-family:inherit;font-size:14px;color:inherit}
  input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--borde);
       border-radius:3px;background:var(--panel);outline:none}
  input.cod,textarea.cod{font-family:var(--mono);letter-spacing:.05em}
  input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--queso);outline-offset:1px}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
       color:var(--gris);display:block;margin-bottom:5px}
  .card{background:var(--panel);border:1px solid var(--borde);border-radius:6px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px}
  .btn{padding:10px 16px;border-radius:4px;border:1px solid var(--tiqueso);
       background:var(--tiqueso);color:#fff;font-weight:500;font-size:13px;cursor:pointer}
  .btn.sec{background:transparent;color:var(--acero);border-color:var(--borde)}
  .btn.oro{background:var(--oro);border-color:var(--oro);color:#3A2A00;font-weight:600}
  .btn.min{background:none;border:none;padding:0;color:var(--acero);font-size:11px;
       text-decoration:underline;cursor:pointer}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
       padding:2px 6px;border-radius:2px;text-transform:uppercase}
  .avi{border-radius:3px;padding:9px 11px;font-size:12px;margin-bottom:12px;border:1px solid}
  .avi.err{background:var(--alerta-suave);border-color:var(--alerta)}
  .avi.war{background:var(--queso-suave);border-color:var(--queso)}
  .avi.ok{background:var(--verde-suave);border-color:var(--verde)}
  .avi.neu{background:var(--fondo);border-color:var(--borde)}
  .avi.esp{background:var(--morado-suave);border-color:var(--morado)}
  pre{background:var(--tinta);color:#D6DBE2;padding:12px;border-radius:3px;overflow-x:auto;
      font-family:var(--mono);font-size:10.5px;line-height:1.6}
  .rev{background:var(--verde-suave)!important;opacity:.75}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

`;

function norm(s){
  return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
}

/* --- catálogo por lote: Lote_Corto,Codigo,Descripcion,Tipo,Equiv_Kg --- */
const CATALOGO = LOTES_RAW.trim().split("\n").slice(1).map(l=>{
  const p=l.split(",");
  if(p.length<5) return null;
  return {loteCorto:p[0].trim(), codigo:p[1].trim(),
          descripcion:p.slice(2,p.length-2).join(",").trim(),
          tipo:p[p.length-2].trim(), equivKg:parseFloat(p[p.length-1])||null,
          clase:null};   /* clase se llena abajo, con tipoProducto() */
}).filter(Boolean);

const POR_LOTE = CATALOGO.reduce((m,i)=>{
  const k=i.loteCorto.toUpperCase();
  if(!m[k]) m[k]=[];
  if(!m[k].some(e=>e.codigo===i.codigo)) m[k].push(i);
  return m;
},{});

const LOTES_CORTOS = Object.keys(POR_LOTE);

/* --- maestro OITM: codigo|desc|grupo|uom|A/I --- */
const ARTICULOS = ARTICULOS_RAW.trim().split("\n").map(l=>{
  const [codigo,desc,grupo,uom,act]=l.split("|");
  return {codigo,desc,grupo,uom,activo:act==="A",busq:norm(codigo+" "+desc+" "+grupo)};
});
const ART = ARTICULOS.reduce((m,a)=>{m[a.codigo]=a;return m;},{});

function buscarArticulos(q,limite=8){
  const t=norm(q).split(/\s+/).filter(Boolean);
  if(!t.length) return [];
  const base = ARTICULOS.filter(a=>t.every(x=>a.busq.includes(x)));

  /* "6 x 8" no aparece literal en ningún código: ahí va como 0608. */
  const k = claveMedidas(q);
  const porMedida = k ? ARTICULOS.filter(a=>a.codigo.includes(k)) : [];

  const vistos = new Set();
  return [...porMedida, ...base]
    .filter(a => !vistos.has(a.codigo) && vistos.add(a.codigo))
    .sort((a,b)=>a.activo===b.activo ? 0 : (a.activo?-1:1))
    .slice(0,limite);
}

/* ══════════════ MÓDULO: lógica de lote ══════════════ */
/* Lote de 10 caracteres:  [FF][PP][YY][DDD][T]                        */

function desglosarLote(lote){
  const s=(lote||"").replace(/[\s-]/g,"").toUpperCase();
  if(s.length!==10) return null;
  return {ff:s.slice(0,2),pp:s.slice(2,4),yy:s.slice(4,6),
          ddd:s.slice(6,9),t:s.slice(9,10),corto:s.slice(0,4)};
}

function fechaDesdeJuliano(yy,ddd){
  const y=2000+parseInt(yy,10), d=parseInt(ddd,10);
  if(isNaN(y)||isNaN(d)||d<1||d>366) return null;
  const f=new Date(Date.UTC(y,0,d));
  if(f.getUTCFullYear()!==y) return null;
  return f.toISOString().slice(0,10);
}

function buscarPorLote(lote){
  const p=desglosarLote(lote);
  return p ? (POR_LOTE[p.corto]||[]) : [];
}

/* Sugerencia por cercanía: lotes cortos a UN dígito de distancia.
   Se priorizan los que comparten familia (primeros 2 dígitos).       */
function sugerirLoteCorto(corto){
  if(!corto || corto.length!==4) return [];
  const cand=LOTES_CORTOS.filter(k=>{
    if(k.length!==4) return false;
    let dif=0;
    for(let i=0;i<4;i++) if(k[i]!==corto[i]) dif++;
    return dif===1;
  });
  return cand.sort((a,b)=>{
    const fa=a.slice(0,2)===corto.slice(0,2)?0:1;
    const fb=b.slice(0,2)===corto.slice(0,2)?0:1;
    return fa-fb || a.localeCompare(b);
  }).slice(0,4);
}

function diasEntre(a,b){
  if(!a||!b) return null;
  const d=(new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/86400000;
  return isNaN(d)?null:Math.abs(d);
}

/* Recortes: el excedente de cortar el producto. Se registra como una orden
   aparte en SAP. El código se deriva de la familia del producto:
   TIQ[FF]xx  →  TIQ[FF]99R.  Ojo: las versiones sin R están inactivas.   */
/* El sufijo no es uniforme: unas familias usan la R y otras no.
     familia 02 → TIQ0299R  (TIQ0299 existe pero está INACTIVO)
     familia 25 → TIQ2599   (sin R)
     familia 29 → TIQ2999   (sin R)
   Por eso se prueban las dos variantes y gana la que esté activa. */
function codigoRecortes(codigoProducto){
  /* La familia se toma de cualquier marca: un fraccionado REA0550 genera
     recortes TIQ0599R, porque no hay código de recortes por marca. Exigir el
     prefijo TIQ dejaba sin botón a todo lo que fuera Real o Casa Real. */
  const m = /^[A-Z]{3}(\d{2})/.exec(codigoProducto||"");
  if(!m) return null;
  for(const c of ["TIQ"+m[1]+"99R", "TIQ"+m[1]+"99"])
    if(ART[c] && ART[c].activo) return c;
  return null;
}
function esRecortes(c){ return /^TIQ\d{2}99R?$/.test(c||""); }

/* Las fotos se transcriben por tandas a lo largo del día, así que los
   registros quedan en el orden en que se cargaron, no en el del consecutivo
   manuscrito. Para revisar contra las boletas conviene verlos en orden. */
/* Orden de los archivos para DTW. Tiene que ser el mismo en cualquier
   dispositivo y después de recargar: la lista que llega de la nube no trae un
   orden fijo, y el RecordKey del OWOR sale de esta posición. */
function ordenDTW(a, b){
  return porConsecutivo(a, b) || String(a.id).localeCompare(String(b.id));
}
function porConsecutivo(a, b){
  const n = x => { const v = parseInt(x.registro, 10); return isNaN(v) ? Infinity : v; };
  return n(a) - n(b) ||
         (a.pareja||0) - (b.pareja||0) ||
         (a.tipo === "recortes" ? 1 : 0) - (b.tipo === "recortes" ? 1 : 0) ||
         String(a.codigo||"").localeCompare(String(b.codigo||""));
}

/* "1-5, 8, 11-13" se lee de un vistazo; "1, 2, 3, 4, 5, 8, 11, 12, 13" no, y
   además ocupa el doble en una columna angosta. */
function comoRangos(numeros){
  const ns = [...new Set((numeros||[])
    .map(x => parseInt(x, 10)).filter(n => !isNaN(n)))].sort((a,b) => a-b);
  const sueltos = (numeros||[]).filter(x => isNaN(parseInt(x, 10)));
  const partes = [];
  let i = 0;
  while(i < ns.length){
    let j = i;
    while(j + 1 < ns.length && ns[j+1] === ns[j] + 1) j++;
    partes.push(j - i >= 2 ? ns[i] + "-" + ns[j]
              : j - i === 1 ? ns[i] + ", " + ns[j]
              : String(ns[i]));
    i = j + 1;
  }
  return partes.concat(sueltos).join(", ");
}

/* Qué le falta a un registro para darlo por revisado. Los tres cotejos son
   contra la foto, así que un archivo bajado antes de terminarlos puede llevar
   a SAP un dato que nadie miró. */
function faltaRevisar(o){
  const pend = [];
  if(!o.revisada) pend.push("la orden");
  if(!o.loteRevisado) pend.push("el lote");
  const comps = (o.componentes||[]).filter(c => (c.material||c.codigo) && !c.revisado);
  if(comps.length) pend.push(comps.length + " componente(s)");
  return pend;
}

/* Números que faltan entre el primero y el último del día: si están las hojas
   3 y 5 pero no la 4, es que quedó sin transcribir. */
function huecosDeRegistros(ordenes){
  const nums = [...new Set((ordenes||[])
    .map(o => parseInt(o.registro, 10))
    .filter(n => !isNaN(n)))].sort((a,b) => a-b);
  if(!nums.length) return {faltan:[], desde:null, hasta:null};

  /* El día siempre arranca en el 1, así que la cuenta empieza ahí y no en el
     número más bajo que se haya cargado: si falta justo el primero, buscar
     desde el 2 daba el día por completo. */
  const hasta = nums[nums.length-1];
  const faltan = [];
  for(let n = 1; n <= hasta; n++) if(!nums.includes(n)) faltan.push(n);
  return {faltan, desde:1, hasta};
}

/* Los recortes vencen dos meses después de producidos. Se suman meses, no 60
   días: si el mes destino es más corto —31 de diciembre más dos— se queda en
   el último día de ese mes en vez de saltar al siguiente. */
const MESES_VENCE_RECORTES = 2;

function sumarMeses(iso, meses){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((iso||"").trim());
  if(!m) return "";
  const a = +m[1], mes = +m[2], dia = +m[3];
  const total = (mes - 1) + meses;
  const anioDestino = a + Math.floor(total / 12);
  const mesDestino = (total % 12 + 12) % 12;
  const ultimo = new Date(Date.UTC(anioDestino, mesDestino + 1, 0)).getUTCDate();
  const d = new Date(Date.UTC(anioDestino, mesDestino, Math.min(dia, ultimo)));
  return d.toISOString().slice(0,10);
}

const venceRecortes = fechaElab => sumarMeses(fechaElab, MESES_VENCE_RECORTES);

/* ¿Qué recortes pertenecen a este producto?

   Vale la pareja exacta —misma foto, mismo bloque— o unos recortes del mismo
   consecutivo y familia, que es el caso cuando el registro entró por otra
   carga. Vive acá y no dentro de cada componente porque llegó a haber tres
   copias de esta regla —la validación, el aviso del editor y la línea del
   balance— y arreglar una dejaba las otras con el criterio viejo. */
function familiaDeCodigo(c){ return (/^[A-Z]{3}(\d{2})/.exec(c||"")||[])[1]; }

function recortesDelProducto(o, todas){
  const lista = todas || [];

  /* La pareja exacta manda: si la hoja trae dos bloques, cada producto tiene
     los suyos y no hay que mezclarlos. */
  const exactos = lista.filter(x => x.tipo === "recortes" &&
    x.hoja === o.hoja && x.pareja === o.pareja);
  if(exactos.some(x => (parseFloat(x.cantidadKg)||0) > 0)) return exactos;

  /* Sin pareja exacta —o con una que quedó sin cantidad— se buscan los del
     mismo consecutivo y familia, que es lo que pasa cuando el registro entró
     por otra carga. Se descartan los que ya son la pareja exacta de otro
     producto: si no, un bloque se llevaría los recortes del otro. */
  const otrosProductos = lista.filter(p => p.tipo !== "recortes" && p.id !== o.id);
  return lista.filter(x => x.tipo === "recortes" &&
    x.registro === o.registro &&
    familiaDeCodigo(x.codigo) === familiaDeCodigo(o.codigo) &&
    !otrosProductos.some(p => p.hoja === x.hoja && p.pareja === x.pareja));
}

const kgRecortesDe = (o, todas) =>
  recortesDelProducto(o, todas).reduce((t,x) => t + (parseFloat(x.cantidadKg)||0), 0);

/* Cuando el número no está en la tabla, el grupo del maestro dice lo mismo con
   otras palabras: es un dato real de SAP y evita el cajón de "Sin familia". */
function grupoComoFamilia(codigo){
  const a = ART[codigo];
  if(!a || !a.grupo) return null;
  return a.grupo.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
}
const MARCAS = ["TIQ","REA","AMS","CSR","MCT","PBM","SFA","RFY"];

  const m = /^[A-Z]{3}(\d{2})/.exec(x||"") || /^(\d{2})/.exec(x||"");
  if(m && FAMILIAS[m[1]]) return FAMILIAS[m[1]];
  return grupoComoFamilia(x);
}

/* Tipo de producto. Se deriva de la DESCRIPCIÓN del catálogo, no de los
   dígitos: la regla de gramos del apéndice falla en 21 de 68 casos
   (0320 es rallado de 2 KG, no de 200 g). La descripción no miente.      */
function tipoProducto(desc){
  const d = (desc||"").toUpperCase();
  if(d.includes("RECORTE")) return "recortes";
  if(d.includes("BLOCK") || d.includes("GRANEL")) return "block";
  if(d.includes("RALLADO") || d.includes("MOLIDO")) return "rallado";
  if(d.includes("FRACCIONADO")) return "fraccionado";
  if(d.includes("REBANAD")) return "rebanado";
  return "envasado";
}

/* A.4 — En los productos block (código terminado en 00) los dígitos 3-4 son
   el PROVEEDOR INTERNO, no la presentación. 21 = Tiqueso. Varios lotes cortos
   distintos consolidan en el mismo artículo: 3021 / 3042 / 3045 → TIQ3000.
   Por eso, si un lote corto no está en el catálogo pero su familia tiene un
   código block activo, lo más probable es que sea un proveedor nuevo.      */
function esCodigoBlock(cod){ return /^[A-Z]{3}\d{2}00$/.test(cod||""); }

function sugerirBlockPorFamilia(corto){
  if(!corto || corto.length!==4) return null;
  const ff = corto.slice(0,2);
  for(const marca of MARCAS){
    const c = marca + ff + "00";
    if(ART[c] && ART[c].activo) return c;
  }
  return null;
}
