/* ══════════════ Granel vs peso fijo — de dónde sale PlannedQuantity ══════════════
   Si el producto es a GRANEL, la cantidad planificada es la casilla "Cantidades"
   de la hoja, que va en KG. Si es de PESO FIJO, es la casilla "Unidades".
   La autoridad es la unidad de medida de SAP (OITM), porque es la unidad en la
   que SAP va a registrar la orden. La columna Tipo del catálogo de lotes sirve
   de contraste: hay 12 filas donde ambas no coinciden y conviene mirarlas.    */
function esGranel(codigo, entradaCatalogo){
  const a = ART[codigo];
  const uom = a ? (a.uom||"").trim().toLowerCase() : "";
  if(uom==="kg")   return true;
  if(uom==="unid") return false;
  if(entradaCatalogo) return entradaCatalogo.tipo==="Granel";
  return null;                      /* no se puede determinar */
}

/* ¿El catálogo de lotes y SAP dicen lo mismo? */
function discrepanciaUnidad(codigo, entradaCatalogo){
  if(!entradaCatalogo || !ART[codigo]) return null;
  const uom = (ART[codigo].uom||"").trim().toLowerCase();
  if(uom!=="kg" && uom!=="unid") return null;
  const porUom = uom==="kg", porCat = entradaCatalogo.tipo==="Granel";
  return porUom===porCat ? null : {porUom, porCat};
}

/* La entrada del catálogo de lotes que corresponde a un código concreto */
function entradaCatalogo(lote, codigo){
  return buscarPorLote(lote).find(c=>c.codigo===codigo) ||
         CATALOGO.find(c=>c.codigo===codigo) || null;
}

/* ══════════════ Empaque: bolsas y etiquetas ══════════════
   Ninguno tiene lote corto, así que se buscan por nombre o por regla.      */

/* Las medidas van en el código con dos dígitos cada una: 6 x 8 → 0608.
   Prefijo BOL para bolsa común y BOLV para bolsa de vacío.                 */
function claveMedidas(texto){
  const m = /(\d{1,2})\s*[xX×]\s*(\d{1,2})/.exec(texto||"");
  if(!m) return null;
  return m[1].padStart(2,"0") + m[2].padStart(2,"0");
}

/* La 14x20 viene en dos versiones y se eligen por producto: la blanca es de
   las mezclas panaderas y la común, del resto. Es la única medida con esa
   distinción, así que va como regla aparte. */
function bolsaBlanca(codigoProducto){
  const fam = (/^[A-Z]{3}(\d{2})/.exec(codigoProducto||"")||[])[1];
  return ["12","13","27"].includes(fam);   /* mezclas panaderas */
}

function buscarBolsa(texto, conVacio, codigoProducto){
  const k = claveMedidas(texto);
  if(!k) return [];
  const exactas = ARTICULOS.filter(a =>
    a.activo && /^BOLV?/.test(a.codigo) && a.codigo.includes(k));

  /* Entre BOL1420 y BOL1420B decide el producto, no el orden del catálogo. */
  if(k === "1420"){
    const blanca = bolsaBlanca(codigoProducto);
    exactas.sort((a,b)=>{
      const ba = a.codigo.endsWith("B") ? 0 : 1;
      const bb = b.codigo.endsWith("B") ? 0 : 1;
      return blanca ? ba-bb : bb-ba;
    });
  }
  /* Con la selladora de vacío en uso, la BOLV va primero. */
  exactas.sort((a,b)=>{
    const va = a.codigo.startsWith("BOLV") ? 0 : 1;
    const vb = b.codigo.startsWith("BOLV") ? 0 : 1;
    return conVacio ? va-vb : vb-va;
  });
  if(exactas.length) return exactas;
  /* Sin coincidencia exacta: bolsas con el mismo ancho, por si el alto se leyó mal. */
  const ancho = k.slice(0,2);
  return ARTICULOS.filter(a => a.activo && /^BOLV?\d{4}/.test(a.codigo) &&
    a.codigo.replace(/^BOLV?/,"").slice(0,2) === ancho).slice(0,6);
}

/* Etiquetas:  E + marca + tamaño + 4 dígitos
     E              etiqueta
     T = Tiqueso · R = Real
     P = pequeña  · G = grande
   Los 4 dígitos son la familia (FF + "00"). En productos de peso fijo se usa
   la presentación completa (FF + PP). Se prueban las dos y gana la que exista. */
function codigosEtiqueta(codigoProducto, loteCorto){
  const m = /^([A-Z]{3})(\d{2})/.exec(codigoProducto||"");
  if(!m) return [];
  const marca = m[1]==="REA" ? "R" : "T";
  const ff = m[2];
  const pp = (loteCorto||"").length===4 ? loteCorto.slice(2,4) : null;
  const sufijos = [];
  if(pp) sufijos.push(ff+pp);      /* presentación, para peso fijo */
  sufijos.push(ff+"00");           /* familia */
  const salida = [];
  for(const tam of ["P","G"])
    for(const suf of sufijos){
      const c = "E"+marca+tam+suf;
      if(ART[c] && ART[c].activo && !salida.includes(c)) salida.push(c);
    }
  return salida;
}

function pareceBolsa(t){   return /bolsa|bols\b|^bol/i.test(t||""); }
function pareceEtiqueta(t){ return /etiq/i.test(t||""); }

/* ══════════════ Almacén por tipo de artículo ══════════════
   Los quesos y productos terminados van al 02. Todo el material de apoyo
   —empaque, bolsas, etiquetas, aditivos, desecante, almidón— va al 11.    */
const GRUPOS_ALMACEN_11 = ["ADITIVOS","EMPAQUE","PLANCHAS ETIQUETAS",
                           "MANO DE OBRA","MAQUINARIA","OTROS PROD Y SERV"];
const ALMACEN_INSUMOS = "11";

function almacenDe(codigo, almacenProducto){
  const a = ART[codigo];
  if(!a) return almacenProducto || "";
  const g = (a.grupo||"").toUpperCase();
  if(g.startsWith("ETIQUETA") || GRUPOS_ALMACEN_11.includes(g)) return ALMACEN_INSUMOS;
  return almacenProducto || "";
}

function esInsumo(codigo){ return almacenDe(codigo,"02") === ALMACEN_INSUMOS; }

/* ══════════════ Conversión de kg a unidades ══════════════
   La hoja tiene una sola columna "CANTIDAD (KG/UNIDADES)" y a veces anotan
   kilos de un artículo que en SAP se lleva por unidad. Ejemplo real:
   120 KG de MEZCLA PANADERA INDUSTRIAL 2 KG son 60 unidades.
   La equivalencia sale del catálogo por lote.                              */
function equivalenciaKg(codigo){
  const c = CATALOGO.find(x => x.codigo === codigo);
  return c && c.equivKg ? c.equivKg : null;
}

function conversionComponente(c){
  const a = ART[c.codigo];
  const cant = parseFloat(c.cantidad);
  if(!a || isNaN(cant)) return null;
  const porUnidad = (a.uom||"").trim().toLowerCase() === "unid";
  const escritoEnKg = (c.unidad||"").trim().toLowerCase() === "kg";
  if(!porUnidad || !escritoEnKg) return null;
  const eq = equivalenciaKg(c.codigo);
  if(!eq) return {falta:true};
  const unidades = cant / eq;
  return {kg:cant, equiv:eq, unidades:+unidades.toFixed(4),
          exacta: Math.abs(unidades - Math.round(unidades)) < 0.001};
}

/* La cantidad que se manda a SAP, ya convertida si hacía falta */
function cantidadComponente(c){
  const conv = conversionComponente(c);
  return (conv && !conv.falta) ? String(conv.unidades) : (c.cantidad || "");
}

/* Lookup de lote tolerante: los lotes de componentes traen guiones y sufijos
   (237125188-1) y no cumplen el formato de 10 caracteres del producto.
   Para encontrar el artículo alcanza con los primeros 4 caracteres.        */
function buscarPorLoteCorto(lote){
  const s = (lote||"").replace(/\s/g,"").toUpperCase();
  if(s.length < 4) return [];
  return POR_LOTE[s.slice(0,4)] || [];
}

/* ══════════════ La marca define el prefijo del código ══════════════
   Un mismo lote corto puede existir en varias marcas: 0550 es TIQ0550 con
   marca Tiqueso y REA0550 con marca Real. El catálogo por lote solo guarda
   una de las dos, así que hay que resolver con la marca del encabezado.   */
const PREFIJO_POR_MARCA = [
  [/^t[ií]?q/i,        "TIQ"],
  [/^rea/i,            "REA"],
  [/casa\s*real/i,     "CSR"],
  [/american|^ams/i,   "AMS"],
];

function prefijoDeMarca(marca){
  const m = norm(marca).trim();
  if(!m) return null;
  if(/CASA\s*REAL/.test(m)) return "CSR";
  for(const [re,pre] of PREFIJO_POR_MARCA) if(re.test(m)) return pre;
  return null;
}

/* El código de ese lote corto en la marca indicada, si existe y está activo */
function codigoPorMarca(loteCorto, marca){
  const pre = prefijoDeMarca(marca);
  const corto = (loteCorto||"").slice(0,4);
  if(!pre || corto.length!==4) return null;

  /* El catálogo manda sobre la construcción por prefijo. Pegar la marca al
     lote corto acierta casi siempre, pero no cuando el número del lote coincide
     con el de otro artículo: el lote 3321 es TIQ3300 —Tipo Mozzarella Block—,
     y armarlo a mano daba TIQ3321, que existe y es activo, así que pasaba por
     bueno. Se busca primero entre los artículos que ese lote corto tiene
     asignados de verdad. */
  const delCatalogo = (POR_LOTE[corto.toUpperCase()] || [])
    .map(e => e.codigo)
    .filter(c => ART[c] && ART[c].activo);
  const conMarca = delCatalogo.filter(c => c.startsWith(pre));
  if(conMarca.length){
    /* Si el mismo lote corto tiene varios artículos, gana el block —el que
       termina en 00—: el lote 3321 es TIQ3300 y el 2321 es TIQ2300. */
    return conMarca.find(c => /00$/.test(c)) || conMarca[0];
  }

  const c = pre + corto;
  return (ART[c] && ART[c].activo) ? c : null;
}

/* De un código a la marca que le corresponde, para poder corregir el campo
   en vez del código. */
const MARCA_DE_PREFIJO = {TIQ:"Tiqueso", REA:"Real", CSR:"Casa Real",
                          AMS:"American Slices"};
function marcaDeCodigo(codigo){
  const m = /^([A-Z]{3})/.exec(codigo || "");
  return m ? (MARCA_DE_PREFIJO[m[1]] || null) : null;
}

/* ¿El código elegido contradice la marca escrita en la hoja? */
function chocaConMarca(codigo, loteCorto, marca){
  const pre = prefijoDeMarca(marca);
  if(!pre || !codigo || codigo.startsWith(pre)) return null;
  const alterno = codigoPorMarca(loteCorto, marca);
  /* Se informa igual aunque no exista el código alterno: puede que lo
     equivocado sea la marca escrita, no el código. */
  return {esperado:pre, alterno, marcaDelCodigo: marcaDeCodigo(codigo)};
}

/* ══════════════ Deshidratado ══════════════
   El queso fresco entra a un cajón de sal y se deja varios días. Pierde peso,
   así que la cantidad planificada de la orden no es lo que entró sino lo que
   se espera que salga.

   Merma por tipo de queso que se deshidrata:
     Semiduro (TIQ0100)                       20 %
     Fresco (TIQ2500) y Turrialba (TIQ0200)   30 %

   El cajón donde se guarda va al campo U_TIQ_CAJ de SAP, que solo acepta
   estos valores.                                                           */
const CAJONES = ["CAJON 1","CAJON 2","CAJON 3","CAJON 4","ESTAÑON"];
const CAMPO_CAJON_DEFECTO = "U_TIQ_CAJ";

const MERMA_DESHIDRATADO = {
  "TIQ0100": 0.20,
  "TIQ0200": 0.30,
  "TIQ2500": 0.30
};

function mermaDeshidratado(codigo){
  if(MERMA_DESHIDRATADO[codigo] !== undefined) return MERMA_DESHIDRATADO[codigo];
  /* Otras presentaciones de la misma familia siguen la regla de su block */
  const m = /^TIQ(\d{2})/.exec(codigo||"");
  if(!m) return null;
  const block = "TIQ" + m[1] + "00";
  return MERMA_DESHIDRATADO[block] !== undefined ? MERMA_DESHIDRATADO[block] : null;
}

/* Cuánto se espera que salga. Se calcula componente por componente, para que
   una mezcla de quesos con mermas distintas dé el número correcto.          */
function planificadaDeshidratado(componentes){
  let entra = 0, sale = 0, sinRegla = [], aparte = [];
  (componentes||[]).forEach(c => {
    if(c.excluido) return;
    const kg = parseFloat(c.cantidad);
    if(isNaN(kg)) return;

    /* La sal y los demás aditivos entran al cajón pero no son lo que se
       deshidrata: la proyección del 20 o 30% se hace solo sobre el queso.
       Contarlos inflaba la cantidad planificada, porque además salían sin
       merma alguna. */
    if(esInsumo(c.codigo) || (ART[c.codigo] && ART[c.codigo].grupo === "ADITIVOS")){
      aparte.push(c.codigo || c.material || "sin código");
      return;
    }

    const m = mermaDeshidratado(c.codigo);
    entra += kg;
    if(m === null){ sinRegla.push(c.codigo || c.material || "sin código"); sale += kg; }
    else sale += kg * (1 - m);
  });
  if(!entra) return null;
  return {entra:+entra.toFixed(3), sale:+sale.toFixed(2),
          merma:+(1 - sale/entra).toFixed(4), sinRegla, aparte};
}

/* ══════════════ Colaboradores y horarios ══════════════ */

/* Para reconocerlos escritos a mano, igual que a los colaboradores. */
const PROVEEDORES = PROVEEDORES_SAP.map(p => p[0]);
const CODIGO_PROVEEDOR = {};
PROVEEDORES_SAP.forEach(([n,c]) => { CODIGO_PROVEEDOR[n] = c; });

function proveedorCanonico(txt){
  const t = norm(txt).replace(/[^A-Z ]/g," ").replace(/\s+/g," ").trim();
  if(!t) return null;
  for(const p of PROVEEDORES){
    const n = norm(p).replace(/[^A-Z ]/g," ").replace(/\s+/g," ").trim();
    if(n === t) return p;
    /* Sin espacios: atrapa "LACTEOSYMAS", "LACTEOS YMAS", "LACTEOSY MAS" y
       también "LACTEOSYUMAS", que es como suele leerse "Lácteos y Más". */
    const pegado = x => x.replace(/ /g,"").replace(/YU/g,"Y");
    if(pegado(n) === pegado(t)) return p;
  }
  return null;
}

/* La planta cambia: entra gente, sale gente. La lista se edita desde la
   configuración y se guarda en el navegador; esta es la de fábrica, que sirve
   de punto de partida y para poder volver atrás.

   Es un array que se modifica en el lugar (splice) en vez de reasignarse,
   porque las funciones que lo usan lo capturan por referencia. */
const COLABORADORES_FABRICA = ["Luisa M","Ivania S","Jose A","Rabeca","Shirley",
  "Santiago","Hector","Perla","Mario","Blanca","Ervin","Tania"];
const COLABORADORES = [...COLABORADORES_FABRICA];
const LS_COLAB = "tiq_colaboradores";

function ponerColaboradores(lista){
  COLABORADORES.splice(0, COLABORADORES.length, ...lista);
}

/* Reconoce un nombre escrito a mano contra la lista conocida, tolerando
   acentos, mayúsculas y apellidos abreviados. Devuelve el nombre canónico
   o null si no se parece a ninguno. */
function nombreCanonico(txt){ const r = resolverNombre(txt); return r && r.nombre; }

/* Distancia de edición, para ordenar candidatos: "IRVIN" está a 1 de "ERVIN"
   y a 4 de "PERLA", así que el primero se ofrece antes. */
function distanciaEdicion(a, b){
  const m = a.length, n = b.length;
  let fila = Array.from({length:n+1}, (_,j) => j);
  for(let i = 1; i <= m; i++){
    let ant = fila[0]; fila[0] = i;
    for(let j = 1; j <= n; j++){
      const tmp = fila[j];
      fila[j] = Math.min(fila[j] + 1, fila[j-1] + 1,
                         ant + (a[i-1] === b[j-1] ? 0 : 1));
      ant = tmp;
    }
  }
  return fila[n];
}

/* Los nombres de la lista más parecidos a lo leído, del más cercano al menos.
   Sirve para preguntar en vez de adivinar. */
function sugerirNombres(txt, cuantos){
  const t = norm(txt).replace(/[^A-Z ]/g," ").trim().split(/\s+/)[0] || "";
  if(!t) return [];
  return COLABORADORES
    .map(c => {
      const pn = norm(c).split(/\s+/)[0];
      /* Un apócope como "Santi" por "Santiago" está a 3 de distancia pero es
         el mismo nombre empezado: se acepta como prefijo. */
      const prefijo = t.length >= 4 && pn.startsWith(t);
      return {nombre:c, d: prefijo ? 0.5 : distanciaEdicion(t, pn)};
    })
    .filter(x => x.d <= Math.max(2, Math.floor(t.length/3)))
    .sort((a,b) => a.d - b.d)
    .slice(0, cuantos || 3)
    .map(x => x.nombre);
}

/* Devuelve {nombre, aproximado} para poder avisar cuando el calce fue por
   parecido y no exacto: si alguna vez entra una "Maria" real, no debe quedar
   convertida en "Mario" sin que nadie lo note. */
function resolverNombre(txt){
  const t = norm(txt).replace(/[^A-Z ]/g," ").trim();
  if(!t) return null;
  for(const c of COLABORADORES) if(norm(c) === t) return {nombre:c, aproximado:false};
  /* Por el primer nombre: "Jose" encuentra "Jose A" */
  const pila = t.split(/\s+/)[0];
  const porNombre = COLABORADORES.filter(c => norm(c).split(/\s+/)[0] === pila);
  if(porNombre.length === 1) return {nombre:porNombre[0], aproximado:false};

  /* A una letra de distancia: en manuscrito "Rebeca" y "Rabeca" son la misma
     persona, y una vocal mal leída no debería convertirla en desconocida. */
  const cerca = COLABORADORES.filter(c =>
    distancia1(pila, norm(c).split(/\s+/)[0]));
  if(cerca.length === 1) return {nombre:cerca[0], aproximado:true};
  return null;
}

/* ¿Difieren en a lo sumo una letra —cambiada, agregada o quitada? */
function distancia1(a, b){
  if(a === b) return true;
  if(Math.abs(a.length - b.length) > 1) return false;
  if(a.length === b.length){
    let dif = 0;
    for(let i = 0; i < a.length; i++) if(a[i] !== b[i] && ++dif > 1) return false;
    return dif === 1;
  }
  const corto = a.length < b.length ? a : b, largo = a.length < b.length ? b : a;
  for(let i = 0, j = 0, saltos = 0; j < largo.length; j++){
    if(corto[i] === largo[j]) i++;
    else if(++saltos > 1) return false;
  }
  return true;
}

function colaboradoresDe(txt){
  /* Se quitan los repetidos: "Shirley, Tania, Shirley" es una sola Shirley.
     Si no, el reporte le cuenta el doble de horas. */
  const vistos = new Set();
  return (txt||"").split(/[,;/]| y /i).map(x=>x.trim()).filter(Boolean)
    .map(x => { const r = resolverNombre(x);
      return {leido:x, canonico:r && r.nombre, aproximado:!!(r && r.aproximado)}; })
    .filter(g => { const k = g.canonico || norm(g.leido);
      if(vistos.has(k)) return false; vistos.add(k); return true; });
}

/* Deja la lista lista para guardar: cada persona una sola vez y con el nombre
   de la lista. En las hojas de fraccionado la misma persona firma en varias
   casillas —fraccionado, empaque, empaque 2 y registro— y terminaba contada
   dos o tres veces. */
function nombresLimpios(txt){
  return colaboradoresDe(txt).map(g => g.canonico || g.leido).join(", ");
}

/* Saca un rango de horas de una frase suelta: "de 01:00 pm a 03:25 pm".
   La tarde se escribe con pm o con la hora corrida, y las dos formas aparecen
   en las boletas. */
function horasEnTexto(txt){
  const t = (txt||"").toLowerCase();
  const re = /(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?/g;
  const halladas = [];
  let m;
  while((m = re.exec(t)) !== null){
    let h = +m[1];
    const min = m[2] ? +m[2] : 0;
    const suf = (m[3]||"").replace(/[.\s]/g,"");
    if(h > 23 || min > 59) continue;
    /* Sin minutos ni sufijo puede ser una cantidad, no una hora. */
    if(!m[2] && !suf) continue;
    if(suf.startsWith("p") && h < 12) h += 12;
    if(suf.startsWith("a") && h === 12) h = 0;
    halladas.push(h*60 + min);
  }
  if(halladas.length < 2) return null;
  let [desde, hasta] = [halladas[0], halladas[1]];

  /* En la boleta la tarde se escribe sin pm: "de 7:00 a 3:25" son las 15:25,
     no las 3 de la madrugada. Se aplica la misma regla de la jornada que en
     los horarios del registro: lo que cae antes de las 6 es de la tarde. */
  if(desde < HORA_MIN) desde += 12*60;
  if(hasta < HORA_MIN) hasta += 12*60;
  if(hasta <= desde && hasta + 12*60 <= HORA_MAX) hasta += 12*60;

  return hasta > desde ? {desde, hasta} : null;
}

/* Busca nombres de la lista dentro de un texto suelto.

   En la boleta hay espacio para tres responsables, pero a veces trabajan
   cuatro y el cuarto termina anotado en OBSERVACIONES. Sin esto, esa persona
   no aparece en ningún registro y su jornada queda incompleta. */
function nombresEnTexto(txt){
  const palabras = (txt||"").split(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]+/).filter(x=>x.length>2);
  const encontrados = [];
  palabras.forEach(pal => {
    const r = resolverNombre(pal);
    /* Solo calces exactos: por parecido, "mesa" o "masa" caerían en algún
       nombre y ensuciarían la lista. */
    if(r && !r.aproximado && !encontrados.includes(r.nombre)) encontrados.push(r.nombre);
  });
  return encontrados;
}

/* Jornada usual: de 6 de la mañana a 6 de la tarde. Fuera de ahí casi siempre
   es una lectura equivocada, no un turno real. */
const HORA_MIN = 6*60, HORA_MAX = 18*60;

function minutosDe(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec((hhmm||"").trim());
  if(!m) return null;
  const h = +m[1], mi = +m[2];
  if(h>23 || mi>59) return null;
  return h*60 + mi;
}

const comoHora = min => String(Math.floor(min/60)).padStart(2,"0")+":"+
                        String(min%60).padStart(2,"0");

/* ══════════════ Duración por registro ══════════════
   Varios registros comparten un mismo tramo de trabajo: se empaca un mismo
   queso en 1 kg, 2 kg y 300 g con la misma gente y el mismo horario. El tiempo
   de ese tramo se reparte entre los registros que lo comparten.            */
function clave(o){
  const gente = colaboradoresDe(o.colaboradores)
    .map(g => g.canonico || norm(g.leido)).sort().join("+");
  return (o.horaInicio||"") + "→" + (o.horaFin||"") + "|" + gente;
}

function duraciones(ordenes){
  const grupos = {};
  (ordenes||[]).forEach(o => {
    if(!o.horaInicio || !o.horaFin) return;
    (grupos[clave(o)] = grupos[clave(o)] || []).push(o);
  });
  const salida = {};
  Object.values(grupos).forEach(g => {
    const ini = minutosDe(g[0].horaInicio), fin = minutosDe(g[0].horaFin);
    if(ini === null || fin === null) return;
    /* Un turno que cruza la medianoche no existe acá: se toma el mismo día. */
    const total = fin >= ini ? fin - ini : 0;
    g.forEach((o, i) => { salida[o.id] = {
      minutos: g.length ? +(total/g.length).toFixed(1) : total,
      totalTramo: total, comparten: g.length,
      /* Uno del grupo lleva el tramo completo en el detalle; los demás se
         marcan como incluidos. Repetir "23 min" en cada renglón invita a
         sumarlos, cuando el trabajo fue uno solo. El reparto se sigue usando
         para los kilos por hora, que ahí sí debe dividirse. */
      principal: i === 0,
      con: g.filter(x=>x.id!==o.id).map(x=>x.codigo||"sin código")
    }; });
  });
  return salida;
}

/* ══════════════ Resumen del día para gerencia ══════════════ */

const MOTIVOS_INCOMPLETO = [
  ["",           "—"],
  ["lote",       "Lote incompleto"],
  /* Distinto de incompleto: acá el lote está entero pero no corresponde —el
     número no existe, o es de otro producto—. Se corrige distinto, así que
     conviene que sea su propia categoría en el reporte. */
  ["loteMal",    "Lote incorrecto"],
  ["cantidad",   "Cantidad incompleta"],
  ["ambos",      "Lote y cantidad incompletos"]
];

/* Los respaldos viejos guardaban true/false; se leen como "sin especificar". */
function motivoIncompleto(v){
  if(!v) return null;
  if(v === true) return "Dato incompleto";
  const m = MOTIVOS_INCOMPLETO.find(x => x[0] === v);
  return m ? m[1] : "Dato incompleto";
}

/* Kilos de un registro, sea que se mida en kg o en unidades. */
function kilosDe(o){
  const kg = parseFloat(o.cantidadKg);
  if(!isNaN(kg) && kg > 0) return kg;
  /* En el deshidratado la cantidad sale de la merma, no de una casilla */
  if(o.tipo === "deshidratado"){
    const m = planificadaDeshidratado(o.componentes);
    if(m) return m.sale;
  }
  const un = parseFloat(o.unidades);
  const eq = equivalenciaKg(o.codigo);
  if(!isNaN(un) && eq) return +(un * eq).toFixed(2);
  return 0;
}

/* Agrupación por proceso, que es como se lee la producción del día. */
/* Lo que sale de marmita se reporta aparte, aunque en la boleta figure como
   un block más. */
const MARMITA = ["TIQ3300","TIQ2421"];
function esMarmita(codigo){ return MARMITA.includes(codigo); }
function categoriaProceso(o){
  /* Un block sale de producir el queso desde cero, que es lo mismo que la
     marmita: se reportan juntos porque son el mismo proceso. */
  if(esMarmita(o.codigo) || o.tipo === "block") return "marmita";
  return o.tipo;
}

const PROCESOS = [
  ["marmita",      "Producción / marmita"],
  ["rallado",      "Rallados"],
  ["fraccionado",  "Fraccionados"],
  ["recortes",     "Recortes"],
  ["deshidratado", "Deshidratado · entradas a cajón"],
  ["salida",       "Deshidratado · salidas de cajón"],
  ["rebanado",     "Rebanados"],

  ["envasado",     "Envasados"],
];

/* Trabajo del día que no produce una orden: una descarga de proveedor, un
   lavado, una capacitación. No va a SAP, pero sí consume horas de la gente y
   sin él el reporte muestra a alguien con medio día sin explicar. */
function ACTIVIDAD_VACIA(){
  return {id:uid(), descripcion:"", horaInicio:"", horaFin:"", colaboradores:""};
}

function minutosActividad(a){
  const i = minutosDe(a.horaInicio), f = minutosDe(a.horaFin);
  return (i === null || f === null || f < i) ? 0 : f - i;
}

function resumenDia(ordenes, fecha, actividades, historico){
  const dur = duraciones(ordenes);
  const porProceso = {}, porFamilia = {}, porPersona = {};
  let kgTotal = 0;

  ordenes.forEach(o => {
    const kg = kilosDe(o);
    kgTotal += kg;

    const cat = categoriaProceso(o);
    const p = porProceso[cat] = porProceso[cat] || {registros:0, kg:0};
    p.registros++; p.kg += kg;

    const fam = familiaDe(o.codigo) || "Sin familia";
    const f = porFamilia[fam] = porFamilia[fam] || {registros:0, kg:0, codigos:{}};
    f.registros++; f.kg += kg;
    if(o.codigo) f.codigos[o.codigo] = (f.codigos[o.codigo]||0) + kg;

    colaboradoresDe(o.colaboradores).forEach(g => {
      const n = g.canonico || g.leido;
      const q = porPersona[n] = porPersona[n] ||
        {registros:0, minutos:0, kg:0, productos:{}, tramos:[]};
      /* Se guarda el tramo, no los minutos: dos registros que se solapan en el
         reloj no son el doble de tiempo. Sumarlos daba jornadas de 13 horas a
         gente que entró a las 6 y salió a las 3. */
      const ini = minutosDe(o.horaInicio), fin = minutosDe(o.horaFin);
      if(ini !== null && fin !== null && fin >= ini) q.tramos.push([ini, fin]);
      q.registros++; q.kg += kg;
      if(o.codigo){
        q.productos[o.codigo] = true;
        /* Código con el registro entre paréntesis: es lo más corto que dice
           exactamente qué se hizo y en cuál boleta buscarlo. La familia va
           debajo, que es como la gente lo nombra. */
        q.trabajos = q.trabajos || {};
        (q.trabajos[o.codigo] = q.trabajos[o.codigo] || new Set())
          .add(o.registro || "—");
        (q.regs = q.regs || new Set()).add(o.registro || "—");
        const f = familiaDe(o.codigo);
        if(f) (q.familias = q.familias || {})[f] = true;
      }
    });
  });

  /* Lo que hay que revisar, en filas comparables para poder leerlo de un
     vistazo. Quedan fuera dos cosas que antes se colaban: lo copiado de la
     boleta —es contexto, no un pendiente— y los avisos internos de la app,
     como un componente excluido del archivo.

     Lo que sí entra es el comentario que escribe quien digita: eso se puso a
     propósito para que alguien lo lea. */
  const notas = [];
  ordenes.forEach(o => {
    const fila = extra => ({registro:o.registro || "—", codigo:o.codigo || "—",
                            lote:o.lote || "", ...extra});

    (o.componentes||[]).filter(c => c.incompleto).forEach(c => {
      const cant = (c.cantidad === "" || c.cantidad == null)
        ? "sin cantidad" : c.cantidad + (c.unidad ? " " + c.unidad : "");
      notas.push(fila({tipo:"lote",
        motivo: motivoIncompleto(c.incompleto),
        detalle: (c.codigo || c.material || "sin identificar") +
                 (c.lote ? " · lote " + c.lote : "") + " · " + cant}));
    });

    /* Un horario a medias sale solo en la tabla de revisión: sin él no se
       puede ubicar el registro en la jornada ni calcular cuánto duró, y en el
       papel es una casilla en blanco que nadie nota. */
    const hI = minutosDe(o.horaInicio), hF = minutosDe(o.horaFin);
    if(hI === null || hF === null || hF < hI){
      const detalle =
        (!o.horaInicio && !o.horaFin) ? "La boleta no trae hora de inicio ni final"
      : (hI !== null && !o.horaFin)   ? "Falta la hora final; solo se anotó " + o.horaInicio
      : (hF !== null && !o.horaInicio) ? "Falta la hora de inicio; solo se anotó " + o.horaFin
      : (hI !== null && hF !== null)  ? "Termina antes de empezar: " + o.horaInicio + " a " + o.horaFin
      : "No se entiende lo escrito: " + (o.horaInicio || "?") + " a " + (o.horaFin || "?");
      notas.push(fila({tipo:"horario", motivo:"Horario sin llenar", detalle}));
    }

    if(o.fechaOriginal && o.fechaOriginal !== o.fechaElaboracion)
      notas.push(fila({tipo:"corregido", motivo:"Fecha corregida",
        detalle:"La boleta decía " + o.fechaOriginal + " y se pasó a " +
                o.fechaElaboracion + " para que coincida con el día real de producción"}));

    if(o.marcaOriginal && o.marcaOriginal !== o.marca)
      notas.push(fila({tipo:"corregido", motivo:"Marca corregida",
        detalle:"La boleta decía " + o.marcaOriginal + " y la etiqueta es " +
                o.marca + " (" + (o.codigo||"sin código") + ")"}));

    if(o.correccion)
      notas.push(fila({tipo:"corregido", motivo:"Orden rehecha",
        detalle:"Se había subido como " + o.correccion.codigo +
                (o.correccion.docEntry ? " (DocEntry " + o.correccion.docEntry + ")" : "") +
                " y se rehízo como " + (o.codigo||"—") +
                (o.correccion.recibida ? ". La vieja ya tenía recepción: revertirla antes de cancelar"
                 : o.correccion.revertida ? ". La recepción de la vieja se canceló en SAP"
                 : ". La vieja se cancela en SAP")}));

    if(o.enEspera)
      notas.push(fila({tipo:"espera", motivo:"En espera",
        detalle:(o.motivoEspera||"sin motivo anotado") +
                " — no se subió a SAP con el resto del día"}));

    if((o.observaciones||"").trim())
      notas.push(fila({tipo:"comentario", motivo:"Comentario",
                       detalle:o.observaciones.trim()}));

    try{
      validarOrden(o, ordenes, fecha).forEach(a => {
        if(/contra .* de materia prima|difieren|inactiv|no da entero|de sí mismo|suma .* pero este registro/i.test(a.msg))
          notas.push(fila({tipo:"cuenta", motivo:"Cuenta que no cuadra", detalle:a.msg}));
      });
    }catch(e){}
  });

  /* Un consecutivo salteado casi siempre es una hoja que quedó sin transcribir.
     Va como fila del día, sin registro propio, porque justamente lo que falta
     es el registro. */
  const huecos = huecosDeRegistros(ordenes);
  if(huecos.faltan.length)
    notas.push({registro:"—", codigo:"—", lote:"", tipo:"faltante",
      motivo:"Registro faltante",
      detalle:"No aparecen los consecutivos " + huecos.faltan.join(", ") +
              ". El día va del 1 al " + huecos.hasta +
              ": puede que esas hojas no se hayan transcrito."});

  let pendientes = 0;
  try{ pendientes = ordenes.filter(o => hayErrores(validarOrden(o, ordenes, fecha))).length; }
  catch(e){}

  /* Las actividades suman a la persona, aparte de lo que hizo en línea. */
  (actividades||[]).forEach(a => {
    const min = minutosActividad(a);
    colaboradoresDe(a.colaboradores).forEach(g => {
      const n = g.canonico || g.leido;
      const q = porPersona[n] = porPersona[n] ||
        {registros:0, minutos:0, kg:0, productos:{}, fueraDeLinea:0};
      q.minutos += min; q.fueraDeLinea = (q.fueraDeLinea||0) + min;
    });
  });

  const orden = (obj, mapa) => Object.entries(obj)
    .map(([k,v]) => ({clave:k, nombre: mapa ? (mapa[k]||k) : k, ...v}))
    .sort((a,b) => b.kg - a.kg);

  const nombreProceso = Object.fromEntries(PROCESOS);
  /* Los apoyos: alguien que entró un rato a ayudar, con su propio horario. Los
     kilos se reparten en proporción al tiempo que estuvo, porque atribuirle la
     producción entera inflaría sus kilos por hora frente a quien estuvo todo
     el turno. */
  ordenes.forEach(o => {
    const ini = minutosDe(o.horaInicio), fin = minutosDe(o.horaFin);
    const largo = (ini !== null && fin !== null && fin > ini) ? fin - ini : null;
    const kg = kilosDe(o);
    (o.apoyos||[]).forEach(ap => {
      const d = minutosDe(ap.desde), h = minutosDe(ap.hasta);
      if(!ap.nombre || d === null || h === null || h <= d) return;
      const q = porPersona[ap.nombre] = porPersona[ap.nombre] ||
        {registros:0, minutos:0, kg:0, productos:{}, tramos:[]};
      q.tramos.push([d, h]);
      q.registros++;
      q.kg += largo ? kg * Math.min(1, (h - d) / largo) : 0;
      if(o.codigo){
        q.productos[o.codigo] = true;
        (q.regs = q.regs || new Set()).add(o.registro || "—");
        const fa = familiaDe(o.codigo);
        if(fa) (q.familias = q.familias || {})[fa] = true;
      }
    });
  });

  /* El tiempo real de cada persona: se unen los tramos solapados y se suma lo
     que queda. Así una jornada nunca puede pasar de las horas del reloj. */
  Object.values(porPersona).forEach(q => {
    const unidos = [];
    (q.tramos||[]).slice().sort((a,b) => a[0]-b[0]).forEach(t => {
      const ult = unidos[unidos.length-1];
      if(ult && t[0] <= ult[1]) ult[1] = Math.max(ult[1], t[1]);
      else unidos.push([t[0], t[1]]);
    });
    q.minutos = unidos.reduce((s,t) => s + (t[1]-t[0]), 0);
    q.desde = unidos.length ? unidos[0][0] : null;
    q.hasta = unidos.length ? unidos[unidos.length-1][1] : null;
    q.minutosLinea = q.minutos;
    q.kgPorHora = q.minutos > 0 ? +(q.kg / (q.minutos/60)).toFixed(1) : null;
  });

  const porProceso2 = {};
  ordenes.forEach(o => {
    const cat = categoriaProceso(o);
    const p = porProceso2[cat] = porProceso2[cat] || {minutos:0, kg:0};
    p.minutos += dur[o.id] ? dur[o.id].minutos : 0;
    p.kg += kilosDe(o);
  });
  const lineas = Object.entries(porProceso2)
    .map(([k,v]) => ({clave:k, nombre:(Object.fromEntries(PROCESOS))[k]||k,
      minutos:+v.minutos.toFixed(0), kg:+v.kg.toFixed(2),
      kgPorHora: v.minutos > 0 ? +(v.kg/(v.minutos/60)).toFixed(1) : null}))
    .filter(x => x.minutos > 0)
    .sort((a,b) => (b.kgPorHora||0) - (a.kgPorHora||0));

  const acts = (actividades||[])
    .filter(a => a.descripcion || a.colaboradores || a.horaInicio)
    .map(a => ({...a, minutos: minutosActividad(a),
                gente: colaboradoresDe(a.colaboradores).map(g => g.canonico || g.leido)}));

  return {
    fecha,
    lineas,
    rendimientos: rendimiento(ordenes),
    transformacion: analisisTransformacion(ordenes, dur, historico),
    consumos: consumo(ordenes),
    linea: lineaDelDia(ordenes, actividades),
    actividades: acts,
    minutosFueraDeLinea: acts.reduce((t,a) => t + a.minutos * (a.gente.length||1), 0),
    registros: ordenes.length,
    kgTotal: +kgTotal.toFixed(2),
    procesos: orden(porProceso, nombreProceso),
    familias: orden(porFamilia),
    notas, pendientes,
    personas: Object.entries(porPersona)
      .map(([n,v]) => ({nombre:n, ...v, productos:Object.keys(v.productos),
                        familias:Object.keys(v.familias||{}),
                        trabajos:Object.entries(v.trabajos||{})
                          .map(([c,regs]) => c + " (" + [...regs].join(", ") + ")"),
                        registrosEnQue:[...(v.regs||[])]
                          .sort((a,b) => (parseInt(a,10)||0) - (parseInt(b,10)||0))}))
      .sort((a,b) => b.minutos - a.minutos),
    duraciones: dur
  };
}

const comoHoras = min => {
  const h = Math.floor(min/60), m = Math.round(min%60);
  return h ? h + " h " + (m ? m + " min" : "") : m + " min";
};

/* ══════════════ Rendimiento: qué entró y qué salió ══════════════
   Un fraccionado y sus recortes son el mismo trabajo: entra un block y sale
   producto empacado más el excedente de cortar. El porcentaje de recorte es
   la medida de cuánto se aprovecha, y varía mucho entre registros del mismo
   día — 22.7% contra 13.9% en la misma jornada. Sin esto, nadie lo ve.     */
function rendimiento(ordenes){
  const grupos = new Map();
  (ordenes||[]).forEach(o => {
    const k = o.hoja ? o.hoja + "·" + o.pareja : o.id;
    if(!grupos.has(k)) grupos.set(k, {productos:[], recortes:[]});
    (o.tipo === "recortes" ? grupos.get(k).recortes : grupos.get(k).productos).push(o);
  });

  const filas = [];
  grupos.forEach(g => {
    if(!g.productos.length) return;
    const principal = g.productos[0];
    /* Solo el fraccionado genera recortes. Un rallado o un envasado saldría
       siempre en 0% y no dice nada: es ruido en la tabla. */
    if(principal.tipo !== "fraccionado" && !g.recortes.length) return;

    /* La materia prima puede venir declarada en la hoja o deducirse de los
       componentes de queso a granel, que es como se anota renglón por renglón. */
    const porComponentes = g.productos.reduce((t,o) =>
      t + (o.componentes||[]).filter(c => c.codigo && ART[c.codigo] && !c.excluido &&
             !esInsumo(c.codigo) && ART[c.codigo].clase === "block" &&
             (c.unidad||"").toLowerCase() !== "unid")
          .reduce((u,c) => u + (parseFloat(c.cantidad)||0), 0), 0);
    const declarada = parseFloat(principal.mpKg);
    const kgRecortes = g.recortes.reduce((t,o) => t + kilosDe(o), 0);
    const kgProducto = g.productos.reduce((t,o) => t + kilosDe(o), 0);
    const entrada = !isNaN(declarada) && declarada > 0
      ? declarada : (porComponentes || kgProducto + kgRecortes);
    if(!entrada) return;

    filas.push({
      registro: principal.registro, codigo: principal.codigo,
      familia: familiaDe(principal.codigo) || "Sin familia",
      productos: g.productos.map(o => o.codigo).filter(Boolean),
      entrada: +entrada.toFixed(2),
      producto: +kgProducto.toFixed(2),
      recortes: +kgRecortes.toFixed(2),
      pctRecortes: +(kgRecortes / entrada * 100).toFixed(1),
      aprovechado: +(kgProducto / entrada * 100).toFixed(1),
      /* Lo que no salió ni como producto ni como recorte: agua, mermas de
         corte, o simplemente una cuenta que no cierra. */
      sinExplicar: +(entrada - kgProducto - kgRecortes).toFixed(2)
    });
  });

  return filas.sort((a,b) => b.pctRecortes - a.pctRecortes);
}

/* ══════════════ Ahumado y deshidratado: cuánto se pierde ══════════════
   Son los dos procesos donde el producto cambia de peso: el ahumado pierde
   agua en el horno y el deshidratado en el cajón. Saber cuánto se pierde, y
   con qué materia prima, es lo que permite comparar entre corridas.        */
/* El ahumado que cambia de peso es este producto intermedio: entra semiduro
   y sale ahumado. Las demás presentaciones de la familia 05 son fraccionados
   del block ya ahumado y no pierden peso en el proceso. */
const PRODUCTOS_AHUMADO = ["TIQ0521"];

function proveedorDeComponente(c){
  if((c.proveedor||"").trim())
    return proveedorCanonico(c.proveedor) || c.proveedor.trim();
  /* Los dígitos 3-4 son el proveedor solo en los block: en un fraccionado esa
     misma posición es la presentación, y leerla como proveedor inventaría uno. */
  const a = ART[c.codigo];
  if(!a || !/00$/.test(c.codigo||"")) return "";
  const p = desglosarLote(c.lote);
  if(!p) return "";
  return PROVEEDOR_INTERNO[p.pp] || ("prov. " + p.pp);
}

/* Cuánto queso entró al cajón del que ahora se está sacando.

   Buscar solo por lote no alcanza: si el mismo día se llenan dos cajones con
   el mismo producto, el lote asignado sale igual y se elige el equivocado. El
   cajón es lo que identifica de dónde sale el queso, así que manda; entre
   varias entradas del mismo cajón se toma la más reciente anterior a la
   salida, que es la que todavía estaba adentro. */
function entradaDeCajon(salida, historico){
  const lista = historico || [];
  const cajon = (salida.cajon||"").trim();
  const antes = e => !salida.fechaElaboracion || e.fecha <= salida.fechaElaboracion;
  const reciente = xs => xs.slice().sort((a,b) => b.fecha.localeCompare(a.fecha))[0] || null;

  if(cajon){
    const mismoCajon = lista.filter(e => (e.cajon||"").trim() === cajon && antes(e));
    /* Si además coincide el lote, mejor todavía. */
    const conLote = mismoCajon.filter(e => e.lote === salida.lote);
    const hallada = reciente(conLote.length ? conLote : mismoCajon);
    if(hallada) return hallada;
  }
  /* Sin cajón anotado queda el lote como último recurso. */
  return reciente(lista.filter(e => e.lote === salida.lote && antes(e)));
}

function analisisTransformacion(ordenes, duraciones, historico){
  const filas = [];
  (ordenes||[]).forEach(o => {
    const esAhumado = PRODUCTOS_AHUMADO.includes(o.codigo);
    const esSalida  = o.tipo === "salida";
    /* La entrada al cajón queda fuera: lo que muestra ahí no es una merma
       medida sino la proyección del 20 o 30%, y comparar una estimación
       contra sí misma no dice nada. El dato real aparece semanas después, en
       la salida, que es cuando se sabe cuánto dio de verdad. */
    if(!esAhumado && !esSalida) return;
    const esEntrada = false;

    /* Solo el queso: los aditivos entran pero no se transforman. */
    const mp = (o.componentes||[]).filter(c => c.codigo && !c.excluido &&
      !esInsumo(c.codigo) && !(ART[c.codigo] && ART[c.codigo].grupo === "ADITIVOS"));
    const entro = mp.reduce((t,c) => t + (parseFloat(c.cantidad)||0), 0);

    /* La salida del cajón se compara contra lo que se anotó que entró: su
       orden es de semanas atrás y no está en el día. */
    /* Para una salida: lo escrito a mano manda, y si no hay nada se busca el
       lote entre las entradas de días anteriores. */
    const hist = esSalida ? entradaDeCajon(o, historico) : null;
    const entrada = esSalida
      ? (parseFloat(o.kgEntraronCajon) || (hist ? hist.kg : 0))
      : entro;
    const salio = esSalida ? totalSalida(o) : kilosDe(o);
    const d = duraciones && duraciones[o.id];

    filas.push({
      registro:o.registro || "—", codigo:o.codigo || "—",
      proceso: esAhumado ? "Ahumado" : esEntrada ? "Entrada a cajón" : "Salida de cajón",
      cajon:o.cajon || "",
      entrada:+entrada.toFixed(2), salio:+salio.toFixed(2),
      /* En una salida, lo que interesa no son los minutos que tomó sacarlo
         sino cuánto estuvo adentro: ahí es donde pierde el agua. */
      diasEnCajon: (esSalida && hist && o.fechaElaboracion)
        ? diasEntre(hist.fecha, o.fechaElaboracion) : null,
      desdeCajon: (esSalida && hist) ? hist.fecha : "",
      origen: esSalida ? (parseFloat(o.kgEntraronCajon) ? "anotado a mano"
                        : hist ? "entrada del " + hist.fecha +
                                 (hist.cajon ? " · " + hist.cajon : "") +
                                 " · reg. " + (hist.registro||"—")
                        : "") : "",
      merma: entrada > 0 ? +((entrada - salio) / entrada * 100).toFixed(1) : null,
      minutos: d ? d.totalTramo : null,
      horario: (o.horaInicio && o.horaFin) ? o.horaInicio + "-" + o.horaFin : "",
      /* Familia y proveedor van separados: en el reporte la familia es el
         dato principal y el proveedor su segunda línea. */
      familias: [...new Set((esSalida && hist ? hist.familias : [])
        .concat(mp.map(c => familiaDe(c.codigo) || c.codigo)))],
      proveedores: [...new Set((esSalida && hist ? hist.proveedores : [])
        .concat(mp.map(proveedorDeComponente)).filter(Boolean))]
    });
  });
  return filas;
}


/* ══════════════ Existencias por lote ══════════════
   Se carga el Excel que SAP exporta —"Inventario en stock por lote"— y se usa
   para entregar componentes solo contra lo que de verdad hay, descontando cada
   entrega de las siguientes.                                                */

const ALMACENES_NOMBRE = {
  "02":"Cámara A", "03":"Cámara B", "04":"Cámara C",
  "05":"Empaque y Transformación #1", "11":"Bodega de suministros",
  "14":"Venta despacho"
};
/* Donde se busca cada cosa: el queso en la cámara, el empaque en la línea y,
   si no aparece, en la bodega general. */
const ALMACENES_BUSQUEDA = {queso:["02"], empaque:["05","11"]};

/* Artículos que se anotan en la hoja pero no se entregan desde inventario: el
   agua sale de la tubería, no de una bodega, y no tiene lote que consumir. */
const SIN_ENTREGA = ["ADT0006"];

/* Lo que la gente escribe en la casilla de lote cuando no hay lote. */
function loteNoAplica(l){
  return /^(NO\s*APLICA|NOAPLICA|N\/?A|NINGUNO|SIN\s*LOTE|-+)$/i.test(String(l||"").trim());
}

function normalizarLote(l){
  return String(l||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}

/* Variantes por dígitos que se confunden al leer a mano. El 2 y el 7 son el
   caso frecuente —un 2 cerrado parece 7—, pero pasa lo mismo con otros pares.
   Se generan cambiando un solo dígito: dos errores en el mismo lote ya no es
   una lectura dudosa sino otro lote. */
const DIGITOS_PARECIDOS = [["2","7"],["1","7"],["0","8"],["5","6"],["3","8"],["1","4"],["9","4"]];

function variantesDeLote(lote){
  const base = normalizarLote(lote);
  const fuera = new Set([base]);
  for(let i = 0; i < base.length; i++){
    for(const [a,b] of DIGITOS_PARECIDOS){
      if(base[i] === a) fuera.add(base.slice(0,i) + b + base.slice(i+1));
      if(base[i] === b) fuera.add(base.slice(0,i) + a + base.slice(i+1));
    }
  }
  return [...fuera];
}

/* Busca el lote en las existencias, de lo más seguro a lo más dudoso. Devuelve
   también cómo se encontró, para que quien revisa sepa qué mirar. */
function buscarLote(inv, codigo, lote, almacenes){
  const filas = (inv && inv.porArticulo && inv.porArticulo[codigo]) || [];
  const enAlm = f => !almacenes || almacenes.includes(f.almacen);
  const norm = normalizarLote(lote);
  if(!norm) return null;

  const exacto = filas.filter(f => f.lote === lote && enAlm(f));
  if(exacto.length) return {filas:exacto, como:"exacto"};

  /* Mismo lote sin guiones ni espacios: la boleta escribe 237-125 y el sistema
     lo tiene como 237125. */
  const sinSignos = filas.filter(f => normalizarLote(f.lote) === norm && enAlm(f));
  if(sinSignos.length) return {filas:sinSignos, como:"sin guiones"};

  const vars = variantesDeLote(lote);
  const porDigito = filas.filter(f => vars.includes(normalizarLote(f.lote)) && enAlm(f));
  if(porDigito.length) return {filas:porDigito, como:"un dígito distinto"};

  /* Último recurso: un solo carácter distinto, en cualquier posición. Se probó
     con el lote corto —familia y proveedor— y no sirve: en un queso hay
     cientos de lotes que lo comparten. */
  const casi = filas.filter(f => {
    const o = normalizarLote(f.lote);
    if(o.length !== norm.length) return false;
    let dif = 0;
    for(let i = 0; i < o.length; i++) if(o[i] !== norm[i] && ++dif > 1) return false;
    return dif === 1;
  }).filter(enAlm);

  if(casi.length){
    /* Si hay varios candidatos no se elige por la app: cuál es el correcto lo
       sabe quien tiene la boleta. */
    const distintos = [...new Set(casi.map(f => f.lote))];
    return {filas:casi, como:"un carácter distinto",
            ambiguo: distintos.length > 1, candidatos: distintos};
  }
  return null;
}

/* Recorre los registros en orden de consecutivo y va restando. El mismo lote
   usado en cuatro órdenes no puede entregar cuatro veces lo que hay. */
function planEntrega(ordenes, inv){
  const saldo = {};   /* codigo|lote|almacen -> kg disponibles */
  const clave = (c,l,a) => c + "|" + l + "|" + a;
  Object.values((inv && inv.porArticulo) || {}).forEach(filas => {
    if(!Array.isArray(filas)) return;
    filas.forEach(f => {
      const k = clave(f.codigo, f.lote, f.almacen);
      saldo[k] = (saldo[k] || 0) + (parseFloat(f.cantidad) || 0);
    });
  });

  const lineas = [], omitidos = [];
  ordenes.slice().sort(porConsecutivo).forEach(o => {
    (o.componentes||[]).forEach(c => {
      if(!c || c.excluido || !c.codigo) return;
      /* Un renglón raro no puede tumbar la pantalla entera: se reporta como
         una línea con error y el resto del día sigue calculándose. */
      /* Ni el agua ni un renglón con "no aplica" en el lote tienen de dónde
         descontarse: se dejan fuera sin marcarlos como problema. */
      if(SIN_ENTREGA.includes(c.codigo) || loteNoAplica(c.lote)){
        omitidos.push({registro:o.registro||"—", codigo:c.codigo,
                       motivo: SIN_ENTREGA.includes(c.codigo) ? "no se entrega desde inventario"
                                                              : "sin lote por definición"});
        return;
      }
      try{
      const pedido = parseFloat(cantidadComponente(c));
      if(!pedido || isNaN(pedido)) return;
      /* La misma regla que decide el almacén en la orden: lo que va al 11 es
         insumo —empaque, etiquetas, aditivos— y el resto es queso. */
      const almacenes = esInsumo(c.codigo)
        ? ALMACENES_BUSQUEDA.empaque : ALMACENES_BUSQUEDA.queso;
      const hallado = buscarLote(inv, c.codigo, c.lote, almacenes);

      const base = {orden:o, comp:c, codigo:c.codigo, loteHoja:c.lote,
                    pedido, registro:o.registro||"—"};
      if(!hallado){ lineas.push({...base, estado:"sin lote", entregar:0, disponible:0}); return; }
      if(hallado.ambiguo){
        lineas.push({...base, estado:"lote ambiguo", como:hallado.como,
          candidatos:hallado.candidatos, entregar:0, disponible:0});
        return;
      }

      /* Entre varios lotes que calzan se toma el más viejo: es la regla de
         rotación y además suele ser el que está en la boleta. */
      const filas = hallado.filas.slice().sort((a,b) => String(a.admision).localeCompare(String(b.admision)));
      let falta = pedido;
      const usados = [];
      for(const f of filas){
        if(falta <= 0.0001) break;
        const k = clave(f.codigo,f.lote,f.almacen);
        const hay = saldo[k] || 0;
        if(hay <= 0) continue;
        const toma = Math.min(hay, falta);
        saldo[k] = +(hay - toma).toFixed(4);
        falta = +(falta - toma).toFixed(4);
        usados.push({lote:f.lote, almacen:f.almacen, cantidad:toma, quedaba:hay});
      }
      const entregado = +(pedido - falta).toFixed(4);
      lineas.push({...base, como:hallado.como, usados,
        entregar:entregado, falta:+falta.toFixed(4),
        disponible:filas.reduce((t,f) => t + (saldo[clave(f.codigo,f.lote,f.almacen)]||0), 0),
        estado: falta > 0.0001 ? (entregado > 0 ? "alcanza a medias" : "sin existencia")
              : hallado.como === "exacto" ? "listo" : "revisar el lote"});
      }catch(e){
        lineas.push({orden:o, comp:c, codigo:c.codigo||"—", loteHoja:c.lote||"",
          registro:o.registro||"—", pedido:c.cantidad||"", entregar:0, disponible:0,
          estado:"error", detalleError:String(e && e.message || e)});
      }
    });
  });
  return {lineas, saldo, omitidos};
}


/* ══════════════ Emisión de componentes ══════════════
   Se corre al final del día, cuando ya está todo transcrito: a veces hay que
   esperar la foto del pesaje de un proveedor. Por eso va aparte de los pasos
   de creación y recepción.                                                  */
const CAB_IGE1 = ["RecordKey","LineNum","BaseType","BaseEntry","BaseLine",
                  "ItemCode","Quantity","WarehouseCode"];

function cabOIGE(col1, col2){
  return ["RecordKey","DocDate","DocDueDate", col1 || "Comments", col2 || "JournalMemo"];
}

/* Un documento por orden, con una línea por lote consumido. La fecha es la de
   elaboración del registro, no la de hoy: la entrega pertenece al día que se
   produjo. */
function construirEmision(plan, fmt, col1, col2){
  const oige=[cabOIGE(col1,col2)], ige1=[CAB_IGE1], btnt=[CAB_BTNT];
  const porOrden = new Map();
  plan.lineas.filter(l => l.entregar > 0 && l.orden.docEntry).forEach(l => {
    if(!porOrden.has(l.orden.id)) porOrden.set(l.orden.id, {orden:l.orden, lineas:[]});
    porOrden.get(l.orden.id).lineas.push(l);
  });

  let rk = 0;
  porOrden.forEach(({orden:o, lineas}) => {
    rk++;
    const f = fechaDTW(o.fechaElaboracion, fmt);
    oige.push([rk, f, f, com1De(o), com2De(o)]);
    let ln = 0;
    lineas.forEach(l => l.usados.forEach(u => {
      ige1.push([rk, ln, 202, o.docEntry, "", l.codigo, u.cantidad, u.almacen]);
      btnt.push([rk, ln, "", ln, u.lote, "", "", "", "", "", "", u.cantidad]);
      ln++;
    }));
  });
  return {oige, ige1, btnt, ordenes:porOrden.size};
}

/* Lee el Excel de SAP. Solo se guardan los almacenes que se usan y las filas
   con existencia: el archivo completo son casi 50 mil renglones y no cabe en
   el navegador. */
function leerInventario(datos){
  const libro = XLSX.read(datos, {type:"array"});
  const hoja = libro.Sheets[libro.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(hoja, {defval:""});
  const usados = ["02","05","11"];
  const porArticulo = {};
  let leidas = 0, guardadas = 0;
  filas.forEach(f => {
    leidas++;
    const codigo = String(f["Número de artículo"]||"").trim();
    const almacen = String(f["Código de almacén"]||"").trim();
    const cantidad = parseFloat(f["Cantidad del Lote"]) || 0;
    if(!codigo || !usados.includes(almacen) || cantidad <= 0) return;
    (porArticulo[codigo] = porArticulo[codigo] || []).push({
      codigo, almacen, cantidad,
      lote: String(f["LOTE"]||"").trim(),
      admision: String(f["Fecha de admisión"]||""),
      vence: String(f["Fecha de vencimiento"]||"")
    });
    guardadas++;
  });
  return {porArticulo, leidas, guardadas, cuando:new Date().toISOString().slice(0,16).replace("T"," ")};
}

/* ══════════════ Consumo del día ══════════════
   Todo lo que se usó, junto por artículo. La materia prima sirve para la
   emisión; el empaque, para saber qué reponer.                             */
function consumo(ordenes){
  const por = new Map();
  (ordenes||[]).forEach(o => (o.componentes||[]).forEach(c => {
    if(!c.codigo || c.excluido) return;
    const cant = parseFloat(cantidadComponente(c)) || 0;
    if(!por.has(c.codigo))
      por.set(c.codigo, {codigo:c.codigo, cantidad:0, lotes:new Set(), registros:new Set(),
                         insumo:esInsumo(c.codigo),
                         uom: ART[c.codigo] ? ART[c.codigo].uom : "",
                         desc: ART[c.codigo] ? ART[c.codigo].desc : c.material});
    const x = por.get(c.codigo);
    x.cantidad += cant;
    if(c.lote) x.lotes.add(c.lote);
    if(o.registro) x.registros.add(o.registro);
  }));
  const filas = [...por.values()].map(x => ({...x,
    cantidad:+x.cantidad.toFixed(3),
    lotes:[...x.lotes], registros:[...x.registros]}));
  return {
    materiaPrima: filas.filter(x => !x.insumo).sort((a,b) => b.cantidad - a.cantidad),
    empaque:      filas.filter(x =>  x.insumo).sort((a,b) => b.cantidad - a.cantidad)
  };
}

/* ══════════════ El día tramo por tramo ══════════════
   Junta órdenes y actividades en una línea de tiempo y marca los huecos: los
   ratos de la jornada donde no hay nada registrado.                        */
function lineaDelDia(ordenes, actividades){
  const tramos = [], sinHorario = [];
  (ordenes||[]).forEach(o => {
    const i = minutosDe(o.horaInicio), f = minutosDe(o.horaFin);
    /* Una orden sin horario no se puede ubicar, y entonces el hueco que deja
       no es tiempo ocioso sino una casilla en blanco de la hoja. Hay que
       decirlo, o el reporte culpa a la planta de un error de anotación. */
    if(i === null || f === null || f < i){
      if(o.codigo || o.registro)
        sinHorario.push({registro:o.registro, codigo:o.codigo || "sin código",
          motivo: (!o.horaInicio && !o.horaFin) ? "sin horario anotado"
                : (!o.horaFin) ? "falta la hora final"
                : (!o.horaInicio) ? "falta la hora de inicio"
                : "el horario termina antes de empezar",
          gente: colaboradoresDe(o.colaboradores).map(g => g.canonico || g.leido)});
      return;
    }
    tramos.push({desde:i, hasta:f, tipo:"orden", que:o.codigo || "sin código",
                 detalle: ART[o.codigo] ? ART[o.codigo].desc : (o.producto||""),
                 registro:o.registro, nota:(o.observaciones||"").trim(),
                 gente: colaboradoresDe(o.colaboradores).map(g => g.canonico || g.leido)});
  });
  (actividades||[]).forEach(a => {
    const i = minutosDe(a.horaInicio), f = minutosDe(a.horaFin);
    if(i === null || f === null || f < i) return;
    tramos.push({desde:i, hasta:f, tipo:"actividad", que:a.descripcion || "Sin describir",
                 detalle:"", gente: colaboradoresDe(a.colaboradores).map(g => g.canonico || g.leido)});
  });
  tramos.sort((a,b) => a.desde - b.desde || a.hasta - b.hasta);

  /* Los huecos se miden sobre la unión de los tramos, no de a uno: dos
     registros en paralelo no dejan hueco entre ellos. */
  const union = [];
  tramos.forEach(t => {
    const ult = union[union.length-1];
    if(ult && t.desde <= ult.hasta) ult.hasta = Math.max(ult.hasta, t.hasta);
    else union.push({desde:t.desde, hasta:t.hasta});
  });

  const huecos = [];
  let cursor = HORA_MIN;
  union.forEach(u => {
    if(u.desde > cursor) huecos.push({desde:cursor, hasta:u.desde});
    cursor = Math.max(cursor, u.hasta);
  });
  if(cursor < HORA_MAX) huecos.push({desde:cursor, hasta:HORA_MAX});

  return {tramos, huecos, sinHorario,
          minutosCubiertos: union.reduce((t,u) => t + (u.hasta - u.desde), 0),
          minutosHuecos: huecos.reduce((t,h) => t + (h.hasta - h.desde), 0),
          primero: union.length ? union[0].desde : null,
          ultimo:  union.length ? union[union.length-1].hasta : null};
}

## EL UNO Y EL SIETE

En esta planta el 7 SIEMPRE lleva un palito cruzado en el medio. Un trazo
vertical sin cruzar es un 1, aunque tenga la banderita de arriba.

Esto importa mucho en las boletas que llenan Jose A e Ivania S, donde la
confusión es frecuente. Ante la duda entre 1 y 7, y sin el palito cruzado,
elegí 1 y anotalo en "dudas".

## DESAMBIGUACIÓN GUIADA

- Si leés un lote corto que NO está en el catálogo, pero cambiando UN dígito sí existe
  Y encaja con el producto escrito en la hoja, usá el que existe y anotalo en "dudas".
  Si no encaja con el producto, dejalo como lo leíste.
- Dígitos que se confunden en manuscrito: 2/9, 0/6, 3/8, 5/6, 4/9. Para el 1 y el 7,
  mirá si hay palito cruzado (ver arriba). Extremá el cuidado.
- El día juliano debe ser coherente con la fecha de elaboración escrita en la hoja.
  Usalos como contraverificación mutua; si no cuadran, anotá la duda.
- El peso neto y las unidades deben ser coherentes con la presentación
  (ej. 40 unidades de 500 G ≈ 20 kg). Si no cuadra, anotá la duda; no corrijas.

## FORMATO DE FECHA — REGLA CRÍTICA

Las fechas de la hoja están en formato LATINOAMERICANO: **DÍA / MES / AÑO**.
NO es mes/día/año. Ejemplos:
    3.8.26   → 3 de agosto de 2026   → "2026-08-03"
    12.5.26  → 12 de mayo de 2026    → "2026-05-12"
    2/8/26   → 2 de agosto de 2026   → "2026-08-02"
Se escriben con punto, barra o guion, indistintamente.

La fecha de elaboración NUNCA es futura: la boleta se llena el día que se
produjo o después. Si al leerla te da una fecha posterior a hoy, leíste mal un
dígito —08-08 por 05-08 es el error típico—: anotalo en "dudas".

Contraverificación obligatoria: el día juliano del lote (dígitos 7 a 9) debe
coincidir con esa fecha. Si al leer día/mes cuadra con el juliano, la lectura es
correcta. Si solo cuadra invirtiendo día y mes, casi seguro leíste mal un dígito:
anotalo en "dudas". Ejemplo real: lote 2950262151, juliano 215 = 3 de agosto de
2026, y la hoja dice 3.8.26. Cuadra.

## LOTES CUYO NÚMERO NO ES EL DEL ARTÍCULO

Casi siempre el código sale de pegar la marca al lote corto: lote 0550 con marca
Tiqueso es TIQ0550. Pero hay lotes cuyo número coincide con OTRO artículo y ahí
la regla falla. Los que importan:

    lote 3321  →  TIQ3300   TIPO MOZZARELLA BLOCK    (NO TIQ3321)
    lote 2321  →  TIQ2300   QUESO BAGACES BLOCK      (NO existe TIQ2321)
    lote 1421  →  TIQ1400   QUESO CHONTALEÑO BLOCK
    lote 2521  →  TIQ2521   QUESO FRESCO TIQUESO BLOCK

Cuando el lote termina en 21 y el artículo es un block, el código casi siempre
es el de la familia con 00 al final. Si dudás, dejá el código vacío y anotalo en
"dudas": el programa lo resuelve con el catálogo.

## BOLSAS Y ETIQUETAS — CÓMO SE CODIFICAN

**Bolsas.** Las medidas van con DOS dígitos cada una en el código:
    6 x 8   → 0608        9 x 14  → 0914        14 x 20 → 1420
Prefijo BOL para bolsa común y BOLV para bolsa de vacío. Si en EQUIPO UTILIZADO
aparece marcada la S. VACÍO, lo más probable es que sea BOLV.
Transcribí las dimensiones tal como estén escritas ("6 x 8") en "material";
el programa se encarga de armar el código.

Las bolsas SIEMPRE se cuentan por unidad, nunca en kilos, aunque el artículo en
SAP se lleve en kg: la hoja anota cuántas bolsas se usaron. Poné ese número tal
cual en "cantidad" y "unid" en la unidad. No conviertas nada.

El lote de una bolsa NO tiene el formato de diez dígitos del queso: suele ser
corto y con guion —"040-22", "319-23"—. Copialo tal cual, con el guion.

**La 14 x 20 tiene dos versiones.** La común, BOL1420, es la de los
fraccionados y rallados de menos de 1 kg. La blanca, BOL1420B, es la de las
mezclas panaderas. Si la hoja no aclara cuál, mirá el producto del bloque.

**Etiquetas.** El patrón es E + marca + tamaño + 4 dígitos:
    E   etiqueta
    T   Tiqueso   ·  R  Real
    P   pequeña   ·  G  grande

La marca de la etiqueta es la del PRODUCTO, no la de quien la fabrica: un
semiduro Tiqueso lleva ETP0100 y el mismo semiduro de marca Real lleva ERP0100.
Los 4 dígitos son la familia del producto con "00" al final. En productos de peso
fijo se usa la presentación completa.
    Semiduro fraccionado  → ETP0100
    Turrialba             → ETP0200
    Real semiduro         → ERP0100
Si no estás seguro del tamaño o de la variante, dejá "codigo" vacío y describí lo
que leíste en "material". El programa propone los códigos que existen.

## LA HOJA DE FRACCIONADOS: BLOQUES REPETIDOS

La hoja "ELABORACIÓN DE FRACCIONADOS" NO es un encabezado con una tabla larga.
Son BLOQUES INDEPENDIENTES apilados uno debajo del otro, normalmente dos por
página. Cada bloque es un producto distinto, con su propio encabezado.

**La hoja impresa SIEMPRE trae DOS bloques.** El de arriba arranca debajo del
logo; el de abajo empieza después de una línea negra gruesa que cruza la página,
y termina en el renglón de OBSERVACIONES. Los dos tienen exactamente las mismas
columnas, así que si ya leíste uno, el otro se lee igual.

EL ERROR MÁS FRECUENTE ES DEVOLVER SOLO EL BLOQUE DE ARRIBA. Antes de escribir
nada, mirá la mitad inferior de la imagen y decidí si tiene datos.

## PRIMERO INVENTARIÁ LA HOJA, DESPUÉS TRANSCRIBÍ

Antes de escribir un solo registro, llená el campo "inventario": un elemento por
bloque con datos, diciendo qué producto viste y si la columna RECORTES tiene algo.
Recién después armá "registros".

Esto no es opcional y no es un resumen: es la lista de lo que tenés que producir.
Cada elemento del inventario con "recortes": true obliga a DOS registros, y cada
uno con "recortes": false obliga a UNO. Al terminar, contá los registros y
comparalos contra el inventario. Si no coinciden, faltó algo: volvé a mirar.

    BOLSA 6x8 lote 101015, 50 utilizadas · ETIQUETA AS-50, 50 unidades
    HORA 9:30 a 9:55

  Bloque de abajo — FECHA 5.8.26 · PRODUCTO Ahumado · PRESENTACIÓN 500 · MARCA Real
    MATERIA PRIMA      lote 0521262151, 47.3 kg
    RECORTES           lote 0599262171, cantidad 5.7
    PRODUCTO TERMINADO etiqueta LOTE:0550262171 VENCE 04/09/2026, total 41.6 kg, 80 unidades
    BOLSA 7x9 lote 101016, 80 utilizadas · ETIQUETA AS-50, 80 unidades
    HORA 9:30 a 10:35

  Le corresponde:
    "inventario": [
      {"bloque":1,"producto":"Ahumado 250 Tiqueso","recortes":true},
      {"bloque":2,"producto":"Ahumado 500 Real","recortes":true}
    ]
    y CUATRO registros:
      bloque 1, tipo "fraccionado", TIQ0525, lote 0525262171, 13 kg, 50 unidades
      bloque 1, tipo "recortes",    TIQ0599R, lote 0599262171, 3.1 kg, sin unidades
      bloque 2, tipo "fraccionado", REA0550, lote 0550262171, 41.6 kg, 80 unidades
      bloque 2, tipo "recortes",    TIQ0599R, lote 0599262171, 5.7 kg, sin unidades

  Fijate que el bloque 2 usa REA porque la marca dice Real, y que los dos bloques
  comparten el mismo lote de recortes: aun así son DOS registros separados.

Cada bloque trae:

  Encabezado propio : FECHA · PRODUCTO · PRESENTACIÓN · MARCA · REVISADO POR
  Tabla propia, en tres grupos de columnas:
     MATERIA PRIMA      : LOTE | CANTIDAD (KG)
     RECORTES           : LOTE | CANTIDAD (KG) | CANTIDAD TOTAL (KG) | CÓDIGO ORDEN SAP
     PRODUCTO TERMINADO : LOTE | CANTIDAD (KG) | CANTIDAD TOTAL (KG) | UNIDADES TOTAL | CÓDIGO ORDEN SAP
  Sección propia    : BOLSA (LOTE | DIMENSIONES | UNIDADES UTILIZADAS | DESECHADAS)
                      ETIQUETA (LOTE | UNIDADES)
                      EQUIPO UTILIZADO (BALANZA | S. VACÍO)
                      RESPONSABLE FRACCIONADO · RESPONSABLE EMPAQUE · RESPONSABLE EMP. 2 Y REG.
                      HORA INICIO | HORA FINAL

Lo ÚNICO compartido por toda la hoja es el consecutivo escrito a mano arriba a
la izquierda. La fecha, el horario y los responsables son de CADA bloque y se
repiten: transcribilos dentro de cada registro, no una sola vez.

**Cada bloque da DOS registros:** el producto fraccionado y sus RECORTES.
Dos bloques llenos = CUATRO registros. Numeralos con "bloque": 1, 2, 3…
El registro de recortes lleva el mismo número de bloque que su producto.

El LOTE del producto terminado suele venir en una ETIQUETA PEGADA, con los
campos LOTE y VENCE. Leé de ahí.

**Cómo se llena cada registro del bloque:**

  UN BLOQUE PUEDE TENER VARIOS RENGLONES. La MATERIA PRIMA suele traer dos o más
  lotes, y el PRODUCTO TERMINADO puede traer varias líneas con su propio subtotal
  y sus propias unidades, más un "Total" escrito al pie de la columna
  CANTIDAD TOTAL (KG). Ese total es el del bloque; los renglones de arriba son
  sus partes.

  OJO CON LA MATERIA PRIMA: su cantidad se REPARTE entre los dos registros del
  bloque. El registro del producto consume los kg del producto; el de recortes,
  los kg de los recortes. NUNCA pongas el total de materia prima en uno solo.
    Ejemplo simple: entran 16.1 kg → el producto lleva 13 y los recortes 3.1.
    Ejemplo con dos lotes: entran 33.9 + 116 = 149.9 kg; el producto hace 127.5
    y los recortes 22.4. En el registro del producto van los DOS lotes de materia
    prima repartidos hasta sumar 127.5 (por ejemplo 30.6 y 96.9), y en el de
    recortes los kg de recortes. Lo que debe cuadrar es la SUMA, no cada renglón.

  Si el bloque trae varias líneas de producto terminado, sumalas: "cantidadKg" es
  el TOTAL del bloque y "unidades" la suma de las unidades. Un solo registro por
  bloque, no uno por línea.

  Producto:  lote y código del PRODUCTO TERMINADO
             cantidadKg = su CANTIDAD TOTAL (KG)
             unidades   = UNIDADES TOTAL
             mpKg       = CANTIDAD (KG) de MATERIA PRIMA
             componentes: la materia prima con su lote y la cantidad total del
                          producto · la bolsa con sus UNIDADES UTILIZADAS ·
                          la etiqueta con sus UNIDADES
  Recortes:  lote y código de RECORTES
             cantidadKg = su CANTIDAD TOTAL (KG)
             unidades   = VACÍO (los recortes son a granel)
             componentes: solo la materia prima, con la cantidad de los recortes

  Debe cumplirse: mpKg ≈ kg del producto + kg de los recortes.
  Ejemplo real: 16.1 = 13 + 3.1  ·  47.3 = 41.6 + 5.7
  Si no cierra, anotalo en "dudas".

La columna CÓDIGO ORDEN SAP va vacía: se anota a mano después.

## LAS HOJAS DE DESHIDRATADO

Hay dos formularios más, de un proceso que dura semanas: el queso entra a un
cajón, pierde agua y sale convertido en otro producto. La orden nace con la
entrada y se recibe con la salida.

**ENTRADA DE PRODUCTO A DESHIDRATADO** (código R-PR-008) → tipoHoja "deshidratado"
  Encabezado: FECHA DE ENTRADA · LOTE ASIGNADO · RESPONSABLE · CAJÓN #
  Tabla QUESO: LOTE | PRODUCTO | PROVEEDOR | CANTIDAD NETA — un renglón por lote
  Tabla SAL: LOTE | CANTIDAD (kg)
  Al pie: CÓDIGO ORDEN SAP · REVISADO POR

  El LOTE ASIGNADO es el del producto que se va a obtener: va en "lote" y de él
  sale el código. Cada renglón de la tabla QUESO es un COMPONENTE, con su lote y
  su cantidad neta en kg. El total escrito al pie de la columna es la suma, no un
  renglón más: no lo transcribas como componente.

  NO calcules la cantidad planificada ni la escribas: el programa la obtiene
  aplicando la merma. Dejá "cantidadKg" y "unidades" vacíos.

  El CAJÓN # va en el campo "cajon".

  La SAL es ADT0001 (Sal Roca). Si dice "Reutilizable" y no tiene cantidad, NO se
  consume: no la incluyas como componente.

**SALIDA DE PRODUCTO DESHIDRATADO** (código R-PR-009) → tipoHoja "salida"
  Encabezado: FECHA DE SALIDA · LOTE · RESPONSABLE · CAJÓN #
  Una sola columna CANTIDAD NETA (kg) con un total al pie
  Al pie: CÓDIGO ORDEN SAP · REVISADO POR

  Es la recepción de un lote que entró al cajón semanas antes. Ese LOTE casi
  nunca coincide con la fecha de la hoja: su día juliano es el de la entrada, y
  eso es correcto, no lo "corrijas".

  El ÚLTIMO dígito del lote es la TANDA y se lee mal seguido. Mirá bien si dice
  1 o 2: un cajón que se llenó en la segunda tanda del día termina en 2, y
  equivocarlo apunta la recepción a otro cajón. Si no se distingue con
  seguridad, anotalo en "dudas".

  El total de CANTIDAD NETA va en "cantidadKg". No tiene componentes: devolvé
  "componentes" vacío. Si el CÓDIGO ORDEN SAP está escrito, ponelo en "docNum".

  A veces sacan solo una parte del cajón y el resto queda adentro. Si la hoja
  dice algo sobre eso —"parcial", "queda producto", "resto en cajón"— ponelo en
  "observaciones" y anotalo en "dudas": cambia si se ajusta o no la cantidad
  planificada de la orden.

  Devolvé UN solo registro con tipo "salida".

El campo MARCA del encabezado del bloque decide con qué marca se registra:

    Tiqueso → TIQ        Real → REA
    Casa Real → CSR      American Slices → AMS

Un mismo lote corto puede existir en dos marcas. Ejemplo real de una misma hoja:
el bloque de arriba dice MARCA Tiqueso con lote 0525262171 → TIQ0525; el de
abajo dice MARCA Real con lote 0550262171 → REA0550, NO TIQ0550.

Poné la marca leída en el campo "marca" de cada registro y elegí el código del
catálogo que corresponda a esa marca.

SI LA ETIQUETA PEGADA CONTRADICE LA MARCA ESCRITA, MANDA LA ETIQUETA. La marca
del encabezado se escribe a mano y se equivocan seguido; la etiqueta sale del
sistema. Ejemplo: el encabezado dice Tiqueso pero la etiqueta dice "Real Queso
Pizzero" → la marca es Real, poné "Real" y el código REA. Anotalo en "dudas". Si el código de esa marca no existe en el
catálogo, dejá "codigo" vacío y anotalo en "dudas".

## LOTES DE COMPONENTES

Los lotes de materia prima, bolsas y etiquetas NO siguen el formato de 10
caracteres del producto terminado: pueden traer guiones, sufijos o largos
distintos (237125188-1, 2772262203-2, 100171147). Transcribilos TAL CUAL,
sin quitar guiones ni completar dígitos. Solo los primeros 4 caracteres se
usan para buscar el artículo.

## LA UNIDAD DE CADA COMPONENTE

La columna de la hoja dice "CANTIDAD (KG/UNIDADES)": el mismo espacio sirve
para las dos cosas. Al lado del número suele estar escrito KG.

Anotá en "unidad" lo que diga la hoja: "kg" si aparece KG junto al número,
"unid" si dice unidades, y vacío si no se especifica.

NO conviertas nada. El programa hace la conversión con la equivalencia del
catálogo cuando el artículo se lleva por unidad y la hoja anota kilos.
Ejemplo real: 120 KG de MEZCLA PANADERA INDUSTRIAL 2 KG son 60 unidades,
pero vos escribís cantidad "120" y unidad "kg".

## LAS DOS CASILLAS DE CANTIDAD

La hoja trae dos casillas distintas y NO son lo mismo:
- **"Cantidades"** → el valor en KILOGRAMOS.
- **"Unidades"** → el conteo de piezas.

Transcribí ambas tal como estén, cada una en su campo ("cantidadKg" y "unidades").
NO decidas cuál es la cantidad planificada ni las conviertas entre sí: eso lo hace el
programa según si el producto es a granel o de peso fijo. Si una casilla está vacía en
la hoja, dejala vacía.

## CONSECUTIVO DEL REGISTRO

Arriba de la hoja, cerca del encabezado "Emitido por: Jefe de Calidad e Inocuidad",
va un número escrito a mano (normalmente 1 a 20). Es el consecutivo del día.
Suele estar circulado o suelto. Ese es el campo "registro" y es UNO por hoja.

## TIPOS DE HOJA — ESTO DEFINE CUÁNTOS REGISTROS DEVOLVÉS

**RALLADO** — la hoja entera es UN solo registro.
  Devolvés un único elemento en "registros".

**FRACCIONADO** — la hoja tiene espacio para DOS parejas de productos.
  Cada pareja son DOS registros separados:
    1. El producto que se fraccionó (ej. TIQ0250, Turrialba 500 g).
    2. Los RECORTES: el excedente que queda al cortar el bloque.
       Van bajo su propio código y en SAP son una orden aparte.
  Una hoja de fraccionado puede dar hasta CUATRO registros: pareja 1 (producto +
  recortes) y pareja 2 (producto + recortes). Si la segunda pareja está en blanco,
  devolvés solo los de la primera. Nunca inventes una pareja vacía.

**Los recortes siempre son TIQ**, aunque el producto que los generó sea Real o
Casa Real: no hay código de recortes por marca. En el registro de recortes poné
"marca": "Tiqueso" aunque el bloque diga otra cosa.

**Códigos de recortes:** son TIQ + familia + 99R. Ejemplos: TIQ0250 → TIQ0299R,
TIQ1471 → TIQ1499R, TIQ0150 → TIQ0199R. Las versiones sin la R final están INACTIVAS
en SAP: usá siempre la que termina en R.

/* --- Reparación de JSON cortado --------------------------------------- */
/* --- Reparación de JSON cortado ------------------------------------------
   No conoce el esquema a propósito. La versión anterior buscaba el array
   "componentes" en la raíz; cuando el esquema pasó a "registros" dejó de
   rescatar nada y las respuestas largas fallaban enteras.

   Estrategia: recorrer el texto llevando la cuenta de llaves y corchetes
   abiertos, recordar la última posición donde había un valor COMPLETO, cortar
   ahí y cerrar lo que quedó abierto. Sirve para cualquier estructura.       */

function repararJSON(txt){
  let s = (txt||"").replace(/```json/gi,"").replace(/```/g,"").trim();
  const i = s.indexOf("{");
  if(i > 0) s = s.slice(i);
  if(!s) return null;

  try{ return JSON.parse(s); }catch(e){}

  const pila = [];          /* llaves y corchetes abiertos */
  let enTexto = false, escape = false, corte = -1, pilaEnCorte = 0;

  for(let k = 0; k < s.length; k++){
    const c = s[k];
    if(escape){ escape = false; continue; }
    if(c === "\\"){ escape = true; continue; }
    if(c === '"'){ enTexto = !enTexto; continue; }
    if(enTexto) continue;

    if(c === "{" || c === "["){ pila.push(c === "{" ? "}" : "]"); }
    else if(c === "}" || c === "]"){
      pila.pop();
      /* Acá terminó un valor completo: es un lugar seguro donde cortar. */
      if(pila.length > 0){ corte = k; pilaEnCorte = pila.length; }
    }
  }

  /* Si el corte cayó a mitad de un texto no hay ningún valor completo dentro
     de un array. Último recurso: cerrar la comilla y las estructuras, para
     salvar al menos la cabecera de la hoja. */
  if(corte < 0){
    let t = s;
    /* Primero descartar una CLAVE a medio escribir  (...,"fechaElab).
       Si el texto abierto era un VALOR, ese patrón no engancha porque
       arrastra el ':' y ahí sí corresponde cerrar la comilla. */
    const sinClave = t.replace(/,\s*"[^"]*$/,"");
    if(sinClave !== t) t = sinClave;
    else if(enTexto)   t += '"';
    t = t.replace(/,\s*$/,"").replace(/:\s*$/,':""');
    for(let k = pila.length - 1; k >= 0; k--) t += pila[k];
    try{
      const j = JSON.parse(t);
      j.dudas = (Array.isArray(j.dudas) ? j.dudas : []).concat(
        "La respuesta llegó muy cortada: solo se pudo rescatar la cabecera. " +
        "Revisá la hoja entera contra la foto.");
      return j;
    }catch(e){ return null; }
  }

  let rescate = s.slice(0, corte + 1).replace(/,\s*$/,"");
  /* Cerrar lo que siguió abierto, en orden inverso */
  const abiertos = [];
  let t = false, esc = false;
  for(const c of rescate){
    if(esc){ esc = false; continue; }
    if(c === "\\"){ esc = true; continue; }
    if(c === '"'){ t = !t; continue; }
    if(t) continue;
    if(c === "{") abiertos.push("}");
    else if(c === "[") abiertos.push("]");
    else if(c === "}" || c === "]") abiertos.pop();
  }
  while(abiertos.length) rescate += abiertos.pop();

  try{
    const j = JSON.parse(rescate);
    j.dudas = (Array.isArray(j.dudas) ? j.dudas : []).concat(
      "La respuesta de la IA llegó cortada. Puede faltar el final de la hoja: " +
      "revisá que estén todos los renglones y componentes.");
    return j;
  }catch(e){ return null; }
}
