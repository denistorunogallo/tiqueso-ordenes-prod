  /* Las fotos del celular vienen de 12 MP y pesan varios MB. La API reescala
     todo lo que pase de 1568 px de lado mayor, así que mandarlas enteras solo
     gasta tiempo y puede hacer fallar la carga. Se reducen antes de enviar:
     mismo detalle útil, mucho menos peso. */
  const LADO_MAX = 1568;
  /* Vercel no acepta más de 4.5 MB de cuerpo, y eso no se puede configurar.
     Base64 infla un 33%, así que se apunta bastante por debajo: cada imagen
     baja de ~700 KB y el envío entero se queda cerca de 3 MB aun mandando las
     mitades. Antes salían de 1568 px a calidad fija y una hoja densa se
     pasaba. */
  const KB_POR_IMAGEN = 700;
  const KB_ENVIO_MAX  = 3600;

  const pesoKB = b64 => Math.round(b64.length * 0.75 / 1024);

  /* Comprime bajando calidad y, si no alcanza, resolución. */
  function aBase64(canvas, tope){
    for(const q of [0.92, 0.82, 0.72, 0.62]){
      const url = canvas.toDataURL("image/jpeg", q);
      const b64 = url.split(",")[1];
      if(pesoKB(b64) <= tope) return {url, b64, calidad:q};
    }
    const url = canvas.toDataURL("image/jpeg", 0.55);
    return {url, b64:url.split(",")[1], calidad:0.55};
  }

  function lienzo(img, ancho, alto, sx, sy, sw, sh){
    const c = document.createElement("canvas");
    c.width = ancho; c.height = alto;
    const ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    if(sw) ctx.drawImage(img, sx, sy, sw, sh, 0, 0, ancho, alto);
    else    ctx.drawImage(img, 0, 0, ancho, alto);
    return c;
  }

  /* Recorta una franja horizontal y la reescala a 1568 px de ancho. Una hoja
     completa a ese tamaño deja cada bloque con muy poca resolución; mandando
     además las mitades, cada bloque llega al doble de detalle. */
  function franja(img, desde, hasta){
    const alto = Math.round(img.height*(hasta-desde));
    const k = Math.min(1, LADO_MAX/Math.max(img.width, alto));
    const c = lienzo(img, Math.round(img.width*k), Math.round(alto*k),
                     0, Math.round(img.height*desde), img.width, alto);
    const {b64} = aBase64(c, KB_POR_IMAGEN);
    return {mediaType:"image/jpeg", base64:b64};
  }

  function reducir(file){
    return new Promise((res,rej)=>{
      const lector=new FileReader();
      lector.onerror=()=>rej(new Error("No se pudo leer "+file.name));
      lector.onload=()=>{
        const img=new Image();
        img.onerror=()=>rej(new Error("No se pudo abrir "+file.name));
        img.onload=()=>{
          const mayor=Math.max(img.width,img.height);
          const original = lector.result.split(",")[1];
          if(mayor<=LADO_MAX && pesoKB(original)<=KB_POR_IMAGEN){
            res({mediaType:file.type, base64:original,
                 url:lector.result, ancho:img.width, alto:img.height,
                 kb:pesoKB(original),
                 mitades:[franja(img,0,0.58), franja(img,0.42,1)]});
            return;
          }
          const k=Math.min(1, LADO_MAX/mayor);
          const c=lienzo(img, Math.round(img.width*k), Math.round(img.height*k));
          const {url,b64} = aBase64(c, KB_POR_IMAGEN);
          res({mediaType:"image/jpeg", base64:b64, url,
               ancho:c.width, alto:c.height, kb:pesoKB(b64),
               /* franjas con solape: un bloque partido al medio se ve entero
                  en al menos una de las dos */
               mitades:[franja(img,0,0.58), franja(img,0.42,1)]});
        };
        img.src=lector.result;
      };
      lector.readAsDataURL(file);
    });
  }

  async function subir(e){
    const files=Array.from(e.target.files||[]);
    e.target.value="";                       /* permite reelegir la misma foto */
    if(!files.length) return;
    setError("");
    try{
      const ims=await Promise.all(files.map(async f=>{
        const r=await reducir(f);
        return {id:uid(), nombre:f.name, mediaType:r.mediaType, base64:r.base64,
                url:r.url, ancho:r.ancho, alto:r.alto, mitades:r.mitades,
                kb:r.kb,
                estado:"pendiente", msg:""};
      }));
      setCola(c=>[...c,...ims]);
    }catch(err){ setError(err.message||"No se pudieron preparar las fotos."); }
  }

  const marcar=(id,cambios)=>setCola(cs=>cs.map(c=>c.id===id?{...c,...cambios}:c));

  /* Procesa la cola. En modo "una", cada foto es un registro independiente:
     si una falla, las demás siguen. En modo "todas", las fotos son páginas
     de una sola boleta.                                                    */
  /* Cuánto pesa el envío de un grupo de fotos, con o sin mitades. */
  function pesoEnvio(ims){
    return ims.reduce((t,im) => t + (im.kb||0) +
      (conMitades && im.mitades ? im.mitades.reduce((u,h)=>u+pesoKB(h.base64),0) : 0), 0);
  }

  async function procesarCola(){
    const pend=cola.filter(c=>c.estado==="pendiente"||c.estado==="error");
    if(!pend.length) return;
    cancelar.current=false; setProcesando(true); setError("");

    if(modo==="todas"){
      const peso = pesoEnvio(pend);
      if(peso > KB_ENVIO_MAX){
        setError("Las " + pend.length + " fotos suman " + Math.round(peso/1024) +
          " MB y el servidor no acepta más de 4.5 MB por envío. " +
          (conMitades ? "Desactivá las mitades, o mandá " : "Mandá ") +
          "menos fotos por vez.");
        setProcesando(false); return;
      }
      pend.forEach(p=>marcar(p.id,{estado:"leyendo",msg:""}));
      try{
        const {json:d}=await leerBoletaIA({imagenes:pend,apiKey,modelo,mitades:conMitades});
        const nuevas=ordenesDesdeIA(d,pend[0].id);
        /* Reintentar una foto reemplaza lo que esa misma foto dejó antes: si se
           sumara, una lectura parcial seguida de una completa dejaría el
           registro por duplicado y SAP crearía dos órdenes iguales. */
        setOrdenes(os=>[...os.filter(o=>o.hoja!==pend[0].id),...nuevas]);
        setFotos(f=>{const n={...f};nuevas.forEach(o=>n[o.id]=pend[0].url);return n;});
        pend.forEach(p=>marcar(p.id,{estado:"ok",salieron:nuevas.length}));
      }catch(err){
        pend.forEach(p=>marcar(p.id,{estado:"error",msg:err.message||"No se pudo leer."}));
      }
      setProcesando(false); return;
    }

    for(const it of pend){
      if(cancelar.current){ marcar(it.id,{estado:"pendiente"}); continue; }
      const peso = pesoEnvio([it]);
      if(peso > KB_ENVIO_MAX){
        marcar(it.id,{estado:"error",
          msg:"La foto pesa " + Math.round(peso/1024) + " MB con las mitades incluidas, " +
              "y el servidor acepta hasta 4.5 MB. Desactivá las mitades para esta."});
        continue;
      }
      marcar(it.id,{estado:"leyendo",msg:""});
      try{
        const {json:d}=await leerBoletaIA({imagenes:[it],apiKey,modelo,tipoHoja:it.tipo,
        mitades:conMitades,
        alAvanzar:n=>marcar(it.id,{recibido:n})});
        const nuevas=ordenesDesdeIA(d,it.id);
        setOrdenes(os=>[...os.filter(o=>o.hoja!==it.id),...nuevas]);
        setFotos(f=>{const n={...f};nuevas.forEach(o=>n[o.id]=it.url);return n;});
        marcar(it.id,{estado:"ok",salieron:nuevas.length,
                    parcial: nuevas.some(o=>o.parcial)});
      }catch(err){
        marcar(it.id,{estado:"error",msg:err.message||"No se pudo leer."});
      }
      await new Promise(r=>setTimeout(r,350));  /* respiro entre llamadas */
    }
    setProcesando(false);
  }

  /* Una orden en espera no entra en ningún archivo: se aparta a propósito
     —está en revisión, o hay que aclarar algo antes— sin perder lo digitado
     ni tener que fingir que ya se recibió. */
  const enEspera = ordenes.filter(o=>o.enEspera);
  const listas = ordenes.filter(o=>!o.enEspera &&
                                   !hayErrores(validarOrden(o,ordenes,fecha)))
                        .sort(ordenDTW);
  const trabadas = ordenes.length - listas.length;
  /* Solo lo que falta subir: si se exporta dos veces al día, la segunda
     corrida no debe repetir las órdenes que ya están en SAP. */
  /* La salida de deshidratado no crea ninguna orden: sirve para ubicar la que
     ya existe y ajustarla a mano. Nunca entra en un archivo. */
  const salidas   = ordenes.filter(o=>o.tipo==="salida");
  const porSubir  = listas.filter(o=>!o.subida && o.tipo!=="salida");
  const porRecibir = listas.filter(o=>(o.subida || o.tipo==="salida") && !o.recibida);

  const csv = useMemo(()=>construirCSV(porSubir,fmtFecha,colCom1,colCom2,colCajon),
    [porSubir,fmtFecha,colCom1,colCom2,colCajon]);
  const liberar = useMemo(()=>construirLiberar(porRecibir,claveOrd),[porRecibir,claveOrd]);
  const ajuste  = useMemo(()=>construirAjuste(porRecibir,claveOrd),[porRecibir,claveOrd]);

  /* Se pregunta una sola vez por acción: bajar tres archivos no debería
     disparar tres avisos iguales. */
  function confirmarSinRevisar(accion){
    const pend = listas.filter(o => faltaRevisar(o).length);
    if(!pend.length) return true;
    const detalle = pend.slice(0,8).map(o =>
      "· reg. " + (o.registro||"—") + " " + (o.codigo||"sin código") +
      " — falta " + faltaRevisar(o).join(", ")).join("\n");
    return confirm(
      pend.length + " registro(s) no están revisados del todo:\n\n" + detalle +
      (pend.length > 8 ? "\n· y " + (pend.length-8) + " más" : "") +
      "\n\n¿" + accion + " igual?");
  }

  const marcarOrdenes = (cuales,campo,valor) => setOrdenes(os=>os.map(o=>
    cuales.some(x=>x.id===o.id) ? {...o,[campo]:valor} : o));
  /* Guarda en cada orden el RecordKey con que va en el OWOR. Al bajar el
     archivo se sobrescribe (ese es el archivo que va a SAP); al marcar como
     subidas solo se completa lo que falte. */
  function sellarRK(cuales, soloFaltantes){
    const t = new Date().toISOString();
    const rk = new Map(cuales.map((o,i)=>[o.id, String(i+1)]));
    setOrdenes(os=>os.map(o=> rk.has(o.id) && !(soloFaltantes && o.rkOwor)
      ? {...o, rkOwor:rk.get(o.id), tandaOwor:t} : o));
  }
  /* Una entrada a cajón crea la orden y ahí se queda: el producto sale semanas
     después, con su hoja de salida, y recién entonces se recibe. Sí necesita
     DocEntry y liberación, porque la recepción futura los va a usar. */
  const enCajon    = porRecibir.filter(o=>o.tipo==="deshidratado");
  /* Las salidas de cajón no salieron en el OWOR de hoy: su orden se creó
     semanas atrás. Si entraran al pegado por orden, se llevarían un DocEntry
     de otra orden y la recepción quedaría contra el documento equivocado.
     El suyo se escribe a mano. */
  /* Tampoco las rehechas: salen solas en un OWOR aparte y su DocEntry se
     escribe en el propio registro, como el de las salidas de cajón. */
  const conDocEntryHoy = porRecibir.filter(o=>o.tipo!=="salida" && !o.correccion);
  const aCancelar = ordenes.filter(o=>o.correccion && o.correccion.docEntry);
  /* «cancelar» ya es la bandera que aborta la cola de fotos. */
  const archCancelar = construirCancelar(ordenes, claveOrd);
  const noCancelables = aCancelar.filter(o=>o.correccion.recibida);
  const salidasSinDocEntry = porRecibir.filter(o=>o.tipo==="salida" && !o.docEntry);
  const porRecepcion = porRecibir.filter(o=>o.tipo!=="deshidratado");
  const recibibles = porRecepcion.filter(o=>listaParaRecibir(o).length===0);
  /* Se arma con todas: así se puede ver la estructura antes de tener los
     DocEntry. Las que no lo tengan quedan con BaseEntry vacío y se avisa. */
  const rec = useMemo(()=>construirRecepcion(porRecepcion,fmtFecha),[porRecepcion,fmtFecha]);   /* OIGN usa sus propios nombres */
  const sinDocEntry = porRecepcion.filter(o=>!o.docEntry).length;
  const ctrl = useMemo(()=>construirControl(porSubir),[porSubir]);
  const comps = useMemo(()=>construirComponentes(listas),[listas]);

  function aplicarDocEntry(){
    const interp = interpretarPegado(pegado);
    if(!interp.modo || !interp.pares.length){
      setAvisoPegar("No entendí el formato. Pegá el resultado de la consulta con su encabezado.");
      return;
    }
    const {porContenido, filas} = emparejarDocEntry(interp, conDocEntryHoy, ordenes);
    if(!porContenido && !confirm(
        "Lo pegado no trae la columna del artículo, así que se asigna por POSICIÓN.\n\n" +
        "Si el orden de la lista no es el mismo del archivo que se subió a SAP, cada " +
        "recepción queda contra la orden de otro producto (pasó el 8/10/2026).\n\n" +
        "¿Asignar por posición igual?")) return;
    const porId = new Map();
    filas.forEach(f => { if(f.destino) porId.set(f.destino.id, f.par); });

    setOrdenes(os => os.map(o => {
      const p = porId.get(o.id);
      if(!p) return o;
      return {...o, docEntry:p.docEntry, docNum: p.docNum || o.docNum,
              docEntryCodigo: p.itemCode || ""};
    }));

    const dudosas = filas.filter(f=>!f.destino && (f.estado==="ambiguo"||f.estado==="repetido")).length;
    const saltadas = filas.filter(f=>f.estado==="liberada"||f.estado==="ya-usado").length;
    const faltan = conDocEntryHoy.filter(o=>!porId.has(o.id)).length;
    setAvisoResp(null);
    setAvisoPegar(porId.size + " DocEntry asignado(s) " +
      (porContenido ? "por artículo" : "por posición") + "." +
      (dudosas ? " " + dudosas + " fila(s) quedaron sin asignar por duda: escribilas a mano." : "") +
      (saltadas ? " Se saltaron " + saltadas + " de subidas anteriores (liberadas o ya asignadas)." : "") +
      (faltan ? " Quedan " + faltan + " orden(es) sin DocEntry." : "") +
      (salidasSinDocEntry.length
        ? " Las " + salidasSinDocEntry.length + " salida(s) de cajón no se tocaron: " +
          "su DocEntry se escribe a mano."
        : ""));
    setPegado("");
  }

  const orden = ordenes.find(o=>o.id===activa) || null;
  const puedeLeer = !NECESITA_KEY || !!apiKey;

  return <div>
    <style>{CSS}</style>

    <header style={{background:"var(--tiqueso)",padding:"14px 16px",position:"sticky",top:0,zIndex:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <img src={LOGO_TIQUESO_BLANCO} alt="Tiqueso" style={{height:34,display:"block"}}/>
            <span style={{fontFamily:"var(--mono)",fontSize:10,letterSpacing:".14em",
                          color:"rgba(255,255,255,.75)",textTransform:"uppercase"}}>
              Órdenes de producción</span>
            <span style={{fontFamily:"var(--mono)",fontSize:9,
                          color:"rgba(255,255,255,.45)"}}
                  title="Fecha en que se armó este archivo">v{VERSION_ARCHIVO}</span>
          </div>
          <h1 style={{fontSize:18,fontWeight:600,color:"#fff",margin:"4px 0 0"}}>
            Empaque y Transformación de Quesos</h1>
          <div style={{fontFamily:"var(--mono)",fontSize:10,color:"rgba(255,255,255,.6)",marginTop:3}}>
            {CATALOGO.length} lotes · {ARTICULOS.length} artículos · {PLATAFORMA}
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
          <NubeBadge oscuro sync={sync} onModelos={()=>setVerModelos(true)} onLecturas={()=>setVerLecturas(true)}/>
          <button className="btn sec" style={{color:"#fff",borderColor:"rgba(255,255,255,.35)",padding:"7px 11px"}}
            onClick={()=>setConfig(c=>!c)}>{puedeLeer?"⚙":"⚠ API"}</button>
        </div>
      </div>
    </header>

    <main style={{padding:14,maxWidth:760,margin:"0 auto"}}>
      {verLecturas && <PanelLecturasIA appInicial="ordenes" onCerrar={()=>setVerLecturas(false)}/>}
      {verModelos && <PanelModelos app="ordenes" titulo="Órdenes de producción" cfg={modelosNube.cfg} guardar={modelosNube.guardar} onCerrar={()=>setVerModelos(false)}/>}
      {soloLectura && <Aviso tipo="neu">🔒 <strong>Modo solo lectura.</strong> Tu usuario ({ROL_TXT[rolNube]||rolNube}) puede ver las órdenes y descargar archivos, pero no modificarlas.</Aviso>}
      <PanelConfig abierto={config} onCerrar={()=>setConfig(false)}
        apiKey={apiKey} setApiKey={setApiKey} modelo={modelo} setModelo={setModelo}
        colabs={colabs} setColabs={setColabs}/>

      {NECESITA_KEY && !apiKey && <Aviso tipo="err">
        <strong style={{color:"var(--alerta)"}}>Sin API key</strong>
        <div style={{color:"var(--acero)",marginTop:3}}>
          Tocá ⚠ API arriba para pegarla. Sin ella funciona el modo prueba, pero no la lectura de fotos.</div>
      </Aviso>}

      {!orden && <div>
        <div className="card">
          <div className="row" style={{alignItems:"flex-end",marginBottom:12}}>
            <Campo etiqueta="Día de producción" valor={fecha} onChange={setFecha} tipo="date" ancho="60%"/>
            <div style={{width:"40%",marginBottom:14,textAlign:"right",
                         fontFamily:"var(--mono)",fontSize:11,color:"var(--gris)"}}>
              {ordenes.length} orden{ordenes.length===1?"":"es"}
              <div style={{fontSize:10,marginTop:2}}>
                {fecha===hoy() ? "hoy · "+ahoraHHMM()+" CR" : "hora CR: "+ahoraHHMM()}
              </div>
            </div>
          </div>

          <input ref={inputRef} type="file" accept="image/*" multiple
            onChange={subir} style={{display:"none"}}/>
          <input ref={camRef} type="file" accept="image/*" multiple capture="environment"
            onChange={subir} style={{display:"none"}}/>

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn" disabled={soloLectura} onClick={()=>inputRef.current.click()}>
              Elegir fotos</button>
            <button className="btn sec" disabled={soloLectura} onClick={()=>camRef.current.click()}>
              Cámara</button>
            <button className="btn sec" disabled={soloLectura} onClick={()=>agregar(ORDEN_VACIA())}>En blanco</button>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:8}}>
            <button className="btn sec" onClick={()=>agregar(ordenEjemplo())}>Ejemplo rallado</button>
            <button className="btn sec" onClick={()=>{
              const par=ordenEjemploFraccionado();
              setOrdenes(os=>[...os,...par]); setActiva(par[0].id);
            }}>Ejemplo fraccionado</button>
            <button className="btn sec" onClick={()=>agregar(ordenEjemploSucia())}>Ejemplo con errores</button>
          </div>

          {cola.length>0 && <div style={{marginTop:14,borderTop:"1px solid var(--borde)",paddingTop:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
              <strong style={{fontSize:13}}>Cola de fotos</strong>
              <span style={{fontFamily:"var(--mono)",fontSize:10.5,color:"var(--gris)"}}>
                {cola.filter(c=>c.estado==="ok").length} leídas ·{" "}
                {cola.filter(c=>c.estado==="error").length} con error ·{" "}
                {cola.filter(c=>c.estado==="pendiente").length} pendientes
              </span>
            </div>

            <div style={{marginBottom:10}}>
              <Lbl>Cómo agrupar las fotos</Lbl>
              <select value={modo} onChange={e=>setModo(e.target.value)} disabled={procesando}>
                <option value="una">Una foto por hoja — lo normal</option>
                <option value="todas">Todas las fotos son la MISMA hoja (reverso o dos tomas)</option>
              </select>
              <label style={{display:"flex",gap:7,alignItems:"center",fontSize:11.5,
                             color:"var(--gris)",margin:"8px 0 5px",cursor:"pointer"}}>
                <input type="checkbox" checked={conMitades}
                  onChange={e=>setConMitades(e.target.checked)}
                  style={{width:"auto",margin:0}}/>
                Mandar también la mitad de arriba y la de abajo por separado
              </label>
              <div style={{fontSize:11,color:"var(--gris)",marginBottom:5,lineHeight:1.45}}>
                Para hojas que salen borrosas o que la IA lee a medias. Manda cada mitad
                por separado, al doble de detalle. Gasta más tokens: activalo solo cuando
                una foto se resista.
              </div>
              <div style={{fontSize:11,color:"var(--gris)",marginTop:5,lineHeight:1.45}}>
                {modo==="una"
                  ? "Cada foto se lee por separado. Una hoja de fraccionado puede generar varias órdenes."
                  : "Las " + cola.length + " fotos se leen juntas como un solo documento."}
              </div>
            </div>

            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
              {cola.map(c=>{
                const col = c.estado==="ok"?"var(--verde)":c.estado==="error"?"var(--alerta)":
                            c.estado==="leyendo"?"var(--queso)":"var(--borde)";
                return <div key={c.id} style={{position:"relative"}}>
                  <img src={c.url} alt="" title={(c.msg||c.nombre)+(c.ancho?" · "+c.ancho+"×"+c.alto+" · "+c.kb+" KB":"")}
                    style={{width:58,height:58,objectFit:"cover",borderRadius:3,
                            border:"2px solid "+col,
                            opacity:c.estado==="leyendo"?.5:1}}/>
                  {c.parcial && <span style={{position:"absolute",left:2,top:2,
                        background:"var(--alerta)",color:"#fff",fontSize:8.5,
                        borderRadius:2,padding:"0 3px"}}>parcial</span>}
                  <span style={{position:"absolute",right:2,bottom:2,background:col,color:"#fff",
                                fontSize:9,borderRadius:2,padding:"0 3px",fontFamily:"var(--mono)"}}>
                    {c.estado==="ok"?"✓":c.estado==="error"?"!":c.estado==="leyendo"?"…":"○"}
                  </span>
                </div>;
              })}
            </div>

            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn" onClick={procesarCola}
                disabled={soloLectura||procesando||!puedeLeer||!cola.some(c=>c.estado==="pendiente"||c.estado==="error")}>
                {procesando
                  ? `Leyendo ${cola.filter(c=>c.estado==="ok"||c.estado==="error").length+1} de ${cola.length}…` +
                    (cola.find(c=>c.estado==="leyendo"&&c.recibido)
                      ? " (" + cola.find(c=>c.estado==="leyendo").recibido + " car.)" : "")
                  : `Transcribir ${cola.filter(c=>c.estado==="pendiente"||c.estado==="error").length} foto(s)`}
              </button>
              {procesando && <button className="btn sec" onClick={()=>{cancelar.current=true;}}>
                Detener</button>}
              {!procesando && <button className="btn sec"
                onClick={()=>setCola(cs=>cs.filter(c=>c.estado!=="ok"))}>Quitar las leídas</button>}
              {!procesando && <button className="btn min" style={{color:"var(--alerta)",alignSelf:"center"}}
                onClick={()=>setCola([])}>Vaciar cola</button>}
            </div>

            {cola.some(c=>c.parcial) && <div className="avi err" style={{marginTop:10}}>
              <strong style={{color:"var(--alerta)"}}>Alguna hoja se leyó a medias</strong>
              <div style={{color:"var(--acero)",marginTop:3,lineHeight:1.5}}>
                Las fotos marcadas <strong>parcial</strong> devolvieron menos registros de
                los que la propia lectura dijo ver. Volvé a transcribirlas —suele funcionar
                al segundo intento— o completá a mano los productos que falten. Si se sube
                así, esos productos no quedan en SAP y nadie se entera.
              </div>
            </div>}

            {cola.filter(c=>c.estado==="error").length>0 && <div className="avi err" style={{marginTop:10,marginBottom:0}}>
              <strong style={{color:"var(--alerta)"}}>Fotos que no se pudieron leer</strong>
              <ul style={{margin:"5px 0 0",paddingLeft:17,color:"var(--acero)"}}>
                {cola.filter(c=>c.estado==="error").map(c=>
                  <li key={c.id} style={{marginBottom:2}}>{c.nombre}: {c.msg}</li>)}
              </ul>
              <div style={{color:"var(--acero)",marginTop:5}}>
                Volvé a tocar Transcribir para reintentar solo estas.</div>
            </div>}
          </div>}

          {error && <div className="avi err" style={{marginTop:12,marginBottom:0,color:"var(--alerta)"}}>{error}</div>}

          <p style={{margin:"12px 0 0",fontSize:11.5,color:"var(--gris)",lineHeight:1.5}}>
            La IA propone, la persona confirma. Hay un techo de precisión en lectura manuscrita:
            el objetivo no es lectura perfecta sino que ningún error pase silencioso.
            Revisá cada renglón contra la foto antes de exportar.
            {!NECESITA_KEY ? " " + NOTA_PLATAFORMA : ""}
          </p>
        </div>

        {ordenes.length>0 && <div className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",
                       marginBottom:10,gap:8}}>
            <h3 style={{margin:0,fontSize:14}}>Avance del día</h3>
            <button className="btn oro" style={{padding:"7px 13px"}}
              onClick={()=>{ if(confirmarSinRevisar("Generar el reporte"))
                pdfDelDia(ordenes,fecha,actividades,histCajon); }}>
              Reporte para gerencia (PDF)</button>
          </div>
          {(() => {
            const h = huecosDeRegistros(ordenes);
            if(!h.faltan.length) return null;
            return <div className="avi war" style={{marginBottom:10}}>
              <strong style={{color:"var(--tinta)"}}>
                Faltan los registros {h.faltan.join(", ")}</strong>
              <div style={{color:"var(--acero)",marginTop:3,lineHeight:1.5}}>
                El día va del 1 al {h.hasta} y esos números no aparecen. Puede que
                esas hojas todavía no se hayan transcrito.
              </div>
            </div>;
          })()}

          {ordenes.slice().sort(porConsecutivo).map(o=>{
            const e=estadoOrden(o,ordenes,fecha);
            return <button key={o.id} onClick={()=>setActiva(o.id)}
              style={{display:"flex",width:"100%",gap:10,alignItems:"center",textAlign:"left",
                      padding:"9px 10px",marginBottom:6,border:"1px solid var(--borde)",
                      borderRadius:3,background:"var(--panel)",cursor:"pointer"}}>
              <span style={{fontSize:16,color:e.color,width:16}}>{e.icono}</span>
              <span style={{flex:1}}>
                <span style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:600}}>
                  {o.codigo||"sin código"}</span>
                <span style={{fontSize:11,color:"var(--gris)",marginLeft:7}}>
                  reg. {o.registro||"—"}{o.tipo==="recortes"?" · recortes":""}
                  {o.pareja>1?" · pareja "+o.pareja:""}
                  {o.docEntry?" · DocEntry "+o.docEntry:""}</span>
                {(o.subida||o.recibida) && <span className="chip"
                  style={{background:"var(--verde-suave)",color:"var(--verde)",marginTop:3,
                          display:"inline-block"}}>
                  {o.recibida?"recibida":"en SAP"}</span>}
                <div style={{fontSize:11,color:"var(--acero)",marginTop:2}}>
                  {o.producto||"(sin producto)"}</div>
              </span>
              <span style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                <span className="chip" style={{color:e.color}}>{e.txt}</span>
                {/* Los temas de los avisos, aunque la orden ya esté revisada:
                    marcarla no garantiza que no se haya pasado algo. */}
                {e.temas.length>0 &&
                  <span style={{fontSize:10,color:"var(--queso)",textAlign:"right",
                        maxWidth:150,lineHeight:1.3}}>
                    revisar {e.temas.join(", ")}</span>}
              </span>
            </button>;
          })}
        </div>}

        <div className="card">
          {/* La lista de días guardados se quitó: el calendario 📅 Días faltantes
              ya muestra qué días tienen datos. Para abrir un día se usa la fecha
              de arriba; queda solo el borrado del día que está en pantalla. */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"var(--gris)",flex:1}}>
              Día en pantalla: <strong style={{fontFamily:"var(--mono)"}}>{fecha}</strong></span>
            <button className="btn min" style={{color:"var(--alerta)"}}
              disabled={soloLectura || !dias.includes(fecha)}
              onClick={()=>{ if(confirm("¿Borrar todas las órdenes del "+fecha+"?"+(conectadoNube?"\n\nTambién se borran de la nube para todos (el administrador las puede recuperar).":""))) borrarDia(fecha); }}>
              Borrar este día</button>
          </div>

          <div style={{marginBottom:14}}>
            <strong style={{fontSize:13}}>Pasar el trabajo a otro dispositivo</strong>
            <p style={{margin:"3px 0 10px",fontSize:11.5,color:"var(--gris)",lineHeight:1.5}}>
              Exportá al terminar en el iPad, guardá el archivo en OneDrive y en la casa
              importalo en la PC para seguir donde ibas. Lleva las órdenes; las fotos no,
              porque pesan demasiado para moverlas.
            </p>

            <input ref={respRef} type="file" accept=".json,application/json" multiple
              onChange={e=>{ const fs=[...(e.target.files||[])]; if(fs.length>1){ e.target.value=""; importarVarios(fs); } else importarRespaldo(e); }} style={{display:"none"}}/>

            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn sec" onClick={exportarDia} disabled={!ordenes.length}>
                Exportar el {fecha}</button>
              {!motivoNoCompartir("x.json","{}","json") &&
                <button className="btn sec" onClick={compartirDia} disabled={!ordenes.length}>
                  Compartir el respaldo</button>}
              <button className="btn sec" disabled={soloLectura} onClick={()=>respRef.current.click()}>
                Importar respaldo(s)</button>
              {conectadoNube && puedeEditarNube &&
                <button className="btn sec" onClick={subirDiasGuardados}>☁ Subir días guardados a la nube</button>}
              <button className="btn sec" onClick={()=>setVerCobertura(v=>!v)}>📅 Días faltantes</button>
            </div>

            {verCobertura && <CoberturaDias titulo="Órdenes de producción" cargar={cargarCobertura}
              onAbrir={f=>{ setFecha(f); setVerCobertura(false); try{ window.scrollTo(0,0); }catch(e){} }} onCerrar={()=>setVerCobertura(false)}/>}
            {avisoResp && <div className={"avi "+(avisoResp.tipo==="ok"?"ok":"err")}
              style={{marginTop:10,marginBottom:0}}>
              <span style={{color: avisoResp.tipo==="ok"?"var(--verde)":"var(--alerta)"}}>
                {avisoResp.texto}</span>
            </div>}
          </div>

          <button className="btn" style={{background:"var(--alerta)",borderColor:"var(--alerta)"}}
            disabled={!dias.length||soloLectura}
            onClick={()=>{
              if(conectadoNube){
                if(!confirm("Esto borra los datos guardados en ESTE dispositivo. Lo que está en la nube no se toca y se vuelve a traer al abrir cada día. ¿Seguir?")) return;
              }else{
                if(!confirm("Esto borra las órdenes de TODOS los días guardados ("+dias.length+
                            "). No se puede deshacer. ¿Seguir?")) return;
                if(!confirm("Última confirmación: se pierde todo el trabajo no exportado.")) return;
              }
              borrarTodo();
            }}>
            {conectadoNube?"Borrar datos de este dispositivo":"Borrar todo y empezar de cero"}
          </button>
          <p style={{margin:"8px 0 0",fontSize:11,color:"var(--gris)",lineHeight:1.5}}>
            No toca la API key ni el modelo. Los archivos que ya descargaste no se ven afectados.
          </p>
        </div>

        {enEspera.length>0 && <div className="card" style={{borderColor:"var(--queso)"}}>
          <h3 style={{margin:"0 0 3px",fontSize:14}}>
            {enEspera.length} orden(es) en espera</h3>
          <p style={{margin:"0 0 10px",fontSize:12,color:"var(--gris)",lineHeight:1.45}}>
            Apartadas a propósito: no salen en ningún archivo ni cuentan para los
            contadores. Siguen guardadas y se pueden reactivar cuando se resuelva.
          </p>
          {enEspera.map(o=>(
            <div key={o.id} style={{display:"flex",gap:8,alignItems:"baseline",
                 padding:"7px 9px",fontSize:11.5,borderTop:"1px solid var(--borde)"}}>
              <span style={{fontFamily:"var(--mono)",fontWeight:600,width:78}}>
                {o.codigo||"—"}</span>
              <span style={{color:"var(--acero)"}}>reg. {o.registro||"—"}</span>
              <span style={{flex:1,color:"var(--queso)"}}>{o.motivoEspera||"sin motivo anotado"}</span>
              <button className="btn min"
                onClick={()=>actualizar({...o,enEspera:false})}>Reactivar</button>
            </div>))}
        </div>}

        {ordenes.length>0 && <div className="card">
          <h3 style={{margin:"0 0 3px",fontSize:14}}>Exportar a DTW</h3>
          <p style={{margin:"0 0 12px",fontSize:12,color:"var(--gris)"}}>
            OWOR y WOR1 se cargan juntos, enlazados por RecordKey. El tercero, CONTROL,
            no se sube.</p>
          <div className="avi neu" style={{fontSize:11.5,marginBottom:12}}>
            <strong>En DTW:</strong> objeto <strong>Production · Production Orders</strong>.
            Tipo de archivo <code style={{fontFamily:"var(--mono)"}}>txt (Tab delimited)</code>.
            Corré <strong>Run Simulation</strong> antes de importar.
          </div>
          {trabadas>0 && <Aviso tipo="war">
            {trabadas} orden{trabadas===1?"":"es"} con errores queda{trabadas===1?"":"n"} fuera del archivo.
            Abrilas desde el panel para corregirlas.</Aviso>}
          <Archivo antesDeBajar={()=>{ if(!confirmarSinRevisar("Descargar")) return false;
                                       sellarRK(porSubir,false); return true; }}
            base={"OWOR_ProductionOrders_"+fecha} filas={csv.owor} fmt={fmtArch} bom={conBom} doble={dobleEnc}
            nota="Va en la fila ProductionOrders, la de más arriba."
            onVer={()=>setVista(vista==="OWOR"?"":"OWOR")} viendo={vista==="OWOR"}/>
          <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")} base={"WOR1_ProductionOrders_Lines_"+fecha} filas={csv.wor1} fmt={fmtArch} bom={conBom} doble={dobleEnc}
            nota="Va en ProductionOrders_Lines. Los componentes, enlazados por RecordKey."
            onVer={()=>setVista(vista==="WOR1"?"":"WOR1")} viendo={vista==="WOR1"}/>
          <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")} base={"CONTROL_"+fecha} filas={ctrl} fmt={fmtArch} bom={conBom} doble={dobleEnc}
            nota="NO se sube a DTW. Es para anotar el DocNum y el DocEntry que devuelva SAP."
            onVer={()=>setVista(vista==="CTRL"?"":"CTRL")} viendo={vista==="CTRL"}/>

          {vista==="OWOR" && <pre style={{marginTop:12}}>{tabla(csv.owor,fmtArch,dobleEnc)}</pre>}
          {vista==="WOR1" && <pre style={{marginTop:12}}>{tabla(csv.wor1,fmtArch,dobleEnc)}</pre>}
          {vista==="CTRL" && <pre style={{marginTop:12}}>{tabla(ctrl,fmtArch,dobleEnc)}</pre>}
          {vista==="OIGN" && <pre style={{marginTop:12}}>{tabla(rec.oign,fmtArch,dobleEnc)}</pre>}
          {vista==="IGN1" && <pre style={{marginTop:12}}>{tabla(rec.ign1,fmtArch,dobleEnc)}</pre>}
          {vista==="BTNT" && <pre style={{marginTop:12}}>{tabla(rec.btnt,fmtArch,dobleEnc)}</pre>}

          <BuscadorErrorDTW ordenes={porSubir}/>

          {porSubir.length>0 && <div className="avi war" style={{marginTop:12}}>
            <strong style={{color:"var(--tinta)"}}>
              Paso obligatorio: marcá estas {porSubir.length} después de importar</strong>
            <div style={{color:"var(--acero)",margin:"3px 0 8px",lineHeight:1.5}}>
              Sin esta marca, el paso 2 no las va a ver y la próxima exportación del día
              las va a repetir.
            </div>
            <button className="btn" onClick={()=>{ sellarRK(porSubir,true); marcarOrdenes(porSubir,"subida",true); }}>
              Ya las importé · marcar {porSubir.length} como subidas</button>
          </div>}

          {listas.some(o=>o.recibida) && <div style={{fontSize:11,color:"var(--gris)",marginTop:8}}>
            {listas.filter(o=>o.recibida).length} orden(es) ya recibidas.{" "}
            <button className="btn min"
              onClick={()=>marcarOrdenes(listas.filter(o=>o.recibida),"recibida",false)}>
              Desmarcar recibidas</button>
          </div>}

          {listas.some(o=>o.subida) && <div style={{fontSize:11,color:"var(--gris)",marginTop:8}}>
            {listas.filter(o=>o.subida).length} orden(es) ya subidas hoy.{" "}
            <button className="btn min"
              onClick={()=>marcarOrdenes(listas.filter(o=>o.subida),"subida",false)}>
              Desmarcar todas</button>
          </div>}

          <div style={{marginTop:14}}>
            {/* La configuración de DTW se quitó en nube-8: valores fijos, confirmados
                contra el template OWOR - ProductionOrders. */}
            {ES_IOS && <div className="avi neu" style={{marginTop:12,marginBottom:0,fontSize:11.5}}>
              <strong>Estás en iPad o iPhone.</strong> Bajá los archivos de a uno: iOS
              bloquea las descargas encadenadas.
              {window.isSecureContext
                ? <span> Si "Descargar" no hace nada, usá <strong>Compartir</strong> y
                    elegí Guardar en Archivos.</span>
                : <span> Compartir no aparece porque la página no está en https.
                    Publicada, ese botón te deja guardar en Archivos o mandar por AirDrop.
                    Mientras tanto, <strong>Copiar</strong> sí funciona.</span>}
            </div>}
          </div>
        </div>}

        {/* ── PASO 2 · RECEPCIÓN ── */}
        {ordenes.length>0 && <div className="card">
          <h3 style={{margin:"0 0 3px",fontSize:14}}>Paso 2 · Liberar y recibir</h3>
          <p style={{margin:"0 0 12px",fontSize:12,color:"var(--gris)"}}>
            Se hace después de importar las órdenes, porque necesita el <code>DocEntry</code> que
            SAP les asignó. El lote del producto nace aquí, con su vencimiento.</p>

          {porSubir.length>0 && <Aviso tipo="war">
            <strong style={{color:"var(--tinta)"}}>
              {porSubir.length} orden(es) no figuran acá</strong>
            <div style={{color:"var(--acero)",margin:"3px 0 8px",lineHeight:1.5}}>
              Están exportadas pero sin marcar como subidas, así que el paso 2 las ignora.
              Si ya las importaste en DTW, marcalas ahora y aparecen enseguida.
            </div>
            <button className="btn" onClick={()=>{ sellarRK(porSubir,true); marcarOrdenes(porSubir,"subida",true); }}>
              Ya las importé · marcar {porSubir.length} como subidas</button>
          </Aviso>}

          {porRecibir.length===0 && <div className="avi neu">
            {listas.length===0
              ? <span style={{color:"var(--acero)"}}>
                  Todavía no hay órdenes válidas en este día.</span>
              : porSubir.length>0
                ? <span style={{color:"var(--acero)"}}>
                    Las {porSubir.length} órdenes del día siguen pendientes de subir.
                    Hacé primero el paso 1 y marcalas como subidas; recién ahí aparecen acá.
                  </span>
                : <span style={{color:"var(--verde)"}}>
                    Todas las órdenes del día ya fueron recibidas. No queda nada pendiente.
                  </span>}
          </div>}

          {porRecibir.length>0 && <div>

          <div style={{marginBottom:12}}>
            <Lbl>Órdenes pendientes de recibir</Lbl>
            <div style={{border:"1px solid var(--borde)",borderRadius:3,overflow:"hidden"}}>
              {porRecibir.map((o,i)=>(
                <div key={o.id} style={{display:"flex",gap:8,alignItems:"baseline",
                     padding:"6px 9px",fontSize:11.5,
                     borderTop: i? "1px solid var(--borde)":"none",
                     background: o.docEntry ? "var(--panel)"
                                : o.tipo==="salida" ? "var(--morado-suave)"
                                : "var(--alerta-suave)"}}>
                  {/* El número es el RecordKey del pegado, no la posición en la
                      lista: una salida de cajón no ocupa lugar en la consulta
                      del día, y numerar por posición corría todo lo de abajo. */}
                  <span style={{fontFamily:"var(--mono)",color:"var(--gris)",width:22}}>
                    {o.tipo==="salida" ? "—" : conDocEntryHoy.findIndex(x=>x.id===o.id)+1}</span>
                  <span style={{fontFamily:"var(--mono)",fontWeight:600,width:78}}>
                    {o.codigo||"—"}</span>
                  <span style={{flex:1,color:"var(--acero)"}}>reg. {o.registro||"—"}</span>
                  <span style={{fontFamily:"var(--mono)",fontSize:11}}>
                    {o.docEntry
                      ? <span>DocEntry <strong>{o.docEntry}</strong>
                          {o.docNum && <span style={{color:"var(--gris)"}}> · DocNum {o.docNum}</span>}</span>
                      : o.tipo==="salida"
                        ? <span style={{color:"var(--morado)"}}>
                            salida de cajón · escribí el DocEntry en el registro</span>
                        : <span style={{color:"var(--alerta)"}}>sin DocEntry</span>}
                  </span>
                  {/* Sirve para las que ya se recibieron fuera de la app: sin esto
                      quedan trabadas pidiendo un DocEntry que ya no hace falta. */}
                  <button className="btn min" title="Sacarla de la lista: ya se recibió"
                    onClick={()=>marcarOrdenes([o],"recibida",true)}>ya recibida</button>
                </div>))}
            </div>
            <div style={{fontSize:11,color:"var(--gris)",marginTop:6,lineHeight:1.45}}>
              <strong>DocEntry y DocNum son números distintos.</strong> El que va a
              <code style={{fontFamily:"var(--mono)"}}> BaseEntry </code> es el
              <strong> DocEntry</strong>. Si se pega el DocNum, la recepción se asocia a otra
              orden y SAP la acepta sin quejarse: hay que cancelarla a mano.
              Si pegaste la consulta con encabezado, acá ves los dos y podés contrastarlos
              contra SAP.
            </div>
          </div>

          <div style={{border:"1px solid var(--queso)",borderRadius:3,
                       padding:12,marginBottom:14,background:"var(--queso-suave)"}}>
            <strong style={{fontSize:13}}>2a · Liberar las órdenes</strong>
            <p style={{margin:"3px 0 10px",fontSize:11.5,color:"var(--acero)",lineHeight:1.5}}>
              Obligatorio antes de recibir. SAP crea todas las órdenes en estado
              Planificado y no acepta crearlas liberadas
              (<em>"can be created in planned status only"</em>); pero tampoco deja
              recibir una Planificada (<em>"status should be Released"</em>).
              Se resuelve con esta corrida aparte.
            </p>
            <div style={{background:"var(--panel)",border:"1px solid var(--borde)",
                         borderRadius:3,padding:"8px 10px",marginBottom:10,fontSize:11.5}}>
              <strong>En DTW:</strong> objeto <strong>Production · Production Orders</strong>,
              el mismo del paso 1. Pero elegí <strong>Update existing data</strong>, no
              <em> Add new data</em>. El archivo va en la fila del padre
              (<code style={{fontFamily:"var(--mono)"}}>ProductionOrders</code>); la fila de
              las líneas se deja vacía.
            </div>
            {liberar.length>1
              ? <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")} base={"LIBERAR_ProductionOrders_"+fecha} filas={liberar}
                  fmt={fmtArch} bom={conBom} doble={dobleEnc}
                  nota="Objeto Production Orders · modo Update existing data, NO Add new data."
                  onVer={()=>setVista(vista==="LIB"?"":"LIB")} viendo={vista==="LIB"}/>
              : <div style={{fontSize:11.5,color:"var(--acero)"}}>
                  Necesita el DocEntry. Pegalo abajo y el archivo aparece acá.</div>}
            {vista==="LIB" && <pre style={{marginTop:0}}>{tabla(liberar,fmtArch,dobleEnc)}</pre>}
          </div>

          {aCancelar.length>0 && <div style={{marginBottom:14}}>
            <Lbl>Órdenes creadas con el producto equivocado</Lbl>
            <div style={{fontSize:11.5,color:"var(--acero)",margin:"2px 0 8px",lineHeight:1.5}}>
              Se rehicieron con el producto correcto. Las anteriores hay que cancelarlas en
              SAP, para que la entrega de componentes y la recepción vayan contra la orden
              buena. Si a la vieja ya se le habían entregado componentes, cancelá esas
              emisiones antes de subir el archivo: con movimientos, DTW la rechaza.
            </div>
            {archCancelar.length>1 &&
              <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")}
                base={"CANCELAR_ProductionOrders_"+fecha} filas={archCancelar}
                fmt={fmtArch} bom={conBom} doble={dobleEnc}
                nota="Objeto Production Orders · modo Update existing data. Cancela las órdenes con el producto equivocado."
                onVer={()=>setVista(vista==="CAN"?"":"CAN")} viendo={vista==="CAN"}/>}
            {vista==="CAN" && <pre style={{marginTop:0}}>{tabla(archCancelar,fmtArch,dobleEnc)}</pre>}
            {noCancelables.length>0 && <div className="avi err" style={{marginTop:8}}>
              <strong style={{color:"var(--alerta)"}}>
                {noCancelables.length} orden(es) ya tenían recepción</strong>
              <div style={{color:"var(--acero)",marginTop:3,lineHeight:1.5}}>
                SAP no deja cancelar una orden con producto recibido. En este orden: cancelá la
                recepción de producción (Datos → Cancelar), después las emisiones de componentes
                si las hubo, y marcá en el registro que ya está revertida. Ahí entra al archivo.
                No uses una salida de mercancía: no queda ligada a la orden.
              </div>
              {noCancelables.map(o=>
                <div key={o.id} style={{fontFamily:"var(--mono)",fontSize:11,marginTop:3}}>
                  · reg. {o.registro||"—"} · DocEntry {o.correccion.docEntry} ·{" "}
                  {o.correccion.codigo} → {o.codigo}</div>)}
            </div>}
          </div>}

          <div className="avi neu" style={{fontSize:11.5}}>
            <strong>Cómo sacar el DocEntry.</strong> No es el mismo número que ves en pantalla
            (ese es el DocNum). Corré esta consulta en SAP B1 sobre HANA:
            <pre style={{margin:"6px 0 0",fontSize:10.5,whiteSpace:"pre-wrap"}}>{CONSULTA(fecha)}</pre>
            <div style={{marginTop:7}}>
              Guardala una vez en SAP (Herramientas → Consultas → Administrador de consultas):
              <code style={{fontFamily:"var(--mono)"}}> [%0] </code> hace que pida la fecha cada vez.
              Copiá el resultado <strong>completo, con el encabezado</strong>: la app empareja
              cada DocEntry por artículo (<code style={{fontFamily:"var(--mono)"}}>ItemCode</code>),
              registro (<code style={{fontFamily:"var(--mono)"}}>Comments</code>) y cantidad, no
              por posición. También sirve pegar tres columnas sin encabezado: RecordKey,
              DocEntry y artículo (p. ej. <code style={{fontFamily:"var(--mono)"}}>1 95705 TIQ0150</code>).
              Las órdenes ya liberadas (de una subida anterior del día) se saltan solas.
              Revisá la vista previa antes de aplicar.
            </div>
            <button className="btn min" style={{marginTop:7}}
              onClick={async()=>{ await copiar(CONSULTA(fecha)); }}>Copiar la consulta</button>
          </div>

          <div style={{fontWeight:600,fontSize:13,margin:"4px 0 6px"}}>
            2b · Recibir el producto terminado</div>
          <Lbl>Pegá el resultado de la consulta, con encabezado — {conDocEntryHoy.length} orden(es) del día</Lbl>
          {porRecibir.length>conDocEntryHoy.length &&
            <div style={{fontSize:11.5,color:"var(--acero)",marginTop:-6,marginBottom:8,
                 lineHeight:1.45}}>
              Son las mismas {conDocEntryHoy.length} que se subieron en el OWOR. Las{" "}
              {porRecibir.length-conDocEntryHoy.length} salida(s) de cajón no entran acá:
              su orden es de semanas atrás y su DocEntry se escribe dentro del registro.
            </div>}
          <textarea rows={4} value={pegado} onChange={e=>setPegado(e.target.value)}
            placeholder={"DocEntry\tDocNum\tItemCode\tPlannedQty\tComments\n95705\t86103\tTIQ0150\t95\tRegistro de produccion N 4"}
            style={{fontFamily:"var(--mono)",fontSize:12,resize:"vertical"}}/>
          <VistaPegado texto={pegado} destinos={conDocEntryHoy} todas={ordenes}/>
          <div style={{display:"flex",gap:8,alignItems:"center",marginTop:8,flexWrap:"wrap"}}>
            <button className="btn sec" onClick={aplicarDocEntry} disabled={!pegado.trim()}>
              Aplicar DocEntry</button>
            {avisoPegar && <span style={{fontSize:11.5,color:"var(--verde)"}}>{avisoPegar}</span>}
          </div>

          <div style={{margin:"14px 0 10px",fontFamily:"var(--mono)",fontSize:11,
                       color: recibibles.length ? "var(--verde)" : "var(--gris)"}}>
            {recibibles.length} de {porRecepcion.length} orden(es) lista(s) para recibir
          </div>

          {porRecepcion.length>recibibles.length && <Aviso tipo="war">
            <strong>Falta información en {porRecepcion.length-recibibles.length} orden(es)</strong>
            <ul style={{margin:"5px 0 0",paddingLeft:17,color:"var(--acero)"}}>
              {porRecepcion.filter(o=>listaParaRecibir(o).length).slice(0,6).map(o=>
                <li key={o.id}>{o.codigo||"sin código"} (reg. {o.registro||"—"}):{" "}
                  {listaParaRecibir(o).join(", ")}</li>)}
            </ul>
          </Aviso>}

          {sinDocEntry>0 && <Aviso tipo="err">
            <strong style={{color:"var(--alerta)"}}>
              {sinDocEntry} de {porRecepcion.length} orden(es) sin DocEntry</strong>
            <div style={{color:"var(--acero)",marginTop:3}}>
              Podés ver los archivos para revisar la estructura, pero la columna
              <code style={{fontFamily:"var(--mono)"}}> BaseEntry </code>
              va vacía en esas filas y DTW las va a rechazar. Pegá los DocEntry arriba
              antes de subirlos.</div>
          </Aviso>}

          <div>
            <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")} base={"OIGN_Documents_"+fecha} filas={rec.oign} fmt={fmtArch} bom={conBom} doble={dobleEnc}
              nota="Va en la fila Documents del paso 4."
              onVer={()=>setVista(vista==="OIGN"?"":"OIGN")} viendo={vista==="OIGN"}/>
            <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")} base={"IGN1_Document_Lines_"+fecha} filas={rec.ign1} fmt={fmtArch} bom={conBom} doble={dobleEnc}
              nota="Va en Document_Lines. Lleva BaseType 202 y el BaseEntry de cada orden."
              onVer={()=>setVista(vista==="IGN1"?"":"IGN1")} viendo={vista==="IGN1"}/>
            <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")} base={"BTNT_BatchNumbers_"+fecha} filas={rec.btnt} fmt={fmtArch} bom={conBom} doble={dobleEnc}
              nota="Va en BatchNumbers. El lote nuevo con su vencimiento. SerialNumbers se deja vacío."
              onVer={()=>setVista(vista==="BTNT"?"":"BTNT")} viendo={vista==="BTNT"}/>
          </div>

          <div className="avi neu" style={{fontSize:11.5,marginTop:4}}>
            <strong>En DTW:</strong> objeto <strong>Inventory · Goods Receipt</strong>
            (no Goods Issue, que es la salida). Tipo de archivo
            <code style={{fontFamily:"var(--mono)"}}> txt (Tab delimited)</code>.
            Los tres van en la misma corrida, cada uno en su fila. Corré
            <strong> Run Simulation</strong> antes de importar.
          </div>
          {salidasSinDocEntry.length>0 && <div className="avi war" style={{marginTop:12}}>
            <strong style={{color:"var(--tinta)"}}>
              {salidasSinDocEntry.length} salida(s) de cajón sin DocEntry</strong>
            <div style={{color:"var(--acero)",margin:"3px 0 6px",lineHeight:1.5}}>
              Su orden se creó semanas atrás, así que el número NO sale de la consulta de
              hoy ni del pegado: hay que escribirlo dentro de cada registro. Si se dejan
              así, la recepción quedaría sin documento contra el cual aplicarse.
            </div>
            {salidasSinDocEntry.map(o=>
              <div key={o.id} style={{fontFamily:"var(--mono)",fontSize:11,
                   color:"var(--acero)"}}>
                · reg. {o.registro||"—"} · {o.codigo} · lote {o.lote||"—"}
                {o.docNum ? " · DocNum de la hoja: " + o.docNum : " · sin DocNum en la hoja"}
              </div>)}
          </div>}

          {enCajon.length>0 && <div className="avi esp" style={{marginTop:12}}>
            <strong style={{color:"var(--tinta)"}}>
              {enCajon.length} orden(es) esperando salir del cajón</strong>
            <div style={{color:"var(--acero)",margin:"3px 0 6px",lineHeight:1.5}}>
              Se crean y se liberan hoy, pero NO se reciben: el producto sale del cajón
              en unas semanas y ahí se recibe, con su hoja de salida. Quedan pendientes
              a propósito; no las marqués como recibidas.
            </div>
            {enCajon.map(o=>
              <div key={o.id} style={{fontFamily:"var(--mono)",fontSize:11,
                   color:"var(--acero)"}}>
                · {o.codigo} · lote {o.lote||"—"} · cajón {o.cajon||"—"}
                {o.docEntry ? " · DocEntry " + o.docEntry : " · sin DocEntry"}
              </div>)}
          </div>}

          {ajuste.length>1 && <div style={{marginTop:12,marginBottom:12,
                border:"1px solid var(--morado)",borderRadius:3,padding:12,
                background:"var(--morado-suave)"}}>
            <strong style={{fontSize:13}}>Ajustar la cantidad planificada</strong>
            <p style={{margin:"3px 0 10px",fontSize:11.5,color:"var(--acero)",lineHeight:1.5}}>
              Las salidas de cajón traen la cantidad real, que reemplaza a la estimada por
              merma cuando se creó la orden. Se sube con <strong>Update existing data</strong>
              sobre Production Orders, antes de la recepción.
            </p>
            <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")} base={"AJUSTE_ProductionOrders_"+fecha} filas={ajuste}
              fmt={fmtArch} bom={conBom} doble={dobleEnc}
              nota="Modo Update existing data. Corrige PlannedQuantity con lo que salió del cajón."
              onVer={()=>setVista(vista==="AJU"?"":"AJU")} viendo={vista==="AJU"}/>
            {vista==="AJU" && <pre style={{marginTop:0}}>{tabla(ajuste,fmtArch,dobleEnc)}</pre>}
          </div>}

          {recibibles.length>0 && <div className="avi war" style={{marginTop:10}}>
            <strong style={{color:"var(--tinta)"}}>Después de importar la recepción</strong>
            <div style={{color:"var(--acero)",margin:"3px 0 8px"}}>
              Marcalas para que no vuelvan a salir en el próximo archivo.</div>
            <button className="btn" onClick={()=>marcarOrdenes(recibibles,"recibida",true)}>
              Marcar {recibibles.length} como recibidas</button>
          </div>}

          </div>}

          {comps.length>1 && <div style={{marginTop:16,paddingTop:12,
                borderTop:"1px solid var(--borde)"}}>
            <strong style={{fontSize:13}}>Entrega de componentes</strong>
            <p style={{margin:"3px 0 10px",fontSize:11.5,color:"var(--acero)",lineHeight:1.5}}>
              Mientras la emisión por DTW siga pendiente, esta hoja sirve para cargarla a
              mano en SAP. Va ordenada por DocEntry, el mismo orden en que vas a encontrar
              las órdenes. La columna <code style={{fontFamily:"var(--mono)"}}>EnLaOrden</code>
              marca con NO los componentes que se excluyeron del archivo: a esos hay que
              agregarlos a la orden antes de entregarlos.
            </p>
            <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")} base={"COMPONENTES_"+fecha} filas={comps}
              fmt={fmtArch} bom={conBom} doble={false}
              nota="NO se sube a DTW. Es para trabajar al lado de SAP."
              onVer={()=>setVista(vista==="COMP"?"":"COMP")} viendo={vista==="COMP"}/>
            {vista==="COMP" && <pre style={{marginTop:0}}>{tabla(comps,fmtArch,false)}</pre>}
          </div>}

          <p style={{margin:"14px 0 0",fontSize:11,color:"var(--gris)",lineHeight:1.5}}>
            Los tres se suben juntos en la misma corrida. La emisión de componentes queda
            pendiente hasta que los lotes de materia prima existan en el sistema.
          </p>
          <p style={{margin:"12px 0 0",fontSize:11,color:"var(--gris)",lineHeight:1.5}}>
            El archivo exportado es el respaldo serio: viaja entre computadoras y no
            se pierde al limpiar el navegador.</p>
        </div>}

        {/* Paso aparte, al final del día: a veces falta la foto del pesaje de
            un proveedor y no conviene mezclarlo con la creación de órdenes. */}
        {/* Va en su propia tarjeta y siempre visible: se usa DESPUÉS de recibir,
            cuando ya no queda nada pendiente y el paso 2 se esconde. Los datos
            salen de la consulta de SAP, no de las órdenes del día. */}
        {!soloLectura && <div className="card">
          <RevertirRecepciones fmt={fmtArch} fmtFecha={fmtFecha} bom={conBom}
            doble={dobleEnc} claveOrd={claveOrd} colCom1={colCom1}/>
        </div>}

        {ordenes.length>0 && <div className="card">
          <h3 style={{margin:"0 0 3px",fontSize:14}}>Paso 3 · Entrega de componentes</h3>
          <p style={{margin:"0 0 12px",fontSize:12,color:"var(--gris)",lineHeight:1.45}}>
            Se corre al final, con todo transcrito. Entrega solo contra existencias
            reales y va descontando: si un lote se usó en cuatro registros, el cuarto
            ve lo que dejaron los tres anteriores.
          </p>

          {!inventario
            ? <div>
                <div className="avi neu" style={{fontSize:11.5,marginBottom:10,lineHeight:1.5}}>
                  Hace falta el Excel de <strong>Inventario en stock por lote</strong> de SAP.
                  Se leen los almacenes 02 (Cámara A), 05 (Empaque y Transformación #1)
                  y 11 (Bodega de suministros).
                </div>
                <input type="file" accept=".xlsx,.xls" onChange={async ev=>{
                  const f = ev.target.files && ev.target.files[0];
                  if(!f) return;
                  try{
                    setInvCargando(true);
                    const inv = leerInventario(new Uint8Array(await f.arrayBuffer()));
                    setInventario(inv);
                  }catch(e){ alert("No se pudo leer el archivo: " + e.message); }
                  finally{ setInvCargando(false); }
                }}/>
                {invCargando && <div style={{fontSize:12,marginTop:8}}>Leyendo…</div>}
              </div>
            : <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",
                     fontSize:11.5,color:"var(--gris)",marginBottom:10}}>
                  <span>{inventario.guardadas} lotes con existencia · cargado {inventario.cuando}</span>
                  <button className="btn min" onClick={()=>setInventario(null)}>Cambiar archivo</button>
                </div>

                {(() => {
                  const plan = planEntrega(listas, inventario);
                  const porEstado = {};
                  plan.lineas.forEach(l => { porEstado[l.estado] = (porEstado[l.estado]||0)+1; });
                  const problemas = plan.lineas.filter(l => l.estado !== "listo");
                  const emision = construirEmision(plan, fmtArch, colCom1, colCom2);
                  const sinDoc = plan.lineas.filter(l => l.entregar>0 && !l.orden.docEntry).length;

                  return <div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                      {Object.entries(porEstado).map(([e,n]) =>
                        <span key={e} className="chip"
                          style={{color: e==="listo" ? "var(--verde)"
                                 : e==="revisar el lote" ? "var(--queso)" : "var(--alerta)"}}>
                          {n} {e}</span>)}
                    </div>

                    {problemas.length>0 && <div className="avi war" style={{marginBottom:10}}>
                      <strong style={{color:"var(--tinta)"}}>
                        {problemas.length} componente(s) para revisar</strong>
                      {/* Con el empaque comprado en kg y consumido por unidad
                          la lista es larga por diseño: se deja desplazable en
                          vez de recortarla a los primeros. */}
                      <div style={{marginTop:5,maxHeight:340,overflowY:"auto",
                           paddingRight:6}}>
                        {problemas.map((l,i) =>
                          <div key={i} style={{fontSize:11.5,lineHeight:1.5,marginTop:3}}>
                            <span style={{fontFamily:"var(--mono)"}}>reg. {l.registro} ·{" "}
                            {l.codigo} · {l.loteHoja||"sin lote"}</span>{" — "}
                            {l.estado === "error" ? "no se pudo calcular: " + l.detalleError
                             : l.estado === "sin lote" ? "ese lote no está en el inventario"
                             : l.estado === "lote ambiguo"
                               ? "podría ser " + (l.candidatos||[]).slice(0,3).join(" o ")
                             : l.estado === "sin existencia" ? "el lote ya no tiene saldo"
                             : l.estado === "alcanza a medias"
                               ? "pide " + l.pedido + " y quedan " + l.entregar
                             : "se encontró por " + l.como + ": " +
                               (l.usados||[]).map(u=>u.lote).join(", ")}
                          </div>)}
                      </div>
                    </div>}

                    {plan.omitidos.length>0 &&
                      <div style={{fontSize:11.5,color:"var(--gris)",marginBottom:10,
                           lineHeight:1.5}}>
                        {plan.omitidos.length} componente(s) quedan fuera de la entrega por
                        no salir de inventario:{" "}
                        {[...new Set(plan.omitidos.map(x=>x.codigo))].join(", ")}.
                      </div>}

                    {sinDoc>0 && <div className="avi err" style={{marginBottom:10}}>
                      {sinDoc} componente(s) pertenecen a órdenes sin DocEntry: primero hay que
                      crear y liberar esas órdenes.
                    </div>}

                    {emision.ige1.length>1 ? <div>
                      <div className="avi neu" style={{fontSize:11.5,marginBottom:10}}>
                        <strong>En DTW:</strong> objeto{" "}
                        <strong>Inventory · Inventory Genexit</strong>, modo{" "}
                        <strong>Add new data</strong>. Los tres archivos juntos.
                      </div>
                      <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")}
                        base={"OIGE_IssueForProduction_"+fecha} filas={emision.oige}
                        fmt={fmtArch} bom={conBom} doble={dobleEnc}
                        nota={emision.ordenes + " documento(s), uno por orden"}
                        onVer={()=>setVista(vista==="OIGE"?"":"OIGE")} viendo={vista==="OIGE"}/>
                      {vista==="OIGE" && <pre style={{marginTop:0}}>{tabla(emision.oige,fmtArch,dobleEnc)}</pre>}
                      <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")}
                        base={"IGE1_IssueForProduction_Lines_"+fecha} filas={emision.ige1}
                        fmt={fmtArch} bom={conBom} doble={dobleEnc}
                        nota="Una línea por lote consumido"
                        onVer={()=>setVista(vista==="IGE1"?"":"IGE1")} viendo={vista==="IGE1"}/>
                      {vista==="IGE1" && <pre style={{marginTop:0}}>{tabla(emision.ige1,fmtArch,dobleEnc)}</pre>}
                      <Archivo antesDeBajar={()=>confirmarSinRevisar("Descargar")}
                        base={"BTNT_IssueForProduction_"+fecha} filas={emision.btnt}
                        fmt={fmtArch} bom={conBom} doble={dobleEnc}
                        nota="Los lotes de cada línea"
                        onVer={()=>setVista(vista==="BTE"?"":"BTE")} viendo={vista==="BTE"}/>
                      {vista==="BTE" && <pre style={{marginTop:0}}>{tabla(emision.btnt,fmtArch,dobleEnc)}</pre>}
                    </div>
                    : <div className="avi war">Todavía no hay nada que entregar.</div>}
                  </div>;
                })()}
              </div>}
        </div>}

      </div>}

      {orden && <div>
        <button className="btn sec" style={{marginBottom:12}} onClick={()=>setActiva(null)}>
          ← Volver al panel del día</button>
        <EditorOrden orden={orden} onCambio={actualizar} foto={fotos[orden.id]} todas={ordenes} dia={fecha} col1={colCom1} col2={colCom2} histCajon={histCajon}
          onAgregarRecortes={()=>{const r=recortesDe(orden);setOrdenes(os=>[...os,r]);setFotos(f=>({...f,[r.id]:fotos[orden.id]}));setActiva(r.id);}}
          onBorrar={()=>{ if(confirm("¿Eliminar esta orden?")){
            setOrdenes(os=>os.filter(x=>x.id!==orden.id)); setActiva(null); } }}
          onUnir={(base,idsAbsorbidos,extra)=>{
            if(!confirm("Se agregarán " + extra.length + " componente(s) a este registro y " +
                        "se borrará" + (idsAbsorbidos.length>1?"n ":" ") +
                        idsAbsorbidos.length + " registro(s). ¿Seguir?")) return;
            setOrdenes(os => os
              .filter(x => !idsAbsorbidos.includes(x.id))
              .map(x => x.id === base.id
                ? {...x, componentes:[...(x.componentes||[]), ...extra]} : x));
            /* Las fotos de las hojas absorbidas se conservan: sin ellas no hay
               cómo cotejar los lotes que vinieron de la segunda. */
            setFotos(f => {
              const junta = [];
              [base.id, ...idsAbsorbidos].forEach(id => {
                const v = f[id];
                (Array.isArray(v) ? v : [v]).filter(Boolean)
                  .forEach(u => { if(!junta.includes(u)) junta.push(u); });
              });
              const nuevo = {...f, [base.id]: junta};
              idsAbsorbidos.forEach(id => { delete nuevo[id]; });
              return nuevo;
            });
          }}/>

        {/* Un registro largo obliga a subir hasta arriba para salir. */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:4,marginBottom:24}}>
          <button className="btn" onClick={()=>setActiva(null)}>
            ← Volver al panel del día</button>
          <button className="btn sec" onClick={()=>window.scrollTo({top:0,behavior:"smooth"})}>
            Ir al inicio del registro</button>
        </div>
      </div>}
    </main>
  </div>;
}

try{
  ReactDOM.createRoot(document.getElementById("root"))
    .render(<Salvavidas><PuertaNube titulo="Órdenes de producción" version={"v"+VERSION_ARCHIVO}><App/></PuertaNube></Salvavidas>);
  window.__appLista = true;                     /* apaga el vigilante */
  const arranque = document.getElementById("arranque");
  if(arranque) arranque.remove();
}catch(e){
  /* Sin consola en iPad: el error tiene que verse en la propia pagina. */
  document.getElementById("root").innerHTML =
    '<div style="font:14px/1.6 -apple-system,sans-serif;padding:20px;color:#B3441A">' +
    '<strong>Error al iniciar la aplicacion</strong><br>' +
    String(e).replace(/</g,"&lt;") + '</div>';
}
</script>
</body>
</html>
