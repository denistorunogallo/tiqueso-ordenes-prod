async function leerBoletaIA({imagenes, apiKey, modelo, tipoHoja, mitades, alAvanzar}){
  const partes = [];
  imagenes.forEach(im=>{
    partes.push({type:"image",
      source:{type:"base64",media_type:im.mediaType,data:im.base64}});
    if(mitades && Array.isArray(im.mitades))
      im.mitades.forEach(h=>partes.push({type:"image",
        source:{type:"base64",media_type:h.mediaType,data:h.base64}}));
  });

  const nota = (mitades && imagenes.some(i=>i.mitades))
    ? " Después de la hoja completa van dos recortes de LA MISMA hoja: la mitad " +
      "de arriba y la mitad de abajo, con solape. Son la misma boleta vista más " +
      "de cerca, NO hojas distintas: usalas para leer mejor, sin duplicar registros."
    : "";

  const contenido = [
    ...partes,
    {type:"text",text:"Transcribí esta boleta de producción siguiendo las reglas. Solo JSON." + nota
      + (tipoHoja==="rallado"   ? " Esta hoja es de RALLADO: devolvé un solo registro." : "")
      + (tipoHoja==="fraccionado" ? " Esta hoja es de FRACCIONADO: devolvé cada producto con su registro de recortes, hasta dos parejas." : "")}
  ];
  const sistema = systemPrompt();

  async function intento(cualModelo){
    const data = await llamarAPI({contenido, sistema, modelo:cualModelo, apiKey, alAvanzar});

    /* Antes se filtraba solo el texto y se ignoraba todo lo demás: si venía
       vacío no había forma de saber por qué. */
    if(data && data.error)
      throw Object.assign(new Error("La API devolvió un error: " +
        (data.error.message || data.error.type || "sin detalle")), {duro:true});

    const bloques = Array.isArray(data.content) ? data.content : [];
    const txt = bloques.filter(b=>b.type==="text").map(b=>b.text).join("");

    if(!txt.trim()){
      const razon = data && data.stop_reason;
      const tipos = bloques.map(b=>b.type).join(", ") || "ninguno";
      let msg;
      if(razon === "max_tokens")
        msg = "La respuesta se cortó por longitud antes de escribir nada. " +
              "Probá con una foto por hoja, o partí la boleta en dos tomas.";
      else if(razon === "refusal")
        msg = "El modelo se negó a responder sobre esta imagen. " +
              "Suele pasar si la foto salió muy borrosa o no se reconoce como una boleta.";
      else
        msg = "El modelo no devolvió texto (stop_reason: " + (razon || "desconocido") +
              ", bloques: " + tipos + "). Revisá que la foto se vea completa y nítida.";
      throw new Error(msg);
    }
    const j = repararJSON(txt);
    if(!j){
      const muestra = (txt||"").trim().slice(0,160).replace(/\s+/g," ");
      throw new Error("La respuesta no vino en formato válido. Empezaba así: «" +
        (muestra || "(vacía)") + "»");
    }
    return {json:j, uso:data.usage||null};
  }

  /* El reintento va con Opus, como en Salidas y Entradas: si Sonnet falló con
     esta foto, repetir con el mismo modelo suele fallar igual. Se usa Opus 5.5
     y no Opus 5 porque cuesta 20% menos —$4/$20 contra $5/$25 por millón— y es
     posterior. Solo se paga cuando hay falla. */
  const MODN = modelosDe("ordenes");   /* modelos configurados por el admin (o los seguros) */
  const principal = (!modelo || modelo==="nube") ? MODN.principal : modelo;
  const respaldo = /opus/.test(principal) ? principal : MODN.respaldo;

  try{ return await intento(principal); }
  catch(e){
    if(e.duro) throw e;
    return await intento(respaldo);
  }
}

/* ══════════════ MÓDULO: app.js — validaciones + piezas de UI ══════════════ */

const MAX_COM = 254;
const ALMACEN_DEFECTO = "02";   /* todos los productos; ya viene en la receta */

/* DTW espera las fechas en AAAAMMDD. Se deja configurable porque algunas
   instalaciones aceptan AAAA-MM-DD y conviene poder probar las dos.        */
function fechaDTW(iso, formato){
  if(!iso) return "";
  return formato==="guiones" ? iso : iso.replace(/-/g,"");
}

/* ¿Esta orden está lista para recibirse? Necesita el DocEntry que SAP asignó
   a la orden de producción, más el lote del producto terminado.            */
/* El DocEntry pegado es de una orden de otro artículo. */
function docEntryAjeno(o){
  return !!(o.docEntry && o.docEntryCodigo && o.codigo &&
            String(o.docEntryCodigo).trim().toUpperCase() !== String(o.codigo).trim().toUpperCase());
}
function listaParaRecibir(o){
  const faltan=[];
  if(!o.docEntry) faltan.push("DocEntry de la orden");
  else if(docEntryAjeno(o))
    faltan.push("el DocEntry " + o.docEntry + " es de una orden de " + o.docEntryCodigo +
                ", no de " + o.codigo + " (volvé a pegar la consulta)");
  if(!o.lote) faltan.push("lote del producto");
  if(!o.codigo) faltan.push("código");
  if(!cantidadDe(o)) faltan.push("cantidad");
  return faltan;
}
/* La fecha de trabajo es el día en Costa Rica (UTC−6, sin horario de verano),
   no en UTC. Con toISOString() a las 7 pm de CR ya se veía el día siguiente,
   porque en UTC era la 1 am.                                               */
const ZONA = "America/Costa_Rica";

function hoy(){
  try{
    /* en-CA da el formato AAAA-MM-DD */
    return new Intl.DateTimeFormat("en-CA",{timeZone:ZONA,
      year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  }catch(e){
    /* si Intl no tiene la zona, se corre a mano: CR es UTC−6 todo el año */
    return new Date(Date.now() - 6*3600*1000).toISOString().slice(0,10);
  }
}

function ahoraHHMM(){
  try{
    return new Intl.DateTimeFormat("en-GB",{timeZone:ZONA,hour:"2-digit",
      minute:"2-digit",hour12:false}).format(new Date());
  }catch(e){
    return new Date(Date.now() - 6*3600*1000).toISOString().slice(11,16);
  }
}
/* id único garantizado (antes: 7 caracteres al azar; con la nube podían repetirse entre días) */
let _uidSeq=0;
const uid = () => Date.now().toString(36)+"-"+(_uidSeq++).toString(36)+"-"+Math.random().toString(36).slice(2,8);

const COMP_VACIO = () => ({id:uid(), material:"", lote:"", codigo:"", cantidad:"",
  unidad:"",        /* "kg" o "unid", tal como está anotado en la hoja */
  excluido:false,   /* queda en el registro pero no viaja al archivo de DTW */
  incompleto:"",    /* "", "lote", "cantidad" o "ambos": qué quedó mal anotado */
  proveedor:"",     /* la hoja de cajón lo escribe; en las demás sale del lote */
  revisado:false});

/* tipo: "rallado" | "fraccionado" | "recortes"
   hoja: id de la foto de origen — agrupa las órdenes que salieron de la misma boleta
   pareja: en fraccionados, 1 o 2 (una hoja tiene espacio para dos parejas)      */
const ORDEN_VACIA = () => ({
  id:uid(), revisada:false, tipo:"rallado", hoja:"", pareja:1, parcial:false,
  loteRevisado:false,   /* el lote del producto terminado se cotejó contra la foto */
  horarioConfirmado:false, /* se cotejó un horario fuera de la jornada usual */
  /* Gente que ayudó solo un rato, con su propio horario: la boleta lo anota en
     observaciones porque no cabe en las casillas de responsable. */
  apoyos:[],            /* [{nombre, desde, hasta}] en HH:MM */
  /* Una orden que ya se subió con el producto equivocado: lo que había en SAP,
     para poder cancelarla y rehacerla sin perder el rastro. */
  correccion:null,      /* {codigo, lote, docEntry, recibida} de la orden mala */
  enEspera:false,       /* apartado a propósito: no entra en ningún archivo */
  motivoEspera:"",      /* por qué se apartó, para que no se olvide */
  /* Dónde va cada orden en el camino a SAP. Sirve para no volver a subir lo
     mismo cuando se exporta varias veces a lo largo del día. */
  subida:false,     /* la orden ya se importó con OWOR/WOR1 */
  recibida:false,   /* ya se hizo la recepción del producto terminado */
  registro:"", docNum:"", docEntry:"", serie:"", tipoOrden:"S", almacen:ALMACEN_DEFECTO,
  /* ItemCode que SAP dice que tiene la orden de ese DocEntry (lo trae el pegado
     de la consulta). Si no coincide con el código del registro, la recepción
     se bloquea: entraría el artículo de otra orden con el lote de esta. */
  docEntryCodigo:"",
  /* RecordKey con que salió en el OWOR y cuándo se armó ese archivo. Queda
     guardado en la orden, así no depende del orden de la lista en pantalla. */
  rkOwor:"", tandaOwor:"",
  producto:"", presentacion:"", marca:"", lote:"", codigo:"", cajon:"",
  /* Salidas de cajón: a veces sacan una parte y el resto queda adentro. */
  salidaFinal:true,    /* false = queda producto en el cajón */
  kgEntraronCajon:"",  /* para comparar contra lo que salió semanas después */
  sacadoAntes:"",      /* kg que ya habían salido de este mismo lote */
  /* Deshidratado: "" normal · "entrada" el queso va al cajón · "salida" sale */
  flujo:"", cajon:"", cajon:"",
  cvo:"", cantidadKg:"", unidades:"", cantidadPlan:"", mpKg:"",
  fechaElaboracion:"", fechaVencimiento:"", horaInicio:"", horaFin:"",
  colaboradores:"", revisadoPor:"",
  comentario1:"", comentario2:"", auto1:true, auto2:true, autoCant:true,
  fechaOriginal:"",     /* lo que decía la boleta, si hubo que corregir la fecha */
  marcaOriginal:"",     /* idem con la marca, cuando la etiqueta decía otra */
  observacionesHoja:"", /* lo que dice el renglón OBSERVACIONES de la boleta */
  observaciones:"",     /* lo que escribe quien digita; va al reporte */
  componentes:[COMP_VACIO()], dudas:[]
});

/* --- Comentarios SAP -------------------------------------------------- */
function armarCom1(o){
  return (o.registro ? `Registro de produccion N ${o.registro}` : "").slice(0,MAX_COM);
}
function armarCom2(o){
  const p=desglosarLote(o.lote), t=[];
  if(p) t.push(`Tanda ${p.t}`);
  /* Con una sola hora se escribe lo que hay, sin inventar un "?" que después
     queda impreso en SAP. */
  if(o.horaInicio && o.horaFin) t.push(`Horario ${o.horaInicio}-${o.horaFin}`);
  else if(o.horaInicio) t.push(`Desde ${o.horaInicio}`);
  else if(o.horaFin) t.push(`Hasta ${o.horaFin}`);
  /* Se escriben los nombres ya resueltos y sin repetir: en SAP quedaba
     "Shirley, Tania, Shirley", y el mismo Ervin aparecía como "Erving" según
     la boleta. El comentario es lo que después se lee en el sistema. */
  const gente = colaboradoresDe(o.colaboradores).map(g => g.canonico || g.leido);
  if(gente.length) t.push(`Colaboradores: ${gente.join(", ")}`);
  return t.join(" · ").slice(0,MAX_COM);
}
/* PlannedQuantity: granel → casilla "Cantidades" (kg) · peso fijo → "Unidades" */
function cantidadAuto(o){
  /* La salida del cajón trae la cantidad real: es la que se recibe. */
  if(o.tipo==="salida") return o.cantidadKg||"";
  /* En el deshidratado la planificada sale de la merma, no de una casilla. */
  if(o.tipo==="deshidratado"){
    const m = planificadaDeshidratado(o.componentes);
    return m ? String(m.sale) : "";
  }
  const g = esGranel(o.codigo, entradaCatalogo(o.lote,o.codigo));
  if(g===null) return "";
  return g ? (o.cantidadKg||"") : (o.unidades||"");
}
/* Se normaliza el número: la hoja dice 0.600 y SAP no necesita los ceros. */
function numero(v){
  const n = parseFloat(v);
  return (v === "" || v === null || v === undefined || isNaN(n)) ? (v || "") : String(n);
}
const cantidadDe = o => numero(o.autoCant===false ? (o.cantidadPlan||"") : cantidadAuto(o));

const com1De = o => o.auto1 ? armarCom1(o) : o.comentario1;
const com2De = o => o.auto2 ? armarCom2(o) : o.comentario2;

/* --- Motor de validación ---------------------------------------------- */
/* nivel 'err' = impide exportar · 'war' = revisar                        */

function validarOrden(o, todas, diaDelPanel){
  const catE = entradaCatalogo(o.lote,o.codigo);
  const A=[]; const err=(m,s)=>A.push({nivel:"err",msg:m,sug:s});
  const war=(m,s)=>A.push({nivel:"war",msg:m,sug:s});

  /* -- lote -- */
  const p = desglosarLote(o.lote);
  if(!o.lote) err("Falta el lote del producto terminado.");
  else if(!p) err(`El lote tiene ${o.lote.length} caracteres; deben ser 10.`);
  else{
    const fj = fechaDesdeJuliano(p.yy,p.ddd);
    if(!fj) err(`El día juliano ${p.ddd} no es válido (001–366).`);
    else if(o.fechaElaboracion && o.tipo!=="salida"){
      /* En una salida de cajón el desfase es normal y esperado: el lote nació
         semanas antes, cuando el queso entró. No es un error de lectura. */
      const d = diasEntre(fj,o.fechaElaboracion);
      if(d!==null && d>1)
        war(`El lote apunta al ${fj} pero la elaboración dice ${o.fechaElaboracion} (${d} días de diferencia).`,
            "Revisá el día juliano contra la fecha escrita.");
    }
    else if(o.tipo==="salida" && fj){
      const d = diasEntre(fj,o.fechaElaboracion);
      if(d!==null && d>60)
        war(`El lote entró al cajón el ${fj}, hace ${d} días.`,
            "Es mucho tiempo para un deshidratado: revisá el día juliano del lote.");
    }
    if(!POR_LOTE[p.corto]){
      const s = sugerirLoteCorto(p.corto);
      war(`El lote corto ${p.corto} no está en el catálogo.`,
          s.length ? `A un dígito de distancia existe: ${s.map(k=>k+" ("+POR_LOTE[k][0].codigo+")").join(", ")}` : null);
    }
  }

  /* -- código del producto -- */
  if(!o.codigo) err("Falta el código SAP del producto terminado.");
  else if(!ART[o.codigo]) err(`El código ${o.codigo} no existe en el maestro de artículos.`);
  else if(!ART[o.codigo].activo) war(`El artículo ${o.codigo} está marcado como inactivo en SAP.`);

  /* -- coherencia entre las dos casillas -- */
  const kg = parseFloat(o.cantidadKg), un = parseFloat(o.unidades);
  if(catE && catE.equivKg && !isNaN(kg) && !isNaN(un) && un>0){
    const esperado = un * catE.equivKg;
    if(esperado>0){
      const desv = Math.abs(kg-esperado)/esperado;
      if(desv > 0.15)
        war(`${un} unidades por ${catE.equivKg} kg dan ${esperado.toFixed(1)} kg, pero Cantidades dice ${kg} kg.`,
            "Puede ser un punto decimal mal leído.");
    }
  }
  if(!isNaN(kg) && (kg<=0 || kg>5000))
    war(`${kg} kg está fuera del rango esperable.`);

  /* -- cantidades: de qué casilla sale PlannedQuantity --
     La entrada a cajón es la excepción: ahí no se escribe la cantidad, se
     calcula restando la merma a los kilos que entraron. Exigir la casilla
     dejaba el registro trabado sin nada que llenar. */
  const granel = esGranel(o.codigo, catE);
  if(o.codigo && o.tipo !== "deshidratado"){
    if(granel===null) war(`No se puede saber si ${o.codigo} es granel o peso fijo; escribí la cantidad a mano.`);
    else if(granel && !o.cantidadKg)
      err("Es un producto a granel: falta la casilla Cantidades, en kg.");
    else if(!granel && !o.unidades)
      err("Es un producto de peso fijo: falta la casilla Unidades.");
  }
  if(o.tipo === "deshidratado" && !planificadaDeshidratado(o.componentes))
    err("No se puede calcular la cantidad: faltan los lotes de queso que entraron.",
        "La cantidad de una entrada a cajón sale de los kilos de materia prima " +
        "menos la merma de su familia.");
  if(!cantidadDe(o)) err("Falta la cantidad planeada (PlannedQuantity).");
  const disc = discrepanciaUnidad(o.codigo, catE);
  if(disc) war(`SAP tiene ${o.codigo} en ${disc.porUom?"kg":"unidades"} pero el catálogo de lotes lo marca como ${disc.porCat?"granel":"peso fijo"}.`,
               "Se usa lo que dice SAP. Vale la pena revisar cuál está bien.");
  /* DocNum lo asigna SAP: va vacío a propósito. Si trae algo, casi siempre es
     el CVO de la etiqueta, que se coló desde la lectura. */
  if(o.docNum && !/^\d+$/.test(String(o.docNum).trim()))
    err(`"${o.docNum}" no es un número de orden válido.`,
        "Se parece al CVO de la etiqueta. El número lo asigna SAP al importar: " +
        "abrí la orden y usá el botón Vaciar, en la tarjeta Datos de la orden en SAP.");
  if(!o.registro)
    err("Falta el consecutivo del registro del día.",
        "Es el número escrito a mano arriba de la hoja. Sin él no se puede " +
        "rastrear qué boleta originó esta orden.");
  if(!o.fechaElaboracion) err("Falta la fecha de elaboración.");
  else if(diaDelPanel && o.fechaElaboracion !== diaDelPanel){
    /* Cada corrida es de un solo día: así el respaldo, el control y la
       importación quedan alineados. Además una fecha futura traba DTW, porque
       SAP pide el tipo de cambio de un día que todavía no existe. */
    const futura = o.fechaElaboracion > diaDelPanel;
    err(`La elaboración dice ${o.fechaElaboracion} y el panel está en ${diaDelPanel}.`,
        futura
          ? "Una fecha futura traba la importación: SAP pide el tipo de cambio de ese día. " +
            "Casi siempre es un dígito mal leído (08-08 por 05-08)."
          : "Cada corrida lleva las órdenes de un solo día. Corregí la fecha, o cambiá " +
            "el día del panel y transcribí esa boleta en su propia jornada.");
  }

  /* -- componentes -- */
  const act = o.componentes.filter(c=>(c.material||c.lote||c.cantidad||c.codigo) && !c.excluido);
  const fuera = o.componentes.filter(c=>c.excluido && (c.material||c.codigo));
  if(!act.length && o.tipo!=="salida")
    err("La orden no tiene ningún componente.");
  if(act.length && o.tipo==="salida")
    war("Una salida de cajón no lleva componentes: la orden ya los consumió al entrar.");
  if(fuera.length)
    war(`${fuera.length} componente(s) quedan fuera del archivo: ` +
        fuera.map(c=>c.codigo||c.material).join(", ") + ".",
        "Hay que agregarlos a mano en SAP después de importar la orden.");
  act.forEach((c,i)=>{
    const n = c.material || `componente ${i+1}`;
    if(!c.codigo) err(`Sin código SAP: ${n}.`);
    else if(!ART[c.codigo]) err(`El código ${c.codigo} (${n}) no existe en el maestro.`);
    else if(!ART[c.codigo].activo) war(`El artículo ${c.codigo} (${n}) está inactivo en SAP.`);
    /* Una línea sin cantidad llega a SAP como columna vacía y rompe la
       importación: tiene que frenar acá. */
    if(!c.cantidad || !(parseFloat(c.cantidad) > 0))
      err(`Sin cantidad: ${n}.`,
          "Una línea sin cantidad no se puede importar. Poné el número, " +
          "o marcá el componente como No exportar.");
    if(c.codigo && ART[c.codigo] && (ART[c.codigo].uom||"").toLowerCase()==="kg" &&
       (pareceBolsa(c.material) || pareceBolsa(c.codigo)))
      war(`En SAP ${c.codigo} se mide en kg, pero la hoja cuenta bolsas por unidad.`,
          "Si se manda el conteo tal cual, SAP va a descargar esa cantidad en kilos.");
    /* Los lotes de componentes traen guiones y sufijos: no se exige el
       formato de 10 caracteres del producto terminado. */
    const conv = conversionComponente(c);
    if(conv && conv.falta)
      war(`${c.codigo} se lleva por unidad en SAP y la hoja anota kilos, pero no hay equivalencia en el catálogo.`,
          "Convertí la cantidad a mano antes de exportar.");
    else if(conv && !conv.exacta)
      war(`${conv.kg} kg ÷ ${conv.equiv} kg = ${conv.unidades} unidades de ${n}: no da entero.`,
          "Revisá la cantidad contra la foto.");
  });

  if(o.parcial)
    war("Esta hoja se leyó a medias: faltan registros que la IA dijo haber visto.",
        "Volvé a transcribir la foto o agregá los productos que falten antes de exportar.");

  /* -- una hoja de fraccionados con un solo bloque es sospechosa -- */
  if(o.tipo==="fraccionado" && o.hoja && Array.isArray(todas)){
    const bloques = new Set(todas.filter(x=>x.hoja===o.hoja).map(x=>x.pareja));
    if(bloques.size===1)
      war("Esta hoja de fraccionados trajo un solo bloque.",
          "La hoja impresa siempre tiene dos. Mirá la mitad de abajo de la foto: " +
          "si tiene datos, agregá esos registros a mano o volvé a transcribir.");
  }

  /* -- la marca de la hoja debe coincidir con el prefijo del código -- */
  /* Los recortes siempre se registran como TIQ, aunque el producto que los
     generó sea Real o Casa Real: no existe un código de recortes por marca.
     Comparar la marca de la hoja contra el prefijo del código ahí es un
     choque garantizado y falso. */
  const choque = o.tipo === "recortes" ? null
               : chocaConMarca(o.codigo, o.lote, o.marca);
  if(choque)
    err(`La hoja dice marca "${o.marca}" pero ${o.codigo} es de ` +
        `${choque.marcaDelCodigo || "otra marca"}.`,
        "Uno de los dos está mal. La etiqueta pegada suele ser más confiable " +
        "que la marca escrita a mano: si el código salió de la etiqueta, " +
        "corregí la marca.");

  /* -- coherencia entre el tipo declarado y el artículo elegido -- */
  if(o.codigo && ART[o.codigo] && o.tipo!=="deshidratado" && o.tipo!=="salida"){
    /* En el deshidratado el tipo describe la etapa del proceso, no la clase
       del artículo: el producto es un block y eso está bien. */
    const clase = ART[o.codigo].clase;
    if(clase!=="envasado" && o.tipo!==clase)
      war(`Marcaste "${o.tipo}" pero ${o.codigo} es ${clase} según el catálogo.`,
          `${ART[o.codigo].desc}`);
  }

  /* -- deshidratado: cajón obligatorio y cantidad esperada -- */
  if(o.tipo==="deshidratado" || o.tipo==="salida"){
    if(!o.cajon) err("Falta el cajón. En SAP es un campo de lista y no puede ir vacío.");
    else if(!CAJONES.includes(o.cajon))
      err(`"${o.cajon}" no es un valor válido de cajón.`,
          "SAP solo acepta: " + CAJONES.join(", ") + ".");
  }
  if(o.tipo==="deshidratado"){
    const est = planificadaDeshidratado(o.componentes);
    if(est){
      if(est.sinRegla.length)
        war(`No hay regla de merma para ${est.sinRegla.join(", ")}: se contó sin pérdida.`,
            "La merma conocida es 20% en semiduro y 30% en fresco y turrialba.");
      const puesta = parseFloat(cantidadDe(o));
      if(!isNaN(puesta) && est.sale > 0){
        const dif = Math.abs(puesta - est.sale) / est.sale;
        if(dif > 0.10)
          war(`Entraron ${est.entra} kg y se planificaron ${puesta} kg, pero con la merma ` +
              `se esperaría cerca de ${est.sale} kg.`,
              "Revisá la cantidad o el tipo de queso que se deshidrató.");
      }
    }
  }

  /* -- un artículo no puede ser componente de sí mismo -- */
  if(o.codigo){
    const propios = act.filter(c => c.codigo === o.codigo);
    if(propios.length)
      err(`${o.codigo} aparece como componente de sí mismo.`,
          "SAP rechaza una orden donde el producto terminado es también materia prima. " +
          "Suele ser un código mal asignado: revisá si la materia prima era el block " +
          "o una presentación distinta.");
  }

  /* -- tipo de orden -- */
  if(o.tipoOrden && !["S","P","D"].includes(o.tipoOrden))
    err(`Tipo de orden "${o.tipoOrden}" no es válido.`,
        "S = Estándar (usa la lista de materiales), P = Especial (los " +
        "componentes se definen en la orden), D = Desensamblaje.");

  /* -- salidas parciales de cajón -- */
  if(o.tipo === "salida"){
    const hoy = parseFloat(o.cantidadKg) || 0;
    const antes = parseFloat(o.sacadoAntes) || 0;
    if(!o.salidaFinal){
      war("Salida parcial: queda producto en el cajón.",
          "No se ajusta la cantidad planificada, porque el resto todavía tiene " +
          "que poder recibirse contra esta misma orden.");
      if(o.sacadoAntes === "")
        war("No se anotó cuánto había salido antes de este lote.",
            "Sirve para saber cuánto queda; sin eso hay que mirarlo en SAP.");
    }
    else if(antes > 0)
      war(`Última salida: ${antes} kg antes + ${hoy} kg hoy = ${(antes+hoy).toFixed(2)} kg en total.`,
          "Ese total es el que va a quedar como cantidad planificada.");
  }

  /* -- vencimiento del lote (va a BTNT en la recepción) -- */
  if(o.lote && !o.fechaVencimiento && o.tipo!=="recortes" && o.tipo!=="salida")
    war("El lote no tiene fecha de vencimiento.",
        "Se toma de la etiqueta blanca del producto. Sin ella, el lote se crea sin caducidad en SAP.");
  if(o.fechaVencimiento && o.fechaElaboracion && o.fechaVencimiento < o.fechaElaboracion)
    err("El vencimiento es anterior a la fecha de elaboración.");

  /* -- la materia prima de cada registro es lo que ese registro produjo --
     El total de materia prima de la hoja se reparte entre el producto y sus
     recortes: cada orden consume su parte, no el total. */
  if((o.tipo==="fraccionado" || o.tipo==="recortes") && o.cantidadKg){
    const propio = parseFloat(o.cantidadKg);
    /* Puede haber VARIOS lotes de materia prima para un mismo producto: lo que
       tiene que cuadrar es la suma, no cada renglón por su cuenta.
       Ejemplo real: 30.6 + 96.9 = 127.5 kg de producto, con dos lotes. */
    /* La materia prima de un fraccionado siempre se pesa. Un renglón contado
       en unidades no es materia prima, aunque haya quedado con código de queso:
       pasó con una etiqueta cuyo lote empezaba en 2504 y aceptó la sugerencia
       de block de la familia 25. */
    const mp = act.filter(c => c.codigo && ART[c.codigo] && !esInsumo(c.codigo) &&
                               ART[c.codigo].clase==="block" &&
                               (c.unidad||"").toLowerCase() !== "unid");
    const suma = mp.reduce((t,c) => t + (parseFloat(c.cantidad)||0), 0);
    if(mp.length && !isNaN(propio) && suma > 0 &&
       Math.abs(suma - propio) > Math.max(0.05, propio*0.02))
      err(`La materia prima suma ${suma.toFixed(2)} kg pero este registro produjo ${propio} kg.`,
          mp.length > 1
            ? `Son ${mp.length} lotes: ${mp.map(c=>(c.lote||c.codigo)+" "+c.cantidad).join(", ")}. ` +
              "Entre todos deben dar los kg de este registro."
            : "En un fraccionado la materia prima se reparte: el producto consume sus kg " +
              "y los recortes los suyos. El total de la hoja no va en un solo registro.");
  }

  /* Un recortes sin cantidad suele ser el que quedó de una lectura a medias:
     está ahí, ocupa lugar y no aporta kilos. */
  if(o.tipo==="recortes" && !o.cantidadKg)
    war("Este registro de recortes no tiene cantidad.",
        "Si quedó de una lectura incompleta y ya existe otro con los kilos, borralo.");

  /* -- balance de masa: materia prima = producto + recortes -- */
  if(o.tipo==="fraccionado" && o.mpKg && Array.isArray(todas)){
    const mp = parseFloat(o.mpKg);
    const pt = parseFloat(o.cantidadKg);
    /* Primero se busca la pareja exacta —misma foto, mismo bloque—, pero si el
       recortes se cargó aparte (una lectura parcial que hubo que reintentar, o
       un registro creado a mano) esa pareja no existe. Como respaldo se aceptan
       los recortes del mismo consecutivo y de la misma familia: dentro de un
       registro, esos recortes salieron de este producto. */
    const familia = familiaDeCodigo;
    const rec = kgRecortesDe(o, todas);
    if(!isNaN(mp) && !isNaN(pt)){
      const suma = pt + rec, dif = Math.abs(mp - suma);
      if(dif > Math.max(0.05, mp*0.02)){
        /* Cuando no encuentra recortes conviene decir con qué los buscó: si no,
           el aviso parece ignorar un registro que está a la vista. */
        const hay = todas.filter(x=>x.tipo==="recortes");
        const detalle = rec > 0
          ? "Revisá las tres casillas contra la foto."
          : hay.length
            ? "No encontré recortes de este producto. Busco los que tengan " +
              "registro «" + (o.registro||"—") + "» y familia " +
              (familia(o.codigo)||"—") + ". En el día hay: " +
              hay.map(x => (x.codigo||"sin código") + " (registro «" + (x.registro||"—") +
                "», familia " + (familia(x.codigo)||"—") + ", " +
                (x.cantidadKg||"sin cantidad") + ")").join(" · ")
            : "No hay ningún registro de recortes en el día.";
        war(`${pt} producto + ${rec} recortes = ${suma.toFixed(2)} kg contra ${mp} kg de materia prima (difieren ${dif.toFixed(2)}).`,
            detalle);
      }
    }
  }

  /* -- reglas de recortes y parejas -- */
  if(o.tipo==="recortes"){
    if(o.codigo && !esRecortes(o.codigo))
      war(`${o.codigo} no parece un código de recortes (se espera TIQ__99R).`);
    if(o.codigo && ART[o.codigo] && !ART[o.codigo].activo)
      err(`${o.codigo} está inactivo. La versión vigente termina en R.`);
  }
  if(o.tipo==="fraccionado" && Array.isArray(todas)){
    /* Mismo criterio que el balance: vale la pareja exacta o unos recortes del
       mismo consecutivo y familia, aunque hayan entrado por otra carga. */
    const par = recortesDelProducto(o, todas).length > 0;
    if(!par && o.hoja){
      const sug = codigoRecortes(o.codigo);
      war("Este fraccionado no tiene su registro de recortes.",
          sug ? `Los recortes de esta familia van con ${sug}.` : null);
    }
  }

  /* -- horario y colaboradores -- */
  const hIni = minutosDe(o.horaInicio), hFin = minutosDe(o.horaFin);
  if(o.horaInicio && hIni === null) war(`La hora de inicio "${o.horaInicio}" no se entiende.`);
  if(o.horaFin && hFin === null) war(`La hora final "${o.horaFin}" no se entiende.`);
  if(hIni !== null && hFin === null)
    war("Falta la hora final: el comentario va a salir con un signo de pregunta.",
        "Sin ella tampoco se puede calcular la duración en el reporte.");
  if(hIni !== null && hFin !== null && hFin < hIni)
    err(`El horario termina antes de empezar (${o.horaInicio} a ${o.horaFin}).`);
  [[hIni,o.horaInicio,"inicio"],[hFin,o.horaFin,"final"]].forEach(([m,txt,cual]) => {
    if(m === null || (m >= HORA_MIN && m <= HORA_MAX)) return;
    /* Una hora de madrugada casi nunca es real: suele ser la tarde con la
       primera cifra mal leída (03:40 por 13:40, 04:15 por 14:15). Frena, en
       vez de avisar: ya se exportaron horarios así y quedaron en SAP.

       Pero a veces el turno sí arranca antes o termina después, así que se
       puede confirmar a mano. Confirmado, baja a aviso: queda constancia de
       que alguien lo miró, sin trabar la exportación. */
    if(o.horarioConfirmado){
      war(`La hora de ${cual} (${txt}) está fuera de la jornada de ` +
          `${comoHora(HORA_MIN)} a ${comoHora(HORA_MAX)}, confirmada contra la foto.`);
      return;
    }
    const enTarde = m + 12*60;
    const posible = (enTarde >= HORA_MIN && enTarde <= HORA_MAX) ? comoHora(enTarde) : null;
    err(`La hora de ${cual} (${txt}) cae fuera de la jornada de ${comoHora(HORA_MIN)} a ${comoHora(HORA_MAX)}.`,
        posible ? `¿No sería ${posible}? Revisá la primera cifra contra la foto.`
                : "Revisá contra la foto.");
  });

  const gente = colaboradoresDe(o.colaboradores);
  const raros = gente.filter(g => !g.canonico).map(g => g.leido);
  if(raros.length)
    war(`No reconozco a: ${raros.join(", ")}.`,
        "Los habituales son " + COLABORADORES.join(", ") + ".");
  const aprox = gente.filter(g => g.aproximado);
  if(aprox.length)
    war("Nombres corregidos por parecido: " +
        aprox.map(g => `"${g.leido}" → ${g.canonico}`).join(", ") + ".",
        "Si alguno es otra persona, escribilo como corresponde.");

  /* Acá hubo una validación que intentaba adivinar conflictos de árbol de
     materiales mirando las órdenes del mismo día. Se quitó: marcaba en rojo
     cualquier aditivo compartido —ADT0002 aparece en media planta— y, peor,
     no detectaba el caso que sí importaba. Sin la lista de materiales de SAP
     no hay forma de deducir el árbol, y adivinar sale más caro que callar. */

  /* -- un queso contado por unidad casi siempre es un código mal puesto -- */
  act.filter(c => c.codigo && ART[c.codigo] && ART[c.codigo].clase==="block" &&
                  !esInsumo(c.codigo) && (c.unidad||"").toLowerCase()==="unid")
     .forEach(c => {
    const n = c.material || c.codigo;
    war(`${c.codigo} es queso a granel pero está contado por unidad: ${n}.`,
        "Si el renglón era una bolsa o una etiqueta, el código está equivocado. " +
        "Buscalo por nombre en vez de aceptar la sugerencia por lote.");
  });

  /* -- el mismo producto dos veces en el día --
     Pasa al reintentar la lectura de una foto ya cargada: quedan la versión
     parcial y la completa. Dos órdenes idénticas en SAP son dos entradas de
     inventario por un solo lote. */
  if(Array.isArray(todas) && o.codigo && o.lote && o.registro){
    /* El consecutivo tiene que ser el mismo: un lote repetido en dos hojas es
       normal —dos corridas del mismo queso para completar un pedido— y ahí no
       hay nada que borrar. El duplicado de verdad es la misma hoja cargada dos
       veces, y esa trae el mismo consecutivo. */
    const gemelas = todas.filter(x => x.id !== o.id && x.codigo === o.codigo &&
      x.lote === o.lote && x.registro === o.registro &&
      String(x.cantidadKg||"") === String(o.cantidadKg||"") &&
      String(x.unidades||"") === String(o.unidades||""));
    if(gemelas.length)
      err(`Hay ${gemelas.length + 1} registros idénticos de ${o.codigo}, ` +
          `lote ${o.lote}, consecutivo ${o.registro}.`,
          "Mismo consecutivo, misma cantidad y mismo lote: casi seguro se cargó " +
          "la foto dos veces. Borrá los que sobren antes de exportar.");
  }

  /* -- artículos repetidos: se juntan en una sola línea del archivo -- */
  const veces = {};
  act.filter(c=>c.codigo).forEach(c => { veces[c.codigo] = (veces[c.codigo]||0) + 1; });
  const repetidos = Object.keys(veces).filter(k => veces[k] > 1);
  if(repetidos.length)
    war(`${repetidos.join(", ")} aparece(n) en más de un renglón.`,
        "En la orden va una sola línea por artículo, con la suma. El detalle por " +
        "lote se conserva para la entrega de componentes.");

  /* -- comentarios -- */
  if(com1De(o).length>MAX_COM) err("El comentario 1 pasa de 254 caracteres.");
  if(com2De(o).length>MAX_COM) err("El comentario 2 pasa de 254 caracteres.");

  return A;
}

const hayErrores = a => a.some(x=>x.nivel==="err");

/* Estado de una orden para el panel del día */
/* De cada aviso, una palabra que diga de qué se trata. En la lista del día no
   cabe el mensaje completo, pero saber que hay algo del horario o de la fecha
   alcanza para decidir si vale la pena abrirlo. */
const TEMAS_AVISO = [
  [/jornada|hora de|horario|termina antes/i,          "horario"],
  [/fecha|lote apunta|día juliano|vence|vencimiento/i,"fecha"],
  [/reconozco a|nombres corregidos|colaborador/i,     "colaboradores"],
  [/materia prima|difieren|recortes/i,                "cuentas"],
  [/lote/i,                                           "lote"],
  [/component|artículo|inactiv|fuera del archivo/i,   "componentes"],
  [/unidades|granel|cantidad/i,                       "cantidades"]
];

/* Avisos que en el editor valen, pero en el resumen del día son ruido: pasan
   en casi todos los registros y son cosas ya resueltas —un componente que se
   excluyó a propósito, dos lotes del mismo queso que el archivo consolida
   solo, o el empaque que siempre se cuenta por unidad—. Si aparecieran acá,
   todos los renglones dirían "revisar algo" y el aviso perdería sentido. */
const AVISOS_FUERA_DEL_RESUMEN = [
  /quedan fuera del archivo/i,
  /aparece\(n\) en más de un renglón/i,
  /se mide en kg, pero la hoja cuenta bolsas por unidad/i
];

function temasDeAvisos(alertas){
  const temas = [];
  (alertas||[])
    .filter(a => a.nivel === "war")
    .filter(a => !AVISOS_FUERA_DEL_RESUMEN.some(re => re.test(a.msg)))
    .forEach(a => {
    const t = TEMAS_AVISO.find(([re]) => re.test(a.msg));
    const nombre = t ? t[1] : "otros";
    if(!temas.includes(nombre)) temas.push(nombre);
  });
  return temas;
}

function estadoOrden(o, todas, dia){
  const a = validarOrden(o, todas, dia);
  const temas = temasDeAvisos(a);
  if(hayErrores(a)) return {icono:"○", txt:"pendiente", color:"var(--alerta)", temas};
  if(!o.revisada || !o.loteRevisado ||
     o.componentes.some(c=>(c.material||c.codigo) && !c.revisado))
    return {icono:"◐", txt:"por revisar", color:"var(--queso)", temas};
  /* Marcada como revisada pero con avisos: se pudo pasar algo por alto y
     conviene verlo desde la lista, sin que impida exportar. */
  if(temas.length) return {icono:"✓", txt:"revisada", color:"var(--verde)", temas};
  return {icono:"✓", txt:"completa", color:"var(--verde)", temas};
}

/* ══════════════ Piezas de UI ══════════════ */

function Lbl({children,extra}){
  return <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
    <span className="lbl">{children}</span>{extra}
  </div>;
}

function Campo({etiqueta,valor,onChange,tipo="text",ancho="100%",cod,ph}){
  return <div style={{width:ancho,marginBottom:14}}>
    <Lbl>{etiqueta}</Lbl>
    <input className={cod?"cod":""} type={tipo} value={valor||""} placeholder={ph||""}
      onChange={e=>onChange(e.target.value)}/>
  </div>;
}

function Aviso({tipo="neu",children}){ return <div className={"avi "+tipo}>{children}</div>; }

function ListaAlertas({alertas}){
  if(!alertas.length) return <Aviso tipo="ok"><strong style={{color:"var(--verde)"}}>Sin alertas.</strong> Todo cuadra contra el catálogo.</Aviso>;
  const errs=alertas.filter(a=>a.nivel==="err"), wars=alertas.filter(a=>a.nivel==="war");
  return <div>
    {errs.length>0 && <Aviso tipo="err">
      <strong style={{color:"var(--alerta)"}}>Impide exportar ({errs.length})</strong>
      <ul style={{margin:"5px 0 0",paddingLeft:17,color:"var(--acero)"}}>
        {errs.map((a,i)=><li key={i} style={{marginBottom:3}}>{a.msg}
          {a.sug && <div style={{color:"var(--gris)",fontSize:11}}>{a.sug}</div>}</li>)}
      </ul></Aviso>}
    {wars.length>0 && <Aviso tipo="war">
      <strong style={{color:"var(--tinta)"}}>Revisar contra la foto ({wars.length})</strong>
      <ul style={{margin:"5px 0 0",paddingLeft:17,color:"var(--acero)"}}>
        {wars.map((a,i)=><li key={i} style={{marginBottom:3}}>{a.msg}
          {a.sug && <div style={{color:"var(--gris)",fontSize:11}}>{a.sug}</div>}</li>)}
      </ul></Aviso>}
  </div>;
}

function DesgloseLote({lote}){
  const p=desglosarLote(lote);
  if(!p) return <div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--gris)",padding:"8px 0"}}>
    {lote?`${lote.length} de 10 caracteres`:"Esperando lote de 10 caracteres"}</div>;
  const f=fechaDesdeJuliano(p.yy,p.ddd);
  const seg=[{v:p.ff,l:"FF",c:"var(--queso)"},{v:p.pp,l:"PP",c:"var(--queso)"},
             {v:p.yy,l:"YY"},{v:p.ddd,l:"DDD"},{v:p.t,l:"T",c:"var(--verde)"}];
  return <div style={{padding:"2px 0"}}>
    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      {seg.map(s=><div key={s.l} style={{flex:s.l==="DDD"?"1 1 62px":"1 1 44px",
        background:s.c?(s.c.includes("verde")?"var(--verde-suave)":"var(--queso-suave)"):"var(--fondo)",
        border:"1px solid "+(s.c||"var(--borde)"),borderRadius:3,padding:"7px 4px",textAlign:"center"}}>
        <div style={{fontFamily:"var(--mono)",fontSize:19,fontWeight:600}}>{s.v}</div>
        <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--gris)",marginTop:3}}>{s.l}</div>
      </div>)}
    </div>
    <div style={{fontFamily:"var(--mono)",fontSize:10.5,color:"var(--gris)",marginTop:6}}>
      corto <strong style={{color:"var(--tinta)"}}>{p.corto}</strong> · tanda <strong style={{color:"var(--tinta)"}}>{p.t}</strong>
      {f?` · ${f}`:" · día juliano inválido"}
    </div>
  </div>;
}

function BuscadorArticulo({onElegir}){
  const [q,setQ]=useState("");
  const res=buscarArticulos(q);
  return <div>
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por código o nombre…"/>
    {q && !res.length && <div style={{fontSize:11.5,color:"var(--gris)",marginTop:6}}>
      Ningún artículo coincide.</div>}
    {res.length>0 && <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
      {res.map(a=><button key={a.codigo} onClick={()=>{onElegir(a.codigo);setQ("");}}
        style={{textAlign:"left",padding:"7px 9px",border:"1px solid var(--borde)",
                background:"var(--panel)",borderRadius:3,cursor:"pointer",opacity:a.activo?1:.55}}>
        <span style={{fontFamily:"var(--mono)",fontSize:12.5,fontWeight:600}}>{a.codigo}</span>
        {!a.activo && <span className="chip" style={{background:"var(--alerta-suave)",color:"var(--alerta)",marginLeft:6}}>inactivo</span>}
        <div style={{fontSize:11,marginTop:2,color:"var(--acero)"}}>{a.desc}</div>
        <div style={{fontFamily:"var(--mono)",fontSize:9.5,marginTop:2,color:"var(--gris)"}}>
          {a.grupo}{a.uom?" · "+a.uom:""}</div>
      </button>)}
    </div>}
  </div>;
}

/* Resolución de código: lote → catálogo → maestro, con búsqueda de respaldo */
/* Atajos para empaque: ni las bolsas ni las etiquetas tienen lote corto. */
function SugerenciasEmpaque({material,productoCod,productoLote,onElegir}){
  let props=[], titulo="";
  if(pareceBolsa(material) && claveMedidas(material)){
    props = buscarBolsa(material,true,productoCod).slice(0,4).map(a=>a.codigo);
    titulo = "Bolsas de " + claveMedidas(material).replace(/^(\d\d)(\d\d)$/,"$1 x $2");
  }else if(pareceEtiqueta(material) && productoCod){
    props = codigosEtiqueta(productoCod, (productoLote||"").slice(0,4));
    titulo = "Etiquetas de este producto";
  }
  if(!props.length) return null;
  return <div style={{marginBottom:8}}>
    <div className="lbl">{titulo}</div>
    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
      {props.map(c=><button key={c} onClick={()=>onElegir(c)}
        style={{padding:"6px 9px",border:"1px solid var(--morado)",
                background:"var(--morado-suave)",borderRadius:3,cursor:"pointer",
                textAlign:"left"}}>
        <span style={{fontFamily:"var(--mono)",fontSize:11.5,fontWeight:600}}>{c}</span>
        <div style={{fontSize:10,color:"var(--acero)"}}>{ART[c].desc}</div>
      </button>)}
    </div>
  </div>;
}

function ResolverCodigo({lote,codigo,onElegir,tolerante,material}){
  const ops=tolerante?buscarPorLoteCorto(lote):buscarPorLote(lote);
  const p=desglosarLote(lote);
  /* Con "tolerante" alcanzan 4 caracteres para encontrar el artículo, pero el
     desglose completo exige 10 y devuelve null hasta entonces. Nunca leer p
     directamente: al escribir el cuarto dígito ya hay resultados y todavía no
     hay desglose, y eso dejaba la pantalla en blanco a media escritura. */
  const corto = p ? p.corto : (lote||"").slice(0,4).toUpperCase();
  const [buscar,setBuscar]=useState(false);

  if(codigo && !buscar){
    const a=ART[codigo];
    const mal = !a ? "no existe en el maestro SAP" : !a.activo ? "inactivo en SAP" : null;
    return <div className={"avi "+(mal?"err":"ok")}>
      <div style={{display:"flex",gap:8,alignItems:"baseline",flexWrap:"wrap"}}>
        <span style={{fontFamily:"var(--mono)",fontSize:15,fontWeight:600}}>{codigo}</span>
        <span style={{fontSize:11,fontWeight:500,color:mal?"var(--alerta)":"var(--verde)"}}>
          {mal||"validado"}</span>
      </div>
      {a && <div style={{color:"var(--acero)",marginTop:4}}>{a.desc} · {a.grupo}{a.uom?" · "+a.uom:""}</div>}
      {a && esCodigoBlock(codigo) && desglosarLote(lote) && <div
        style={{color:"var(--gris)",marginTop:4,fontSize:11.5}}>
        Producto block: los dígitos 3-4 del lote ({desglosarLote(lote).pp}) son el
        proveedor interno — {proveedorInterno(lote)} — y no cambian el código.</div>}
      <button className="btn min" style={{marginTop:6}} onClick={()=>{onElegir("");setBuscar(true);}}>
        Elegir otro artículo</button>
    </div>;
  }

  if(ops.length===1 && !buscar){
    return <div className="avi neu">
      <div style={{color:"var(--acero)",marginBottom:7}}>
        El lote corto <strong>{corto}</strong> apunta a un artículo:</div>
      <button className="btn" style={{width:"100%",textAlign:"left"}} onClick={()=>onElegir(ops[0].codigo)}>
        <span style={{fontFamily:"var(--mono)",fontWeight:600}}>{ops[0].codigo}</span>
        <div style={{fontSize:11,marginTop:2,opacity:.85}}>{ops[0].descripcion}</div>
      </button>
      <button className="btn min" style={{marginTop:7}} onClick={()=>setBuscar(true)}>Buscar otro</button>
    </div>;
  }

  if(ops.length>1 && !buscar){
    return <Aviso tipo="war">
      <strong>{ops.length} productos comparten el lote corto {corto}</strong>
      <div style={{color:"var(--acero)",margin:"3px 0 8px"}}>Elegí cuál se produjo.</div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {ops.map(o=><button key={o.codigo} onClick={()=>onElegir(o.codigo)}
          style={{textAlign:"left",padding:"8px 10px",border:"1.5px solid var(--borde)",
                  background:"var(--panel)",borderRadius:3,cursor:"pointer"}}>
          <span style={{fontFamily:"var(--mono)",fontSize:13,fontWeight:600}}>{o.codigo}</span>
          <div style={{fontSize:11,marginTop:2,opacity:.7}}>{o.descripcion}</div>
        </button>)}
      </div>
      <button className="btn min" style={{marginTop:7}} onClick={()=>setBuscar(true)}>Ninguno · buscar</button>
    </Aviso>;
  }

  const sug = corto.length===4 ? sugerirLoteCorto(corto) : [];
  /* No se ofrece el block de la familia si el renglón es empaque: los lotes de
     bolsas y etiquetas empiezan con cualquier cosa y la coincidencia es casual. */
  const esEmpaque = pareceBolsa(material) || pareceEtiqueta(material);
  const block = (corto.length===4 && !esEmpaque) ? sugerirBlockPorFamilia(corto) : null;
  return <div className="avi neu">
    <div style={{color:"var(--acero)",marginBottom:8}}>
      {corto.length===4 ? `El lote corto ${corto} no está en el catálogo.` : "Buscá el artículo en el maestro SAP:"}
    </div>
    {block && <div style={{marginBottom:8}}>
      <div className="lbl">Si es un block de proveedor nuevo</div>
      <button onClick={()=>onElegir(block)}
        style={{padding:"7px 9px",border:"1px solid var(--morado)",background:"var(--morado-suave)",
                borderRadius:3,cursor:"pointer",textAlign:"left",width:"100%"}}>
        <span style={{fontFamily:"var(--mono)",fontSize:12.5,fontWeight:600}}>{block}</span>
        <div style={{fontSize:11,marginTop:2,color:"var(--acero)"}}>
          {ART[block].desc} — familia {familiaDe(corto)||corto.slice(0,2)}</div>
        <div style={{fontSize:10.5,marginTop:2,color:"var(--gris)"}}>
          En los block, los dígitos 3-4 ({corto.slice(2,4)}) son el proveedor interno:
          todos consolidan en este artículo.</div>
      </button>
    </div>}
    {sug.length>0 && <div style={{marginBottom:8}}>
      <div className="lbl">A un dígito de distancia</div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
        {sug.map(k=><button key={k} onClick={()=>onElegir(POR_LOTE[k][0].codigo)}
          style={{padding:"5px 8px",border:"1px solid var(--queso)",background:"var(--queso-suave)",
                  borderRadius:3,cursor:"pointer",fontFamily:"var(--mono)",fontSize:11}}>
          {k} → {POR_LOTE[k][0].codigo}</button>)}
      </div>
    </div>}
    <BuscadorArticulo onElegir={c=>{onElegir(c);setBuscar(false);}}/>
    {buscar && <button className="btn min" style={{marginTop:8}} onClick={()=>setBuscar(false)}>Cancelar</button>}
  </div>;
}

/* ══════════════ MÓDULO: editor.js — una orden ══════════════ */

function CampoComentario({numero,destino,valor,sugerido,auto,onAuto,onChange}){
  const largo=valor.length, excede=largo>MAX_COM;
  return <div style={{marginBottom:14}}>
    <Lbl extra={<span style={{fontFamily:"var(--mono)",fontSize:10,
      color:excede?"var(--alerta)":"var(--gris)"}}>{largo}/{MAX_COM}</span>}>
      Comentario {numero} → {destino}
    </Lbl>
    <textarea rows={2} value={valor} onChange={e=>{onAuto(false);onChange(e.target.value);}}
      style={{borderColor:excede?"var(--alerta)":"var(--borde)",resize:"vertical"}}/>
    {!auto && sugerido!==valor &&
      <button className="btn min" style={{marginTop:5}}
        onClick={()=>{onAuto(true);onChange(sugerido);}}>Volver al texto automático</button>}
  </div>;
}

function ConversionComp({c}){
  const conv = conversionComponente(c);
  if(!conv) {
    const alm = c.codigo ? almacenDe(c.codigo,"02") : null;
    return alm==="11" ? <div style={{fontSize:11,color:"var(--morado)",marginBottom:10}}>
      Insumo: va al almacén 11.</div> : null;
  }
  if(conv.falta) return <div className="avi war" style={{marginBottom:10}}>
    Se lleva por unidad en SAP pero la hoja dice kilos, y no hay equivalencia
    en el catálogo. Convertí la cantidad a mano.</div>;
  return <div style={{fontSize:11.5,marginBottom:10,fontFamily:"var(--mono)",
      color: conv.exacta ? "var(--verde)" : "var(--alerta)"}}>
    {conv.kg} kg ÷ {conv.equiv} kg = <strong>{conv.unidades} unidades</strong> a SAP
    {!conv.exacta && " — no da entero, revisá"}
  </div>;
}

function FilaComponente({c,idx,total,onCambio,onQuitar,productoCod,productoLote}){
  const set=(k,v)=>onCambio({...c,[k]:v});
  const usado = c.material||c.lote||c.cantidad||c.codigo;
  const problema = usado && (!c.codigo || !ART[c.codigo] || !c.cantidad);
  return <div style={{border:"1px solid "+(c.incompleto?"var(--alerta)"
                                          :c.excluido?"var(--morado)":"var(--borde)"),
                      borderRadius:3,padding:12,marginBottom:10,
                      opacity: c.excluido ? .7 : 1,
                      background: c.excluido ? "var(--morado-suave)"
                                : c.revisado ? "var(--verde-suave)" : "var(--fondo)"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8}}>
      <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--gris)",letterSpacing:".09em"}}>
        COMPONENTE {String(idx+1).padStart(2,"0")}
        {problema && !c.revisado && <span className="chip"
          style={{background:"var(--queso-suave)",color:"var(--tinta)",marginLeft:6}}>revisar</span>}
      </span>
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <label style={{display:"flex",gap:5,alignItems:"center",fontSize:11.5,cursor:"pointer",
                       color:c.revisado?"var(--verde)":"var(--gris)"}}>
          <input type="checkbox" checked={!!c.revisado} onChange={e=>set("revisado",e.target.checked)}
            style={{width:"auto",margin:0}}/> Revisado
        </label>
        <select value={typeof c.incompleto==="string"?c.incompleto:(c.incompleto?"ambos":"")}
          onChange={e=>set("incompleto",e.target.value)}
          title="Sale listado en el reporte de gerencia"
          style={{width:"auto",fontSize:11.5,padding:"3px 6px",
                  color:c.incompleto?"var(--alerta)":"var(--gris)",
                  borderColor:c.incompleto?"var(--alerta)":"var(--borde)"}}>
          {MOTIVOS_INCOMPLETO.map(([v,t])=>
            <option key={v} value={v}>{v?t:"Anotación completa"}</option>)}
        </select>
        <label style={{display:"flex",gap:5,alignItems:"center",fontSize:11.5,cursor:"pointer",
                       color:c.excluido?"var(--morado)":"var(--gris)"}}
               title="Se conserva en el registro pero no va al archivo de DTW">
          <input type="checkbox" checked={!!c.excluido} onChange={e=>set("excluido",e.target.checked)}
            style={{width:"auto",margin:0}}/> No exportar
        </label>
        {total>1 && <button className="btn min" style={{color:"var(--alerta)"}} onClick={onQuitar}>Quitar</button>}
      </div>
    </div>
    <Campo etiqueta="Material" valor={c.material} onChange={v=>set("material",v)}/>
    <div className="row">
      {/* Sin tocar guiones ni sufijos: 237125188-1 es un lote válido. */}
      <Campo etiqueta="Lote (opcional)" valor={c.lote} cod ancho="60%"
        onChange={v=>set("lote",v.replace(/\s/g,"").toUpperCase())}/>
      <Campo etiqueta="Cantidad" valor={c.cantidad} cod ancho="25%" onChange={v=>set("cantidad",v)}/>
      <div style={{width:"15%",marginBottom:14}}>
        <Lbl>Unidad</Lbl>
        <select value={c.unidad||""} onChange={ev=>set("unidad",ev.target.value)}>
          <option value="">—</option>
          <option value="kg">kg</option>
          <option value="unid">unid</option>
        </select>
      </div>
    </div>
    {c.excluido && <div style={{fontSize:11.5,color:"var(--morado)",marginBottom:10,lineHeight:1.45}}>
      Queda fuera del archivo. Sirve para artículos que DTW rechaza por datos maestros
      —por ejemplo un artículo no inventariable cuyo método de valoración no es Estándar—:
      así la orden entra igual y ese componente se agrega a mano en SAP.
    </div>}
    <ConversionComp c={c}/>
    <ResolverCodigo lote={c.lote} codigo={c.codigo} onElegir={v=>set("codigo",v)}
      tolerante material={c.material}/>
  </div>;
}

/* Un registro puede venir de más de una foto: cuando los lotes no caben en una
   hoja y siguen en otra, al unirlas hay que poder cotejar contra las dos. */
function VisorFoto({url}){
  const [abierto,setAbierto]=useState(false);
  const urls = (Array.isArray(url) ? url : [url]).filter(Boolean);
  if(!urls.length) return null;
  return <div className="card" style={{padding:10}}>
    <div style={{display:"flex",gap:10,alignItems:"center"}}>
      <div style={{display:"flex",gap:4,flexShrink:0}}>
        {urls.map((u,i) =>
          <img key={i} src={u} alt="" onClick={()=>setAbierto(a=>!a)}
            style={{width:54,height:54,objectFit:"cover",borderRadius:3,
                    border:"1px solid var(--borde)",cursor:"pointer"}}/>)}
      </div>
      <div style={{flex:1}}>
        <div style={{fontSize:12,fontWeight:600}}>
          {urls.length===1 ? "Foto de origen" : urls.length + " fotos de origen"}</div>
        <div style={{fontSize:11,color:"var(--gris)"}}>
          {urls.length===1
            ? "Cotejá cada renglón contra ella antes de marcar Revisado."
            : "Los lotes vienen de dos hojas: cotejá contra las dos."}</div>
      </div>
      <button className="btn min" onClick={()=>setAbierto(a=>!a)}>{abierto?"Ocultar":"Ampliar"}</button>
    </div>
    {abierto && urls.map((u,i) =>
      <img key={i} src={u} alt="" style={{width:"100%",marginTop:10,borderRadius:3,

}

const TIPOS=[["rallado","Rallado"],["fraccionado","Fraccionado"],["recortes","Recortes"],
             ["block","Block / granel"],["rebanado","Rebanado"],["envasado","Envasado"],
             ["deshidratado","Deshidratado · entrada al cajón"],
             ["salida","Deshidratado · salida del cajón"]];

/* Al elegir un artículo, el tipo de registro sale del catálogo. */
function conCodigo(o, codigo){
  const a = ART[codigo];
  return {...o, codigo, tipo: a && a.clase ? a.clase : o.tipo};
}

/* Las dos casillas de la hoja. Cuál alimenta PlannedQuantity depende de si el
   producto es a granel (kg) o de peso fijo (unidades).                      */
function BalanceMasa({o,todas,onCambio}){
  if(o.tipo!=="fraccionado") return null;
  const mp=parseFloat(o.mpKg), pt=parseFloat(o.cantidadKg);
  const rec=kgRecortesDe(o, todas);
  const suma=(isNaN(pt)?0:pt)+rec;
  const cierra = !isNaN(mp) && Math.abs(mp-suma)<=Math.max(0.05,mp*0.02);
  return <div style={{marginBottom:14}}>
    <Lbl>Materia prima · CANTIDAD (KG)</Lbl>
    <input className="cod" value={o.mpKg||""} onChange={ev=>onCambio({...o,mpKg:ev.target.value})}/>
    {o.mpKg!=="" && !isNaN(mp) && <div style={{marginTop:6,fontSize:11.5,
      color: cierra?"var(--verde)":"var(--alerta)", fontFamily:"var(--mono)"}}>
      {pt||0} producto + {rec} recortes = {suma.toFixed(2)} kg
      {cierra ? "  ✓ cierra con la materia prima" : "  ✗ contra " + mp + " kg de materia prima"}
    </div>}
  </div>;
}

function CasillasCantidad({o,onCambio}){
  const granel = esGranel(o.codigo, entradaCatalogo(o.lote,o.codigo));
  const usada  = granel===null ? null : (granel ? "cantidadKg" : "unidades");
  const valor  = cantidadDe(o);
  const marco  = k => ({
    border: usada===k ? "2px solid var(--verde)" : "1px solid var(--borde)",
    borderRadius:3, padding: usada===k ? 7 : 8, background: usada===k ? "var(--verde-suave)" : "transparent"
  });
  return <div style={{marginBottom:14}}>
    <div className="row">
      <div style={{width:"50%",...marco("cantidadKg")}}>
        <Lbl>Cantidad total (kg){usada==="cantidadKg" && <span className="chip"
          style={{color:"var(--verde)"}}>a SAP</span>}</Lbl>
        <input className="cod" value={o.cantidadKg||""}
          onChange={e=>onCambio({...o,cantidadKg:e.target.value})}/>
      </div>
      <div style={{width:"50%",...marco("unidades")}}>
        <Lbl>Unidades total{usada==="unidades" && <span className="chip"
          style={{color:"var(--verde)"}}>a SAP</span>}</Lbl>
        <input className="cod" value={o.unidades||""}
          onChange={e=>onCambio({...o,unidades:e.target.value})}/>
      </div>
    </div>
    <div style={{fontSize:11,color:"var(--gris)",marginTop:6,lineHeight:1.45}}>
      {granel===null
        ? "Elegí el código para saber de cuál casilla sale la cantidad planificada."
        : granel
          ? "Producto a granel: la cantidad planificada sale de Cantidad total, en kg."
          : "Producto de peso fijo: la cantidad planificada sale de Unidades total."}
    </div>
    <div style={{marginTop:8}}>
      <Lbl extra={o.autoCant===false
        ? <button className="btn min" onClick={()=>onCambio({...o,autoCant:true})}>Volver al automático</button>
        : null}>
        Cantidad planificada → PlannedQuantity
      </Lbl>
      <input className="cod" value={valor}
        onChange={e=>onCambio({...o,autoCant:false,cantidadPlan:e.target.value})}/>
    </div>
